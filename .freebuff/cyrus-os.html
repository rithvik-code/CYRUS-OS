const CMD_ALIASES={ dir:"ls", cls:"clear", ver:"ver", where:"which", findstr:"findstr", tasklist:"ps", type:"type", erase:"rm", ren:"mv", copy:"cp", xcopy:"cp", move:"mv", md:"mkdir", rd:"rmdir", del:"rm", ipconfig:"ipconfig", tracert:"tracert", netstat:"netstat", systeminfo:"systeminfo", taskkill:"taskkill", sc:"sc", net:"net", chkdsk:"chkdsk", vol:"vol", label:"label", sfc:"sfc", shutdown:"shutdown", winver:"ver", apt:"apt", dnf:"dnf", pacman:"pacman", "curl.exe":"curl" };

const CMDS = {
  // ---------- navigation
  pwd:{ run(a,s,pr){ pr(s.cwd); } },
  ls:{ run(a,s,pr){
    const flags=a.filter(x=>x.startsWith("-")), path=a.find(x=>!x.startsWith("-"))||"";
    const p=VFS.norm(s.cwd,path), n=VFS.node(p);
    if(!n){ pr(`ls: ${path||"."}: No such file or directory`,"err"); return; }
    if(n.type==="file"){ pr(n.name); return; }
    let names=Object.keys(n.children);
    if(!flags.some(f=>f.includes("a"))) names=names.filter(x=>!x.startsWith("."));
    if(!names.length){ pr("(empty)","dim"); return; }
    pr(names.map(name=>{
      const c=n.children[name];
      if(flags.some(f=>f.includes("l"))){
        const perm=c.type==="dir"?"drwxr-xr-x":"-rw-r--r--";
        return `${perm}  rithvik  ${fmtSize(c.size||0).padStart(8)}  ${fmtTime(c.mtime)}  ${c.type==="dir"?name+"/":name}`;
      }
      return (c.type==="dir"?name+"/":name);
    }).join("\n"));
  }},
  dir:{ run(a,s,pr){ CMDS.ls.run(a,s,pr); } },
  tree:{ run(a,s,pr){
    const p=VFS.norm(s.cwd,a[0]||""), n=VFS.node(p);
    if(!n||n.type!=="dir"){ pr(`tree: ${a[0]||"."}: Not a directory`,"err"); return; }
    const lines=[p.replace("/home/rithvik","~")];
    const walk=(node,pre)=>{ const ks=Object.keys(node.children); ks.forEach((k,i)=>{
      const c=node.children[k], last=i===ks.length-1;
      lines.push(pre+(last?"└── ":"├── ")+(c.type==="dir"?k+"/":k));
      if(c.type==="dir") walk(c,pre+(last?"    ":"│   ")); }); };
    walk(n,"");
    pr(lines.join("\n")); pr(`\n${lines.length-1} entries`,"dim");
  }},
  cd:{ run(a,s,pr){
    if(a[0]==="-"){ if(s.dirs&&s.dirs.length){ const prev=s.dirs.pop(); const cur=s.cwd; s.cwd=prev; if(s.ps)s.ps(); pr(prev); } else pr("cd: no previous directory","err"); return; }
    const p=VFS.norm(s.cwd,a[0]||"~"), n=VFS.node(p);
    if(!n||n.type!=="dir"){ pr(`cd: ${a[0]||"~"}: Not a directory`,"err"); return; }
    s.dirs=s.dirs||[]; s.dirs.push(s.cwd); s.cwd=p; if(s.ps)s.ps();
  }},
  clear:{ run(a,s){ s.out.innerHTML=""; } },
  reset:{ run(a,s){ s.out.innerHTML=""; } },
  exit:{ run(){ const w=WM.wins.get("terminal"); if(w) WM.close("terminal"); } },

  // ---------- files
  touch:{ run(a,s,pr){
    if(!a.length){ pr("usage: touch <file>…","err"); return; }
    a.forEach(f=>{ const p=VFS.norm(s.cwd,f); const n=VFS.node(p); if(n){ n.mtime=Date.now(); } else VFS.writeFile(p,""); });
    Store.save();
    pr("touched "+a.join(" "),"ok"); Bus.emit("vfs");
  }},
  mkdir:{ run(a,s,pr){
    const targets=a.filter(x=>!x.startsWith("-"));
    if(!targets.length){ pr("usage: mkdir [-p] <dir>…","err"); return; }
    targets.forEach(t=>{ const p=VFS.norm(s.cwd,t); VFS.mkdirp(p); });
    pr("created "+targets.join(", "),"ok");
  }},
  rmdir:{ run(a,s,pr){
    if(!a[0]){ pr("usage: rmdir <dir>","err"); return; }
    const p=VFS.norm(s.cwd,a[0]), n=VFS.node(p);
    if(!n||n.type!=="dir"){ pr(`rmdir: ${a[0]}: Not a directory`,"err"); return; }
    if(Object.keys(n.children).length){ pr(`rmdir: ${a[0]}: Directory not empty`,"err"); return; }
    VFS.remove(p); pr("removed "+a[0],"ok");
  }},
  rm:{ run(a,s,pr){
    const flags=a.filter(x=>x.startsWith("-")), target=a.find(x=>!x.startsWith("-"));
    if(!target){ pr("usage: rm [-r] [-f] <path>","err"); return; }
    const p=VFS.norm(s.cwd,target);
    if(p==="/"||p==="/home"||/^c:\\?$/i.test(p)){ pr("rm: refused — critical path. Administrator confirmation required.","err"); return; }
    const n=VFS.node(p); if(!n){ pr(`rm: ${target}: No such file or directory`,"err"); return; }
    if(n.type==="dir"&&!flags.some(f=>f.includes("r"))){ pr(`rm: ${target}: is a directory (use -r)`,"err"); return; }
    VFS.remove(p); pr("removed "+target,"ok"); Log.record(`term: rm ${target}`,"delete_file",{path:p},"medium",true,true,"rm via terminal");
  }},
  cp:{ run(a,s,pr){
    const rec=a.some(x=>x.startsWith("-")&&x.includes("r"));
    const rest=a.filter(x=>!x.startsWith("-"));
    if(rest.length<2){ pr("usage: cp [-r] <src> <dst>","err"); return; }
    const sp=VFS.norm(s.cwd,rest[0]), sn=VFS.node(sp);
    if(!sn){ pr(`cp: ${rest[0]}: No such file or directory`,"err"); return; }
    let dp=VFS.norm(s.cwd,rest[1]); const dn=VFS.node(dp);
    if(sn.type==="file"){
      if(dn&&dn.type==="dir") dp=dp+"/"+sn.name;
      VFS.writeFile(dp,sn.content); pr(`copied ${rest[0]} → ${dp.replace("/home/rithvik","~")}`,"ok");
    } else if(rec){
      const copyDir=(node,base)=>{ VFS.mkdirp(base); Object.values(node.children).forEach(c=>{
        if(c.type==="dir") copyDir(c,base+"/"+c.name); else VFS.writeFile(base+"/"+c.name,c.content); }); };
      copyDir(sn,dp); pr(`copied directory ${rest[0]} → ${dp.replace("/home/rithvik","~")}`,"ok");
    } else pr(`cp: ${rest[0]}: is a directory (use -r)`,"err");
  }},
  mv:{ run(a,s,pr){
    if(a.length<2){ pr("usage: mv <src> <dst>","err"); return; }
    const sp=VFS.norm(s.cwd,a[0]), dpRaw=VFS.norm(s.cwd,a[1]);
    const n=VFS.node(sp); if(!n){ pr(`mv: ${a[0]}: No such file or directory`,"err"); return; }
    const dn=VFS.node(dpRaw);
    if(dn&&dn.type==="dir") VFS.move(sp,dpRaw);
    else { const nd=VFS.detach(sp); if(!nd){pr("mv failed","err");return;} nd.name=VFS.base(dpRaw); VFS.attach(VFS.parent(dpRaw),nd); }
    pr(`moved ${a[0]} → ${a[1]}`,"ok");
  }},
  cat:{ run(a,s,pr){
    if(!a.length){ pr("usage: cat <file>…","err"); return; }
    for(const f of a){ const n=VFS.node(VFS.norm(s.cwd,f));
      if(!n||n.type!=="file"){ pr(`cat: ${f}: No such file`,"err"); continue; }
      pr(n.content||"(empty file)");
    }
  }},
  less:{ run(a,s,pr){
    const n=VFS.node(VFS.norm(s.cwd,a[0]||""));
    if(!n||n.type!=="file"){ pr(`less: ${a[0]}: No such file`,"err"); return; }
    const lines=(n.content||"").split("\n"); const PER=24;
    let page=0; const pages=Math.max(1,Math.ceil(lines.length/PER));
    const show=()=>{ pr(`── ${n.name} ── page ${page+1}/${pages} ── (Space next · q quit)`+"\n"+lines.slice(page*PER,(page+1)*PER).join("\n")); };
    show();
    if(pages>1){
      const h=(e)=>{ if(e.key===" "){ e.preventDefault(); page++; if(page>=pages){ cleanup(); return; } show(); s.out.scrollTop=s.out.scrollHeight; }
        else if(e.key.toLowerCase()==="q"){ cleanup(); } };
      const cleanup=()=>{ document.removeEventListener("keydown",h); pr("(pager closed)","dim"); };
      document.addEventListener("keydown",h);
      s.pagerCleanup=cleanup;
    }
  } },
  more:{ run(a,s,pr){ CMDS.less.run(a,s,pr); } },
  head:{ run(a,s,pr){ const raw=(s.stdin!=null)?null:(a.filter(x=>!x.startsWith("-")).pop());
    const n10=a.indexOf("-n"); const cnt=n10>=0?parseInt(a[n10+1])||10:10;
    let text=null;
    if(s.stdin!=null) text=s.stdin;
    else { const n=VFS.node(VFS.norm(s.cwd,raw||"")); if(!n||n.type!=="file"){ pr(`head: ${raw}: No such file`,"err"); return; } text=n.content||""; }
    pr(text.split("\n").slice(0,cnt).join("\n")); }},
  tail:{ run(a,s,pr){ const raw=(s.stdin!=null)?null:(a.filter(x=>!x.startsWith("-")).pop());
    const n10=a.indexOf("-n"); const cnt=n10>=0?parseInt(a[n10+1])||10:10;
    let text=null;
    if(s.stdin!=null) text=s.stdin;
    else { const n=VFS.node(VFS.norm(s.cwd,raw||"")); if(!n||n.type!=="file"){ pr(`tail: ${raw}: No such file`,"err"); return; } text=n.content||""; }
    const L=text.split("\n"); pr(L.slice(-cnt).join("\n")); }},
  sort:{ run(a,s,pr){ let text=null;
    if(s.stdin!=null) text=s.stdin;
    else { const raw=a.filter(x=>!x.startsWith("-")).pop(); const n=VFS.node(VFS.norm(s.cwd,raw||""));
      if(!n||n.type!=="file"){ pr(`sort: ${raw}: No such file`,"err"); return; } text=n.content||""; }
    pr(text.split("\n").sort().join("\n")); }},
  uniq:{ run(a,s,pr){ const text=(s.stdin!=null)?s.stdin:"";
    const out=[]; text.split("\n").forEach((l,i,arr)=>{ if(i===0||l!==arr[i-1]) out.push(l); }); pr(out.join("\n")); }},
  nl:{ run(a,s,pr){ const n=VFS.node(VFS.norm(s.cwd,a[0]||""));
    if(!n||n.type!=="file"){ pr(`nl: ${a[0]}: No such file`,"err"); return; }
    pr((n.content||"").split("\n").map((l,i)=>`${String(i+1).padStart(5)}  ${l}`).join("\n")); }},
  wc:{ run(a,s,pr){ const n=VFS.node(VFS.norm(s.cwd,a[0]||""));
    if(!n||n.type!=="file"){ pr(`wc: ${a[0]}: No such file`,"err"); return; }
    const c=n.content||"", L=c.split("\n").length, W=(c.match(/\S+/g)||[]).length;
    pr(`${L} lines  ${W} words  ${c.length} chars  ${n.name}`); }},
  file:{ run(a,s,pr){ const p=VFS.norm(s.cwd,a[0]||""); const n=VFS.node(p);
    if(!n){ pr(`file: ${a[0]}: No such file`,"err"); return; }
    pr(n.type==="dir"?`${p}: directory`:`${p}: ${n.ext?n.ext.toUpperCase()+" document":"text"} — ${fmtSize(n.size||0)}, modified ${fmtTime(n.mtime)}`); }},
  stat:{ run(a,s,pr){ const p=VFS.norm(s.cwd,a[0]||""); const n=VFS.node(p);
    if(!n){ pr(`stat: ${a[0]}: No such file`,"err"); return; }
    pr(`  File: ${p}\n  Type: ${n.type==="dir"?"directory":"regular file"}\n  Size: ${fmtSize(n.size||0)}\nModify: ${fmtTime(n.mtime)}`); }},
  ln:{ run(a,s,pr){ pr("ln: cyrus-vfs models links as copies — created a copy instead","dim"); this.copyOne(a[0],a[1],s,pr); },
    copyOne(a,s,pr){ CMDS.cp.run([a],s,pr); } },

  // ---------- search
  grep:{ run(a,s,pr){
    const flags=a.filter(x=>x.startsWith("-")); const rest=a.filter(x=>!x.startsWith("-"));
    const pat=rest[0]; if(!pat){ pr("usage: grep [-i] [-n] [-v] [-r] <pattern> [path]","err"); return; }
    const targets=rest.slice(1); const ci=flags.some(f=>f.includes("i")); const nv=flags.some(f=>f.includes("n"));
    const vin=flags.some(f=>f.includes("v"));
    let re; try{ re=new RegExp(pat, ci?"i":""); }catch(e){ re=new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), ci?"i":""); }
    const hits=[];
    const scanFile=(p,node)=>{ const lines=(node.content||"").split("\n");
      lines.forEach((l,i)=>{ const m=re.test(l); if(m!==vin) hits.push(`${p.replace("/home/rithvik","~")}:${nv?i+1+":":""}${l}`); }); };
    if(s.stdin!=null){ // stdin from a pipe
      (s.stdin||"").split("\n").forEach(l=>{ const m=re.test(l); if(m!==vin) hits.push(l); });
    } else if(!targets.length||flags.some(f=>f.includes("r"))){
      VFS.walk(VFS.norm(s.cwd,targets[0]||""),(p,n)=>{ if(n.type==="file") scanFile(p,n); });
    } else {
      targets.forEach(t=>{ const p=VFS.norm(s.cwd,t); const n=VFS.node(p);
        if(!n){ pr(`grep: ${t}: No such file`,"err"); return; }
        if(n.type==="file") scanFile(p,n); else VFS.walk(p,(pp,nn)=>{ if(nn.type==="file") scanFile(pp,nn); }); });
    }
    if(!hits.length){ pr("(no matches)","dim"); return; }
    pr(hits.slice(0,60).join("\n")); if(hits.length>60) pr(`… ${hits.length-60} more`,"dim");
  }},
  findstr:{ run(a,s,pr){ const rest=a.filter(x=>!x.startsWith("/"));
    CMDS.grep.run(rest.slice(0,1).concat(rest.slice(1)),s,pr); } },
  find:{ run(a,s,pr){
    const base=VFS.norm(s.cwd, a[0]&&!a[0].startsWith("-") ? a[0] : "");
    const nameIdx=a.indexOf("-name"); const pat=nameIdx>=0?a[nameIdx+1]:null;
    const extIdx=a.indexOf("-ext"); const ext=extIdx>=0?a[extIdx+1]:null;
    const mtIdx=a.indexOf("-mtime"); const mtd=mtIdx>=0?parseInt(a[mtIdx+1]):null;
    const clean=pat?pat.replace(/\*/g,"").replace(/\?.?/g,"") : null;
    const out=[];
    VFS.walk(base,(p,n)=>{ if(n.type!=="file")return;
      if(ext && !p.toLowerCase().endsWith("."+ext.toLowerCase().replace(".","")))return;
      if(clean && !p.toLowerCase().includes(clean.toLowerCase()))return;
      if(mtd!=null && (Date.now()-n.mtime)>mtd*86400000)return;
      out.push(p.replace("/home/rithvik","~")); });
    pr(out.length?out.join("\n"):"(no matches)","out");
  }},
  locate:{ run(a,s,pr){
    if(!a[0]){ pr("usage: locate <name>","err"); return; }
    const out=[]; VFS.walk("/home/rithvik",(p,n)=>{ if(p.toLowerCase().includes(a[0].toLowerCase())) out.push(p.replace("/home/rithvik","~")); });
    pr(out.length?out.join("\n"):"(no matches)","out");
  }},
  which:{ run(a,s,pr){ const c=a[0];
    if(!c){ pr("usage: which <cmd>","err"); return; }
    if(MAN[c]&&CMDS[c]) pr("/cyrus/bin/"+c+" (builtin)"); else if(CMD_ALIASES[c]&&CMDS[CMD_ALIASES[c]]) pr("/cyrus/bin/"+CMD_ALIASES[c]+" (builtin, windows alias)"); else pr(`which: ${c}: not found`,"err"); }},
  whereis:{ run(a,s,pr){ CMDS.which.run(a,s,pr); } },
  where:{ run(a,s,pr){ CMDS.which.run(a,s,pr); } },
  type:{ run(a,s,pr){ const c=a[0];
    if(CMDS[c]) pr(`${c} is a shell builtin`); else if(MAN[c]) pr(`${c} is /cyrus/bin/${c}`); else pr(`type: ${c}: not found`,"err"); }},

  // ---------- permissions
  chmod:{ run(a,s,pr){ const p=VFS.norm(s.cwd,a[1]||""); const n=VFS.node(p);
    if(!n){ pr(`chmod: ${a[1]}: No such file`,"err"); return; }
    n.mode=a[0]||"644"; n.exec=/x/.test(a[0]||""); Store.save(); pr(`mode of ${a[1]} changed to ${a[0]}`,"ok"); }},
  chown:{ run(a,s,pr){ const n=VFS.node(VFS.norm(s.cwd,a[1]||""));
    if(!n){ pr(`chown: ${a[1]}: No such file`,"err"); return; } n.owner=a[0]; Store.save(); pr(`owner of ${a[1]} → ${a[0]}`,"ok"); }},
  chgrp:{ run(a,s,pr){ const n=VFS.node(VFS.norm(s.cwd,a[1]||""));
    if(!n){ pr(`chgrp: ${a[1]}: No such file`,"err"); return; } n.group=a[0]; Store.save(); pr(`group of ${a[1]} → ${a[0]}`,"ok"); }},
  umask:{ run(a,s,pr){ pr("0022 (cyrus-vfs default)"); } },

  // ---------- system info
  whoami:{ run(a,s,pr){ pr("rithvik"); } },
  who:{ run(a,s,pr){ pr(`rithvik  console  ${fmtTime(Date.now())}`); } },
  w:{ run(a,s,pr){ pr(`USER     TTY   FROM    WHAT\nrithvik  tty1  -       cyrus-sh (windows: ${WM.wins.size})`); } },
  id:{ run(a,s,pr){ pr("uid=1000(rithvik) gid=1000(rithvik) groups=1000(rithvik),27(sudo),44(video)"); } },
  groups:{ run(a,s,pr){ pr("rithvik sudo video"); } },
  hostname:{ run(a,s,pr){ pr("cyrus"); } },
  uname:{ run(a,s,pr){ pr(a.some(x=>x.startsWith("-"))?"CYRUS cyrus-vfs 1.0.0 js-virtual x86_64 (browser host)":"CYRUS"); } },
  uptime:{ run(a,s,pr){ const up=Date.now()-(Store.bootTs||Date.now()); const m=Math.floor(up/60000);
    pr(` ${fmtTime(Date.now())} up ${m} min, 1 user, load: ${WM.wins.size} windows`); } },
  date:{ run(a,s,pr){ pr(new Date().toString()); } },
  cal:{ run(a,s,pr){
    const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
    const first=new Date(y,mo,1).getDay(), days=new Date(y,mo+1,0).getDate();
    const mn=now.toLocaleString([],{month:"long"});
    const head=`${mn} ${y}`.padStart(16)+"\nSu Mo Tu We Th Fr Sa";

// ---------- PyRun: safe mini-Python
const PyRun={ run(src){ const out=[];
  try{ const lines=src.split("\n");
    for(const raw of lines){ const l=raw.trim();
      let m=l.match(/^print\s*\((.*)\)\s*$/)||l.match(/^print\s+(.+)$/);
      if(m){ let arg=m[1];
        if(/^f["']/.test(arg)){ arg=arg.slice(1).replace(/["']$/,"").replace(/\{([^}]+)\}/g,(x,e)=>String(this.evalExpr(e,out))); }
        else arg=arg.replace(/^["']|["']$/g,"").replace(/["'],\s*["']/g," ");
        out.push(arg.replace(/\\n/g,"\n")); continue; }
      m=l.match(/^(\w+)\s*=\s*(.+)$/);
      if(m&&!/^(if|for|while|def|class|import|from|print)$/.test(m[1])){ this.vars=this.vars||{}; this.vars[m[1]]=this.evalExpr(m[2],out); continue; }
      if(/^(import|from|#|\"\"\")/.test(l)||l==="") continue;
    } }catch(e){ out.push("Traceback: "+e.message); }
  return out.length?out.join("\n"):"(script ran — only print/assignment statements are supported in this sandbox)"; },
  evalExpr(e){ try{ return Function("vars",`with(vars||{}){ return (${e}) }`)(this.vars||{}); }catch(err){ return "?"; } } };

  const writeMeta=(m,repo)=>VFS.writeFile((repo||s.cwd)+"/.cyrus-git/meta",JSON.stringify(m));
  if(sub==="init"){ init(); VFS.writeFile(s.cwd+"/.cyrus-git/meta",JSON.stringify({staged:[],commits:[],branches:["main"],cur:"main",stash:[],tags:[]}));
    pr(`Initialized empty Git repository in ${s.cwd}/.cyrus-git/`,"ok"); return; }
  const rp=repoPath(); const base=s.cwd;

  if(sub==="branch"){ if(!a[1]){ pr(meta.branches.map(b=>(b===meta.cur?"* ":"  ")+b).join("\n")); return; }

  if(sub==="diff"){ const now=filesNow();

  if(sub==="stash"){ meta.stash.push({when:Date.now(),files:filesNow().length}); writeMeta(meta,repo); pr(`stashed working set (${filesNow().length} files)`,"ok"); return; }
  if(sub==="tag"){ if(a[1]){ meta.tags.push(a[1]); writeMeta(meta,repo); pr(`tagged ${a[1]}`,"ok"); } else pr(meta.tags.join("\n")||"(no tags)"); return; }

  if(sub==="restore"||sub==="reset"){ meta.staged=[]; writeMeta(meta,repo); pr("unstaged everything (working tree intact)","ok"); return; }
  pr("usage: git <init|add|commit|log|status|branch|switch|diff|stash|tag|remote|restore|reset>","err");
} };

const PAGER={ page:null };

// ---------- shell operators + dispatch ------------------------------------
const Sh = {
  // split on ; && || while respecting quotes
  segments(line){
    const segs=[]; let cur="", op=null, i=0, q=null;
    while(i<line.length){
      const c=line[i];
      if(q){ cur+=c; if(c===q)q=null; i++; continue; }
      if(c==="\""||c==="'"){ q=c; cur+=c; i++; continue; }
      if(c==="&"&&line[i+1]==="&"){ segs.push({text:cur,op:op}); op="&&"; cur=""; i+=2; continue; }
      if(c==="|"&&line[i+1]==="|"){ segs.push({text:cur,op:op}); op="||"; cur=""; i+=2; continue; }
      if(c===";"){ segs.push({text:cur,op:op}); op=null; cur=""; i++; continue; }
      cur+=c; i++;
    }
    segs.push({text:cur,op:op});
    return segs.filter(s=>s.text.trim());
  },
  // split one segment into pipelines by | ; each stage gets redirections applied
  parsePipes(text){
    const stages=[]; let cur="", q=null, i=0;
    while(i<text.length){ const c=text[i];
      if(q){ cur+=c; if(c===q)q=null; i++; continue; }
      if(c==="\""||c==="'"){ q=c; cur+=c; i++; continue; }
      if(c==="|"){ stages.push(cur.trim()); cur=""; i++; continue; }
      cur+=c; i++; }
    stages.push(cur.trim());
    return stages.map(st=>{
      const out={cmd:"",redir:null,append:false,input:null};
      const rm=/\s(>>?)\s*("[^"]*"|'[^']*'|\S+)\s*$/.exec(st);
      if(rm){ out.append=rm[1]===">>"; st=st.slice(0,rm.index); out.redir=rm[2].replace(/^["']|["']$/g,""); }
      const im=/\s<\s*("[^"]*"|'[^']*'|\S+)\s*$/.exec(st);
      if(im){ out.input=im[1].replace(/^["']|['"]$/g,""); st=st.slice(0,im.index); }
      out.cmd=st.trim(); return out;
    });
  },
  run(line, state, print){
    const lastOk={v:true};
    for(const seg of this.segments(line)){
      if(seg.op==="&&"&&!lastOk.v) continue;
      if(seg.op==="||"&&lastOk.v) continue;
      lastOk.v=this.pipeline(seg.text, state, print);
    }
  },
  pipeline(text, state, print){
    const stages=this.parsePipes(text);
    let data=null, ok=true;
    for(let i=0;i<stages.length;i++){
      const st=stages[i];
      const catchOut=[];
      const pr=(t,cls)=>catchOut.push(t);
      // command substitution $( )
      let cmdText=st.cmd.replace(/\$\(([^()]*)\)/g,(m,inner)=>{
        let cap="";
        this.pipeline(inner, state, t=>{cap+=t+"\n";});
        return cap.trim();
      });
      const toks=Term.tokenize(cmdText.trim());
      if(!toks.length) continue;
      let cmd=toks[0], args=toks.slice(1);
      // stdin from the previous pipe stage: expose as state.stdin for commands that accept it
      state.stdin=data;
      // alias expansion
      if(state.aliases&&state.aliases[cmd]) { const ex=Term.tokenize(state.aliases[cmd]); cmd=ex[0]||cmd; args=ex.slice(1).concat(args); }
      // CMD aliases (windows names)
      if(!CMDS[cmd]&&CMD_ALIASES[cmd]&&CMDS[CMD_ALIASES[cmd]]) cmd=CMD_ALIASES[cmd];
      // "??" starts with a non-word char, keep it intact through the tokenizer
      let res=true;
      if(cmd==="man"){ this.man(args,pr); }
      else if(cmd==="apropos"){ this.apropos(args,pr); }
      else if(cmd==="whatis"){ pr(args[0]&&MAN[args[0]]?MAN[args[0]].split("—")[0].trim():`whatis: ${args[0]}: nothing appropriate`,"out"); }
      else if(cmd==="cheat"){ this.cheat(args,pr); }
      else if(CMDS[cmd]){
        // For the last stage, let async handlers write straight to the terminal;
        // for piped stages, keep capturing into catchOut.
        const isLast=(i===stages.length-1);
        const prFinal=isLast&&!st.redir?print:pr;
        try{ CMDS[cmd].run(args, state, prFinal); }catch(e){ pr((cmd)+": "+e.message,"err"); res=false; }
      }
      else if(CMDS["help"]){ pr(`${cmd}: command not found. Try 'ai ${cmdText.trim()}' — CYRUS might understand it.`,"err"); res=false; }
      // final stage output goes to the terminal (or the redirection target)
      const outText=catchOut.join("\n");
      if(i===stages.length-1){
        if(st.redir){
          const target=VFS.norm(state.cwd,st.redir);
          if(st.append){ const ex=VFS.node(target); const base=(ex&&ex.content)||"";
            VFS.writeFile(target, base+(base?"\n":"")+outText); }
          else VFS.writeFile(target,outText);
          print("(wrote "+st.redir+")","dim");
        } else if(outText) print(outText);
      }
      // pipe forward: next stage receives this stage's captured output
      data=catchOut.join("\n");
      ok=ok&&res;
    }
    state.stdin=null;
    return ok;
  },
  man(args,pr){
    const c=args[0];
    if(!c){ pr("What manual page do you want?\nusage: man <command>   ·   try: man ls","err"); return; }
    if(MAN[c]) pr(c.toUpperCase()+"(1)\n\nNAME    "+c+" — "+MAN[c].split("—").slice(1).join("—").trim()||MAN[c]+"\n\nSYNOPSIS  "+MAN[c]+"\n\nSee also: cheat, apropos "+c);
    else pr(`No manual entry for ${c}. Try 'apropos ${c}' or 'cheat'.`,"err");
  },
  apropos(args,pr){
    const kw=(args[0]||"").toLowerCase();
    if(!kw){ pr("usage: apropos <keyword>","err"); return; }
    const hits=Object.entries(MAN).filter(([c,d])=>c.includes(kw)||d.toLowerCase().includes(kw)).map(([c,d])=>`${c} — ${d.split("—").slice(1).join("—").trim()||d}`);
    pr(hits.length?hits.join("\n"):`nothing appropriate for “${kw}”`,"out");
  },
  cheat(args,pr){
    const cat=(args[0]||"all").toLowerCase();
    const groups={
      nav:["ls","cd","pwd","tree","clear","reset","exit"],
      files:["touch","mkdir","rmdir","rm","cp","mv","cat","less","head","tail","nl","wc","file","stat","ln"],
      read:["cat","less","head","tail","nl","wc"],
      search:["grep","find","locate","which","whereis","type"],
      perm:["chmod","chown","chgrp","umask"],
      sys:["whoami","who","w","id","groups","hostname","uname","uptime","date","cal","history","env","printenv","systeminfo","ver"],
      proc:["ps","top","kill","tasklist","taskkill"],
      disk:["df","du","free","lsblk","mount"],
      net:["ip","ss","netstat","ipconfig","ping","tracert","dig","nslookup","curl","wget","ssh"],
      pkg:["apt","dnf","pacman","pip","npm"],
      arch:["tar","zip","unzip","gzip","gunzip"],
      dev:["python","pip","java","javac","gcc","g++","node","npm","git","docker"],
      ops:["echo","export","unset","alias","unalias","source"],
      env:["export","unset","env","alias"],
      help:["man","apropos","whatis","cheat","help"],
      win:["dir","cls","ver","where","findstr","tasklist","ipconfig","tracert","netstat","systeminfo","taskkill"],
      git:["git"],
      docker:["docker"],
      cyrus:["ai","open","neofetch","ask","explain"],
    };
    const aliases={win:"Windows CMD", nav:"Navigation", files:"Files", read:"Reading files", search:"Search", perm:"Permissions",
      sys:"System info", proc:"Processes", disk:"Disk", net:"Networking", pkg:"Packages", arch:"Archives",
      dev:"Development", ops:"Shell operators", env:"Environment", help:"Help", git:"Git", docker:"Docker", cyrus:"CYRUS AI layer"};
    const cats=cat==="all"?Object.keys(groups):Object.keys(groups).filter(k=>k===cat);
    if(!cats.length){ pr("categories: "+Object.keys(groups).join(", "),"err"); return; }
    const out=[];
    for(const k of cats){
      out.push("\n── "+(aliases[k]||k)+" "+"─".repeat(Math.max(2,40-(aliases[k]||k).length)));
      for(const c of groups[k]){ if(MAN[c]) out.push("  "+MAN[c]); }
    }
    out.push("\nRun any of these directly — they all work here. Details: man <cmd>");
    pr(out.join("\n"));
  }
};

// ---------- command assistant: describe it → the AI writes the command for you
// The model never executes anything — it only *writes* the command into your input
// line; you review/edit, and pressing Enter is the human approval. (Spec §3/§16.)
const AskCmd={
  known(cmd){ return !!(CMDS[cmd] || (CMD_ALIASES[cmd] && CMDS[CMD_ALIASES[cmd]])); },
  validCommands(text){
    return text.replace(/```[a-z]*/g,"").replace(/```/g,"").split("\n").map(l=>l.trim())
      .filter(l=>l && !l.startsWith("#"))
      .filter(l=>this.known(l.replace(/^[$>]\s*/,"").split(/\s+/)[0]))
      .map(l=>l.replace(/^[$>]\s*/,""));
  },
  async cloud(req){
    const caps=Object.keys(MAN).join(" ");
    const sys=`You are the command-writing assistant inside the CYRUS OS terminal (cyrus-sh).
The user describes a task in plain English; you reply with the exact shell command(s) that accomplish it.
Rules:
- Use ONLY cyrus-sh builtins. Available commands: ${caps}
- The user's home is ~ (= /home/rithvik). All paths are virtual.
- Output ONLY the command(s), one per line, no markdown fences, no explanations, no $ prompts.
- Multi-step tasks: chain with && or ; on one line, or give several lines.
- Never suggest sudo; rm on critical paths is blocked by the OS policy anyway.`;
    const r=await Router.chat([{role:"system",content:sys},{role:"user",content:req}],{taskType:"fast",temperature:0,maxTokens:180});
    if(!r.ok) throw new Error((r.errors||[]).join(" | ")||"offline");
    const cmds=this.validCommands(r.text);
    if(!cmds.length) throw new Error("model returned no valid commands");
    return {cmds, via:r.viaLabel};
  },
  local(req){
    const lo=req.toLowerCase();
    const any=(...ws)=>ws.some(w=>lo.includes(w));
    const has=(...ws)=>ws.every(w=>lo.includes(w));
    const extM=lo.match(/\b(pdf|jpg|jpeg|png|csv|java|py|zip|doc|pptx)s?\b/);
    if(any("clean","tidy")&&any("desktop")) return {cmds:["ai clean up my desktop"], via:"local rules"};
    if(any("workspace")){ const m=lo.match(/([a-z ]+) workspace/); return {cmds:[`ai start ${m?m[1].trim():"college"} workspace`], via:"local rules"}; }
    if(any("find","search","locate","show")&&extM) return {cmds:[`find ~ -ext ${extM[1]==="jpeg"?"jpg":extM[1]==="docs"?"doc":extM[1]}`], via:"local rules"};
    if(any("find","search","locate")&&any("machine learning"," ml ")) return {cmds:[`grep -ri "machine learning" ~ | head -n 20`], via:"local rules"};
    if((has("what","using")||has("taking","up"))&&any("space","disk","storage")) return {cmds:["du","df -h"], via:"local rules"};
    if(any("disk","storage","space")&&any("free","usage","left","how much")) return {cmds:["df -h"], via:"local rules"};
    if(any("internet","network","connectivity","online","wifi")) return {cmds:["ping google.com"], via:"local rules"};
    if(any("ip","network config")&&!any("internet")) return {cmds:["ipconfig"], via:"local rules"};
    if(any("running","process","windows open","tasklist")) return {cmds:["ps"], via:"local rules"};
    if(any("memory","ram")&&any("how much","usage","using")) return {cmds:["free"], via:"local rules"};
    if(any("git")&&any("commit")) return {cmds:[`git add . && git commit -m "update"`], via:"local rules"};
    if(any("git")&&any("init","repository","repo")) return {cmds:["git init"], via:"local rules"};
    if(any("git")&&any("status","changes")) return {cmds:["git status"], via:"local rules"};
    if(any("compress","archive","backup","zip")&&any("folder","directory","project","everything in")){ const m=lo.match(/(?:folder|directory|project)\s+([a-z0-9_\-\.]+)/); return {cmds:[`tar -czf ${m?m[1]:"archive"}.tar.gz ${m?m[1]:"."}`], via:"local rules"}; }
    if(any("calendar")) return {cmds:["cal"], via:"local rules"};
    if(any("date","time")&&!any("file","folder")) return {cmds:["date"], via:"local rules"};
    if(any("grep","inside","contains")&&any("search","find","text")){ const m=req.match(/"([^"]+)"|\bfor\s+([a-z0-9 ]+)/i); const pat=m?(m[1]||m[2]).trim():"pattern"; return {cmds:[`grep -r "${pat}" ~ | head -n 20`], via:"local rules"}; }
    if(any("create","make","new")&&any("folder","directory")){ const m=lo.match(/(?:folder|directory)\s+(?:called\s+|named\s+)?([a-z0-9_\-]+)/); return {cmds:[`mkdir -p ${m?m[1]:"new-folder"}`], via:"local rules"}; }
    if(any("install")&&any("pip","python package")){ const m=lo.match(/install\s+([a-z0-9_\-]+)/); return {cmds:[`pip install ${m?m[1]:"package"}`], via:"local rules"}; }
    if(any("install")&&any("apt","package")){ const m=lo.match(/install\s+([a-z0-9_\-]+)/); return {cmds:[`apt install ${m?m[1]:"package"}`], via:"local rules"}; }
    if(any("docker")&&any("run","start","container")){ const m=lo.match(/(?:run|start)\s+([a-z0-9_\-\.\/:]+)/); return {cmds:[`docker pull ${m?m[1]:"nginx"} && docker run ${m?m[1]:"nginx"}`], via:"local rules"}; }
    if(any("python","pip")&&any("version")) return {cmds:["python --version"], via:"local rules"};
    if(any("count","how many")&&any("line","word")){ const m=req.match(/\b([\w\-\.]+\.[a-z0-9]+)\b/i); return {cmds:[`wc ${m?m[1]:"file"}`], via:"local rules"}; }
    // default: hand it to the OS intent layer (still plain English, still safe)
    return {cmds:[`ai ${req}`], via:"local rules"};
  },
  async suggest(req, s, print){
    print("🤖 assistant: thinking…","dim");
    let res=null, via="", note="";
    if(Store.data.settings.privacy!=="local"){
      try{ res=await this.cloud(req); via=res.via; }
      catch(e){ note="(cloud unreachable — using local rules)"; }
    }
    if(!res){ res=this.local(req); via=res.via; }
    if(note) print(note,"dim");
    const risky=res.cmds.some(c=>/\brm\b/.test(c));
    print("");
    print(`💡 Suggested command${res.cmds.length>1?"s":""}  ·  via ${via}`, "ok");
    res.cmds.forEach(c=>print("  $ "+c, "p"));
    if(risky) print("  ⚠️ this deletes data — review it before pressing Enter", "err");
    print("  (written into the input line below — press Enter to run, or edit first)","dim");
    print("");
    Log.record("ask: "+req,"suggest_command",{request:req},"low",false,true,"suggested via "+via);
    if(s.inp){ s.inp.value=res.cmds.join(" ; "); s.inp.focus(); }
    return res.cmds;
  }
};

    pr("undo with: organize --undo","dim"); return;
  }
  if(a[0]==="--undo"){ const n=IOrganizer.undo(); pr(n?"undid "+n+" moves":"nothing to undo", n?"ok":"dim"); return; }
  return _origOrganizeRun(a,s,pr);
};

CMDS.explain={ run(a,s,pr){
  const line=a.join(" ");
  if(!line){ pr("usage: explain <command or pipeline> — e.g. explain tar -czf backup.tar.gz Projects","dim"); return; }
  const base=line.split(/\s*[|;&]\s*/)[0].split(/\s+/)[0];
  const man=MAN[base];
  pr("📘 "+line);
  if(man) pr("   "+man);
  else pr("   not a cyrus-sh builtin — on a real system it depends on what's installed");
  const warns=[];
  if(/\brm\b/.test(line)) warns.push("deletes files (directories need -r; critical paths are policy-blocked)");
  if(/(>|\s)>{0,2}\s*\S+\s*$/.test(line)&&/>/.test(line)) warns.push("writes to a file");
  if(/curl|wget|ping/.test(line)) warns.push("reaches the network");
  if(/git\s+push/.test(line)) warns.push("uploads commits to a remote");
  if(/chmod\s+\+x/.test(line)) warns.push("marks a file executable");
  if(/docker\s+run/.test(line)) warns.push("starts a container");
  if(warns.length) pr("   ⚠️ "+warns.join("; "));
  if(s.inp){ s.inp.value=line; s.inp.focus(); pr("   (in the input line — Enter runs it once you're happy)"); }
}};

const Term = {
  history: [],
  tokenize(s){ const re=/"([^"]*)"|'([^']*)'|(\S+)/g; const out=[]; let m; while((m=re.exec(s))) out.push(m[1]!=null?m[1]:(m[2]!=null?m[2]:m[3])); return out; },
  exec(line, state, print){
    line = (line||"").trim();
    try{
      if(!line) return;
      Term.history.push(line);
      if(Term.history.length>200) Term.history.shift();
      // support "!5" re-run from history
      const bang = line.match(/^!(\d+)$/);
      if(bang){ const idx=parseInt(bang[1])-1; const h=Term.history[idx];
        if(h && h!==line){ print("(re-run: "+h+")","dim"); return Term.exec(h, state, print); }
        return; }
      Sh.run(line, state, print);
    }catch(e){ print("error: "+e.message,"err"); console.error(e); }
  }
};

      results.querySelector('[data-a="close"]').addEventListener("click",()=>results.classList.add("hidden"));
      results.querySelectorAll(".r").forEach(r=>r.addEventListener("click",()=>{

        else openEditor(r.dataset.p);
      }));
    };
    win.render=render; render();
    win.onReload=render;
    if(typeof arg==="string") st.path=VFS.norm("/home/rithvik",arg);
    if(arg&&arg.results) win.showSearchResults(arg.results,arg.query);

// ---------------------------------------------------------------------------
//  LANG — the engine every other phase reads from
// ---------------------------------------------------------------------------
const LANG = (()=>{
  const byId = new Map(), byExt = new Map();

  function build(row){
    const [id,name,exts,fam,sym,kw,bi,ty,run] = row;
    const f = FAM[fam] || FAM.plain;
    const spec = {
      id, name,
      exts: String(exts||"").split(/\s+/).filter(Boolean),
      fam,
      line:f.line||[], block:f.block||[], str:f.str||[], esc:!!f.esc, raw:f.raw||null,
      pairs: f.pairs||{}, indent: f.ind||2,
      xml: !!f.xml, markdown: !!f.markdown, regexp: !!f.regexp,
      openers: OPENERS.filter(o=> o==='"'||o==="'" ? f.str.length : !!f.pairs[o]),
      kw:   K(KW[kw]||""),
      bi:   K(BUILTINS[bi]||""),
      ty:   K(TYPES[ty]||""),
      con:  K(CONSTS[kw]||""),
      sym:  (SYM[sym]||[]).reduce((acc,r)=>{
        try{ const [kind,src,g]=r; acc.push({kind, re:new RegExp(src,"gm"), g:g||1}); }
        catch(e){ console.warn("[cyrus-studio] bad symbol rule for "+id+": "+e.message); }
        return acc;
      }, []),
      run,
    };
    byId.set(id,spec);
    spec.exts.forEach(e=>{ if(!byExt.has(e)) byExt.set(e,spec); });
    return spec;
  }
  LANGS.forEach(build);
  // names/aliases that map onto existing specs
  [["node","javascript"],["ts","typescript"],["py","python"],["jsx","javascript"],
   ["sh","bash"],["shell","bash"],["zsh","bash"],["yml","yaml"],["rs","rust"],
   ["golang","go"],["rb","ruby"],["kt","kotlin"],["cs","csharp"],["c#","csharp"],
   ["c++","cpp"],["h","c"],["hpp","cpp"],["pl","perl"],["lua51","lua"],
   ["objective-c","objectivec"],["asm","asm"],["batchfile","batch"],
   ["tf","hcl"],["hcl","hcl"],["proto3","proto"],["docker","dockerfile"]
  ].forEach(([alias,id])=>{ if(byId.has(id)){ const s=byId.get(id); if(!s.exts.includes(alias)){ s.exts.push(alias); byExt.set(alias,s); } } });
  // Terraform — worth its own row so hcl gets real syntax
  build(["hcl","Terraform / HCL","tf hcl tfvars nomad vault","h","txt","sh","sh","",  "terraform"]);
  build(["jsonc","JSON with comments","jsonc jsonl ndjson geojson","c","json","","","","json"]);

  function byName(n){ return byId.get(String(n||"").toLowerCase()) || null; }

  function forPath(path, content){
    const base = String(path||"").split("/").pop()||"";
    const lname = base.toLowerCase();
    // exact filename wins (Dockerfile, Makefile, CMakeLists.txt)
    const exact = {"dockerfile":1,"makefile":1,"cmakelists.txt":1,"rakefile":1,"gemfile":1,"procfile":1,"vagrantfile":1,
      "requirements.txt":1,"cargo.toml":1,"go.mod":1,"package.json":1,"pyproject.toml":1,"build.gradle":1,
      ".gitignore":1,".env":1,"license":1,"readme":1,"todo":1,"hosts":1,"passwd":1,"fstab":1};
    if(exact[lname]){
      if(/^dockerfile/.test(lname)) return byId.get("dockerfile");
      if(/^makefile/.test(lname)) return byId.get("make");
      if(lname==="cmakelists.txt") return byId.get("cmake");
      if(lname==="rakefile"||lname==="gemfile") return byId.get("ruby");
      if(/^requirements|^pyproject/.test(lname)) return byId.get("toml");
      if(/^cargo\.toml/.test(lname)) return byId.get("toml");
      if(/^go\.mod/.test(lname)) return byId.get("toml");
      if(/^package\.json$/.test(lname)) return byId.get("json");
      if(/^build\.gradle/.test(lname)) return byId.get("jvm");
      if(lname.startsWith(".")) return derive(lname);
    }
    const dot = lname.lastIndexOf(".");
    if(dot>0){
      const ext = lname.slice(dot+1);
      const hit = byExt.get(ext);
      if(hit) return hit;
      return derive(ext, content);
    }
    // shebang detection
    if(content){
      const m = String(content).slice(0,120).match(/^#!\s*(\S+)(?:\s+(\S+))?/);
      if(m){
        const sh=[/bash/,/sh$/,/zsh/,/ksh/,/python/,/node/,/ruby/,/perl/,/php/,/lua/,/rscript/,/julia/,/R/,/awk/,/sed/];
        for(const r of sh) if(r.test(m[1])){ const n=r.source.replace(/[\\^$]/g,""); }
        const map={bash:"bash",sh:"bash",zsh:"bash",ksh:"bash",python:"python",python3:"python",node:"javascript",
                   ruby:"ruby",perl:"perl",php:"php",lua:"lua",rscript:"r",julia:"julia",R:"r",awk:"sh",env:"sh"};
        const key=map[m[1].split("/").pop()]|| (m[2]&&map[m[2].split("/").pop()]);
        if(key&&byId.has(key)) return byId.get(key);
      }
    }
    return byId.get("plain");
  }

  // Unknown extension → derive a workable spec from the extension itself so a
  // brand-new language still highlights and still gets diagnostics.
  const derived = new Map();
  function derive(ext, content){
    ext = String(ext||"").toLowerCase();
    if(derived.has(ext)) return derived.get(ext);
    let fam = "plain";
    if(content){
      const s = String(content).slice(0,4000);
      if(/\n\s*(def |class )|\n\s*import \w|\nfrom \w+ import/.test(s)) fam="h";
      else if(/\/\*[\s\S]*?\*\/|\n\s*(function|class|const|let) /.test(s)) fam="c";
      else if(/\n#|\n--|\bSECTION\b/.test(s)) fam="h";
    }
    const spec = {
      id:"~"+ext, name: ext.toUpperCase()+" (derived)", exts:[ext], fam,
      line:FAM[fam].line||[], block:FAM[fam].block||[], str:FAM[fam].str||[], esc:!!FAM[fam].esc, raw:null,
      pairs: FAM[fam].pairs||{}, indent:FAM[fam].ind||2, xml:false, markdown:false, regexp:false,
      openers: OPENERS.filter(o=> o==='"'||o==="'" ? FAM[fam].str.length : !!FAM[fam].pairs[o]),
      kw:new Set(), bi:new Set(), ty:new Set(), con:new Set(), sym:[], run:"", derived:true,
    };
    derived.set(ext,spec);
    return spec;
  }

  // ---- tokenizer ---------------------------------------------------------
  // Emits [{s,e,t}]. Single pass. Used by the highlighter, the diagnostics
  // engine and the AI context builder.
  function tokenize(src, spec){
    const out = []; const n = src.length; let i = 0;
    const kw = spec.kw, bi = spec.bi, ty = spec.ty, con = spec.con;
    const push = (s,e,t)=>{ if(e>s) out.push({s:s,e:e,t:t}); };
    let prev = "";                 // last significant token text
    let prevType = "";
    const isWordStart = c => /[A-Za-z_$]/.test(c);
    const isWord = c => /[A-Za-z0-9_$]/.test(c);
    const OPS = ["===","!==","...","**=","<<=",">>=","&&=","||=","??=",">>>","=>","->","::","++","--","+=","-=","*=","/=","%=","&&","||","??","?.","==","!=","<=",">=","<<",">>","**","+","-","*","/","%","=","<",">","!","&","|","^","~","?","@","#","$"];

    while(i<n){
      const c = src[i];

      // whitespace — skip, renderer fills the gaps as plain text
      if(c===" "||c==="\t"||c==="\n"||c==="\r"){ i++; continue; }

      // ---- markup
      if(spec.xml && c==="<"){
        const m = /^<\?([\s\S]*?)\?>/.exec(src.slice(i));
        if(m){ push(i,i+m[0].length,"dec"); i+=m[0].length; continue; }
        const cm = /^<!--[\s\S]*?(?:-->|$)/.exec(src.slice(i));
        if(cm){ push(i,i+cm[0].length,"cmt"); i+=cm[0].length; prev=""; continue; }
        const cl = /^<!\[CDATA\[[\s\S]*?\]\]>/.exec(src.slice(i));
        if(cl){ push(i,i+cl[0].length,"str"); i+=cl[0].length; continue; }
        const dt = /^<![A-Za-z]+/.exec(src.slice(i));
        if(dt){ const gt=src.indexOf(">",i); push(i, gt<0?n:gt+1, "tag"); i=(gt<0?n:gt+1); continue; }
        const tg = /^<\/?[A-Za-z][\w:.-]*/.exec(src.slice(i));
        if(tg){
          push(i, i+tg[0].length, "tag"); i+=tg[0].length;
          // attributes until '>' or '/>'
          while(i<n && src[i]!==">"){
            if(src[i]===" "||src[i]==="\t"||src[i]==="\n"){ i++; continue; }
            if(spec.esc && src[i]==="\\"){ push(i,i+2,"esc"); i+=2; continue; }
            if(src[i]==='"'||src[i]==="'"){ const s0=i, q=src[i]; i++;
              while(i<n && src[i]!==q){ if(src[i]==="\n")break; i++; }
              if(src[i]===q) i++;
              push(s0,i,"str"); continue; }
            if(src[i]==="/"||src[i]==="="){ push(i,i+1,"op"); i++; continue; }
            const at = /^[A-Za-z_:@#][\w:.@-]*/.exec(src.slice(i));
            if(at){ push(i,i+at[0].length,"attr"); i+=at[0].length; continue; }
            i++;
          }
          if(i<n){ push(i,i+1,"tag"); i++; }
          prev=">"; prevType="tag";
          continue;
        }
      }

      // ---- markdown
      if(spec.markdown){
        const rest = src.slice(i);
        const h = /^#{1,6}[^\n]*/.exec(rest);
        if(h){ push(i,i+h[0].length,"kw"); i+=h[0].length; continue; }
        const b = /^(?:```|~~~)[^\n]*\n?/.exec(rest);
        if(b){ push(i,i+b[0].length,"str"); i+=b[0].length; continue; }
        const bl = /^(?:[-*+]|\d+\.)\s/.exec(rest);
        if(bl){ push(i,i+bl[0].length,"kw"); i+=bl[0].length; continue; }
        const lk = /^\[[^\]\n]*\]\([^)\n]*\)/.exec(rest);
        if(lk){ push(i,i+lk[0].length,"fn"); i+=lk[0].length; continue; }
        const bt = /^`[^`\n]*`/.exec(rest);
        if(bt){ push(i,i+bt[0].length,"str"); i+=bt[0].length; continue; }
      }

      // ---- block comment
      let matched = false;
      for(const b of (spec.block||[])){
        if(src.startsWith(b[0],i)){
          const e = src.indexOf(b[1], i+b[0].length);
          const end = e<0 ? n : e+b[1].length;
          push(i,end,"cmt"); i=end; matched=true; break;
        }
      }
      if(matched){ prev=""; continue; }

      // ---- line comment
      for(const l of (spec.line||[])){
        if(src.startsWith(l,i)){
          let e=i; while(e<n && src[e]!=="\n") e++;
          push(i,e,"cmt"); i=e; prev=""; matched=true; break;
        }
      }
      if(matched) continue;

      // ---- string
      for(const s of (spec.str||[])){
        if(src.startsWith(s[0],i)){
          const raw = spec.raw && spec.raw.indexOf(s[0])>=0;
          let j = i+s[0].length;
          while(j<n){
            if(!raw && spec.esc && src[j]==="\\"){ j+=2; continue; }
            if(src.startsWith(s[1],j)){ j+=s[1].length; break; }
            if(s[1].length===1 && src[j]==="\n") break;     // unterminated single-line
            j++;
          }
          push(i,j,"str"); i=j; prev="str"; prevType="str"; matched=true; break;
        }
      }
      if(matched) continue;

      // ---- number
      if(/[0-9]/.test(c) || (c==="." && /[0-9]/.test(src[i+1]||""))){
        const m = /^(?:0[xXbBoO][0-9a-fA-F_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?)(?:[eE][+-]?\d+)?[a-zA-Z_]*n?|[0-9][a-zA-Z_]*/.exec(src.slice(i));
        if(m){ push(i,i+m[0].length,"num"); i+=m[0].length; prev=m[0]; prevType="num"; continue; }
      }

      // ---- regexp literal (c-family heuristic)
      if(spec.regexp && c==="/" && (prevType==="op"||prevType==="kw"||prevType==="pun"||prev==="("||prev===","||prev===""||prev==="["||prev==="return"||prev===";")){
        let j=i+1, ok=false, inClass=false;
        while(j<n && src[j]!=="\n"){
          if(src[j]==="\\"){ j+=2; continue; }
          if(src[j]==="[") inClass=true;
          else if(src[j]==="]") inClass=false;
          else if(src[j]==="/" && !inClass){ ok=true; j++; break; }
          j++;
        }
        if(ok){ let k=j; while(k<n && /[a-z]/.test(src[k])) k++;
          push(i,k,"regexp"); i=k; prev=""; prevType="regexp"; continue; }
      }

      // ---- word
      if(isWordStart(c)){
        let j=i; while(j<n && isWord(src[j])) j++;
        const w = src.slice(i,j);
        let t = "";
        if(kw.has(w)) t="kw";
        else if(con.has(w)) t="num";
        else if(bi.has(w)) t="bi";
        else if(ty.has(w)) t="ty";
        else {
          let k=j; while(k<n && (src[k]===" "||src[k]==="\t")) k++;
          if(src[k]==="(") t="fn";
          else if(spec.pairs["{"] && src[j]==="{" && /^\s*\{/.test(src.slice(j))) t="cls";
          else if(/^[A-Z][A-Z0-9_]{1,}$/.test(w)) t="var";
          else if(/^[A-Z]/.test(w)) t="cls";
          else if(/^[@$][A-Za-z_]/.test(w)) t="ty";
        }
        push(i,j,t||""); i=j; prev=w; prevType=t||"word";
        continue;
      }

      // ---- operator / punctuation
      const op = OPS.find(o=>src.startsWith(o,i));
      if(op){ push(i,i+op.length,"op"); i+=op.length; prev=op; prevType="op"; continue; }
      push(i,i+1,"pun"); i++; prev=c; prevType="pun";
    }
    return out;
  }

  return { byId, byExt, LANGS, forPath, byName, derive, tokenize,
           count: byId.size, extCount: byExt.size };
})();// ---------------------------------------------------------------------------
//  Symbols — structure, not just colour.
// ---------------------------------------------------------------------------
const SYMBOLS = (()=>{
  function lineStarts(src){
    const starts=[0];
    for(let i=0;i<src.length;i++) if(src[i]==="\n") starts.push(i+1);
    return starts;
  }
  function lineOf(starts,pos){
    let lo=0, hi=starts.length-1;
    while(lo<hi){ const mid=(lo+hi+1)>>1; if(starts[mid]<=pos) lo=mid; else hi=mid-1; }
    return lo;
  }

  function extract(src, spec){
    const starts = lineStarts(src);
    const out = [];
    const seen = new Set();
    for(const rule of (spec.sym||[])){
      rule.re.lastIndex = 0;
      let m, guard = 0;
      while((m = rule.re.exec(src)) && guard++ < 2000){
        const name = (m[rule.g]||"").trim();
        if(!name || name.length>80) continue;
        let pos = m.index + m[0].indexOf(name);
        if(pos<0) continue;
        const line = lineOf(starts,pos);
        const col = pos - starts[line];
        const key = rule.kind+":"+name+":"+line;
        if(seen.has(key)) continue;
        seen.add(key);
        // nesting: count indentation depth for the outline
        let depth = 0;
        for(let i=line-1;i>=0;i--){
          const ls = src.slice(starts[i], i+1<starts.length?starts[i+1]-1:src.length);
          const t = ls.trim();
          if(!t) continue;
          const ind = ls.length - ls.replace(/^[ \t]*/,"").length;
          if(ind < col - 1){ depth++; if(depth>8) break; }
          else break;
        }
        out.push({ name, kind:rule.kind, line, col, pos, depth,
                   container: nearestContainer(out, line, col) });
      }
    }
    out.sort((a,b)=> a.line-b.line || a.col-b.col);
    return out.slice(0,900);
  }
  function nearestContainer(list, line, col){
    let best=null;
    for(const s of list){
      if(s.line<=line && (s.line<line || s.col<=col)){
        if(!best || s.line>best.line || (s.line===best.line && s.col>best.col)) best=s;
      }
    }
    return best ? best.name : null;
  }

  // enclosing symbol at a caret position
  function at(list, line, col){
    let best=null;
    for(const s of list){
      if(s.line<=line){
        if(s.kind==="fn"||s.kind==="cls"||s.kind==="int"||s.kind==="let"){
          const end = list.find(x=>x!==s && x.line>s.line && x.depth<=s.depth);
          const eLine = end ? end.line : Infinity;
          if(line < eLine || (line===eLine && (end? col<=end.col : true))){
            if(!best || s.line>=best.line) best=s;
          }
        }
      }
    }
    return best;
  }

  // workspace-wide reference search for an identifier
  function references(src, name, spec){
    const out=[]; const starts=lineStarts(src);
    const re = new RegExp("\\b"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
    let m, guard=0;
    while((m=re.exec(src)) && guard++<400){
      out.push({ line: lineOf(starts,m.index), col: m.index-starts[lineOf(starts,m.index)], pos:m.index, len:name.length });
    }
    return out;
  }

  return { extract, at, references, lineStarts, lineOf };
})();

// ---------------------------------------------------------------------------
//  Diagnostics — compiler-free structural analysis, honest about its limits.
// ---------------------------------------------------------------------------
const DIAG = (()=>{
  const SEV = { err:3, warn:2, info:1 };
  // column of the `var` keyword itself, not the char in front of it
  const varIdx = L => { const m=/(^|[^\w.])var\s+[A-Za-z_$]/.exec(L); return m ? m.index+m[1].length : 0; };
  function analyze(src, spec, opts={}){
    const out = [];
    const starts = SYMBOLS.lineStarts(src);
    const lineOf = p => SYMBOLS.lineOf(starts,p);
    // `pos` is the character offset. Fixers need it to build a range edit without
    // re-parsing the source, so every diagnostic carries one from the start.
    const at = p => { const l=lineOf(p); return { pos:p, line:l, col:p-starts[l] }; };
    const atLC = (l,c) => { const p=(starts[l]||0)+c; return { pos:p, line:l, col:c }; };

    // ---- 1. bracket balance, computed from the token stream (so strings and
    //         comments never produce phantom errors)
    const toks = LANG.tokenize(src, spec);
    const stack = [];
    // Angle brackets are deliberately excluded: in every C-family language `<`
    // and `>` are overwhelmingly comparison operators, so pairing them turns
    // `if(x > 1)` into three bogus diagnostics. The highlighter can afford the
    // guess because it only colours text; the balance check cannot.
    const PAIRS = spec.pairs || {};
    const openers = Object.keys(PAIRS).filter(o=>o!=="<" && o!==">");
    const closers = openers.map(o=>PAIRS[o]);
    // Once a mismatch happens the stack no longer describes the file, so
    // anything derived from it afterwards would be a confident lie. `const b =
    // [1,2;` makes the `}` swallow the `[` and the remaining `{` then looks
    // unclosed — appending a `}` would "fix" a file that was missing a `]`.
    let desynced = false;
    for(const t of toks){
      if(t.t!=="op" && t.t!=="pun") continue;
      const ch = src[t.s];
      if(openers.includes(ch)) stack.push({ch, pos:t.s});
      else if(closers.includes(ch)){
        const want = openers.find(o=>PAIRS[o]===ch);
        const top = stack.pop();
        if(!top){ desynced = true;
          out.push({...at(t.s), len:1, sev:"err", msg:`Unexpected closing “${ch}”`, src:"bracket" }); }
        else if(top.ch!==want){
          desynced = true;
          const p=at(top.pos);
          out.push({...p, len:1, sev:"err", msg:`“${top.ch}” closed by “${ch}”`, src:"bracket" });
          const q=at(t.s);
          out.push({...q, len:1, sev:"warn", msg:`Expected “${PAIRS[top.ch]}” to close this`, src:"bracket" });
        }
      }
    }
    // `order` is the opener's depth in the stack, so closing several at once can
    // emit them innermost-first and reconstruct the nesting correctly
    if(!desynced) stack.slice(0,8).forEach((s,i)=>{
      out.push({...at(s.pos), order:i, len:1, sev:"err", msg:`“${s.ch}” is never closed`, src:"bracket" });
    });

    // ---- 2. unterminated strings (tokenizer stops at newline)
    for(const t of toks){
      if(t.t!=="str") continue;
      const text = src.slice(t.s,t.e);
      const open = spec.str.find(s=>text.startsWith(s[0]));
      if(!open) continue;
      const closed = text.length>=open[0].length+open[1].length && text.endsWith(open[1]) && text.slice(-open[1].length-1, -open[1].length)!==undefined
                     && text.trimEnd().endsWith(open[1]);

        out.push({...at(t.s), len:Math.min(text.length,60), sev:"err", msg:"String is never closed", src:"string" });
      }
    }

    // ---- 3. line-level rules
    const lines = src.split("\n");
    const MAXL = opts.maxLine || 140;
    for(let i=0;i<lines.length;i++){
      const L = lines[i];
      if(L.length>MAXL) out.push({...atLC(i,MAXL),len:1,sev:"info",msg:`Line is ${L.length} characters`,src:"style"});
      if(/\t/.test(L) && /^ +\S/.test(L.replace(/^\t+/,"")) && spec.indent===4 && /^\t|^\s{2,4}\t/.test(L)){
        out.push({...atLC(i,0),len:1,sev:"warn",msg:"Mixed tabs and spaces in indentation",src:"style"});
      }
      if(spec.regexp){
        const m=/[^=!<>]==[^=]/.exec(L); if(m && !/["'`]/.test(L.slice(Math.max(0,m.index-1),m.index)))
          out.push({...atLC(i,m.index+1),len:2,sev:"warn",msg:"Loose equality — consider ===",src:"quality"});
        if(/(^|[^\w.])var\s+[A-Za-z_$]/.test(L) && !/\/\//.test(L.split(m&&m.index)[0]||""))
          out.push({...atLC(i,varIdx(L)),len:3,sev:"info",msg:"`var` is function-scoped — prefer let/const",src:"quality"});
        if(/\bdebugger\b/.test(L)) out.push({...atLC(i,L.indexOf("debugger")),len:8,sev:"warn",msg:"`debugger` statement left in",src:"quality"});
      }
      if(/\b(TODO|FIXME|HACK|XXX)\b/.test(L))
        out.push({...atLC(i,Math.max(0,L.search(/\b(TODO|FIXME|HACK|XXX)\b/)||L.length-4)),len:4,sev:"info",msg:"Note: "+L.match(/\b(TODO|FIXME|HACK|XXX)\b/)[0],src:"note"});
      if(spec.id==="python" && /^\s*except\s*:/.test(L))
        out.push({...atLC(i,L.indexOf("except")),len:6,sev:"warn",msg:"Bare except swallows every error",src:"quality"});
      if(spec.id==="cpp" && /^\s*#\s*include\s*<[^>]*\.h>/.test(L))
        out.push({...atLC(i,0),len:1,sev:"info",msg:"C header in C++ — prefer the matching .hpp",src:"style"});
      if(/\b(password|passwd|secret|api[_-]?key|token)\b\s*[:=]\s*["'][^"']{6,}["']/i.test(L))
        out.push({...atLC(i,Math.max(0,L.search(/\b(password|passwd|secret|api[_-]?key|token)\b/i))),len:4,sev:"warn",msg:"Possible hard-coded secret",src:"security"});
    }

    // ---- 4. unused imports (high signal, low false-positive)
    const imported = [];
    // Branch on language identity, never on a loose flag. `spec.fam` is "c" for
    // almost everything curly-braced (including JavaScript) and `spec.regexp`
    // is true for most of them too, so either test misroutes #include and
    // import rules. Only these languages actually spell it #include.
    const C_INCLUDE = new Set(["c","cpp","objectivec"]);
    if(spec.id==="python"){
      const re=/^[ \t]*(?:from[ \t]+([.\w]+)[ \t]+import[ \t]+(.+)|import[ \t]+([.\w, ]+))$/gm;
      let m;
      while((m=re.exec(src))){
        const names=(m[2]||m[3]||"").split(",").map(s=>s.trim().split(/\s+as\s+/).pop()).filter(Boolean);
        names.forEach(n=> imported.push({name:n.replace(/^\./,""), pos:m.index}));
      }
    } else if(C_INCLUDE.has(spec.id)){
      const re=/^[ \t]*#\s*include\s*[<"]([^>"]+)[>"]/gm;
      let m;
      while((m=re.exec(src))) imported.push({name:null, pos:m.index, header:m[1]});
    } else if(spec.regexp || spec.id==="typescript" || spec.id==="javascript"){
      const re=/^[ \t]*import[ \t]+(?:([A-Za-z_$][\w$]*)[ \t]*,?\s*)?(?:.*?from\s*)?["'][^"']+["']/gm;
      let m;
      while((m=re.exec(src))) if(m[1]) imported.push({name:m[1], pos:m.index});
      const re2=/^[ \t]*const[ \t]*\{([^}]*)\}[ \t]*=[ \t]*require\(/gm;
      while((m=re2.exec(src))) m[1].split(",").forEach(n=>{ const nm=n.trim().split(":").pop().trim(); if(nm) imported.push({name:nm,pos:m.index}); });
    } else if(spec.fam==="c"){
      const re=/^[ \t]*#\s*include[ \t]*[<"]([^>"]+)[>"]/gm;
      let m;
      while((m=re.exec(src))) imported.push({name:null, pos:m.index, header:m[1]});
    }
    const bodyNoImports = src.replace(/^[ \t]*(?:import|from|#\s*include|use)[^\n]*$/gm,"");
    for(const im of imported){
      if(im.name){
        const uses = (bodyNoImports.match(new RegExp("\\b"+im.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g"))||[]).length;

      } else if(im.header){

    // ---- 5. defined-but-never-referenced functions (info only)
    const syms = SYMBOLS.extract(src, spec);
    for(const s of syms){
      if(s.kind!=="fn") continue;
      if(/^(test_|Test|setUp|tearDown|main|__)/.test(s.name)) continue;
      const line = src.slice(starts[s.line], starts[s.line+1]||src.length);
      const uses = (src.match(new RegExp("\\b"+s.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g"))||[]).length;
      if(uses<=1 && line.length<400) out.push({...atLC(s.line,s.col), len:s.name.length, sev:"info", name:s.name, msg:`“${s.name}” is defined but never referenced`, src:"unused"});
    }

    out.sort((a,b)=> a.line-b.line || a.col-b.col || SEV[b.sev]-SEV[a.sev]);
    return out.slice(0,200);
  }

  const runnerPatterns = [
    { re:/^([\w./\\-]*?)(\w+)\.(\w+):(\d+):?\s*(.*)$/, sev:"err", msg:m=>`${m[2]}.${m[3]} — ${m[5]||m[4]}`, file:m=>m[1]?m[1]+"."+m[2]:"", line:m=>+m[4] },
    { re:/^Traceback \(most recent call last\)/, sev:"err", msg:()=>"Python traceback", file:()=>null, line:()=>0, bare:true },
    { re:/^\s*File "([^"]+)", line (\d+)/, sev:"err", msg:m=>"Python traceback", file:m=>m[1], line:m=>+m[2] },
    { re:/^([\w./\\-]+):(\d+):(\d+):?\s*(?:fatal\s+)?(?:error|Error)(.*)$/, sev:"err", msg:m=>"Compiler error", file:m=>m[1], line:m=>+m[2] },
    { re:/^(?:.*?\b)?(Warning|warning|warn)\b:?\s*(.*)$/, sev:"warn", msg:m=>m[1]+": "+m[2], file:()=>null, line:()=>0 },
    { re:/^(.*?):(\d+):(\d+):?\s*note:/, sev:"info", msg:m=>"Note: "+m[1], file:m=>m[1], line:m=>+m[2] },
    { re:/^\s*(?:ERROR|Error|error):\s*(.*)$/, sev:"err", msg:m=>m[1], file:()=>null, line:()=>0 },
    { re:/^\s*(WARN|Warning|warning):\s*(.*)$/, sev:"warn", msg:m=>m[1], file:()=>null, line:()=>0 },
  ];

  // turn raw runner output into clickable problems
  function fromOutput(text, fileHint){
    const out=[];
    const src = String(text);
    // a bare "Traceback ..." header is only interesting when no frame line follows it
    const hasFrames = /^\s*File\s+"[^"]+",\s*line\s+\d+/m.test(src);
    for(const line of src.split("\n").slice(0,400)){
      for(const p of runnerPatterns){
        if(p.bare && hasFrames) continue;
        const m = p.re.exec(line);
        if(m){
          const f = p.file(m);
          out.push({ file: f && !/^<|^\//.test(f) ? f : (fileHint||null), line: p.line(m)||0, col:0, len:1,
                     sev:p.sev, msg:p.msg(m), src:"run", raw:line });
          break;
        }
      }
    }
    return out;
  }

  const counts = list => list.reduce((a,d)=>{ a[d.sev]=(a[d.sev]||0)+1; return a; }, {});
  // ---------------------------------------------------------------------------
  //  QUICK FIX
  //  Two tiers, and the difference matters more than anything else in here:
  //
  //    mechanical — CYRUS already proved the bug from the token stream, so it
  //                 computes the patch itself. No model is consulted and the
  //                 fix is correct for the class of error it claims.
  //    ai         — a guess. Offered because a human still reviews the diff,
  //                 never because CYRUS knows the answer.
  //
  //  A fix is a list of range edits {start, end, insert} rather than a
  //  replacement string, so it can be previewed, applied out of order and
  //  combined with other fixes without any of them invalidating the others.
  // ---------------------------------------------------------------------------
  // `safe` means "batching this changes nothing the author meant to write".
  // Safe fixes are what "Fix all" is allowed to apply together. Adding a
  // keyword like `export` is mechanical and correct but it changes the module's
  // public surface, so it stays a one-at-a-time decision.
  const M = (id, label, edits, note, order, safe) =>
    ({ id, label, kind:"mechanical", edits, note:note||"", order:order||0, safe:safe!==false });
  const A = (id, label) => ({ id, label, kind:"ai", edits:null, note:"" });

  function quickFix(src, spec, d){
    if(!d) return [];
    const fixes = [];
    const at1 = d.pos==null ? 0 : d.pos;

    // ---- brackets ------------------------------------------------------
    let m;
    if(d.src==="bracket" && (m=/^“(.+?)” is never closed$/.exec(d.msg))){
      const closer = (spec.pairs||{})[m[1]];
      if(closer) fixes.push(M("bracket.close", `Insert the missing “${closer}”`, [{start:eof(src), end:eof(src), insert:closer}], "", d.order));
    }
    if(d.src==="bracket" && (m=/^Expected “(.+?)” to close this$/.exec(d.msg))){
      // Deliberately no mechanical fix here. A mismatched pair means the parser
      // lost sync, and the right place for the missing closer is genuinely
      // ambiguous: `if(x > 1 {` would come back as `if(x >) 1 {`. That is a
      // guess wearing the costume of a certainty, so it goes to the model.
    }

      const opener = Object.keys(spec.pairs||{}).find(o=>spec.pairs[o]===m[1]);
      if(opener) fixes.push(M("bracket.open", `Insert the missing opening “${opener}”`, [{start:at1, end:at1, insert:opener}]));
    }

    // ---- strings --------------------------------------------------------
    if(d.src==="string"){
      const quote = /^[“'"]/.test(d.msg) ? null : src[at1];
      if(quote) fixes.push(M("string.close", `Close the string with “${quote}”`,
        [{start:lineEndOf(src,at1), end:lineEndOf(src,at1), insert:quote}]));
    }

    // ---- unused imports --------------------------------------------------
    if(d.src==="unused" && (m=/^“(.+?)” is imported but never used$/.exec(d.msg))){
      const ls = src.lastIndexOf("\n", at1-1)+1;          // statement start
      let le = src.indexOf("\n", ls); if(le<0) le = src.length;
      const stmt = src.slice(ls, le);
      // only delete when the statement really does nothing but import this one
      const single = spec.id==="python"
        ? new RegExp("^\\s*(?:import|from)\\s+.*\\b"+m[1]+"\\b.*$").test(stmt)
        : /^\s*(?:import\s+[\w$]+\b|const\s*\{)/.test(stmt);
      if(single) fixes.push(M("unused.import", `Remove the unused import of “${m[1]}”`,
        [{start:ls, end:le, insert:""}], "deletes one line"));
    }
    if(d.src==="unused" && (m=/^“(.+?)” is defined but never referenced$/.exec(d.msg))){
      const ls = src.lastIndexOf("\n", at1-1)+1;
      if((spec.regexp || spec.id==="typescript") && /^\s*(function|const|let|class)\b/.test(src.slice(ls,ls+40)) && !/\bexport\b/.test(src.slice(ls,ls+20))){
        fixes.push(M("unused.export", `Export “${m[1]}” so it is referenced`, [{start:ls, end:ls, insert:"export "}], "", 0, false));
      }
    }

    // ---- quality --------------------------------------------------------
    if(d.src==="quality" && d.msg.indexOf("Loose equality")===0){
      const op = src.substr(at1,2);
      const strict = op==="!=" ? "!==" : "===";
      fixes.push(M("eq.strict", `Use “${strict}”`, [{start:at1, end:at1+2, insert:strict}]));
    }
    if(d.src==="quality" && d.msg.indexOf("`var`")===0)
      fixes.push(M("var.let", "Use “let” instead of “var”", [{start:at1, end:at1+3, insert:"let"}]));
    if(d.src==="quality" && d.msg.indexOf("Bare except")===0)
      fixes.push(M("except.ex", "Catch “Exception” explicitly",
        [{start:at1+6, end:at1+6, insert:" Exception"}]));
    if(d.src==="quality" && (m=/^“(.+?)” has no include guard$/.exec(d.msg))){
      const guard = m[1].replace(/[^\w]/g,"").toUpperCase();
      fixes.push(M("guard.add", `Wrap in include guard “${guard}”`, [
        {start:0, end:0, insert:`#ifndef ${guard}\n#define ${guard}\n`},
        {start:eof(src), end:eof(src), insert:`\n#endif // ${guard}`}
      ]));
    }

    // ---- style ----------------------------------------------------------
    if(d.src==="style" && d.msg.indexOf("Mixed tabs and spaces")===0){
      const ls = src.lastIndexOf("\n", at1-1)+1;
      let le = src.indexOf("\n", ls); if(le<0) le = src.length;
      const body = src.slice(ls, le);
      const width = /^\t/.test(body) ? (spec.indent||2) : 2;
      const ind = /^[ \t]*/.exec(body)[0];
      const vis = ind.replace(/\t/g, " ".repeat(width));
      if(vis!==ind) fixes.push(M("style.indent", "Normalise the indentation",
        [{start:ls, end:ls+ind.length, insert:vis}], "tabs become spaces"));
    }

    // Everything else is a judgement call, so it goes to the model — and says so.
    if(!fixes.length) fixes.push(A("ai.propose", "Ask CYRUS to fix this"));
    return fixes;
  }

  // Apply many fixes at once. Edits run right-to-left so every offset stays
  // valid, and edits sharing one offset are merged into a single splice — that
  // is what lets two unclosed brackets both get their closer appended instead of
  // the second one being discarded as an overlap.
  function applyFixes(src, fixes){
    const groups = new Map();
    fixes.forEach((f,fi)=>{
      (f.edits||[]).forEach((e,ei)=>{
        const k = e.start;
        if(!groups.has(k)) groups.set(k, []);
        groups.get(k).push({ e, f, fi, ei });
      });
    });
    let out = src;
    for(const k of [...groups.keys()].sort((a,b)=> b-a)){
      const g = groups.get(k);
      // replacements that actually consume text come first; then insertions,
      // innermost opener first, so `(` then `{` closes as `)}` and not `}{`
      g.sort((a,b)=>
        (b.e.end - a.e.end) ||
        ((b.f.order||0) - (a.f.order||0)) ||
        (b.fi - a.fi));
      const ins = g.map(x=>x.e.insert).join("");
      const end = Math.max(...g.map(x=>x.e.end));
      out = out.slice(0,k) + ins + out.slice(end);
    }
    return out;
  }

  return { analyze, fromOutput, counts, SEV, quickFix, applyFixes };
})();// ---------------------------------------------------------------------------
//  HL — tokens + overlay decorations → HTML for the editor layer
//  Decorations: find matches, occurrence highlight, multi-cursor selections,
//  folded regions, diagnostics underlines, inline-AI ghost text, diff bands.
// ---------------------------------------------------------------------------
const HL = (()=>{
  const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;" };
  const e = s => s.replace(/[&<>]/g, c=>ESC[c]);

  function render(src, spec, deco){
    const toks = LANG.tokenize(src, spec);
    deco = deco || {};
    const marks = [];

    // ---- 1. diagnostic underlines + diff bands + folded regions
    const lineStarts = SYMBOLS.lineStarts(src);
    const at = p => { let l=SYMBOLS.lineOf(lineStarts,p); return {s:lineStarts[l], e:(lineStarts[l+1]!==undefined?lineStarts[l+1]:src.length)}; };
    for(const d of (deco.problems||[])){
      const r = at(d.line!=null?lineStarts[d.line]||0 : 0);
      const off = d.line!=null && d.col!=null ? d.col : 0;
      marks.push({ s:r.s+Math.max(0,off), e:r.s+Math.max(0,off)+Math.max(1,d.len||1), c:"d-"+(d.sev==="err"?"er":d.sev==="warn"?"wr":"in"), t:"wave" });
    }
    for(const m of (deco.matches||[])) marks.push({ s:m.s, e:m.e, c:"mtch", t:"box" });
    for(const m of (deco.occurrences||[])) marks.push({ s:m.s, e:m.e, c:"occ", t:"box" });
    for(const m of (deco.sel2||[])) marks.push({ s:m.s, e:m.e, c:"sel2", t:"box" });
    for(const m of (deco.folded||[])) marks.push({ s:m.s, e:m.e, c:"fold", t:"fold" });
    for(const m of (deco.occWord||[])) marks.push({ s:m.s, e:m.e, c:"curw", t:"box" });

    // ---- 2. splice tokens + marks into one ordered stream
    const all = toks.map(t=>({s:t.s,e:t.e,c:t.t})).filter(t=>t.c);
    for(const m of marks) all.push(m);
    all.sort((a,b)=> a.s-b.s || (a.e-b.e));

    let html = "", cur = 0;
    for(const t of all){
      if(t.s < cur) continue;                     // overlapping: first wins
      if(t.s > cur) html += e(src.slice(cur,t.s));
      const body = e(src.slice(t.s,t.e));
      html += t.c
        ? '<span class="'+t.c+(t.t&&t.t!=="box"?' '+(t.t==="wave"?"wavy":t.t):"")+'">'+body+'</span>'
        : body;
      cur = t.e;
    }
    if(cur < src.length) html += e(src.slice(cur));

    // ---- 3. ghost text (inline autocomplete) appended after the caret line
    if(deco.ghost && deco.ghost.pos!=null && deco.ghost.text){
      // rebuild with the ghost split out at exactly that offset
      return render2(src, spec, deco, deco.ghost);
    }
    // trailing newline keeps the last (empty) line tall enough to click into
    if(src.endsWith("\n")) html += "\n";
    return html;
  }

  function render2(src, spec, deco, ghost){
    const html = render(src, spec, Object.assign({}, deco, {ghost:null}));
    const pos = ghost.pos;
    const gtext = ghost.text;
    const esc = s => String(s).replace(/[&<>]/g, c=>ESC[c]);
    // split the rendered html at `pos` by walking the raw source length
    let seen = 0, out = "", i = 0;
    while(i < html.length && seen < pos){
      const c = html[i];
      if(c==="&"){ const m=/^&(amp|lt|gt);/.exec(html.slice(i)); if(m){ seen += m[0]==="&amp;"?1:m[0]==="&lt;"?1:1; out+=m[0]; i+=m[0].length; continue; } }
      if(c==="<"){ const j=html.indexOf(">",i); const tag=html.slice(i,j+1); out+=tag; i=j+1; continue; }
      if(c==="\n"){ seen++; out+=c; i++; continue; }
      seen++; out+=c; i++;
    }
    const rest = html.slice(i);
    out += '<span class="ghost">'+esc(gtext)+"</span>"+rest;
    return out;
  }

  // minimap strips: one short run per token, scaled down
  function minimapRuns(src, spec, widthPx){
    const toks = LANG.tokenize(src, spec);
    const colW = 1.6;
    const runs = [];
    let prevColor = null;
    for(const t of toks){
      if(t.t!=="kw" && t.t!="str" && t.t!=="cmt" && t.t!=="num" && t.t!=="fn" && t.t!=="bi" && t.t!=="kw") continue;
      const line = src.slice(0,t.s).split("\n").length;
      const lineStart = t.s - src.lastIndexOf("\n", t.s-1) - 1;
      const col = t.s - lineStart;
      const color = { kw:"#8f5fc4", str:"#5f9e52", cmt:"#463c63", num:"#b07a45", fn:"#c9a850", bi:"#4d84c4" }[t.t];
      runs.push({ y: line*2, x: Math.floor(col*colW), w: Math.max(1, Math.round((t.e-t.s)*colW)), c:color });
      prevColor = color;
    }
    return runs;
  }

  return { render, minimapRuns };
})();
// ---------------------------------------------------------------------------
// PHASE 1 — THE EDITOR
// A transparent <textarea> owns text, selection and clipboard. A highlighted
// <div> underneath owns every visual: tokens, cursors, ghosts, folds, findings.
// That split is what makes real multi-cursor, bracket highlighting and
// selection-aware AI possible in a single HTML file.

const CW = 7.5, LH = 20, PADL = 12, PADT = 10;

class StEditor {
  constructor(host, opts){
    this.host = host;
    this.on = opts.on || {};
