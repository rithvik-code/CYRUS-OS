<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0716">
<title>CYRUS OS — AI-native operating environment</title>
<style>
:root{
  --bg:#0d0716; --panel:#160e26; --panel2:#1f1434; --panel3:#2a1c45;
  --text:#f2ecff; --muted:#a89cc8; --border:#3a2a58; --border2:#4c3a74;
  --accent:#d4a53f; --accent2:#ffd873; --green:#4ade80; --yellow:#fbbf24; --red:#fb7185; --blue:#7dd3fc;
  --gold:#d4a53f; --wine:#9d3b6e; --violet:#7c4dff;
  --shadow:0 18px 50px rgba(5,2,12,.65);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden; user-select:none;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:14px;
}
body.no-anim *{transition:none!important;animation:none!important}
code,pre,.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3344;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- WALLPAPER / DESKTOP ---------- */
#desktop{position:fixed;inset:0;display:flex;flex-direction:column}
#wallpaper{position:absolute;inset:0;background:
  radial-gradient(1100px 700px at 78% -10%, rgba(212,165,63,.20), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(124,77,255,.30), transparent 60%),
  radial-gradient(700px 500px at 50% 120%, rgba(157,59,110,.22), transparent 60%),
  linear-gradient(160deg,#0d0716 0%,#150b28 55%,#1c1038 100%);
  transition:transform .35s cubic-bezier(.2,.7,.3,1),background .4s;will-change:transform}
#wallpaper.w-green{background:
  radial-gradient(1100px 700px at 80% -10%, rgba(74,222,128,.18), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(212,165,63,.14), transparent 60%),
  linear-gradient(160deg,#071009,#0b1810 60%,#0e2016)}
#wallpaper.w-blue{background:
  radial-gradient(1100px 700px at 80% -10%, rgba(125,211,252,.20), transparent 60%),
  radial-gradient(800px 500px at 0% 100%, rgba(124,77,255,.26), transparent 60%),
  linear-gradient(160deg,#080a18,#0e1128 60%,#141a3c)}
#wallpaper.w-ember{background:
  radial-gradient(1100px 700px at 80% -10%, rgba(251,113,133,.20), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(212,165,63,.16), transparent 60%),
  linear-gradient(160deg,#160a0c,#220f14 60%,#2a1216)}
/* interactive background: pointer-reactive orbs + glow that follows the mouse */
#wall-fx{position:absolute;inset:-60px;z-index:1;pointer-events:none;overflow:hidden}
#wall-fx .orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;will-change:transform;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
#wall-fx .o1{width:340px;height:340px;left:8%;top:16%;background:radial-gradient(circle,rgba(212,165,63,.34),transparent 70%)}
#wall-fx .o2{width:460px;height:460px;left:62%;top:38%;background:radial-gradient(circle,rgba(124,77,255,.38),transparent 70%)}
#wall-fx .o3{width:300px;height:300px;left:30%;top:62%;background:radial-gradient(circle,rgba(157,59,110,.32),transparent 70%)}
#wall-fx .o4{width:220px;height:220px;left:80%;top:8%;background:radial-gradient(circle,rgba(125,211,252,.22),transparent 70%)}
#wall-fx .cursor-glow{position:absolute;width:520px;height:520px;left:0;top:0;margin:-260px 0 0 -260px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,165,63,.14),rgba(124,77,255,.07) 45%,transparent 68%);
  will-change:transform;transition:transform .18s ease-out}
#wallpaper.w-green ~ #wall-fx .cursor-glow{background:radial-gradient(circle,rgba(74,222,128,.13),rgba(212,165,63,.06) 45%,transparent 68%)}
#wallpaper.w-ember ~ #wall-fx .cursor-glow{background:radial-gradient(circle,rgba(251,113,133,.14),rgba(212,165,63,.07) 45%,transparent 68%)}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(36px,-26px) scale(1.07)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-44px,30px) scale(.94)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,36px) scale(1.05)}}
#wall-fx .o1{animation:drift1 13s ease-in-out infinite}
#wall-fx .o2{animation:drift2 17s ease-in-out infinite}
#wall-fx .o3{animation:drift3 15s ease-in-out infinite}

/* top bar */
#topbar{position:relative;z-index:60;height:40px;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:rgba(22,14,38,.78);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,165,63,.22)}
.tb-brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1.5px;font-size:13px;padding:4px 10px;border-radius:8px;color:var(--accent2);cursor:pointer}
.tb-brand:hover{background:rgba(212,165,63,.12)}
.tb-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tb-ic{cursor:pointer}
.dicon{cursor:pointer}
#tb-priv{cursor:pointer}
#tb-bell{cursor:pointer}
#tb-search{flex:0 1 420px;display:flex;align-items:center;gap:8px;background:var(--panel2);
  border:1px solid var(--border);border-radius:9px;padding:5px 12px;color:var(--muted);cursor:pointer;font-size:13px}
#tb-search:hover{border-color:rgba(212,165,63,.45);background:var(--panel3)}
#tb-search kbd{margin-left:auto}
#tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.tb-ic{position:relative;width:32px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px}
.tb-ic:hover{background:var(--panel2)}
#tb-priv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:8px}
#tb-priv:hover{background:var(--panel2)}
#tb-priv .pd{width:8px;height:8px;border-radius:50%}
#tb-clock{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25;padding:0 8px}
#tb-clock b{display:block;color:var(--text);font-size:13px}
#bell-count{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
kbd{background:var(--panel3);border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;
  padding:0 6px;font-size:11px;font-family:Consolas,monospace;color:var(--muted)}

/* ---------- WATERMELON-STYLE INTERACTION LAYER ---------- */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
.btn,.tb-btn,.dock-item,.sm-app,.achip,.sug{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.12));
  transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.btn:active,.tb-btn:active,.achip:active{transform:scale(.96)}
.btn,.tb-btn,.achip{transition:transform .12s var(--spring),background .12s,border-color .12s}
.dock-item:active{transform:translateY(-2px) scale(.94)}
.toolbar input[type=text]:focus,#as-in:focus,#pal-input:focus{box-shadow:0 0 0 3px rgba(212,165,63,.16);border-color:rgba(212,165,63,.55)!important}
.win{animation:wpop .22s var(--spring)}
@keyframes wpop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal{animation:wpop .2s var(--spring)}
.fitem,.n-card{transition:transform .15s var(--spring),background .12s,border-color .12s}
.fitem:hover{transform:translateY(-2px)}
.n-card:hover{transform:translateX(3px)}
.sm-grid .sm-app{opacity:0;animation:smpop .3s var(--spring) forwards}
.sm-grid .sm-app:nth-child(1){animation-delay:.02s}.sm-grid .sm-app:nth-child(2){animation-delay:.05s}
.sm-grid .sm-app:nth-child(3){animation-delay:.08s}.sm-grid .sm-app:nth-child(4){animation-delay:.11s}
.sm-grid .sm-app:nth-child(5){animation-delay:.14s}.sm-grid .sm-app:nth-child(6){animation-delay:.17s}
.sm-grid .sm-app:nth-child(7){animation-delay:.2s}.sm-grid .sm-app:nth-child(8){animation-delay:.23s}
.sm-grid .sm-app:nth-child(9){animation-delay:.26s}.sm-grid .sm-app:nth-child(10){animation-delay:.29s}
.sm-grid .sm-app:nth-child(11){animation-delay:.32s}
@keyframes smpop{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}

/* desktop icons */
#dicons{position:absolute;top:56px;left:14px;z-index:5;display:flex;flex-direction:column;gap:6px;width:92px}
.dicon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;cursor:pointer;text-align:center}
.dicon:hover{background:rgba(212,165,63,.1)}
.dicon .ic{font-size:30px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.dicon .lb{font-size:11.5px;color:#dfe3ec;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ---------- WINDOWS ---------- */
#winlayer{position:absolute;inset:40px 0 88px 0;z-index:10;pointer-events:none}
#winlayer .win{pointer-events:auto}
.win{position:absolute;display:flex;flex-direction:column;background:rgba(22,14,38,.94);backdrop-filter:blur(16px);
  border:1px solid rgba(76,58,116,.7);border-radius:var(--radius);box-shadow:var(--shadow);min-width:320px;min-height:200px;overflow:hidden}
.win.focused{border-color:rgba(212,165,63,.5);box-shadow:0 24px 70px rgba(5,2,12,.7),0 0 0 1px rgba(212,165,63,.28)}
.win-title{height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(31,20,52,.85);
  border-bottom:1px solid var(--border);cursor:grab;flex:none}
.win-title:active{cursor:grabbing}
.win-title .w-ic{font-size:15px}
.win-title .w-t{font-size:12.5px;font-weight:600;color:#e4dcf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-btns{margin-left:auto;display:flex;gap:0;align-self:stretch;height:100%}
.wbtn{width:44px;height:100%;border-radius:0;display:flex;align-items:center;justify-content:center;
  color:#cfc6e4;font-size:10px;line-height:1;background:transparent;transition:background .1s,color .1s}
.wbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.wbtn.close:hover{background:#e81123;color:#fff}
.wbtn.min{font-size:11px}
.wbtn.max{font-size:9px}
.wbtn:active{background:rgba(255,255,255,.2)}
.wbtn.close:active{background:#f1707a}
.win-body{flex:1;overflow:auto;position:relative}
.win.min{display:none}
.win.max{border-radius:0}

/* ---------- DOCK ---------- */
#dock{position:relative;z-index:60;height:74px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;
  background:rgba(13,8,26,.66);backdrop-filter:blur(16px);border:1px solid rgba(212,165,63,.25);
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);border-radius:22px;box-shadow:0 12px 40px rgba(5,2,12,.6)}
.dock-item{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s,box-shadow .15s;background:rgba(42,28,69,.65);border:1px solid rgba(124,77,255,.28)}
.dock-item:hover{background:rgba(58,42,88,.85);transform:translateY(-7px) scale(1.12);box-shadow:0 8px 22px rgba(212,165,63,.25)}
.dock-item.running{border-color:rgba(212,165,63,.6);box-shadow:0 0 14px rgba(212,165,63,.22)}
.dock-item.running::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dock-sep{width:1px;height:30px;background:rgba(212,165,63,.35);margin:0 6px}
#dock-palette{background:linear-gradient(135deg,rgba(212,165,63,.3),rgba(124,77,255,.3));border:1px solid rgba(212,165,63,.5)}

/* ---------- PALETTE ---------- */
#palette{position:absolute;inset:0;z-index:800;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
#palette .backdrop{position:absolute;inset:0;background:rgba(8,4,18,.62);backdrop-filter:blur(3px)}
#pal-card{position:relative;width:min(640px,92vw);background:rgba(24,15,42,.97);border:1px solid rgba(212,165,63,.4);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#pal-input{width:100%;background:transparent;border:none;outline:none;padding:18px 20px;font-size:18px;color:var(--text)}
#pal-input::placeholder{color:#5a6175}
#pal-meta{display:flex;align-items:center;gap:8px;padding:0 20px 10px;font-size:11.5px;color:var(--muted)}
.chip{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid}
.chip.intent{color:var(--accent2);border-color:rgba(212,165,63,.45);background:rgba(212,165,63,.12)}
.chip.low{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.chip.med{color:var(--yellow);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.chip.high{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
#pal-result{padding:12px 20px 16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;user-select:text}
#pal-result.ok{color:var(--green)}#pal-result.err{color:var(--red)}
#pal-suggest{border-top:1px solid var(--border);padding:10px 8px;background:rgba(13,8,26,.7)}
#pal-suggest .s-h{font-size:10.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:2px 12px 8px}
.sug{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13.5px;color:#cdd3e0}
.sug:hover{background:var(--panel2)}
.sug .s-i{width:18px;text-align:center}

/* ---------- MODAL ---------- */
#modal-root{position:absolute;inset:0;z-index:850;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.6);backdrop-filter:blur(3px)}
.modal{width:min(460px,92vw);background:var(--panel);border:1px solid rgba(212,165,63,.35);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.modal h3{font-size:15.5px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal .m-body{font-size:13.5px;color:#c9cfdd;line-height:1.6;white-space:pre-wrap;user-select:text;max-height:260px;overflow:auto}
.modal .m-btns{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.btn{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--border2);background:var(--panel2)}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}

/* ---------- TOASTS ---------- */
#toast-root{position:absolute;right:16px;bottom:100px;z-index:750;display:flex;flex-direction:column;gap:9px;width:340px}
.toast{background:rgba(24,15,42,.97);border:1px solid var(--border2);border-left:3px solid var(--accent);
  border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;line-height:1.5;cursor:pointer;
  animation:slidein .18s ease;user-select:text}
.toast.warn{border-left-color:var(--yellow)}.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
.toast .t-title{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;gap:7px;align-items:center}
.toast .t-msg{color:#c4cad8;white-space:pre-wrap;max-height:180px;overflow:auto}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- NOTIFICATION DRAWER ---------- */
#ndraw{position:absolute;top:40px;right:0;bottom:0;width:360px;z-index:700;background:rgba(19,12,34,.97);
  backdrop-filter:blur(16px);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column}
#ndraw.open{transform:none}
#ndraw .n-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center}
#ndraw .n-head b{font-size:13.5px}
#ndraw .n-head span{margin-left:auto;font-size:11.5px;color:var(--muted);cursor:pointer}
#ndraw .n-head span:hover{color:var(--text)}
#nlist{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.n-bucket .b-h{font-size:10.5px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.n-bucket.imp .b-h{color:var(--red)}.n-bucket.act .b-h{color:var(--yellow)}.n-bucket.low .b-h{color:var(--muted)}
.n-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;font-size:13px;line-height:1.5}
.n-card b{display:block;font-size:13px;margin-bottom:2px}
.n-card .n-sub{color:var(--muted);font-size:12px}

/* ---------- BOOT / LOCK ---------- */
#boot{position:fixed;inset:0;z-index:1000;background:#080412;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#boot .logo{font-size:38px;font-weight:800;letter-spacing:12px;color:var(--accent2);text-shadow:0 0 30px rgba(212,165,63,.5)}
#boot .sub{color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase}
#bootLog{width:min(560px,88vw);height:170px;overflow:hidden;font-family:Consolas,monospace;font-size:12px;color:#7f8aa3;line-height:1.7}
#bootLog .ok{color:var(--green)}
#bootBar{width:min(560px,88vw);height:4px;background:var(--panel2);border-radius:4px;overflow:hidden}
#bootBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--violet));transition:width .3s}
#boot-skip{color:#5a6175;font-size:11.5px}
#lock{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:linear-gradient(160deg,#0d0716,#1a0f30 60%,#241440);transition:opacity .35s}
#lock.fade{opacity:0;pointer-events:none}
#lock-time{font-size:74px;font-weight:200;letter-spacing:2px}
#lock-date{color:var(--muted);font-size:15px;margin-top:2px}
#lock-card{margin-top:70px;display:flex;flex-direction:column;align-items:center;gap:13px}
#lock-av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--wine));
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;box-shadow:0 10px 34px rgba(212,165,63,.35)}
#lock-name{font-size:19px;font-weight:600}
#lock-hint{color:var(--muted);font-size:12.5px}
#lock-btn{margin-top:4px;padding:9px 26px;border-radius:999px;background:linear-gradient(135deg,var(--gold),#b8860b);font-weight:600;font-size:13.5px;color:#1a0f30}
#lock-btn:hover{background:linear-gradient(135deg,var(--accent2),var(--gold))}

/* ---------- APP-SHARED ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex:none;background:rgba(26,30,41,.5);flex-wrap:wrap}
.toolbar .tb-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);font-size:12.5px}
.toolbar .tb-btn:hover{background:var(--panel3)}
.toolbar input[type=text]{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;outline:none;min-width:130px}
.toolbar input[type=text]:focus{border-color:var(--accent)}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--text);font-weight:600;cursor:pointer}
.crumb b:hover{text-decoration:underline}

/* files */
#files-grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
.fitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:10px;cursor:pointer;text-align:center;border:1px solid transparent}
.fitem:hover{background:var(--panel2)}
.fitem.sel{background:rgba(212,165,63,.14);border-color:rgba(212,165,63,.4)}
.fitem .f-ic{font-size:34px}
.fitem .f-n{font-size:11.5px;word-break:break-word;max-height:29px;overflow:hidden;line-height:1.3}
.fitem .f-s{font-size:10px;color:var(--muted)}
#files-results{position:absolute;inset:0;background:rgba(18,21,29,.98);z-index:5;padding:14px;overflow:auto;user-select:text}

<script>
"use strict";
/* =========================================================================
   CYRUS OS — working browser port of the CYRUS intent→policy→action OS layer.
   Everything runs client-side: virtual filesystem, intent engine, permission
   gate, window manager, apps, audit log. State persists in localStorage.
   ========================================================================= */

// ------------------------------------------------ utils
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const daysAgo = n => Date.now()-n*86400000;
const fmtSize = kb => kb>=1048576 ? (kb/1048576).toFixed(1)+" GB" : kb>=1024 ? (kb/1024).toFixed(1)+" MB" : Math.round(kb)+" KB";
const fmtTime = ts => new Date(ts).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});

// ------------------------------------------------ event bus
const Bus = { m:{}, on(e,f){(this.m[e]=this.m[e]||[]).push(f);}, emit(e,d){(this.m[e]||[]).forEach(f=>{try{f(d)}catch(err){console.error(err)}});} };

// ------------------------------------------------ persistent store
const Store = {
  KEY:"cyrus_os_v2",
  data:null,
  load(){
    try{ this.data = JSON.parse(localStorage.getItem(this.KEY)); }catch(e){ this.data=null; }
    if(!this.data || !this.data.vfs){ this.data = { vfs: seedFS(), log: seedLog(), settings: defaultSettings(), notes:{} }; this.save(); }
    if(!this.data.settings) this.data.settings = defaultSettings();
    if(this.data.settings.accent==="#8b5cf6") this.data.settings.accent="#d4a53f"; // migrate old blue accent → royal gold
    // one-time: owner asked for maximum intelligence — unlock the cloud brain lane (can re-lock in Settings)
    if(!this.data.settings.brainUnlocked){ this.data.settings.brainUnlocked=true;
      if(this.data.settings.privacy==="local") this.data.settings.privacy="cloud"; this.save(); }
  },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){} },
  reset(){ localStorage.removeItem(this.KEY); location.reload(); }
};
function defaultSettings(){
  return { privacy:"local", accent:"#d4a53f", wallpaper:"default", anims:true, llmEndpoint:"", llmModel:"", notifications:null, brainLane:"astra",
           apiKeys:{}, endpoints:{}, usePuter:true, routeChain:null, routeModel:{}, routeStrategy:null };
}

// ------------------------------------------------ virtual filesystem
function mkFile(name, content, opts={}){
  const ext=(name.split(".").pop()||"").toLowerCase();
  return { type:"file", name, ext, content:content||"",
           size: opts.size != null ? opts.size : Math.max(2, Math.round((content||"").length/900)+40+Math.round(Math.random()*300)),
           mtime: opts.mtime || Date.now() };
}
function mkDir(name, children={}, opts={}){ return { type:"dir", name, children, mtime: opts.mtime||Date.now() }; }

function seedFS(){
  const home = mkDir("rithvik", {
    Documents: mkDir("Documents", {
      "AI Mining Presentation.pptx": mkFile("AI Mining Presentation.pptx",
        "AI in Mining — Rockfall Prediction\nSlide outline: 1) Problem: rockfall threats in open-pit mines. 2) Sensor data from the Rockfall dataset. 3) ML model comparison: random forest vs gradient boosting. 4) Results: 94% accuracy on the rockfall dataset. 5) Deployment plan for Smart Campus dashboard integration. Presented to the AI mining research group.",
        {size:4200, mtime:daysAgo(25)}),
      "AI mining research.pdf": mkFile("AI mining research.pdf",
        "Research paper draft: machine learning for rockfall hazard prediction. Covers feature engineering on seismic sensor streams, gradient boosted trees, and a comparison against baseline models. Related to the Rockfall dataset and the Smart Campus project.",
        {size:2100, mtime:daysAgo(28)}),
      "Rockfall dataset.csv": mkFile("Rockfall dataset.csv","sensor_id,timestamp,vibration,magnitude,label\n...",{size:15400, mtime:daysAgo(31)}),
      "resume.pdf": mkFile("resume.pdf","Rithvik — cybersecurity and AI projects: CrimeGraph, ThreatView, VulnScan, XAI Agent, Smart Campus.",{size:340, mtime:daysAgo(60)}),
      "Team meeting — Aug 19.txt": mkFile("Team meeting — Aug 19.txt","Discussed Smart Campus occupancy model training plan, dataset cleanup and the dashboard API. Next: finish model accuracy testing.",{size:12, mtime:daysAgo(26)}),
      "ML Notes": mkDir("ML Notes", {
        "transformers cheat sheet.pdf": mkFile("transformers cheat sheet.pdf","Attention is all you need — QKV, multi-head attention, positional encoding, masking. Notes from last semester deep learning course.",{size:890, mtime:daysAgo(105)}),
        "CNN notes.pdf": mkFile("CNN notes.pdf","Convolutional neural networks: kernels, pooling, feature maps. Lab exercises from last semester.",{size:760, mtime:daysAgo(118)}),
        "gradient descent.pdf": mkFile("gradient descent.pdf","Optimization: SGD, momentum, Adam, learning-rate schedules. Course notes.",{size:640, mtime:daysAgo(97)}),
      }),
      "java_assignments": mkDir("java_assignments", {

const VFS = {
  root:null,
  norm(base, p){
    if(p==null||p==="") return base;
    if(p==="~") p="/home/rithvik";
    if(p.startsWith("~/")) p="/home/rithvik/"+p.slice(2);
    let parts = p.startsWith("/") ? p.split("/") : (base+"/"+p).split("/");
    const st=[];
    for(const seg of parts){ if(!seg||seg===".")continue; if(seg==="..")st.pop(); else st.push(seg); }
    return "/"+st.join("/");
  },
  node(path){
    if(path==="/"||path==="") return this.root;
    let cur=this.root;
    for(const seg of path.split("/").filter(Boolean)){
      if(!cur || cur.type!=="dir") return null;
      cur = cur.children[seg];
    }
    return cur||null;
  },
  parent(path){ const i=path.lastIndexOf("/"); return i<=0?"/":path.slice(0,i); },
  base(path){ return path.split("/").filter(Boolean).pop()||"/"; },
  mkdirp(path){
    let cur=this.root;
    for(const seg of path.split("/").filter(Boolean)){
      if(!cur.children[seg]) cur.children[seg]=mkDir(seg,{});
      cur=cur.children[seg];
      if(cur.type!=="dir") return null;
    }
    return cur;
  },
  writeFile(path, content){
    const dir=this.node(this.parent(path)); if(!dir||dir.type!=="dir") return false;
    const name=this.base(path);
    if(dir.children[name] && dir.children[name].type==="dir") return false;
    const ex=dir.children[name];
    if(ex){ ex.content=content; ex.mtime=Date.now(); ex.size=Math.max(2,Math.round(content.length/900)+2); }
    else dir.children[name]=mkFile(name,content);
    Bus.emit("vfs"); Store.save(); return true;
  },
  detach(path){
    const node=this.node(path); if(!node) return null;
    const dir=this.node(this.parent(path));
    delete dir.children[this.base(path)];
    return node;
  },
  attach(dirPath, node){
    const dir=this.node(dirPath); if(!dir||dir.type!=="dir") return false;
    dir.children[node.name]=node; Bus.emit("vfs"); Store.save(); return true;
  },
  move(src, dstDirPath){
    const node=this.detach(src); if(!node) return false;
    const dst=this.node(dstDirPath);
    if(dst && dst.type==="dir" && !dst.children[node.name]){ dst.children[node.name]=node; }
    else { // rename
      const pd=this.node(this.parent(dstDirPath)); if(!pd) return false;
      node.name=this.base(dstDirPath); pd.children[node.name]=node;
    }
    Bus.emit("vfs"); Store.save(); return true;
  },
  remove(path){
    const node=this.detach(path); if(!node) return false;
    Bus.emit("vfs"); Store.save(); return true;
  },
  walk(path, fn){
    const n=this.node(path); if(!n) return;
    if(n.type==="file"){ fn(path, n); return; }
    for(const name of Object.keys(n.children)) this.walk((path==="/"?"":path)+"/"+name, fn);
  },
  allFiles(){ const out=[]; this.walk("/home/rithvik",(p,n)=>out.push({path:p,node:n})); return out; },
  sizeOf(path){ const n=this.node(path); if(!n) return 0; if(n.type==="file") return n.size||0; let t=0; this.walk(path,(p,f)=>t+=f.size||0); return t; }
};

// ------------------------------------------------ CYRUS Memory — persistent facts CYRUS is told
// "remember that X" → saved to ~/Memory/cyrus-memory.json + re-injected into every conversation.
const MemoryC = {
  path:"/home/rithvik/Memory/cyrus-memory.json",
  _cache:null,
  facts(){
    if(this._cache) return this._cache;
    const n=VFS.node(this.path);
    try{ this._cache = n && n.type==="file" ? JSON.parse(n.content||"[]") : []; }catch(e){ this._cache=[]; }
    return this._cache;
  },
  save(){
    VFS.mkdirp("/home/rithvik/Memory");
    VFS.writeFile(this.path, JSON.stringify(this.facts(),null,2));
    this._cache=null; // re-read from VFS (single source of truth, persists via Store)
  },
  add(text, source){
    text=String(text||"").trim(); if(!text) return false;
    const facts=this.facts();
    if(facts.some(f=>f.text.toLowerCase()===text.toLowerCase())) return false;
    facts.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), text:text.slice(0,220),
                   ts:Date.now(), source:source||"chat"});
    if(facts.length>100) facts.length=100;
    this.save(); return true;
  },
  forget(id){ const f=this.facts(); const i=f.findIndex(x=>x.id===id); if(i<0) return false; f.splice(i,1); this.save(); return true; },
  clearAll(){ this._cache=[]; this.save(); },
  // fact lines for the persona (most recent 20)
  block(){
    const f=this.facts().slice(0,20);
    if(!f.length) return "";
    return "\n\nWHAT CYRUS REMEMBERS (told by the user across sessions — treat as true):\n" +
      f.map(x=>"• "+x.text).join("\n");
  },
  // detect "remember that ..." requests in chat text; returns saved fact or null
  capture(text){
    const m=String(text||"").match(/^\s*(?:hey\s+)?(?:cyrus[,:]?\s*)?(?:please\s+)?remember(?:\s+(?:that|this))?[\s:,-]+(.+)$/is);
    if(!m) return null;
    let fact=m[1].trim().replace(/[.!?]+$/,"");
    if(fact.length<3 || /^(to\s+)?(open|run|delete|move|find)\b/i.test(fact)) return null; // that's an action, not a memory
    return this.add(fact) ? fact : null;
  }
};

// ------------------------------------------------ Smart Organizer — AI-proposed folder cleanup, review-before-apply, undoable
const IOrganizer = {
  lastUndo:null,
  async plan(folderPath){
    const node=VFS.node(folderPath); if(!node||node.type!=="dir") throw new Error("folder not found");
    const items=Object.values(node.children).filter(n=>n.type==="file").map(n=>n.name);
    if(items.length<2) throw new Error("not enough files in "+folderPath+" to organize");
    const r=await Router.chat([
      {role:"system", content:"You organize a user's folder. Given file names, propose 2-4 AI folders and an assignment for EVERY file. Reply ONLY minified JSON: {\"folders\":[\"Suggested Name\",...],\"moves\":[{\"file\":\"exact name\",\"to\":\"Suggested Name\"}]}. Group by purpose/topic, never by extension alone. Keep names short and human."},
      {role:"user", content:"Folder: "+folderPath+"\nFiles:\n"+items.join("\n")}
    ],{taskType:"general", temperature:.3, maxTokens:500});
    if(!r.ok) throw new Error((r.errors||["router offline"]).join("; ").slice(0,140));
    const m=r.text.match(/\{[\s\S]*\}/); if(!m) throw new Error("model did not return a plan");
    const p=JSON.parse(m[0]);
    if(!Array.isArray(p.moves)||!Array.isArray(p.folders)) throw new Error("bad plan shape");
    return {folders:p.folders.slice(0,5), moves:p.moves.filter(x=>x&&x.file&&x.to&&items.includes(x.file)).slice(0,80), via:r.via};
  },
  apply(folderPath, plan){
    const applied=[];
    plan.folders.forEach(f=>VFS.mkdirp(folderPath+"/"+f));
    plan.moves.forEach(mv=>{
      const src=folderPath+"/"+mv.file;
      if(VFS.node(src) && VFS.node(folderPath+"/"+mv.to)){
        if(VFS.move(src, folderPath+"/"+mv.to)) applied.push({from:src, to:folderPath+"/"+mv.to+"/"+mv.file});
      }
    });
    this.lastUndo={folder:folderPath, applied};
    Log.record("organize "+folderPath,"organize",{moves:applied.length},"medium",true,true,"AI plan applied after review via "+(plan.via||""));
    return applied.length;
  },
  undo(){
    if(!this.lastUndo) return 0;
    let n=0; this.lastUndo.applied.forEach(m=>{ if(VFS.move(m.to, this.lastUndo.folder)) n++; });
    this.lastUndo=null; return n;
  }
};

  toggleMax(win){
    const e=win.el;
    if(e.dataset.max){ e.style.cssText=e.dataset.max; delete e.dataset.max; e.classList.remove("max"); }
    else{ e.dataset.max=e.style.cssText;
      e.style.cssText="left:0;top:0;width:100%;height:100%;z-index:"+(++this.z); e.classList.add("max"); }
  },
  focus(win){ this.wins.forEach(w=>w.el.classList.remove("focused")); win.el.classList.add("focused"); win.el.style.zIndex=++this.z; },
  close(id){
    const win=this.wins.get(id); if(!win)return;
    if(win.onClose) try{win.onClose();}catch(e){}
    win.el.remove(); this.wins.delete(id); Bus.emit("wm");
  },
  running(id){ const w=this.wins.get(id); return w && !w.el.classList.contains("min"); }
};

const CMD_ALIASES={ dir:"ls", cls:"clear", ver:"ver", where:"which", findstr:"findstr", tasklist:"ps", type:"type", erase:"rm", ren:"mv", copy:"cp", xcopy:"cp", move:"mv", md:"mkdir", rd:"rmdir", del:"rm", ipconfig:"ipconfig", tracert:"tracert", netstat:"netstat", systeminfo:"systeminfo", taskkill:"taskkill", sc:"sc", net:"net", chkdsk:"chkdsk", vol:"vol", label:"label", sfc:"sfc", shutdown:"shutdown", winver:"ver", apt:"apt", dnf:"dnf", pacman:"pacman", "curl.exe":"curl" };

const CMDS = {
  // ---------- navigation
  pwd:{ run(a,s,pr){ pr(s.cwd); } },
  ls:{ run(a,s,pr){
    const flags=a.filter(x=>x.startsWith("-")), path=a.find(x=>!x.startsWith("-"))||"";
    const p=VFS.norm(s.cwd,path), n=VFS.node(p);
    if(!n){ pr(`ls: ${path||"."}: No such file or directory`,"err"); return; }
    if(n.type==="file"){ pr(n.name); return; }
    let names=Object.keys(n.children);
    if(!flags.some(f=>f.includes("a"))) names=names.filter(x=>!x.startsWith("."));
    if(!names.length){ pr("(empty)","dim"); return; }
    pr(names.map(name=>{
      const c=n.children[name];
      if(flags.some(f=>f.includes("l"))){
        const perm=c.type==="dir"?"drwxr-xr-x":"-rw-r--r--";
        return `${perm}  rithvik  ${fmtSize(c.size||0).padStart(8)}  ${fmtTime(c.mtime)}  ${c.type==="dir"?name+"/":name}`;
      }
      return (c.type==="dir"?name+"/":name);
    }).join("\n"));
  }},
  dir:{ run(a,s,pr){ CMDS.ls.run(a,s,pr); } },
  tree:{ run(a,s,pr){
    const p=VFS.norm(s.cwd,a[0]||""), n=VFS.node(p);
    if(!n||n.type!=="dir"){ pr(`tree: ${a[0]||"."}: Not a directory`,"err"); return; }
    const lines=[p.replace("/home/rithvik","~")];
    const walk=(node,pre)=>{ const ks=Object.keys(node.children); ks.forEach((k,i)=>{
      const c=node.children[k], last=i===ks.length-1;
      lines.push(pre+(last?"└── ":"├── ")+(c.type==="dir"?k+"/":k));
      if(c.type==="dir") walk(c,pre+(last?"    ":"│   ")); }); };
    walk(n,"");
    pr(lines.join("\n")); pr(`\n${lines.length-1} entries`,"dim");
  }},
  cd:{ run(a,s,pr){
    if(a[0]==="-"){ if(s.dirs&&s.dirs.length){ const prev=s.dirs.pop(); const cur=s.cwd; s.cwd=prev; if(s.ps)s.ps(); pr(prev); } else pr("cd: no previous directory","err"); return; }
    const p=VFS.norm(s.cwd,a[0]||"~"), n=VFS.node(p);
    if(!n||n.type!=="dir"){ pr(`cd: ${a[0]||"~"}: Not a directory`,"err"); return; }
    s.dirs=s.dirs||[]; s.dirs.push(s.cwd); s.cwd=p; if(s.ps)s.ps();
  }},
  clear:{ run(a,s){ s.out.innerHTML=""; } },
  reset:{ run(a,s){ s.out.innerHTML=""; } },
  exit:{ run(){ const w=WM.wins.get("terminal"); if(w) WM.close("terminal"); } },

  // ---------- files
  touch:{ run(a,s,pr){
    if(!a.length){ pr("usage: touch <file>…","err"); return; }
    a.forEach(f=>{ const p=VFS.norm(s.cwd,f); const n=VFS.node(p); if(n){ n.mtime=Date.now(); } else VFS.writeFile(p,""); });
    Store.save();
    pr("touched "+a.join(" "),"ok"); Bus.emit("vfs");
  }},
  mkdir:{ run(a,s,pr){
    const targets=a.filter(x=>!x.startsWith("-"));
    if(!targets.length){ pr("usage: mkdir [-p] <dir>…","err"); return; }
    targets.forEach(t=>{ const p=VFS.norm(s.cwd,t); VFS.mkdirp(p); });
    pr("created "+targets.join(", "),"ok");
  }},
  rmdir:{ run(a,s,pr){
    if(!a[0]){ pr("usage: rmdir <dir>","err"); return; }
    const p=VFS.norm(s.cwd,a[0]), n=VFS.node(p);
    if(!n||n.type!=="dir"){ pr(`rmdir: ${a[0]}: Not a directory`,"err"); return; }
    if(Object.keys(n.children).length){ pr(`rmdir: ${a[0]}: Directory not empty`,"err"); return; }
    VFS.remove(p); pr("removed "+a[0],"ok");
  }},
  rm:{ run(a,s,pr){
    const flags=a.filter(x=>x.startsWith("-")), target=a.find(x=>!x.startsWith("-"));
    if(!target){ pr("usage: rm [-r] [-f] <path>","err"); return; }
    const p=VFS.norm(s.cwd,target);
    if(p==="/"||p==="/home"||/^c:\\?$/i.test(p)){ pr("rm: refused — critical path. Administrator confirmation required.","err"); return; }
    const n=VFS.node(p); if(!n){ pr(`rm: ${target}: No such file or directory`,"err"); return; }
    if(n.type==="dir"&&!flags.some(f=>f.includes("r"))){ pr(`rm: ${target}: is a directory (use -r)`,"err"); return; }
    VFS.remove(p); pr("removed "+target,"ok"); Log.record(`term: rm ${target}`,"delete_file",{path:p},"medium",true,true,"rm via terminal");
  }},
  cp:{ run(a,s,pr){
    const rec=a.some(x=>x.startsWith("-")&&x.includes("r"));
    const rest=a.filter(x=>!x.startsWith("-"));
    if(rest.length<2){ pr("usage: cp [-r] <src> <dst>","err"); return; }
    const sp=VFS.norm(s.cwd,rest[0]), sn=VFS.node(sp);
    if(!sn){ pr(`cp: ${rest[0]}: No such file or directory`,"err"); return; }
    let dp=VFS.norm(s.cwd,rest[1]); const dn=VFS.node(dp);
    if(sn.type==="file"){
      if(dn&&dn.type==="dir") dp=dp+"/"+sn.name;
      VFS.writeFile(dp,sn.content); pr(`copied ${rest[0]} → ${dp.replace("/home/rithvik","~")}`,"ok");
    } else if(rec){
      const copyDir=(node,base)=>{ VFS.mkdirp(base); Object.values(node.children).forEach(c=>{
        if(c.type==="dir") copyDir(c,base+"/"+c.name); else VFS.writeFile(base+"/"+c.name,c.content); }); };
      copyDir(sn,dp); pr(`copied directory ${rest[0]} → ${dp.replace("/home/rithvik","~")}`,"ok");
    } else pr(`cp: ${rest[0]}: is a directory (use -r)`,"err");
  }},
  mv:{ run(a,s,pr){
    if(a.length<2){ pr("usage: mv <src> <dst>","err"); return; }
    const sp=VFS.norm(s.cwd,a[0]), dpRaw=VFS.norm(s.cwd,a[1]);
    const n=VFS.node(sp); if(!n){ pr(`mv: ${a[0]}: No such file or directory`,"err"); return; }
    const dn=VFS.node(dpRaw);
    if(dn&&dn.type==="dir") VFS.move(sp,dpRaw);
    else { const nd=VFS.detach(sp); if(!nd){pr("mv failed","err");return;} nd.name=VFS.base(dpRaw); VFS.attach(VFS.parent(dpRaw),nd); }
    pr(`moved ${a[0]} → ${a[1]}`,"ok");
  }},
  cat:{ run(a,s,pr){
    if(!a.length){ pr("usage: cat <file>…","err"); return; }
    for(const f of a){ const n=VFS.node(VFS.norm(s.cwd,f));
      if(!n||n.type!=="file"){ pr(`cat: ${f}: No such file`,"err"); continue; }
      pr(n.content||"(empty file)");
    }
  }},
  less:{ run(a,s,pr){
    const n=VFS.node(VFS.norm(s.cwd,a[0]||""));
    if(!n||n.type!=="file"){ pr(`less: ${a[0]}: No such file`,"err"); return; }
    const lines=(n.content||"").split("\n"); const PER=24;
    let page=0; const pages=Math.max(1,Math.ceil(lines.length/PER));
    const show=()=>{ pr(`── ${n.name} ── page ${page+1}/${pages} ── (Space next · q quit)`+"\n"+lines.slice(page*PER,(page+1)*PER).join("\n")); };
    show();
    if(pages>1){
      const h=(e)=>{ if(e.key===" "){ e.preventDefault(); page++; if(page>=pages){ cleanup(); return; } show(); s.out.scrollTop=s.out.scrollHeight; }
        else if(e.key.toLowerCase()==="q"){ cleanup(); } };
      const cleanup=()=>{ document.removeEventListener("keydown",h); pr("(pager closed)","dim"); };
      document.addEventListener("keydown",h);
      s.pagerCleanup=cleanup;
    }
  } },
  more:{ run(a,s,pr){ CMDS.less.run(a,s,pr); } },
  head:{ run(a,s,pr){ const raw=(s.stdin!=null)?null:(a.filter(x=>!x.startsWith("-")).pop());
    const n10=a.indexOf("-n"); const cnt=n10>=0?parseInt(a[n10+1])||10:10;
    let text=null;
    if(s.stdin!=null) text=s.stdin;
    else { const n=VFS.node(VFS.norm(s.cwd,raw||"")); if(!n||n.type!=="file"){ pr(`head: ${raw}: No such file`,"err"); return; } text=n.content||""; }
    pr(text.split("\n").slice(0,cnt).join("\n")); }},
  tail:{ run(a,s,pr){ const raw=(s.stdin!=null)?null:(a.filter(x=>!x.startsWith("-")).pop());
    const n10=a.indexOf("-n"); const cnt=n10>=0?parseInt(a[n10+1])||10:10;
    let text=null;
    if(s.stdin!=null) text=s.stdin;
    else { const n=VFS.node(VFS.norm(s.cwd,raw||"")); if(!n||n.type!=="file"){ pr(`tail: ${raw}: No such file`,"err"); return; } text=n.content||""; }
    const L=text.split("\n"); pr(L.slice(-cnt).join("\n")); }},
  sort:{ run(a,s,pr){ let text=null;
    if(s.stdin!=null) text=s.stdin;
    else { const raw=a.filter(x=>!x.startsWith("-")).pop(); const n=VFS.node(VFS.norm(s.cwd,raw||""));
      if(!n||n.type!=="file"){ pr(`sort: ${raw}: No such file`,"err"); return; } text=n.content||""; }
    pr(text.split("\n").sort().join("\n")); }},
  uniq:{ run(a,s,pr){ const text=(s.stdin!=null)?s.stdin:"";
    const out=[]; text.split("\n").forEach((l,i,arr)=>{ if(i===0||l!==arr[i-1]) out.push(l); }); pr(out.join("\n")); }},
  nl:{ run(a,s,pr){ const n=VFS.node(VFS.norm(s.cwd,a[0]||""));
    if(!n||n.type!=="file"){ pr(`nl: ${a[0]}: No such file`,"err"); return; }
    pr((n.content||"").split("\n").map((l,i)=>`${String(i+1).padStart(5)}  ${l}`).join("\n")); }},
  wc:{ run(a,s,pr){ const n=VFS.node(VFS.norm(s.cwd,a[0]||""));
    if(!n||n.type!=="file"){ pr(`wc: ${a[0]}: No such file`,"err"); return; }
    const c=n.content||"", L=c.split("\n").length, W=(c.match(/\S+/g)||[]).length;
    pr(`${L} lines  ${W} words  ${c.length} chars  ${n.name}`); }},
  file:{ run(a,s,pr){ const p=VFS.norm(s.cwd,a[0]||""); const n=VFS.node(p);
    if(!n){ pr(`file: ${a[0]}: No such file`,"err"); return; }
    pr(n.type==="dir"?`${p}: directory`:`${p}: ${n.ext?n.ext.toUpperCase()+" document":"text"} — ${fmtSize(n.size||0)}, modified ${fmtTime(n.mtime)}`); }},
  stat:{ run(a,s,pr){ const p=VFS.norm(s.cwd,a[0]||""); const n=VFS.node(p);
    if(!n){ pr(`stat: ${a[0]}: No such file`,"err"); return; }
    pr(`  File: ${p}\n  Type: ${n.type==="dir"?"directory":"regular file"}\n  Size: ${fmtSize(n.size||0)}\nModify: ${fmtTime(n.mtime)}`); }},
  ln:{ run(a,s,pr){ pr("ln: cyrus-vfs models links as copies — created a copy instead","dim"); this.copyOne(a[0],a[1],s,pr); },
    copyOne(a,s,pr){ CMDS.cp.run([a],s,pr); } },

  // ---------- search
  grep:{ run(a,s,pr){
    const flags=a.filter(x=>x.startsWith("-")); const rest=a.filter(x=>!x.startsWith("-"));
    const pat=rest[0]; if(!pat){ pr("usage: grep [-i] [-n] [-v] [-r] <pattern> [path]","err"); return; }
    const targets=rest.slice(1); const ci=flags.some(f=>f.includes("i")); const nv=flags.some(f=>f.includes("n"));
    const vin=flags.some(f=>f.includes("v"));
    let re; try{ re=new RegExp(pat, ci?"i":""); }catch(e){ re=new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), ci?"i":""); }
    const hits=[];
    const scanFile=(p,node)=>{ const lines=(node.content||"").split("\n");
      lines.forEach((l,i)=>{ const m=re.test(l); if(m!==vin) hits.push(`${p.replace("/home/rithvik","~")}:${nv?i+1+":":""}${l}`); }); };
    if(s.stdin!=null){ // stdin from a pipe
      (s.stdin||"").split("\n").forEach(l=>{ const m=re.test(l); if(m!==vin) hits.push(l); });
    } else if(!targets.length||flags.some(f=>f.includes("r"))){
      VFS.walk(VFS.norm(s.cwd,targets[0]||""),(p,n)=>{ if(n.type==="file") scanFile(p,n); });
    } else {
      targets.forEach(t=>{ const p=VFS.norm(s.cwd,t); const n=VFS.node(p);
        if(!n){ pr(`grep: ${t}: No such file`,"err"); return; }
        if(n.type==="file") scanFile(p,n); else VFS.walk(p,(pp,nn)=>{ if(nn.type==="file") scanFile(pp,nn); }); });
    }
    if(!hits.length){ pr("(no matches)","dim"); return; }
    pr(hits.slice(0,60).join("\n")); if(hits.length>60) pr(`… ${hits.length-60} more`,"dim");
  }},
  findstr:{ run(a,s,pr){ const rest=a.filter(x=>!x.startsWith("/"));
    CMDS.grep.run(rest.slice(0,1).concat(rest.slice(1)),s,pr); } },
  find:{ run(a,s,pr){
    const base=VFS.norm(s.cwd, a[0]&&!a[0].startsWith("-") ? a[0] : "");
    const nameIdx=a.indexOf("-name"); const pat=nameIdx>=0?a[nameIdx+1]:null;
    const extIdx=a.indexOf("-ext"); const ext=extIdx>=0?a[extIdx+1]:null;
    const mtIdx=a.indexOf("-mtime"); const mtd=mtIdx>=0?parseInt(a[mtIdx+1]):null;
    const clean=pat?pat.replace(/\*/g,"").replace(/\?.?/g,"") : null;
    const out=[];
    VFS.walk(base,(p,n)=>{ if(n.type!=="file")return;
      if(ext && !p.toLowerCase().endsWith("."+ext.toLowerCase().replace(".","")))return;
      if(clean && !p.toLowerCase().includes(clean.toLowerCase()))return;
      if(mtd!=null && (Date.now()-n.mtime)>mtd*86400000)return;
      out.push(p.replace("/home/rithvik","~")); });
    pr(out.length?out.join("\n"):"(no matches)","out");

const PyRun={ run(src){ const out=[];

    for(const raw of lines){ const l=raw.trim();
      let m=l.match(/^print\s*\((.*)\)\s*$/)||l.match(/^print\s+(.+)$/);
      if(m){ let arg=m[1];

        else arg=arg.replace(/^["']|["']$/g,"").replace(/["'],\s*["']/g," ");

  return out.length?out.join("\n"):"(script ran — only print/assignment statements are supported in this sandbox)"; },
  evalExpr(e){ try{ return Function("vars",`with(vars||{}){ return (${e}) }`)(this.vars||{}); }catch(err){ return "?"; } } };

// ---------- Git (mini, per-folder in .cyrus-git/)
const Git={ run(a,s,pr){
  const sub=a[0];
  const repoPath=()=>{ let d=s.cwd; while(d!=="/"){ if(VFS.node(d+"/.cyrus-git")) return d; d=VFS.parent(d); } return null; };
  const init=()=>VFS.mkdirp(s.cwd+"/.cyrus-git");
  const readMeta=(repo)=>{ const n=VFS.node((repo||s.cwd)+"/.cyrus-git/meta"); try{ return JSON.parse(n.content); }catch(e){ return {staged:[],commits:[],branches:["main"],cur:"main",stash:[],tags:[]}; } };
  const writeMeta=(m,repo)=>VFS.writeFile((repo||s.cwd)+"/.cyrus-git/meta",JSON.stringify(m));
  if(sub==="init"){ init(); VFS.writeFile(s.cwd+"/.cyrus-git/meta",JSON.stringify({staged:[],commits:[],branches:["main"],cur:"main",stash:[],tags:[]}));
    pr(`Initialized empty Git repository in ${s.cwd}/.cyrus-git/`,"ok"); return; }
  const rp=repoPath(); const base=s.cwd;
  if(!rp){ pr("fatal: not a git repository — run 'git init' first","err"); return; }
  const meta=readMeta(rp); const repo=rp;
  const filesNow=()=>{ const o=[]; VFS.walk(base,(p,n)=>{ if(n.type==="file"&&!p.includes(".cyrus-git")) o.push(p); }); return o; };
  if(sub==="add"){ const t=a[1]||".";
    const list=(t==="."||t==="-A"||t==="-a")?filesNow():filesNow().filter(p=>p.includes(t.replace(/^\.\//,"")));
    meta.staged=[...new Set(meta.staged.concat(list))]; writeMeta(meta,repo);
    pr(`staged ${list.length} file(s)`,"ok"); return; }
  if(sub==="commit"){ const msg=(a[1]==="-m"?a.slice(2).join(" "):a.slice(1).join(" "))||"(no message)";
    if(!(meta.staged||[]).length){ pr("nothing staged — git add first","err"); return; }
    meta.commits.unshift({hash:Math.random().toString(16).slice(2,9),msg,files:meta.staged.slice(),when:Date.now()});
    meta.staged=[]; writeMeta(meta,repo); pr(`[${meta.cur} ${meta.commits[0].hash}] ${msg}`,"ok"); return; }
  if(sub==="log"){ pr(meta.commits.length?meta.commits.map(c=>`${c.hash}  ${fmtTime(c.when)}  ${c.msg}  (${c.files.length} files)`).join("\n"):"no commits yet"); return; }
  if(sub==="status"){ const now=filesNow();
    pr(`On branch ${meta.cur}\n\nStaged:\n${(meta.staged||[]).map(p=>"  "+p.replace("/home/rithvik","~")).join("\n")||"  (nothing)"}\n\nUntracked/modified (working set: ${now.length} files)\nRun 'git add .' then 'git commit -m \"msg\"'.`); return; }
  if(sub==="branch"){ if(!a[1]){ pr(meta.branches.map(b=>(b===meta.cur?"* ":"  ")+b).join("\n")); return; }
    meta.branches.push(a[1]); writeMeta(meta,repo); pr(`created branch ${a[1]}`,"ok"); return; }
  if(sub==="switch"||sub==="checkout"){ if(a[1]==="-c"||a[1]==="-b"){ meta.branches.push(a[2]); meta.cur=a[2]; writeMeta(meta,repo); pr(`switched to new branch '${a[2]}'`,"ok"); return; }
    if(!meta.branches.includes(a[1])){ pr(`branch '${a[1]}' not found`,"err"); return; }
    meta.cur=a[1]; writeMeta(meta,repo); pr(`switched to branch '${a[1]}'`,"ok"); return; }
  if(sub==="merge"){ pr(`merge '${a[1]||""}': fast-forward (virtual) — working tree unchanged`,"ok"); return; }
  if(sub==="diff"){ const now=filesNow();
    pr(`diff vs last commit:\n`+(meta.commits[0]?meta.commits[0].files.filter(p=>!now.includes(p)).map(p=>`- removed: ${p}`).join("\n"):"(no commits)")); return; }
  if(sub==="stash"){ meta.stash.push({when:Date.now(),files:filesNow().length}); writeMeta(meta,repo); pr(`stashed working set (${filesNow().length} files)`,"ok"); return; }
  if(sub==="tag"){ if(a[1]){ meta.tags.push(a[1]); writeMeta(meta,repo); pr(`tagged ${a[1]}`,"ok"); } else pr(meta.tags.join("\n")||"(no tags)"); return; }
  if(sub==="remote"){ pr(a[1]==="-v"?"origin  https://github.com/rithvik/cyrus (virtual)":"(virtual remote configured)"); return; }
  if(sub==="clone"||sub==="push"||sub==="pull"||sub==="fetch"){ pr(`git ${sub}: network remotes are outside the sandbox — use your real terminal + real git for remote ops`,"dim"); return; }
  if(sub==="restore"||sub==="reset"){ meta.staged=[]; writeMeta(meta,repo); pr("unstaged everything (working tree intact)","ok"); return; }
  pr("usage: git <init|add|commit|log|status|branch|switch|diff|stash|tag|remote|restore|reset>","err");
} };

// ---------- shell operators + dispatch ------------------------------------
const Sh = {
  // split on ; && || while respecting quotes
  segments(line){
    const segs=[]; let cur="", op=null, i=0, q=null;
    while(i<line.length){
      const c=line[i];
      if(q){ cur+=c; if(c===q)q=null; i++; continue; }
      if(c==="\""||c==="'"){ q=c; cur+=c; i++; continue; }
      if(c==="&"&&line[i+1]==="&"){ segs.push({text:cur,op:op}); op="&&"; cur=""; i+=2; continue; }
      if(c==="|"&&line[i+1]==="|"){ segs.push({text:cur,op:op}); op="||"; cur=""; i+=2; continue; }
      if(c===";"){ segs.push({text:cur,op:op}); op=null; cur=""; i++; continue; }
      cur+=c; i++;
    }
    segs.push({text:cur,op:op});
    return segs.filter(s=>s.text.trim());
  },
  // split one segment into pipelines by | ; each stage gets redirections applied
  parsePipes(text){
    const stages=[]; let cur="", q=null, i=0;
    while(i<text.length){ const c=text[i];
      if(q){ cur+=c; if(c===q)q=null; i++; continue; }
      if(c==="\""||c==="'"){ q=c; cur+=c; i++; continue; }
      if(c==="|"){ stages.push(cur.trim()); cur=""; i++; continue; }
      cur+=c; i++; }
    stages.push(cur.trim());
    return stages.map(st=>{
      const out={cmd:"",redir:null,append:false,input:null};
      const rm=/\s(>>?)\s*("[^"]*"|'[^']*'|\S+)\s*$/.exec(st);
      if(rm){ out.append=rm[1]===">>"; st=st.slice(0,rm.index); out.redir=rm[2].replace(/^["']|["']$/g,""); }
      const im=/\s<\s*("[^"]*"|'[^']*'|\S+)\s*$/.exec(st);
      if(im){ out.input=im[1].replace(/^["']|['"]$/g,""); st=st.slice(0,im.index); }
      out.cmd=st.trim(); return out;
    });
  },
  run(line, state, print){
    const lastOk={v:true};
    for(const seg of this.segments(line)){
      if(seg.op==="&&"&&!lastOk.v) continue;
      if(seg.op==="||"&&lastOk.v) continue;
      lastOk.v=this.pipeline(seg.text, state, print);
    }
  },
  pipeline(text, state, print){
    const stages=this.parsePipes(text);
    let data=null, ok=true;
    for(let i=0;i<stages.length;i++){
      const st=stages[i];
      const catchOut=[];
      const pr=(t,cls)=>catchOut.push(t);
      // command substitution $( )
      let cmdText=st.cmd.replace(/\$\(([^()]*)\)/g,(m,inner)=>{
        let cap="";
        this.pipeline(inner, state, t=>{cap+=t+"\n";});
        return cap.trim();
      });
      const toks=Term.tokenize(cmdText.trim());
      if(!toks.length) continue;
      let cmd=toks[0], args=toks.slice(1);
      // stdin from the previous pipe stage: expose as state.stdin for commands that accept it
      state.stdin=data;
      // alias expansion
      if(state.aliases&&state.aliases[cmd]) { const ex=Term.tokenize(state.aliases[cmd]); cmd=ex[0]||cmd; args=ex.slice(1).concat(args); }
      // CMD aliases (windows names)
      if(!CMDS[cmd]&&CMD_ALIASES[cmd]&&CMDS[CMD_ALIASES[cmd]]) cmd=CMD_ALIASES[cmd];
      // "??" starts with a non-word char, keep it intact through the tokenizer
      let res=true;
      if(cmd==="man"){ this.man(args,pr); }
      else if(cmd==="apropos"){ this.apropos(args,pr); }
      else if(cmd==="whatis"){ pr(args[0]&&MAN[args[0]]?MAN[args[0]].split("—")[0].trim():`whatis: ${args[0]}: nothing appropriate`,"out"); }
      else if(cmd==="cheat"){ this.cheat(args,pr); }
      else if(CMDS[cmd]){
        // For the last stage, let async handlers write straight to the terminal;
        // for piped stages, keep capturing into catchOut.
        const isLast=(i===stages.length-1);
        const prFinal=isLast&&!st.redir?print:pr;
        try{ CMDS[cmd].run(args, state, prFinal); }catch(e){ pr((cmd)+": "+e.message,"err"); res=false; }
      }
      else if(CMDS["help"]){ pr(`${cmd}: command not found. Try 'ai ${cmdText.trim()}' — CYRUS might understand it.`,"err"); res=false; }
      // final stage output goes to the terminal (or the redirection target)
      const outText=catchOut.join("\n");
      if(i===stages.length-1){
        if(st.redir){
          const target=VFS.norm(state.cwd,st.redir);
          if(st.append){ const ex=VFS.node(target); const base=(ex&&ex.content)||"";
            VFS.writeFile(target, base+(base?"\n":"")+outText); }
          else VFS.writeFile(target,outText);
          print("(wrote "+st.redir+")","dim");
        } else if(outText) print(outText);
      }
      // pipe forward: next stage receives this stage's captured output
      data=catchOut.join("\n");
      ok=ok&&res;
    }
    state.stdin=null;
    return ok;
  },
  man(args,pr){
    const c=args[0];
    if(!c){ pr("What manual page do you want?\nusage: man <command>   ·   try: man ls","err"); return; }
    if(MAN[c]) pr(c.toUpperCase()+"(1)\n\nNAME    "+c+" — "+MAN[c].split("—").slice(1).join("—").trim()||MAN[c]+"\n\nSYNOPSIS  "+MAN[c]+"\n\nSee also: cheat, apropos "+c);
    else pr(`No manual entry for ${c}. Try 'apropos ${c}' or 'cheat'.`,"err");
  },
  apropos(args,pr){
    const kw=(args[0]||"").toLowerCase();
    if(!kw){ pr("usage: apropos <keyword>","err"); return; }
    const hits=Object.entries(MAN).filter(([c,d])=>c.includes(kw)||d.toLowerCase().includes(kw)).map(([c,d])=>`${c} — ${d.split("—").slice(1).join("—").trim()||d}`);
    pr(hits.length?hits.join("\n"):`nothing appropriate for “${kw}”`,"out");
  },
  cheat(args,pr){
    const cat=(args[0]||"all").toLowerCase();
    const groups={
      nav:["ls","cd","pwd","tree","clear","reset","exit"],
      files:["touch","mkdir","rmdir","rm","cp","mv","cat","less","head","tail","nl","wc","file","stat","ln"],
      read:["cat","less","head","tail","nl","wc"],
      search:["grep","find","locate","which","whereis","type"],
      perm:["chmod","chown","chgrp","umask"],
      sys:["whoami","who","w","id","groups","hostname","uname","uptime","date","cal","history","env","printenv","systeminfo","ver"],
      proc:["ps","top","kill","tasklist","taskkill"],
      disk:["df","du","free","lsblk","mount"],
      net:["ip","ss","netstat","ipconfig","ping","tracert","dig","nslookup","curl","wget","ssh"],
      pkg:["apt","dnf","pacman","pip","npm"],
      arch:["tar","zip","unzip","gzip","gunzip"],
      dev:["python","pip","java","javac","gcc","g++","node","npm","git","docker"],
      ops:["echo","export","unset","alias","unalias","source"],
      env:["export","unset","env","alias"],
      help:["man","apropos","whatis","cheat","help"],
      win:["dir","cls","ver","where","findstr","tasklist","ipconfig","tracert","netstat","systeminfo","taskkill"],
      git:["git"],
      docker:["docker"],
      cyrus:["ai","open","neofetch","ask","explain"],
    };
    const aliases={win:"Windows CMD", nav:"Navigation", files:"Files", read:"Reading files", search:"Search", perm:"Permissions",
      sys:"System info", proc:"Processes", disk:"Disk", net:"Networking", pkg:"Packages", arch:"Archives",
      dev:"Development", ops:"Shell operators", env:"Environment", help:"Help", git:"Git", docker:"Docker", cyrus:"CYRUS AI layer"};
    const cats=cat==="all"?Object.keys(groups):Object.keys(groups).filter(k=>k===cat);
    if(!cats.length){ pr("categories: "+Object.keys(groups).join(", "),"err"); return; }
    const out=[];
    for(const k of cats){
      out.push("\n── "+(aliases[k]||k)+" "+"─".repeat(Math.max(2,40-(aliases[k]||k).length)));
      for(const c of groups[k]){ if(MAN[c]) out.push("  "+MAN[c]); }
    }
    out.push("\nRun any of these directly — they all work here. Details: man <cmd>");
    pr(out.join("\n"));
  }
};
// legacy names used by docs: these are first-class commands
CMDS.man={ run(a,s,pr){ Sh.man(a,pr); } };

// ---------- command assistant: describe it → the AI writes the command for you
// The model never executes anything — it only *writes* the command into your input
// line; you review/edit, and pressing Enter is the human approval. (Spec §3/§16.)
const AskCmd={
  known(cmd){ return !!(CMDS[cmd] || (CMD_ALIASES[cmd] && CMDS[CMD_ALIASES[cmd]])); },
  validCommands(text){
    return text.replace(/```[a-z]*/g,"").replace(/```/g,"").split("\n").map(l=>l.trim())
      .filter(l=>l && !l.startsWith("#"))
      .filter(l=>this.known(l.replace(/^[$>]\s*/,"").split(/\s+/)[0]))
      .map(l=>l.replace(/^[$>]\s*/,""));
  },
  async cloud(req){
    const caps=Object.keys(MAN).join(" ");
    const sys=`You are the command-writing assistant inside the CYRUS OS terminal (cyrus-sh).
The user describes a task in plain English; you reply with the exact shell command(s) that accomplish it.
Rules:
- Use ONLY cyrus-sh builtins. Available commands: ${caps}
- The user's home is ~ (= /home/rithvik). All paths are virtual.
- Output ONLY the command(s), one per line, no markdown fences, no explanations, no $ prompts.
- Multi-step tasks: chain with && or ; on one line, or give several lines.
- Never suggest sudo; rm on critical paths is blocked by the OS policy anyway.`;
    const r=await Router.chat([{role:"system",content:sys},{role:"user",content:req}],{taskType:"fast",temperature:0,maxTokens:180});
    if(!r.ok) throw new Error((r.errors||[]).join(" | ")||"offline");
    const cmds=this.validCommands(r.text);
    if(!cmds.length) throw new Error("model returned no valid commands");
    return {cmds, via:r.viaLabel};
  },
  local(req){
    const lo=req.toLowerCase();
    const any=(...ws)=>ws.some(w=>lo.includes(w));
    const has=(...ws)=>ws.every(w=>lo.includes(w));
    const extM=lo.match(/\b(pdf|jpg|jpeg|png|csv|java|py|zip|doc|pptx)s?\b/);
    if(any("clean","tidy")&&any("desktop")) return {cmds:["ai clean up my desktop"], via:"local rules"};
    if(any("workspace")){ const m=lo.match(/([a-z ]+) workspace/); return {cmds:[`ai start ${m?m[1].trim():"college"} workspace`], via:"local rules"}; }
    if(any("find","search","locate","show")&&extM) return {cmds:[`find ~ -ext ${extM[1]==="jpeg"?"jpg":extM[1]==="docs"?"doc":extM[1]}`], via:"local rules"};
    if(any("find","search","locate")&&any("machine learning"," ml ")) return {cmds:[`grep -ri "machine learning" ~ | head -n 20`], via:"local rules"};
    if((has("what","using")||has("taking","up"))&&any("space","disk","storage")) return {cmds:["du","df -h"], via:"local rules"};
    if(any("disk","storage","space")&&any("free","usage","left","how much")) return {cmds:["df -h"], via:"local rules"};
    if(any("internet","network","connectivity","online","wifi")) return {cmds:["ping google.com"], via:"local rules"};
    if(any("ip","network config")&&!any("internet")) return {cmds:["ipconfig"], via:"local rules"};
    if(any("running","process","windows open","tasklist")) return {cmds:["ps"], via:"local rules"};
    if(any("memory","ram")&&any("how much","usage","using")) return {cmds:["free"], via:"local rules"};
    if(any("git")&&any("commit")) return {cmds:[`git add . && git commit -m "update"`], via:"local rules"};
    if(any("git")&&any("init","repository","repo")) return {cmds:["git init"], via:"local rules"};
    if(any("git")&&any("status","changes")) return {cmds:["git status"], via:"local rules"};
    if(any("compress","archive","backup","zip")&&any("folder","directory","project","everything in")){ const m=lo.match(/(?:folder|directory|project)\s+([a-z0-9_\-\.]+)/); return {cmds:[`tar -czf ${m?m[1]:"archive"}.tar.gz ${m?m[1]:"."}`], via:"local rules"}; }
    if(any("calendar")) return {cmds:["cal"], via:"local rules"};
    if(any("date","time")&&!any("file","folder")) return {cmds:["date"], via:"local rules"};
    if(any("grep","inside","contains")&&any("search","find","text")){ const m=req.match(/"([^"]+)"|\bfor\s+([a-z0-9 ]+)/i); const pat=m?(m[1]||m[2]).trim():"pattern"; return {cmds:[`grep -r "${pat}" ~ | head -n 20`], via:"local rules"}; }
    if(any("create","make","new")&&any("folder","directory")){ const m=lo.match(/(?:folder|directory)\s+(?:called\s+|named\s+)?([a-z0-9_\-]+)/); return {cmds:[`mkdir -p ${m?m[1]:"new-folder"}`], via:"local rules"}; }
    if(any("install")&&any("pip","python package")){ const m=lo.match(/install\s+([a-z0-9_\-]+)/); return {cmds:[`pip install ${m?m[1]:"package"}`], via:"local rules"}; }
    if(any("install")&&any("apt","package")){ const m=lo.match(/install\s+([a-z0-9_\-]+)/); return {cmds:[`apt install ${m?m[1]:"package"}`], via:"local rules"}; }
    if(any("docker")&&any("run","start","container")){ const m=lo.match(/(?:run|start)\s+([a-z0-9_\-\.\/:]+)/); return {cmds:[`docker pull ${m?m[1]:"nginx"} && docker run ${m?m[1]:"nginx"}`], via:"local rules"}; }
    if(any("python","pip")&&any("version")) return {cmds:["python --version"], via:"local rules"};
    if(any("count","how many")&&any("line","word")){ const m=req.match(/\b([\w\-\.]+\.[a-z0-9]+)\b/i); return {cmds:[`wc ${m?m[1]:"file"}`], via:"local rules"}; }
    // default: hand it to the OS intent layer (still plain English, still safe)
    return {cmds:[`ai ${req}`], via:"local rules"};
  },
  async suggest(req, s, print){
    print("🤖 assistant: thinking…","dim");
    let res=null, via="", note="";
    if(Store.data.settings.privacy!=="local"){
      try{ res=await this.cloud(req); via=res.via; }
      catch(e){ note="(cloud unreachable — using local rules)"; }
    }
    if(!res){ res=this.local(req); via=res.via; }
    if(note) print(note,"dim");
    const risky=res.cmds.some(c=>/\brm\b/.test(c));
    print("");
    print(`💡 Suggested command${res.cmds.length>1?"s":""}  ·  via ${via}`, "ok");
    res.cmds.forEach(c=>print("  $ "+c, "p"));
    if(risky) print("  ⚠️ this deletes data — review it before pressing Enter", "err");
    print("  (written into the input line below — press Enter to run, or edit first)","dim");
    print("");
    Log.record("ask: "+req,"suggest_command",{request:req},"low",false,true,"suggested via "+via);
    if(s.inp){ s.inp.value=res.cmds.join(" ; "); s.inp.focus(); }
    return res.cmds;
  }
};
CMDS.ask={ run(a,s,pr){ const req=a.join(" ");
  if(!req){ pr("usage: ask <describe what you want in plain English>","dim"); pr("  ask find all my java files","dim"); pr("  ?? what's using my disk space","dim"); return; }
  AskCmd.suggest(req,s,pr); } };
CMDS["??"]={ run(a,s,pr){ CMDS.ask.run(a,s,pr); } };
CMDS.organize={ run(a,s,pr){
  const target=VFS.norm(s.cwd, a[0]||"Downloads");
  const n=VFS.node(target);
  if(!n||n.type!=="dir"){ pr("no such folder: "+target,"err"); return; }
  const files=Object.values(n.children).filter(x=>x.type==="file");
  if(files.length<2){ pr("not enough files to organize in "+target,"dim"); return; }
  pr("🧠 asking CYRUS to plan folders for "+files.length+" files…");
  IOrganizer.plan(target).then(plan=>{
    pr(""); pr("Proposed folders: "+plan.folders.join(", "),"ok");
    plan.moves.forEach(m=>pr("   "+m.file+"  →  "+m.to));
    pr(""); pr("apply? type: organize "+a[0]+" --apply","p");
    s._orgPlan={path:target, plan};
  }).catch(e=>pr("plan failed: "+e.message,"err"));
}};
CMDS.organize_orig=CMDS.organize; // marker (help text lives in MAN)
const _origOrganizeRun=CMDS.organize.run;
CMDS.organize.run=function(a,s,pr){
  if(a[0]==="--apply"){
    const p=s._orgPlan;
    if(!p){ pr("no plan staged — run: organize <folder> first","err"); return; }
    const n=IOrganizer.apply(p.path,p.plan);
    pr("organized "+n+" files into "+p.plan.folders.length+" folders","ok");
    pr("undo with: organize --undo","dim"); return;
  }
  if(a[0]==="--undo"){ const n=IOrganizer.undo(); pr(n?"undid "+n+" moves":"nothing to undo", n?"ok":"dim"); return; }
  return _origOrganizeRun(a,s,pr);
};

CMDS.explain={ run(a,s,pr){
  const line=a.join(" ");
  if(!line){ pr("usage: explain <command or pipeline> — e.g. explain tar -czf backup.tar.gz Projects","dim"); return; }
  const base=line.split(/\s*[|;&]\s*/)[0].split(/\s+/)[0];
  const man=MAN[base];
  pr("📘 "+line);
  if(man) pr("   "+man);
  else pr("   not a cyrus-sh builtin — on a real system it depends on what's installed");
  const warns=[];
  if(/\brm\b/.test(line)) warns.push("deletes files (directories need -r; critical paths are policy-blocked)");
  if(/(>|\s)>{0,2}\s*\S+\s*$/.test(line)&&/>/.test(line)) warns.push("writes to a file");
  if(/curl|wget|ping/.test(line)) warns.push("reaches the network");
  if(/git\s+push/.test(line)) warns.push("uploads commits to a remote");
  if(/chmod\s+\+x/.test(line)) warns.push("marks a file executable");
  if(/docker\s+run/.test(line)) warns.push("starts a container");
  if(warns.length) pr("   ⚠️ "+warns.join("; "));
  if(s.inp){ s.inp.value=line; s.inp.focus(); pr("   (in the input line — Enter runs it once you're happy)"); }
}};

const Term = {
  history: [],
  tokenize(s){ const re=/"([^"]*)"|'([^']*)'|(\S+)/g; const out=[]; let m; while((m=re.exec(s))) out.push(m[1]!=null?m[1]:(m[2]!=null?m[2]:m[3])); return out; },
  exec(line, state, print){
    line = (line||"").trim();
    try{
      if(!line) return;
      Term.history.push(line);
      if(Term.history.length>200) Term.history.shift();
      // support "!5" re-run from history
      const bang = line.match(/^!(\d+)$/);
      if(bang){ const idx=parseInt(bang[1])-1; const h=Term.history[idx];
        if(h && h!==line){ print("(re-run: "+h+")","dim"); return Term.exec(h, state, print); }
        return; }
      Sh.run(line, state, print);
    }catch(e){ print("error: "+e.message,"err"); console.error(e); }
  }
};

      st1.textContent=p.replace("/home/rithvik","~")+"  ·  "+ext(p).toUpperCase()+"  ·  "+t.content.split("\n").length+" lines";
    }
    win.openFile=(p)=>{
      const n=VFS.node(p);
      if(!n||n.type!=="file"){ Toast.show("Studio","Not a file: "+p,null,"err"); return; }
      if(!win.st.open.has(p)) win.st.open.set(p,{content:n.content||"",dirty:false});
      focusTab(p);
    };
    win.loadFile=win.openFile; // compat with Files app / workspaces
    code.addEventListener("input",()=>{
      const t=win.st.open.get(win.st.cur); if(!t)return;
      t.content=code.value; t.dirty=true; updateGutter(); renderTabs();
    });
    code.addEventListener("scroll",()=>{ gutter.scrollTop=code.scrollTop; });
    code.addEventListener("keydown",e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); save(); }
      if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); run(); }
      if(e.key==="Tab"){ e.preventDefault(); const s=code.selectionStart; code.value=code.value.slice(0,s)+"  "+code.value.slice(code.selectionEnd); code.selectionStart=code.selectionEnd=s+2; }
    });
    function save(){
      if(!win.st.cur)return; VFS.writeFile(win.st.cur, code.value);
      const t=win.st.open.get(win.st.cur); if(t)t.dirty=false;
      renderTabs(); st1.textContent="saved "+fmtTime(Date.now()); Toast.show("Studio","Saved "+VFS.base(win.st.cur),null,"ok");
    }
    function run(){
      if(!win.st.cur){ Toast.show("Studio","Open a file first",null,"warn"); return; }
      const e0=ext(win.st.cur), src=code.value;
      out.classList.remove("hidden");
      if(e0==="html"||e0==="htm"){ out.innerHTML="<iframe srcdoc=\""+esc(src.replace(/"/g,"&quot;"))+"\"></iframe>"; st1.textContent="preview: live HTML"; return; }
      if(e0==="py"){ const res=PyRun.run(src); out.innerHTML='<span class="ok">(python sandbox)</span>\n'+esc(res); st1.textContent="ran python"; return; }
      if(e0==="js"||e0==="mjs"||e0==="json"){ if(e0==="json"){ try{ JSON.parse(src); out.innerHTML='<span class="ok">valid JSON ✓</span>'; }catch(err){ out.innerHTML='<span class="err">'+esc(err.message)+"</span>"; } st1.textContent="validated json"; return; }
        const logs=[]; const fc={log:(...a)=>logs.push(a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ")),
          error:(...a)=>logs.push("❌ "+a.join(" ")),warn:(...a)=>logs.push("⚠️ "+a.join(" ")),info:(...a)=>logs.push(a.join(" "))};
        try{ new Function("console",src)(fc); out.innerHTML=logs.length?esc(logs.join("\n")):'<span class="ok">ran — no console output</span>'; st1.textContent="ran javascript"; }
        catch(err){ out.innerHTML='<span class="err">'+esc(err.name+": "+err.message)+"</span>"; st1.textContent="error"; }
        return; }
      if(e0==="css"){ out.innerHTML="CSS is live via HTML preview — wrap it in an .html file and Run."; return; }
      if(e0==="md"){ out.innerHTML="<div style='font-family:Segoe UI;font-size:13.5px;white-space:pre-wrap;color:#ddd'>"+esc(src)+"</div>"; st1.textContent="markdown preview (raw)"; return; }
      out.innerHTML="No runner for ."+e0+" — JS, Python, HTML, JSON and MD run here. Ask Copilot to convert your code to one of those.";
    }
    // ---- explorer tree
    function buildTree(){
      tree.innerHTML="";
      const roots=["/home/rithvik/Projects","/home/rithvik/Documents","/home/rithvik/Desktop"];
      const addDir=(p,depth,cont)=>{
        const n=VFS.node(p); if(!n||n.type!=="dir")return;
        const d=el("div","st-dir"); d.innerHTML="📁 "+esc(VFS.base(p)); cont.appendChild(d);
        let open=false, kids=null;
        d.addEventListener("click",()=>{
          open=!open;
          if(open&&!kids){ kids=el("div"); kids.style.paddingLeft="14px"; cont.appendChild(kids);
            Object.values(n.children).sort((a,b)=>(a.type===b.type?a.name.localeCompare(b.name):a.type==="dir"?-1:1)).forEach(c=>{
              const cp=p+"/"+c.name;
              if(c.type==="dir") addDir(cp,depth+1,kids);
              else{ const f=el("div","st-file"); f.innerHTML=ficon(cp)+" "+esc(c.name);
                f.addEventListener("click",()=>{ win.openFile(cp); tree.querySelectorAll(".st-file").forEach(x=>x.classList.remove("on")); f.classList.add("on"); });
                kids.appendChild(f); }
            });
            if(!Object.values(n.children).length) kids.innerHTML='<div class="st-file" style="opacity:.5">(empty)</div>';
          }
          kids&&!open?(kids.style.display="none"):(kids&&(kids.style.display=""));
        });
      };
      roots.forEach(r=>addDir(r,0,tree));
    }
    buildTree();
    // ---- AI copilot
    const aimsgs=q('[data-a="aimsgs"]'), aiin=q('[data-a="aiin"]');
    const aiAdd=(role,text)=>{ const m=el("div","msg "+role); m.textContent=text; aimsgs.appendChild(m); aimsgs.scrollTop=aimsgs.scrollHeight; return m; };
    async function ask(qtext){
      if(!win.st.cur){ aiAdd("ai","Open a file first — then I can see its full content."); return; }
      aiAdd("user",qtext);
      const wait=aiAdd("ai","⏳ reading your file…");
      const sys="You are CYRUS Copilot inside CYRUS Studio, an in-OS code editor. You see the user's current file. Answer with precision: identify real issues, give corrected code in fenced blocks, keep prose tight. If the file is fine, say so. Max ~250 words unless code is needed.";
      const user=qtext+"\n\nFile: "+win.st.cur+"\n```"+ext(win.st.cur)+"\n"+code.value.slice(0,4000)+"\n```";
      const r=await Router.chat([{role:"system",content:sys},{role:"user",content:user}],{taskType:"reasoning",maxTokens:900});
      wait.remove();
      aiAdd("ai", r.ok ? r.text : "Router unreachable ("+((r.errors||[]).join("; ")||"offline")+"). Tip: connect the brain in Settings → CYRUS Brain, or use the local engine via Terminal.");
    }
    q('[data-a="aisend"]').addEventListener("click",()=>{ const v=aiin.value.trim(); if(v){ aiin.value=""; ask(v); } });
    aiin.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=aiin.value.trim(); if(v){ aiin.value=""; ask(v); } } });
    win.body.querySelectorAll(".st-ai-quick .tb-btn").forEach(b=>b.addEventListener("click",()=>ask(b.dataset.q)));
    q('[data-a="aihide"]').addEventListener("click",()=>q('[data-a="aipane"]').classList.add("hid"));
    q('[data-a="aitoggle"]').addEventListener("click",()=>q('[data-a="aipane"]').classList.toggle("hid"));
    q('[data-a="run"]').addEventListener("click",run);
    q('[data-a="save"]').addEventListener("click",save);
    if(path) win.openFile(path);
    win.onReload=()=>{ if(win.st.cur) focusTab(win.st.cur); };
    const re=()=>buildTree(); Bus.on("vfs",re);
  }});
  if(path){ const w=WM.wins.get("editor"); if(w&&w.loadFile) w.loadFile(path); }
}

function openAgents(topic){
  WM.open({id:"agents", title:"AI Agents", icon:"🤖", w:760, h:540, build(win){
    win.render=()=>{
      win.body.innerHTML=`<div class="app"><div class="toolbar"><b style="font-size:12.5px">Agents plan with the AI Router — they execute ONLY whitelisted intents, same policy gate as you.</b></div>
        <div class="ws-grid" data-a="grid" style="grid-template-columns:repeat(auto-fill,minmax(215px,1fr))"></div>
        <div data-a="run" class="hidden" style="flex:1;overflow:auto;padding:16px 18px;border-top:1px solid var(--border);user-select:text"></div></div>`;
      const grid=win.body.querySelector('[data-a="grid"]');
      for(const [id,a] of Object.entries(AGENTS)){
        const c=el("div","ws-card");
        c.innerHTML=`<div class="w-emoji">${a.emoji}</div><b>${esc(a.name)}</b><span>${esc(a.desc)}</span>`;
        c.addEventListener("click",()=>win.run(id));
        grid.appendChild(c);
      }
    };
    win.run=async(agentId, topicText)=>{
      const a=AGENTS[agentId];
      const runBox=win.body.querySelector('[data-a="run"]');
      runBox.classList.remove("hidden");
      const task=(topicText!=null?topicText:topic||"").trim()||a.defaultTopic||"machine learning";
      const log=(html)=>{ runBox.insertAdjacentHTML("beforeend",html); runBox.scrollTop=runBox.scrollHeight; };
      runBox.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span style="font-size:22px">${a.emoji}</span><b style="font-size:15px">${esc(a.name)}</b>
        <span style="color:var(--muted);font-size:12px">task: “${esc(task)}”</span>
        <button class="tb-btn" data-a="back" style="margin-left:auto">← All agents</button></div>`;
      runBox.querySelector('[data-a="back"]').addEventListener("click",()=>win.render());
      log(`<div style="color:var(--muted);font-size:12.5px;margin-bottom:10px">🧠 Planning with the AI Router…</div>`);
      let steps=a.plan(task);
      let planNote="";
      // Ask a free model to refine the plan into ordered intent steps (still schema-checked at execution)
      try{
        const list=Object.entries(SCHEMAS).map(([k,v])=>`- ${k}: ${v.fields.join(", ")||"no fields"}`).join("\n");
        const r=await Router.chat([
          {role:"system",content:`You are the planner for a CYRUS OS agent. Given a task, output ONLY a JSON array (max 4 steps) of objects {"intent":"<allowed intent>","fields":{...}} using ONLY these intents:\n${list}\nNo prose, no fences.`},
          {role:"user",content:`Agent: ${a.name}. Task: ${task}`}
        ],{taskType:"reasoning",temperature:0.1,maxTokens:300});
        if(r.ok){
          const m=r.text.match(/\[[\s\S]*\]/);
          if(m){
            const plan=JSON.parse(m[0]).filter(s=>s && SCHEMAS[s.intent]);
            if(plan.length){ steps=plan; planNote=`plan by ${r.viaLabel}`; }
          }
        }
      }catch(e){ planNote=`local plan (${e.message.slice(0,40)})`; }
      log(`<div style="color:var(--muted);font-size:12px;margin-bottom:12px">Plan: ${steps.length} step(s) · ${esc(planNote||"built-in plan")}</div>`);
      const results=[];
      for(const [i,s] of steps.entries()){
        log(`<div style="font-size:12.5px;color:var(--muted)">▸ Step ${i+1}: <code>${esc(s.intent)}</code> ${esc(JSON.stringify(s.fields).slice(0,70))} — running…</div>`);
        // Agents go through the SAME pipeline: policy gate + confirmation + audit log.
        const r=await handleRequest(`${s.intent}: ${JSON.stringify(s.fields)}`);
        // handleRequest parses text; for agent steps, execute directly but through Policy+Modal:
        results.push({step:s, r});
        log(`<div style="font-size:12.5px;margin:0 0 10px 14px;color:${r.ok&&!r.blocked?"var(--green)":"var(--yellow)"};white-space:pre-wrap">${esc(String(r.message).slice(0,220))}</div>`);
      }
      // synthesis via Router (or local summary)
      let synth=`${a.synth(task)}\n\n${results.map((x,i)=>`${i+1}. ${x.step.intent}: ${String(x.r.message||"").split("\n")[0].slice(0,110)}`).join("\n")}`;
      try{
        const r=await Router.chat([
          {role:"system",content:`You are ${a.name}, a CYRUS OS agent. Using the step results below, write a tight final report (max 150 words, plain text, no headings). End with one recommended next action.`},          {role:"user",content:`Task: ${task}\n\nStep results:\n${results.map((x,i)=>`${i+1}. ${x.step.intent} → ${String(x.r.message||"").slice(0,300)}`).join("\n")}`}
        ],{taskType:"reasoning"});
        if(r.ok){ synth=r.text+`\n\n— synthesized by ${r.viaLabel}`;
          log(`<div style="font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:14px 0 8px;border-top:1px solid var(--border);padding-top:12px">Final report</div>`); }
      }catch(e){ log(`<div style="font-size:11px;color:var(--muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px">Router unavailable for synthesis — showing local summary.</div>`); }
      log(`<div style="font-size:13.5px;line-height:1.7;color:#d5dae6;white-space:pre-wrap">${esc(synth)}</div>`);
      // write report file + notification
      const slug=task.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32)||"report";
      const path=`/home/rithvik/Documents/${a.name.replace(/ /g,"")}-${slug}.md`;
      VFS.writeFile(path, `# ${a.synth(task)}\n\nTask: ${task}\nAgent: ${a.name} (${planNote||"built-in plan"})\nDate: ${new Date().toLocaleString()}\n\n${synth}\n`);
      Notify.add({bucket:"act", title:`${a.name} finished`, sub:`Report saved to ${path.replace("/home/rithvik","~")}`, app:"editor", arg:path, ts:Date.now()/1000});
      Log.record(`agent ${a.name}: ${task}`,"agent_run",{agent:agentId,task},"low",false,true,`${steps.length} steps · report at ${path}`);
    };
    win.render();
    win.onReload=()=>win.render();
    if(topic) setTimeout(()=>win.run(Object.keys(AGENTS)[0], topic),150);
  }});
}
