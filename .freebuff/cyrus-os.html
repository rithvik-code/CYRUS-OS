function initClock(){
  const tick=()=>{
    const now=new Date();
    const b=$("#tb-clock b"), s=$("#tb-clock span"), lt=$("#lock-time"), ld=$("#lock-date");
    if(b) b.textContent=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    if(s) s.textContent=now.toLocaleDateString([], {month:"short",day:"numeric"});
    if(lt) lt.textContent=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    if(ld) ld.textContent=now.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});
  };
  tick(); setInterval(tick,1000);
}

// context menu
function initCtx(){
  document.addEventListener("contextmenu",e=>{
    if(e.target.closest(".win")||e.target.closest("#palette")||e.target.closest("#ndraw"))return;
    e.preventDefault();
    let c=$("#ctx"); if(c)c.remove();
    c=el("div"); c.id="ctx";
    c.innerHTML=`<button data-a="pal">✨ Ask CYRUS… <span style="margin-left:auto"><kbd>Ctrl+Space</kbd></span></button>
      <button data-a="wall">🖼️ Change wallpaper</button>
      <button data-a="files">🗂️ Open Files</button>
      <button data-a="about">💠 About CYRUS OS</button>`;
    document.body.appendChild(c);
    const r=c.getBoundingClientRect();
    c.style.left=Math.min(e.clientX, innerWidth-r.width-8)+"px";
    c.style.top=Math.min(e.clientY, innerHeight-r.height-8)+"px";
    c.addEventListener("click",ev=>{
      const a=ev.target.closest("button")?.dataset.a;
      c.remove();
      if(a==="pal")Palette.show();
      if(a==="wall")Apps.open("settings");
      if(a==="files")Apps.open("files","/home/rithvik");
      if(a==="about")Apps.open("about");
    });
    setTimeout(()=>document.addEventListener("click",()=>c.remove(),{once:true}),0);
  });
}

// keyboard
function initKeys(){
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey && e.code==="Space"){ e.preventDefault(); const lock=$("#lock"); if(lock && !lock.classList.contains("hidden"))return; Palette.toggle(); return; }
    if(e.key==="Escape"){
      if(!$("#startmenu").classList.contains("hidden")) toggleStartMenu(false);
      else if(!$("#palette").classList.contains("hidden")) Palette.hide();
      else if($("#ndraw").classList.contains("open")) toggleDrawer(false);
    }
  });
}

// ------------------------------------------------ boot + login
async function boot(){
  const lines=[
    "CYRUS BIOS v0.4 — initializing hardware handoff",
    "[ ok ] mounted virtual filesystem  (cyrus-vfs on /)",
    "[ ok ] loaded intent engine — 11 whitelisted intents",
    "[ ok ] policy engine: low → run · medium → confirm · high → blocked",
    "[ ok ] audit log attached (cyrus_log.sqlite3 → localStorage)",
    "[ ok ] AI router: Puter (keyless) + your free keys, task-aware lanes",
    "[ .. ] semantic file index",
    "[ ok ] notification filter trained on 3 buckets",
    "[ ok ] workspace restore service",
    "[ ok ] permission sandbox — model has NO shell access",
    "welcome to CYRUS OS",
  ];
  const log=$("#bootLog"), bar=$("#bootBar i");
  let skipped=false;
  $("#boot").addEventListener("click",()=>{ skipped=true; });
  for(let i=0;i<lines.length;i++){
    if(skipped) break;
    log.appendChild(el("div", lines[i].startsWith("[ ok ]")?"ok":"", esc(lines[i])));
    bar.style.width=Math.round(((i+1)/lines.length)*100)+"%";
    await sleep(210);
  }
  bar.style.width="100%";
  await sleep(skipped?50:320);
  $("#boot").remove();
  const lock=$("#lock"); lock.classList.remove("hidden");
  const login=()=>{
    lock.classList.add("fade");
    setTimeout(()=>lock.remove(),380);
    $("#desktop").classList.remove("hidden");
    // welcome briefing (AI daily briefing opens once per day)
    setTimeout(()=>{
      renderNotifs(); toggleDrawer(false);
      Toast.show("Good day, Rithvik 👋","Press Ctrl+Space and just say what you want — “find my java assignments”, “start my college workspace”.",()=>Palette.show());
      setTimeout(()=>{ try{ Briefing.show(); }catch(e){} },1400);
    },300);
  };
  $("#lock-btn").addEventListener("click",login);
  document.addEventListener("keydown",e=>{ if(e.key==="Enter" && document.body.contains(lock) && !lock.classList.contains("fade")) login(); },{once:false});
}

// ------------------------------------------------ init
// Watermelon-style ripple on every button press
function initRipples(){
  document.addEventListener("pointerdown",e=>{
    const b=e.target.closest(".btn,.tb-btn,.dock-item,.sm-app,.achip,.sug");
    if(!b||document.body.classList.contains("no-anim"))return;
    const r=b.getBoundingClientRect();
    const rip=el("span","ripple");
    const d=Math.max(r.width,r.height);
    rip.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
    b.appendChild(rip); setTimeout(()=>rip.remove(),600);
  },{passive:true});
}

  initRipples();
  Store.load();
  Store.bootTs=Date.now();

  if(!VFS.node("/home/rithvik")){ Store.data.vfs=seedFS(); VFS.root=Store.data.vfs; }

  boot();
}
