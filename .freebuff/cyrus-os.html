// ============================================================================
//  OS PHASE 13 — DEVICE PROFILES
//  Named local profiles with separate encrypted vaults.
// ============================================================================
//
//  WHAT THIS IS NOT
//  ----------------
//  This is not multi-user, and nothing in the UI is allowed to imply that it is.
//
//  A real OS account means: an identity the machine trusts, permissions enforced
//  by a kernel, a login service, group policy, an audit trail keyed to a person.
//  A web page cannot supply any of that, and pretending otherwise would repeat
//  exactly the mistake this whole file exists to fix.
//
//  So the honest version: several *device-local profiles*, each with its own
//  vault, settings and audit log, unlocked by a passphrase held only by this
//  browser profile. The word "account" does not appear in the UI. The word
//  "user" does not appear either. SysProbe's "System users / permissions" row
//  stays permanently `unavailable`, because it is.
// ============================================================================

const Vaults = {
  // PBKDF2-SHA256, 210k iterations. `iterations` is stored with the payload so
  // a future bump stays readable instead of silently invalidating old vaults.
  ITER: 210000,
  SALT_BYTES: 16,

  async deriveKey(passphrase, salt, iterations){
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations, hash:"SHA-256"},
      base,
      {name:"AES-GCM", length:256},
      false,
      ["encrypt","decrypt"]
    );
  },
  toB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); },
  fromB64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },

  available(){ return typeof crypto !== "undefined" && !!(crypto.subtle && crypto.getRandomValues); },

  async encrypt(plaintext, passphrase){
    if(!this.available()) throw new Error("WebCrypto is not available in this browser");
    const salt = crypto.getRandomValues(new Uint8Array(this.SALT_BYTES));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await this.deriveKey(passphrase, salt, this.ITER);
    const data = new TextEncoder().encode(plaintext);
    const ct   = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
    return JSON.stringify({ v:1, alg:"AES-GCM", kdf:"PBKDF2-SHA256", iterations:this.ITER,
                            salt:this.toB64(salt), iv:this.toB64(iv), data:this.toB64(ct) });
  },

  async decrypt(blob, passphrase){
    if(!this.available()) throw new Error("WebCrypto is not available in this browser");
    const b = JSON.parse(blob);
    if(!b || b.alg !== "AES-GCM") throw new Error("this vault was written by a different scheme");
    const key = await this.deriveKey(passphrase, this.fromB64(b.salt), b.iterations || this.ITER);
    let plain;
    try{
      plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:this.fromB64(b.iv)}, key, this.fromB64(b.data));
    }catch(e){
      // AES-GCM authentication failed. Almost always a wrong passphrase, and
      // saying so is more useful than "operation failed".
      throw new Error("wrong passphrase, or this vault was damaged");
    }
    return new TextDecoder().decode(plain);
  },
};

// ============================================================================
const Profiles = {
  META:"cyrus_profiles_v1",
  active:null,
  _list:[],

  available(){ try{ return !!localStorage; }catch(e){ return false; } },

  list(){
    try{
      const raw = localStorage.getItem(this.META);
      const parsed = raw ? JSON.parse(raw) : null;
      this._list = (parsed && Array.isArray(parsed.profiles)) ? parsed.profiles : [];
    }catch(e){ this._list = []; }
    return this._list;
  },
  _save(){ try{ localStorage.setItem(this.META, JSON.stringify({profiles:this._list, active:this.active})); }catch(e){} },
  get(name){ return this.list().find(p => p.name === name) || null; },

  async create(name, passphrase){
    name = String(name||"").trim();
    if(!name) throw new Error("a profile needs a name");
    if(this.get(name)) throw new Error("a profile called “" + name + "” already exists");
    if(passphrase && !Vaults.available()) throw new Error("this browser has no WebCrypto, so a passphrase cannot be used");
    const p = { name, created:Date.now(), encrypted:!!passphrase, saltHint:null };
    if(passphrase){
      const enc = await Vaults.encrypt(this._emptyVault(), passphrase);
      localStorage.setItem(this._vaultKey(name), enc);
    }else{
      // Stored in plain sight, and the UI says so rather than implying safety.
      localStorage.setItem(this._vaultKey(name), this._emptyVault());
    }
    this.list().push(p);
    this._save();
    return p;
  },

  _emptyVault(){ return JSON.stringify({ vfs:VFS.node("/") || mkDirNode("/",{}), log:[], settings:Store.data.settings || defaultSettings(), notes:{} }); },
  _vaultKey(name){ return "cyrus_vault_" + encodeURIComponent(name); },

  // Unlock writes the vault into the live Store and returns whether it worked.
  async unlock(name, passphrase){
    const p = this.get(name);
    if(!p) return {ok:false, message:"No such profile."};
    const raw = localStorage.getItem(this._vaultKey(name));
    if(raw == null) return {ok:false, message:"That profile has no vault — it may have been removed from this browser."};
    let text = raw;
    if(p.encrypted){
      if(!passphrase) return {ok:false, message:"This profile is encrypted. Enter its passphrase."};
      try{ text = await Vaults.decrypt(raw, passphrase); }
      catch(e){ return {ok:false, message: e.message || "could not unlock that vault"}; }
    }
    let v;
    try{ v = JSON.parse(text); }catch(e){ return {ok:false, message:"That vault is corrupt."}; }
    Store.data.vfs = v.vfs || (VFS.node("/"));
    Store.data.log = Array.isArray(v.log) ? v.log : [];
    Store.data.settings = Object.assign(defaultSettings(), v.settings || {});
    Store.data.notes = v.notes || {};
    // VFS.root must point at the loaded tree or every later read sees the old one.
    VFS.root = Store.data.vfs;
    Store.save();
    this.active = name; this._save();
    return {ok:true, message:"Unlocked “" + name + "”."};
  },

  async saveActive(passphrase){
    const name = this.active;
    if(!name) return {ok:false, message:"no profile is active"};
    const p = this.get(name);
    const plain = JSON.stringify({vfs:VFS.root, log:Store.data.log, settings:Store.data.settings, notes:Store.data.notes});
    try{
      localStorage.setItem(this._vaultKey(name), p.encrypted ? await Vaults.encrypt(plain, passphrase) : plain);
      return {ok:true, message:"Saved."};
    }catch(e){ return {ok:false, message:e.message||String(e)}; }
  },

  remove(name){
    if(!this.get(name)) return false;
    localStorage.removeItem(this._vaultKey(name));
    this._list = this.list().filter(p => p.name !== name);
    if(this.active === name) this.active = null;
    this._save();
    return true;
  },

  // The sentence that keeps this feature honest, shown wherever profiles appear.
  blurb(){
    return "Device profiles. Each has its own files, settings and history, unlocked on this " +
           "browser only. There is no account, no identity and no permission system — CYRUS " +
           "cannot tell who you are, and a profile protects data at rest, not from you.";
  },
};

Cyrus.onReady(()=>{

  if(list.length > 1){
    const hint = document.querySelector("#lock-hint");
    if(hint) hint.textContent = "Pick a profile to continue";

    strip.innerHTML = list.map(p=>
      `<button class="cyr-lock-p" data-n="${esc(p.name)}">${esc(p.name)}${p.encrypted? " 🔒":""}</button>`).join("");
    card.insertBefore(strip, document.querySelector("#lock-btn"));

// ============================================================================
//  OS PHASE 14 — OFFLINE
//  A brain that works with the cable pulled, and an honest reason when it can't.
// ============================================================================
//
//  THE CONSTRAINT THAT DECIDES THIS FILE
//  -------------------------------------
//  Service workers do not register on `file://`. Neither does the install
//  prompt, and OPFS is unreliable there. CYRUS is a single HTML file that most
//  people open by double-clicking, so "add a service worker" is not a feature —
//  it is a decision about which origins get it.
//
//  It gets them where it can work. `node .freebuff/serve.js 8791` serves the
//  same file over http://localhost, which is a secure context, and everything
//  below switches on there. On `file://` nothing is registered, nothing breaks,
//  and the Offline app explains precisely why.
//
//  THE OLLAMA PROBLEM
//  ------------------
//  With the page on http://localhost:8791 and Ollama on http://localhost:11434,
//  the browser treats that as cross-origin. Ollama answers a preflight, refuses
//  it, and `fetch` rejects with an opaque TypeError that is indistinguishable
//  from "Ollama is not running".
//
//  Both states look identical to JavaScript. The only way to tell them apart is
//  to probe the endpoint from a context that is *not* subject to CORS, and the
//  answer is: you cannot, from the page. So this file does the next best thing —
//  it names both causes, says which fix applies to each, and never claims to
//  know which one it was.
// ============================================================================

const Offline = {
  // Served from the site root by serve.js, because a service worker's default
  // scope is its own directory and the page that registers it lives at "/".
  swUrl:"/sw.js",
  manifestUrl:"/manifest.webmanifest",
  reg:null,
  installed:false,
  reason:"",
  // Cross-origin needs a server. file:// gets neither of these.
  canRegister(){
    return typeof navigator!=="undefined" && "serviceWorker" in navigator &&
           /^https?:$/.test(location.protocol);
  },

  async register(){
    if(!this.canRegister()){
      this.reason = location.protocol === "file:"
        ? "This page is open as file://, where browsers do not allow service workers."
        : "This browser does not support service workers.";
      return {ok:false, reason:this.reason};
    }
    // The manifest is injected from JS rather than sitting in <head>, because
    // the build restores the HTML from HEAD — a hand-edited <link> would be
    // erased on the next `node .freebuff/rebuild.js`. On file:// the href is
    // null so no pointless request is made.
    if(!document.querySelector('link[rel="manifest"]')){
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = this.canRegister() ? this.manifestUrl : "";
      if(link.href) document.head.appendChild(link);
    }
    try{
      this.reg = await navigator.serviceWorker.register(this.swUrl, {scope:"./"});

      // On a FIRST visit there is nothing active yet: the worker is still
      // installing and reg.active is null. Reading the state only once left
      // the panel saying "Registering…" forever even though the worker came
      // active a moment later, so activation is tracked as it happens.
      this.installed = !!this.reg.active;
      this._watch(this.reg.active);
      this._watch(this.reg.installing);
      this._watch(this.reg.waiting);

      // A stale worker from an earlier visit serves an older CYRUS. Say so
      // rather than letting the user debug phantom behaviour.
      this.reg.addEventListener("updatefound", ()=>{
        const w = this.reg.installing;
        if(!w) return;
        w.addEventListener("statechange", ()=>{
          if(w.state === "installed" && navigator.serviceWorker.controller){
            Toast.show("Offline","A new version of CYRUS is ready. Close every CYRUS tab to switch over.",null,"warn");
          }
        });
      });

      return {ok:true, state:this.reg.active ? "active" : (this.reg.installing ? "installing" : "waiting")};
    }catch(e){
      this.reason = e.message || String(e);
      return {ok:false, reason:this.reason};
    }
  },

  // Follow a worker's lifecycle and reflect it in the panel. A worker that
  // reaches "activated" means offline really is available from now on.
  _watch(worker){
    if(!worker || worker.__cyrusWatched) return;
    worker.__cyrusWatched = true;
    worker.addEventListener("statechange", ()=>{
      if(worker.state === "activated"){
        this.installed = true;
        this.reason = "";
      }else if(worker.state === "redundant"){
        this.installed = false;
      }
      Bus.emit("cyrus:offline");   // the Offline window repaints on this
    });
  },

  // What "offline" actually means here, stated by what is cached and what is not.
  coverage(){
    return [
      { what:"The CYRUS shell (this HTML file)", when:"cached after the first load", ok:this.installed },
      { what:"Your files, settings and audit log", when:"always local — never needs a network", ok:true },
      { what:"Local model (Ollama)", when:"works offline, if the endpoint allows this origin", ok:null },
      { what:"Puter, Groq, Gemini, OpenRouter, Pollinations", when:"cloud — these need a network and will say so", ok:false },
      { what:"Web search", when:"needs a network", ok:false },
    ];
  },
};

// ============================================================================
//  Ollama CORS diagnosis
// ============================================================================
//  Replaces the old probe's single red "no answer from that endpoint".
const OllamaDiag = {
  // Ollama has to opt in to a browser origin with OLLAMA_ORIGINS. Without it
  // the reply is a preflight failure that fetch() reports as a bare TypeError.
  corsHint(){
    const origin = location.origin === "null" ? "(file:// — no origin, always refused)" : location.origin;
    return origin;
  },
  fix(){
    return process_free_text(
      "Ollama is on port 11434 and your page is on " + this.corsHint() +
      ". These are different origins, so the browser sends a preflight and Ollama" +
      " refuses it unless you name the page explicitly.\n\n" +
      "  # in the shell Ollama is running in, before starting it:\n" +
      "  export OLLAMA_ORIGINS='" + this.corsHint() + "'\n" +
      "  ollama serve\n\n" +
      "On Windows PowerShell:\n" +
      "  $env:OLLAMA_ORIGINS='" + this.corsHint() + "'; ollama serve\n\n" +
      "Or set it to '*' if this machine is yours alone — that lets any page" +
      " reach your model, which is a real trade-off and not a recommendation."
    );
  },

  // A single request cannot separate "not running" from "refused". So try the
  // endpoint three ways and report what is actually distinguishable.
  async diagnose(endpoint){
    const url = String(endpoint||"").replace(/\/v1\/chat\/completions\/?$/,"");
    if(!url) return {state:"no-endpoint", text:"No endpoint set. Settings → CYRUS Brain → Ollama."};

    // 1. A plain no-cors probe: opaque either way, but a *network-level*
    //    failure (nothing listening) rejects, while a server that answers with
    //    a CORS error resolves opaquely. That difference is real and usable.
    let reachable = null;
    try{ await fetch(url + "/api/tags", {mode:"no-cors", cache:"no-store"}); reachable = true; }
    catch(e){ reachable = false; }

    if(!reachable){
      return {
        state:"unreachable",
        text:"Nothing answered at " + url + ".\n\n" +
             "  · Is Ollama running?  `ollama serve`, then `ollama pull qwen2.5:3b`\n" +
             "  · Is it on another port? Check with `ollama list` or the terminal's `netstat`\n" +
             "  · Did you mean your cloud providers? The AI Router tries those first anyway."
      };
    }

    // 2. Something is listening. Now the only likely cause left is the origin.
    let cors = false, body = null;
    try{
      const r = await fetch(url + "/api/tags", {cache:"no-store"});
      cors = true;
      try{ body = await r.json(); }catch(e){}
    }catch(e){ cors = false; }

// ---- dynamic suggestion engine: replaces static template chips. As the user types,
// local pattern suggestions appear instantly, then the model refines them (debounced).
const Suggest={
  token:0,
  row(rowEl, items, onPick){
    rowEl.innerHTML="";
    if(!items || !items.length){ rowEl.style.display="none"; return; }
    rowEl.style.display="flex";
    items.slice(0,4).forEach(s=>{
      const b=el("button","achip",esc(String(s)));
      b.addEventListener("click",()=>onPick(String(s)));
      rowEl.appendChild(b);
    });
  },
  wire(inputEl, rowEl, {local, model, onPick}){
    let t=null;
    const run=()=>{
      const v=inputEl.value.trim();
      if(!v){ this.token++; clearTimeout(t); this.row(rowEl,[],onPick); return; }
      this.row(rowEl, local(v), onPick);
      if(!model) return;
      const my=++this.token;
      clearTimeout(t);
      t=setTimeout(async()=>{
        try{
          const items=await model(v);
          if(my!==this.token || inputEl.value.trim()!==v || !items) return;
          this.row(rowEl, items, onPick);
        }catch(e){}
      },800);
    };
    inputEl.addEventListener("input",run);
  }
};

  const lo=t.toLowerCase().trim(); const out=[];
  const cleaned=t.trim().replace(/\?+$/,"");
  const bare=cleaned.replace(/^(what|who|why|how|when|where)\s+(is|are|do|does|did|to)\s+/i,"").trim()||cleaned;
  if(/^rem/i.test(lo)) out.push(cleaned.replace(/^(please\s+)?rem(ember)?( that)?\s*/i,"remember that ")||"remember that ...");
  if(/^what|^who/i.test(lo)){ out.push(cleaned+" — explained simply","why does "+bare+" matter?"); }
  if(/^why/i.test(lo)){ out.push("why "+bare+"? the real reason","explain "+bare+" like I'm 12"); }
  if(/^how/i.test(lo)){ out.push(cleaned+"? step by step","explain "+bare+" like I'm 12"); }
  if(/\b(code|bug|error|python|java|javascript|js|debug)\b/i.test(lo)) out.push("debug this: "+bare);
  if(/\b(plan|study|exam|deadline)\b/i.test(lo)) out.push("help me plan: "+bare);
  try{
    const words=lo.split(/\s+/).filter(w=>w.length>3);
    const f=VFS.allFiles().find(f=>words.some(w=>f.node.name.toLowerCase().includes(w)));
    if(f) out.push("find my "+f.node.name);
    const c=Object.keys(MAN).find(k=>words.includes(k));
    if(c) out.push("explain "+c);
  }catch(e){}
  if(!out.length) out.push("tell me more about "+bare);
  return [...new Set(out)].slice(0,4);
}
async function chatModelSugs(v){
  const r=await Router.chat([
    {role:"system",content:"You suggest follow-up chat questions. The user is mid-typing to CYRUS, a friendly AI chatbot. Reply ONLY a JSON array of exactly 4 short questions they'd likely ask next — each under 60 chars, plain text, no numbering, closely related to their input."},
    {role:"user",content:"Partial input: "+v}
  ],{taskType:"fast",temperature:.8,maxTokens:160});
  if(!r.ok) return null;
  const m=r.text.match(/\[[\s\S]*\]/); if(!m) return null;
  try{ const a=JSON.parse(m[0]); return Array.isArray(a)?a.filter(x=>typeof x==="string"&&x.trim()).slice(0,4):null; }catch(e){ return null; }
}
function assistLocalSugs(t){
  const lo=t.toLowerCase().trim(); const out=[];
  const rest=t.trim().replace(/^(please\s+)?(can you\s+)?/i,"");
  if(/^(find|search|where)/i.test(lo)){ out.push("find my java assignments","find files I changed this week","search for "+rest.replace(/^(find|search( for)?|where( is)?)\s*/i,"")+" in Documents"); }
  if(/^(start|open|launch)/i.test(lo)){ out.push("start my college workspace",rest); }
  if(/^what/i.test(lo)){ out.push("what's using my disk space?","what did I work on yesterday?"); }
  if(/^(clean|organi)/i.test(lo)){ out.push("clean up my desktop","organize my Downloads"); }
  if(/^(move|copy)/i.test(lo)) out.push("move project.zip to Downloads");
  if(/^(create|make|new)/i.test(lo)) out.push("create a python project for predicting house prices");
  if(/^show/i.test(lo)) out.push("show me the presentation about AI last month");
  if(!out.length) out.push(rest,"find files about "+rest.split(/\s+/).slice(0,2).join(" "));
  return [...new Set(out.filter(x=>x&&x.trim()))].slice(0,4);
}

}

// ------------------------------------------------ Talk to CYRUS: mic dictation + spoken replies
const Voice = {
  rec:null, listening:false, onTranscript:null, onceHint:false,
  supported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); },
  toggle(onDone){
    if(this.listening){ try{ this.rec.stop(); }catch(e){} return; }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ Toast.show("Voice","This browser has no speech recognition — try Chrome or Edge."); return; }
    if(!this.rec || this.rec._renew){
      const r=new SR(); r.lang="en-US"; r.interimResults=true; r.continuous=false;
      r.onresult=e=>{ let fin="",inter="";
        for(let i=0;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t; else inter+=t; }
        if(this.onTranscript) this.onTranscript(fin||inter, !fin);
      };
      r.onend=()=>{ this.listening=false; document.body.classList.remove("voice-on");
        const b=document.querySelector('[data-a="mic"]'); if(b) b.classList.remove("rec"); };
      r.onerror=e=>{ this.listening=false; document.body.classList.remove("voice-on");
        const b=document.querySelector('[data-a="mic"]'); if(b) b.classList.remove("rec");
        Toast.show("Voice", e.error==="not-allowed" ? "Mic permission denied — allow the microphone to talk to CYRUS." : "Voice error: "+e.error); };
      this.rec=r; this.rec._renew=true;
    }
    try{ this.onTranscript=onDone||this.onTranscript; this.rec.start(); this.listening=true;
      document.body.classList.add("voice-on");
      const b=document.querySelector('[data-a="mic"]'); if(b) b.classList.add("rec");
    }catch(e){ this.listening=false; }
  },
  stop(){ if(this.listening){ try{ this.rec.stop(); }catch(e){} } },
  async speak(text){
    try{
      await Router.puterReady();
      const clean=String(text).replace(/[```#*_>|]/g,"").trim();
      const chunks=clean.match(/[\s\S]{1,420}(?:\s|$)/g)||[];
      for(const c of chunks){ if(!c.trim())continue;
        const a=await Router.txt2speech(c.trim()); a.play();
        await new Promise(res=>{ a.onended=res; setTimeout(res,12000); }); }
    }catch(e){ if(!this.onceHint){ this.onceHint=true;
      Toast.show("Voice","Spoken replies need the Puter brain — connect it in Settings → CYRUS Brain (one-time free sign-in).",()=>Apps.open("settings")); } }
  }
};

// --- CYRUS Video: text → scenes → images → narration → player (CYRUS-branded; keyless engines)
const CyrusVideo={
  // 1) script: model splits the topic into 3-5 scenes with image prompts + narration
  async script(topic, scenes){
    const r=await Router.chat([
      {role:"system",content:`You are CYRUS Video's director. Split the topic into EXACTLY ${scenes} scenes. Reply ONLY minified JSON: {"title":"<video title>","scenes":[{"img":"<detailed visual prompt, photographic, no text in image>","say":"<2 sentences of narration, warm and clear>"}]}`},
      {role:"user",content:"Topic: "+topic}
    ],{taskType:"general",temperature:.7,maxTokens:900});
    if(!r.ok) throw new Error((r.errors||["router offline"]).join("; ").slice(0,120));
    const m=r.text.match(/\{[\s\S]*\}/); if(!m) throw new Error("model did not return a storyboard");
    const j=JSON.parse(m[0]);
    if(!Array.isArray(j.scenes)||!j.scenes.length) throw new Error("empty storyboard");
    return {title:String(j.title||topic).slice(0,60), scenes:j.scenes.slice(0,6).map(s=>({img:String(s.img||topic), say:String(s.say||"").slice(0,420)}))};
  },
  // 2) stills via the keyless CYRUS image engine (Pollinations) — retries once on failure
  loadImage(prompt){
    const attempt=()=>new Promise((res,rej)=>{ const im=new Image();
      im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>rej(new Error("image engine failed"));
      im.src=Router.imgUrl(prompt,1280,720); setTimeout(()=>rej(new Error("image engine timeout")),75000); });
    return attempt().catch(()=>new Promise(r=>setTimeout(r,3500)).then(attempt));
  },
  // 3) render play: timed slideshow synced to narration (TTS per scene via Puter)
  async play(win, board, stage){
    const Say=Router.txt2speech.bind(Router);
    for(let i=0;i<board.scenes.length;i++){
      const sc=board.scenes[i];
      stage.querySelectorAll(".cv-cap").forEach(x=>x.classList.remove("on"));
      const cap=stage.querySelector(`[data-i="${i}"]`); if(cap) cap.classList.add("on");
      const say=`Scene ${i+1} of ${board.scenes.length}. ${sc.say}`;
      try{ const a=await Say(say); a.play();
        await new Promise(res=>{ a.onended=res; setTimeout(res, 9000); });
      }catch(e){ await new Promise(res=>setTimeout(res, 4500)); }
    }
  }
};

        stage.innerHTML=`<div style="font-size:15px;font-weight:700">🎬 ${esc(board.title)}</div>

        const cards=board.scenes.map((sc,i)=>{
          const card=el("div"); card.style.cssText="border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel2)";
          card.innerHTML=`<div style="aspect-ratio:16/9;background:#0a0512;display:grid;place-items:center;color:var(--muted);font-size:12px">scene ${i+1} — painting…</div>

          strip.appendChild(card); return card;
        });
        // paint sequentially with stagger — parallel bursts trip the free engine's fair-use
        (async()=>{ for(let i=0;i<board.scenes.length;i++){
          const card=cards[i];
          try{ const im=await CyrusVideo.loadImage(board.scenes[i].img);
            const holder=card.firstChild; holder.innerHTML=""; holder.style.display="grid"; holder.style.placeItems="center";
            im.style.cssText="width:100%;height:100%;object-fit:cover"; holder.appendChild(im);

                .catch(()=>{ holder.innerHTML=`scene ${i+1} — engine busy `; holder.appendChild(rb); }); });
            holder.appendChild(rb);
          }
          await new Promise(r=>setTimeout(r,3500));
        } })();
        stage.querySelector('[data-a="play"]').addEventListener("click",async ev=>{
          ev.target.disabled=true; ev.target.textContent="▶️ playing…";
          await CyrusVideo.play(win,board,stage);

      go.disabled=false; go.textContent="🎬 Make it";
    });
  }});
}});

    }));

      s.wallpaper=b.dataset.w; Store.save(); applyWallpaper();
      wallW.querySelectorAll("button").forEach(x=>x.classList.toggle("primary",x===b));
    }));

    const brainStatus=win.body.querySelector('[data-a="brain-status"]');
    const brainMsg=()=>{
      const cloud=Router.order("reasoning").filter(id=>id!=="local");
      brainStatus.innerHTML = s.privacy==="local"
        ? "⚠️ Privacy is <b>Local only</b> — the brain lane is bypassed and CYRUS answers with local rules. Switch AI Privacy Mode above to <b>Cloud ok</b> to think with the big models."
        : `Thinking with: <b>${cloud.map(id=>(PROVIDERS[id]||{}).label||id).join(" → ")}</b>. First choice: <b>${Router.pickModel(cloud[0]||"puter")}</b>.`;

      if(!v){ st.textContent="Paste a key first — platform.openai.com/api-keys."; return; }

      try{
        const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
          headers:{"Authorization":"Bearer "+v,"Content-Type":"application/json"},
          body:JSON.stringify({model:"gpt-4o-mini",messages:[{role:"user",content:"Reply with exactly: KEY-OK"}],max_tokens:5})});

    const themesWrap=win.body.querySelector('[data-a="themes"]');

      themesWrap.innerHTML = all.length ? "" : `<span style="font-size:12px;color:var(--muted)">No generated themes yet — describe a vibe above.</span>`;

        const chip=el("button","tb-btn");
        chip.innerHTML=`<span style="display:inline-flex;gap:3px;margin-right:7px;vertical-align:-2px">${(t.orbs||[]).map(c=>`<span style="width:10px;height:10px;border-radius:50%;background:${esc(c)};display:inline-block"></span>`).join("")}</span>${esc(t.name)}`;
        if(s.wallpaper==="gen:"+t.name) chip.classList.add("primary");
        chip.title=(t.reason||t.vibe||"")+" — right-click to delete";
        chip.addEventListener("click",()=>{ s.wallpaper="gen:"+t.name; Store.save(); applyWallpaper(); renderThemes(); });
        chip.addEventListener("contextmenu",e=>{ e.preventDefault(); Themes.remove(t.name); if(s.wallpaper==="gen:"+t.name){s.wallpaper="default";Store.save();} applyWallpaper(); renderThemes(); });
        themesWrap.appendChild(chip);

    win.body.querySelector('[data-a="did-save"]').addEventListener("click",()=>{

    win.body.querySelector('[data-a="ptoken-save"]').addEventListener("click",async()=>{
      const st=win.body.querySelector('[data-a="ptoken-status"]');

      if(!v){ st.textContent="Paste a token first (see instructions below)."; return; }
      Router.keys().puterToken=v; Store.save(); st.textContent="Testing…";
      try{
        if(typeof window.puter==="undefined") await Router.loadPuter();
        try{ window.puter.setAuthToken(v); }catch(e){}
        const resp=await Promise.race([
          window.puter.ai.chat("Reply with exactly: TOKEN-OK",{model:"gpt-4o-mini"}),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error("test timeout")),20000))
        ]);
        const txt=typeof resp==="string"?resp:(resp?.message?.content??resp?.text??"");
        st.innerHTML = /TOKEN-OK/.test(String(txt)) ? "✅ <b>Brain connected</b> — Claude Sonnet 4 / GPT-4o lane is live. Tokens are stored only in this browser." : `⚠️ Got a reply but unexpected: <code>${esc(String(txt).slice(0,60))}</code>`;
      }catch(e){ st.innerHTML="❌ "+esc(String(e.message||e).slice(0,120))+" — the token may be expired; grab a fresh one."; }
    });
    win.body.querySelector('[data-a="brain-unlock"]').addEventListener("click",async()=>{
      s.privacy="cloud"; s.brainLane="astra"; Store.save(); updatePrivBadge(); privWrap.querySelectorAll(".radio-row").forEach(x=>x.classList.toggle("on",x.dataset.v==="cloud"));
      brainMsg();
      Toast.show("CYRUS Brain","Full IQ unlocked — thinking with the strongest free cloud models.",null,"ok");
      const pr=await Router.probe("puter");
      if(brainStatus.isConnected) brainStatus.innerHTML+=`<div style="margin-top:4px">Puter reachability: ${pr?"✅ live — Claude Sonnet 4 / GPT-4o ready":"⏳ will load on first question (needs network)"}</div>`;
    });
    const animBtn=win.body.querySelector('[data-a="anim"]');
    const setAnim=()=>{ animBtn.textContent=s.anims?"On":"Off"; document.body.classList.toggle("no-anim",!s.anims); };
    animBtn.addEventListener("click",()=>{ s.anims=!s.anims; Store.save(); setAnim(); }); setAnim();
    // ---- providers UI
    const provsWrap=win.body.querySelector('[data-a="provs"]');
    function renderProvs(){
      provsWrap.innerHTML="";
      for(const [id,p] of Object.entries(PROVIDERS)){
        const on=Router.enabled(id);
        const row=el("div","set-row");
        row.style.cssText="display:block;border-bottom:1px solid rgba(42,48,64,.5);padding:12px 0";
        const models=p.models.map(m=>`<option value="${esc(m.id)}" ${Router.pickModel(id)===m.id?"selected":""}>${esc(m.name)}</option>`).join("");
        row.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:17px">${p.icon}</span><b style="font-size:13.5px">${esc(p.label)}</b>
          <span style="font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid ${on?"rgba(52,211,153,.4)":"var(--border2)"};color:${on?"var(--green)":"var(--muted)"}">${on?"enabled":"off"}</span>
          <label style="margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer">
            <input type="checkbox" data-a="en" ${id==="local"?"checked disabled":on?"checked":""}> enable</label></div>
        <div style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5">${esc(p.desc)}</div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
          ${p.keyless?"":`<input class="sw" data-a="key" type="password" placeholder="API key" value="${esc(Router.keys()[id]||"")}" style="width:210px">`}
          ${id==="ollama"?`<input class="sw" data-a="endpoint" placeholder="http://localhost:11434" value="${esc(Router.endpoints().ollama||"")}" style="width:210px">`:""}
          <select class="sw" data-a="model" style="width:210px">${models}</select>
        </div>`;
        row.querySelector('[data-a="en"]').addEventListener("change",e=>{
          if(id==="local")return;
          if(id==="puter"){ s.usePuter=e.target.checked; }
          else if(id==="ollama"){ if(e.target.checked && !Router.endpoints().ollama) Router.endpoints().ollama="http://localhost:11434"; }
          Store.save(); renderProvs();
        });
        const keyIn=row.querySelector('[data-a="key"]');
        if(keyIn){
          keyIn.addEventListener("change",()=>{ Router.keys()[id]=keyIn.value.trim(); Store.save(); renderProvs(); });
        }
        const epIn=row.querySelector('[data-a="endpoint"]');
        if(epIn){ epIn.addEventListener("change",()=>{ Router.endpoints().ollama=epIn.value.trim()||"http://localhost:11434"; Store.save(); }); }
        const modelSel=row.querySelector('[data-a="model"]');
        if(modelSel){ modelSel.addEventListener("change",()=>{ if(!s.routeModel)s.routeModel={}; s.routeModel[id]=modelSel.value; Store.save(); }); }
        provsWrap.appendChild(row);
      }
    }
    renderProvs();
    win.body.querySelector('[data-a="probe"]').addEventListener("click",async()=>{
      const st=win.body.querySelector('[data-a="probestatus"]');
      st.textContent="testing…";
      const ids=Object.keys(PROVIDERS).filter(id=>Router.enabled(id));
      const out=[];
      for(const id of ids){ const ok=await Router.probe(id); out.push(`${PROVIDERS[id].icon} ${id}: ${ok?"reachable":"unreachable"}`); }
      st.textContent=out.join("  ·  ");
    });
    win.body.querySelector('[data-a="stratsave"]').addEventListener("click",()=>{
      s.routeStrategy=win.body.querySelector('[data-a="strat"]').value||null; Store.save();
      Toast.show("Routing","Strategy saved.",null,"ok");
    });
    win.body.querySelector('[data-a="reset"]').addEventListener("click",async()=>{
      if(await Modal.confirm({title:"Reset CYRUS OS?",body:"Virtual filesystem, audit log and settings will be wiped.\nThis cannot be undone.",confirmText:"Reset",danger:true})) Store.reset();
    });
    win.onReload=()=>{};
  }});
}});

const Router = {
  // ---- configuration accessors
  cfg(){ return Store.data.settings; },
  keys(){ if(!this.cfg().apiKeys) this.cfg().apiKeys={}; return this.cfg().apiKeys; },
  endpoints(){ if(!this.cfg().endpoints) this.cfg().endpoints={}; return this.cfg().endpoints; },
  enabled(id){
    const c=this.cfg();
    if(id==="local") return true;                       // always on
    if(id==="puter") return c.usePuter!==false;         // default on
    if(id==="pollinations") return true;                // keyless community API — always on
    const hasKey = !!(this.keys()[id]||"").trim();
    if(id==="ollama") return hasKey || !!(this.endpoints().ollama||"").trim();
    return hasKey;
  },
  order(taskType){
    const c=this.cfg();
    if(c.brainLane==="fast") taskType=taskType==="reasoning"?"fast":taskType; // fast lane: small models even for reasoning
    // user-managed chain always first if present
    let chain=(c.routeChain&&c.routeChain.length)?c.routeChain.slice():[];
    // sensible defaults per task type
    if(!chain.length){
      if(taskType==="reasoning") chain=["puter","pollinations","openrouter","gemini","groq"];
      else if(taskType==="fast") chain=["pollinations","groq","puter","gemini","openrouter"];
      else if(taskType==="vision") chain=["gemini","openrouter","puter"];
      else chain=["pollinations","groq","openrouter","gemini","puter"];
    }
    // ChatGPT add-on: a pasted OpenAI key always jumps the queue
    if(this.enabled("openai")) chain.unshift("openai");
    // privacy gates
    const p=c.privacy;
    if(p==="local") return ["local"];
    chain=chain.filter(id=>{
      if(!PROVIDERS[id]) return false;
      if(id==="ollama") return true;                    // local machine, always allowed
      if(p==="ask"||p==="cloud"||p==="max") return true;
      return false;
    });
    // drop disabled providers (no key etc.)
    chain=chain.filter(id=>this.enabled(id));
    chain.push("local");
    // dedupe, keep order
    return [...new Set(chain)];
  },

  // ---- availability probe (cheap GET, 1 try)
  async probe(id){
    try{
      if(id==="groq"){ const r=await fetch("https://api.groq.com/openai/v1/models",{headers:this.auth(id)}); return r.ok; }
      if(id==="gemini"){ const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(this.keys().gemini||"")}&pageSize=1`); return r.ok; }
      if(id==="openrouter"){ const r=await fetch("https://openrouter.ai/api/v1/models"); return r.ok; } // unauth endpoint; just reachability
      if(id==="ollama"){ const base=(this.endpoints().ollama||"http://localhost:11434").replace(/\/v1\/chat\/completions\/?$/,""); const r=await fetch(base+"/api/tags"); return r.ok; }
      if(id==="puter"){ return typeof window.puter!=="undefined" || !!this.cfg().usePuter; }
      if(id==="local") return true;
    }catch(e){ return false; }
    return false;
  },
  auth(id){ return { "Authorization":"Bearer "+(this.keys()[id]||""), "Content-Type":"application/json" }; },

  // ---- core call: tries providers in order, returns {text, via, errors}
  async chat(messages, {taskType="general", temperature=0.2, maxTokens=700}={}){
    const order=this.order(taskType);
    const errors=[];
    const fmtErr=e=> e instanceof Error ? e.message : (typeof e==="string"?e:JSON.stringify(e).slice(0,160));
    // Hard per-provider timeout so one hanging SDK can never stall the whole chain.
    const withTimeout=(pr, ms)=>Promise.race([
      pr,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error(ms/1000+"s timeout")), ms))
    ]);
    for(const id of order){
      try{
        const text=await withTimeout(this.call(id, messages, {temperature, maxTokens}), 45000);
        if(text && text.trim()) return {ok:true, text:text.trim(), via:id, viaLabel:(PROVIDERS[id]?PROVIDERS[id].label:id), errors};
      }catch(e){ errors.push(`${id}: ${fmtErr(e)}`); }
    }
    return {ok:false, text:"", via:"local", errors};
  },

  async call(id, messages, {temperature=0.2, maxTokens=700}={}){
    const c=this.cfg();
    if(id==="local") throw new Error("local has no chat model — caller falls back to rules");
    if(id==="puter") return await this.callPuter(messages, {temperature, maxTokens});
    if(id==="ollama"){
      const base=(this.endpoints().ollama||"http://localhost:11434/v1/chat/completions");
      const url=base.endsWith("/v1/chat/completions")?base:(base.replace(/\/$/,"")+"/v1/chat/completions");
      return await this.callOpenAI(url, messages, {temperature, maxTokens, headers:{ "Content-Type":"application/json" }, model:c.llmModel||PROVIDERS.ollama.models[0].id});
    }
    if(id==="groq") return await this.callOpenAI("https://api.groq.com/openai/v1/chat/completions", messages, {temperature, maxTokens, headers:this.auth(id)});
    if(id==="openai") return await this.callOpenAI("https://api.openai.com/v1/chat/completions", messages, {temperature, maxTokens, headers:this.auth(id), model:this.pickModel("openai")});
    if(id==="pollinations") return await this.callOpenAI("https://text.pollinations.ai/openai", messages, {temperature, maxTokens, headers:{"Content-Type":"application/json"}, model:this.pickModel("pollinations")});
    if(id==="openrouter") return await this.callOpenAI("https://openrouter.ai/api/v1/chat/completions", messages, {temperature, maxTokens, headers:{...this.auth(id), "X-Title":"CYRUS OS"}});
    if(id==="gemini") return await this.callGemini(messages, {temperature, maxTokens});
    throw new Error("unknown provider "+id);
  },

  async callOpenAI(url, messages, {temperature, maxTokens, headers, model}){
    const c=this.cfg();
    const dft = /api\.openai\.com/.test(url) ? (c.routeModel?.openai||"gpt-4o-mini") : (c.routeModel?.[c.routeChain?.[0]] || "llama-3.1-8b-instant");
    const body={ model: model||dft, messages, temperature, max_tokens:maxTokens };
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), 30000);
    try{
      const r=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),signal:ctl.signal});
      if(!r.ok){ const t2=await r.text(); throw new Error(`HTTP ${r.status} ${t2.slice(0,120)}`); }
      const j=await r.json();
      const txt=j.choices?.[0]?.message?.content;
      if(!txt) throw new Error("empty response");
      return txt;
    } finally{ clearTimeout(t); }
  },

  async callGemini(messages, {temperature, maxTokens}){
    const key=this.keys().gemini||"";
    const model=this.pickModel("gemini");
    const sys=messages.filter(m=>m.role==="system").map(m=>m.content).join("\n");
    const contents=messages.filter(m=>m.role!=="system").map(m=>({role:m.role==="assistant"?"model":"user", parts:[{text:m.content}]}));
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ contents, systemInstruction:sys?{parts:[{text:sys}]}:undefined,
        generationConfig:{temperature, maxOutputTokens:maxTokens} })
    });
    if(!r.ok){ const t=await r.text(); throw new Error(`HTTP ${r.status} ${t.slice(0,120)}`); }
    const j=await r.json();
    const txt=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join("");
    if(!txt) throw new Error("empty response");
    return txt;
  },

  // try a model once; normalize errors
  async _puterOnce(prompt, model){
    let resp;
    try{ resp=await Promise.race([
      window.puter.ai.chat(prompt, {model}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("puter timeout")),40000)) ]); }
    catch(e){
      const msg = e instanceof Error ? e.message : (typeof e==="string"?e:JSON.stringify(e));
      if(/auth|sign|login/i.test(msg)) throw new Error("Puter needs a one-time sign-in (popup was blocked in this embedded view — open CYRUS OS in its own browser tab)");
      throw new Error(msg);
    }
    const txt=typeof resp==="string"?resp:(resp?.message?.content ?? resp?.text ?? resp?.toString?.());
    if(!txt||typeof txt!=="string"||!txt.trim()) throw new Error("empty response");
    return txt;
  },
  async callPuter(messages, {temperature, maxTokens}){
    if(typeof window.puter==="undefined") await this.loadPuter();
    // manual connect: use a pasted Puter auth token (works where popups are blocked)
    const tok=(this.keys().puterToken||"").trim();
    if(tok && typeof window.puter.setAuthToken==="function"){ try{ window.puter.setAuthToken(tok); }catch(e){} }
    const model=this.pickModel("puter");
    // puter.ai.chat(prompt, {model}) — flatten messages to a transcript
    const prompt=messages.map(m=>`${m.role==="system"?"[SYSTEM]":m.role==="assistant"?"[USER]":"[ASSISTANT]"}: ${m.content}`).join("\n\n");
    // model lanes hiccup occasionally ("missing model", 402s on premium lanes) —
    // retry once on the same model, then fall through the workhorse chain before giving up
    const chain=[model, "gpt-4o-mini", "gpt-4o"].filter((m,i,a)=>a.indexOf(m)===i);
    let lastErr=null;
    for(const m of chain){
      try{ return await this._puterOnce(prompt, m); }
      catch(e){ lastErr=e;
        if(/sign-in/i.test(e.message)) throw e; }
    }
    throw (lastErr||new Error("puter unavailable"));
  },
  // streaming chat via Puter (async-iterable). onChunk(text-so-far). Returns full text.
  async streamPuter(messages, {temperature=.6, maxTokens=1200, onChunk}={}){
    if(typeof window.puter==="undefined") await this.loadPuter();
    const tok=(this.keys().puterToken||"").trim();
    if(tok && typeof window.puter.setAuthToken==="function"){ try{ window.puter.setAuthToken(tok); }catch(e){} }
    const model=this.pickModel("puter");
    const prompt=messages.map(m=>`${m.role==="system"?"[SYSTEM]":m.role==="user"?"[USER]":"[ASSISTANT]"}: ${m.content}`).join("\n\n");
    // model lanes hiccup occasionally — try the chosen model, then workhorses, then give up
    const chain=[model, "gpt-4o-mini", "gpt-4o"].filter((m,i,a)=>a.indexOf(m)===i);
    let lastErr=null, emitted=false;
    for(const m of chain){
      try{
        const resp=await window.puter.ai.chat(prompt, {model:m, stream:true});
        let full="";
        for await(const part of resp){
          const t=typeof part==="string"?part:(part?.text ?? part?.message?.content ?? "");
          if(t){ full+=t; emitted=true; try{ onChunk&&onChunk(full); }catch(e){} }
        }
        if(!full.trim()) throw new Error("empty stream");
        return full;
      }catch(e){ lastErr=e;
        if(/sign-in/i.test(e.message)) throw e;
        if(emitted) break; // chunks already shown — never restart, that would duplicate the answer
      }
    }
    throw (lastErr||new Error("puter unavailable"));
  },
  // ---- Puter multimodal superpowers (all keyless, user-pays)
  // CYRUS image engine: Pollinations (free, keyless, instant) — used first for stills
  imgUrl(prompt, w=1024, h=1024){
    return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&nologo=true&seed=${Math.floor(Math.random()*99999)}`;
  },
  // D-ID talking-avatar lane (optional user key): create a talk, return {id}
  async didCreateTalk(sourceUrl, text){
    const key=(this.keys().did||"").trim(); if(!key) throw new Error("no D-ID key — add it in Settings → CYRUS Brain");
    const r=await fetch("https://api.d-id.com/talks",{method:"POST",
      headers:{"Authorization":"Basic "+key,"Content-Type":"application/json"},
      body:JSON.stringify({source_url:sourceUrl, script:{type:"text", input:text.slice(0,900)}})});
    if(!r.ok){ const t=await r.text(); throw new Error("D-ID HTTP "+r.status+" "+t.slice(0,100)); }
    return await r.json();
  },
  async didGetTalk(id){
    const key=(this.keys().did||"").trim();
    const r=await fetch("https://api.d-id.com/talks/"+encodeURIComponent(id),{headers:{"Authorization":"Basic "+key}});
    if(!r.ok) throw new Error("D-ID HTTP "+r.status);
    return await r.json(); // {result_url} when ready
  },
  async puterReady(){ if(typeof window.puter==="undefined") await this.loadPuter();
    const tok=(this.keys().puterToken||"").trim();
    if(tok && typeof window.puter.setAuthToken==="function"){ try{ window.puter.setAuthToken(tok); }catch(e){} } },
  async txt2img(prompt, testMode){ await this.puterReady(); return window.puter.ai.txt2img(prompt, !!testMode); }, // returns <img>
  async txt2speech(text){ await this.puterReady(); return window.puter.ai.txt2speech(text); },        // returns Audio
  async txt2vid(prompt, testMode){ await this.puterReady(); return window.puter.ai.txt2vid(prompt, !!testMode); }, // returns <video>
  async speech2txt(url){ await this.puterReady(); const r=await window.puter.ai.speech2txt(url); return r?.text ?? String(r); },
  async img2txt(src){ await this.puterReady(); return String(await window.puter.ai.img2txt(src)); },
  async listModels(){ await this.puterReady(); try{ return await window.puter.ai.listModels(); }catch(e){ return null; } },
  puterLoading:null,
  loadPuter(){
    if(this.puterLoading) return this.puterLoading;
    this.puterLoading=new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://js.puter.com/v2/";
      s.onload=()=>res();
      s.onerror=()=>rej(new Error("failed to load js.puter.com"));
      document.head.appendChild(s);
      setTimeout(()=>rej(new Error("puter load timeout")),12000);
    });
    return this.puterLoading;
  },

  pickModel(id){
    const c=this.cfg();
    if(c.routeModel && c.routeModel[id]) return c.routeModel[id];
    return PROVIDERS[id].models[0].id;
  },

  // ---- task classification: which lane should try first
  classify(text){
    const lo=text.toLowerCase();
    if(/\b(why|explain|analy[sz]e|compare|reason|proof|design|architecture|strategy|plan for|trade-?offs?|deep|code|debug|write|algorithm|refactor|optimize|math|solve)\b/.test(lo)) return "reasoning";
    if(/\b(summarize|quick|fast|tiny|brief|short|flash)\b/.test(lo)) return "fast";
    if(/\b(image|photo|screenshot|vision|see this|picture)\b/.test(lo)) return "vision";
    return "general";
  },

  // ---- CYRUS brain helper: the lane the chatbot actually thinks with
  // Returns {id, label, model, stream}. "cyrus" = local rules (always answers, never fails).
  brain(){
    const order=this.order("reasoning");
    const id=order.find(x=>x!=="local")||"cyrus";
    if(id==="openai") return {id, label:"ChatGPT (your key)", model:this.pickModel("openai"), stream:true};
    if(id==="puter") return {id, label:"Puter · keyless", model:this.pickModel("puter"), stream:true};
    if(id==="pollinations") return {id, label:"Pollinations · keyless", model:this.pickModel("pollinations"), stream:false};
    return {id:"cyrus", label:"cyrus rules", model:"rules", stream:false};
  },

  // ---- generative theme: the model composes a royal wallpaper + accent from a vibe prompt
  async generativeTheme(vibe){
    const r=await this.chat([
      {role:"system", content:"You design color themes for a royal dark desktop OS. Answer with ONLY minified JSON, no prose, no markdown fences: {\"name\":\"<3 word name\",\"bg0\":\"#hex deep background\",\"bg1\":\"#hex surface\",\"accent\":\"#hex gold-like accent\",\"accent2\":\"#hex secondary\",\"a\":\"#hex orb 1\",\"b\":\"#hex orb 2\",\"c\":\"#hex orb 3\",\"d\":\"#hex orb 4\",\"reason\":\"<12 words max>\"}. Colors must harmonize, background very dark (L under 18%), accents luminous."},
      {role:"user", content:"Vibe: "+vibe}
    ],{taskType:"general", temperature:.9, maxTokens:300});
    if(!r.ok) throw new Error((r.errors||["router offline"]).join("; ").slice(0,140));
    const m=r.text.match(/\{[\s\S]*\}/); if(!m) throw new Error("model did not return a theme");
    const t=JSON.parse(m[0]);
    const hex=s=>typeof s==="string"&&/^#[0-9a-fA-F]{6}$/.test(s.trim());
    ["bg0","bg1","accent","accent2","a","b","c","d"].forEach(k=>{ if(!hex(t[k])) throw new Error("bad color "+k); });
    return { name:String(t.name||"Generated").slice(0,32), bg0:t.bg0, bg1:t.bg1, accent:t.accent, accent2:t.accent2,
             orbs:[t.a,t.b,t.c,t.d], reason:String(t.reason||"").slice(0,120), vibe };
  }
};

const IntentEngine = {
  parse(text){
    const t=text.trim(); const lo=t.toLowerCase();
    // briefing
    if(/\b(good morning|briefing|what'?s (on|for|happening) today|my day)\b/.test(lo)) return {intent:"briefing",fields:{}};
    // recent activity (OS context graph: “what was that document I edited yesterday?”)
    if(/\bwhat (?:was|were) (?:i|that|the) |\bwhat did i (?:edit|work|open|do)|\bwhere was i\b|\bcontinue where i left off\b/.test(lo))
      return {intent:"recent_activity", fields:{}};
    // workspace
    let m=lo.match(/\b(?:start|open|launch|switch to|restore)\s+(?:my\s+)?([a-z ]+?)\s*workspace\b/);
    if(m) return {intent:"open_workspace", fields:{workspace_name:m[1].trim()}};
    // summarize
    m=lo.match(/\bsummari[sz]e\s+(?:the\s+)?(.+)/);
    if(m) return {intent:"summarize", fields:{path:m[1].replace(/^the\s+/,"")}};
    // system report
    if(/\bwhat'?s using (all )?(my )?(memory|ram|cpu|disk|space)|disk usage|storage usage|how much space|what'?s taking up/.test(lo))
      return {intent:"system_report", fields:{}};
    // web search
    m=lo.match(/\b(?:search|google|look up)\s+(?:the\s+web\s+for|online\s+for|the\s+internet\s+for)\s+(.+)/);
    if(m) return {intent:"web_search", fields:{query:m[1]}};
    // delete
    m=t.match(/\b(?:delete|remove|trash)\s+(?:the\s+)?(.+)/i);
    if(m) return {intent:"delete_file", fields:{path:m[1], raw:t}};
    // move
    m=t.match(/\bmove\s+(.+?)\s+to\s+(.+)/i);
    if(m) return {intent:"move_file", fields:{source:m[1], destination:m[2]}};
    // create project
    m=lo.match(/\b(?:create|make|start)\s+(?:a\s+|an\s+|the\s+)?(?:(new|python|web|data\s*science|react|node|java)\s+)*(?:new\s+)?(project|app)\b\s*(?:called|named|for)?\s*(.*)?/);
    if(m){
      let name=(m[3]||"").replace(/\bfor (predicting|analy[sz]ing|tracking) (.+)/i,(x,a,b)=>b).replace(/[.!.]+$/,"").trim();
      const kind=/data\s*science|data/.test(lo)?"data science":/web|react|node/.test(lo)?"web":/java/.test(lo)?"java":"python";
      if(!name && /csv|data/.test(lo)) name="data-analysis";
      if(!name) name="new-project";
      return {intent:"create_project", fields:{name:name.replace(/\s+/g,"-").toLowerCase(), kind}};
    }
    // run scripts (registered only)
    if(/clean( up)?( my)? desktop/.test(lo)) return {intent:"run_script", fields:{script_name:"clean desktop"}};
    if(/(python )?data science (setup|environment)|set up (my )?(python )?(data|ds) ?(science )?environment/.test(lo))
      return {intent:"run_script", fields:{script_name:"python data science setup"}};
    // open app
    m=lo.match(/\b(?:open|launch|start|run)\s+(?:the\s+)?(vs ?code|visual studio code|terminal|files?|browser|notes?|settings?|assistant|memory|audit log|workspaces?|about)\b/);
    if(m){
      let a=m[1].replace(/visual studio code/,"vs code").replace(/files?/,"files").replace(/notes?/,"notes").replace(/settings?/,"settings").replace(/workspaces?/,"workspaces").replace(/audit log/,"memory");
      return {intent:"open_app", fields:{app_name:a}};
    }
    // search
    m=lo.match(/\b(?:find|search|show me|look for|locate|where (?:is|are))\b\s*(?:for\s+)?(.+)/);
    if(m){
      let q=m[1];
      const fields={query:q};
      const em=q.match(/\b(pdfs?|pptx?|csvs?|jpe?g|png|java|py|md|txt|zip|docs?)\b/); if(em) fields.ext=em[1].replace("pdfs","pdf").replace("ppt","pptx").replace("csvs","csv").replace("doc","txt");
      const wm=q.match(/\byesterday\b|\blast (week|month|semester|year)\b|\btoday\b/); if(wm) fields.when=wm[0];
      q=q.replace(/\b(my|the|all|files?|documents?|find|please|about|from|last|yesterday|today|week|month|semester|year|pdfs?|pptx?|csvs?|jpe?g|png)\b/g," ").replace(/\s+/g," ").trim();
      if(!q) q=m[1];
      fields.query=q;
      return {intent:"search_files", fields};
    }
    return {intent:"unknown", fields:{}};
  }
};

// ------------------------------------------------ ===== POLICY (port of permissions.py) =====
const Policy = {
  CRITICAL_RE:/(everything|all files|all my files|my computer|c:\\|c:\/|^\/$|^root$|system32)/i,
  evaluate(intent, fields){
    // Pre-flight critical screen: wholesale deletion is blocked outright —
    // it never even gets a confirmation dialog (spec §16).
    if(intent==="delete_file" && fields && this.CRITICAL_RE.test((fields.path||"").trim()))
      return {requires_confirmation:false, risk_level:"high", blocked:true, reason:"Wholesale deletion — blocked. Administrator confirmation required."};
    const risk=(SCHEMAS[intent]||{}).risk||"high";
    if(risk==="low")   return {requires_confirmation:false, risk_level:"low",  reason:"Read-only or reversible action."};
    if(risk==="medium")return {requires_confirmation:true,  risk_level:"medium", reason:"Modifies filesystem state or runs a registered script."};
    return {requires_confirmation:false, risk_level:"high", blocked:true, reason:"Unclassified or high-risk action — blocked from auto-confirmation."};
  }
};

function withinHome(p){ return p.startsWith("/home/rithvik"); }

function findFileByFuzzy(ref){
  const refLo=ref.toLowerCase().replace(/^~\/?/,"").replace(/^["']|["']$/g,"").trim();
  // exact-ish path first
  let p=VFS.norm("/home/rithvik",ref);
  let n=VFS.node(p); if(n) return p;
  // search by name substring
  const files=VFS.allFiles().concat(VFS.walkDirs());
  const hits=files.filter(f=>f.path.toLowerCase().includes(refLo)||VFS.base(f.path).toLowerCase()===refLo);
  return hits.length?hits[0].path:null;
}
VFS.walkDirs=function(){ const out=[]; const walk=(path,node)=>{ if(node.type!=="dir")return; out.push({path,node}); for(const c of Object.values(node.children)) walk((path==="/"?"":path)+"/"+c.name,c); }; walk("/home/rithvik",VFS.node("/home/rithvik")); return out; };

function scoreSearch(query, ext, when){
  const toks=query.toLowerCase().split(/\s+/).filter(Boolean);
  const now=Date.now();
  const win= when==="yesterday"?1.5: when==="today"?1: when==="last week"?7: when==="last month"?31: when==="last semester"?130: when==="last year"?365: null;
  const res=[];
  const stem=w=>w.replace(/(ing|ed|es|s)$/,"");
  const stems=toks.map(stem).filter(w=>w.length>2);
  for(const f of VFS.allFiles()){
    const name=f.node.name.toLowerCase(); const content=(f.node.content||"").toLowerCase();
    const path=f.path.toLowerCase();
    let sc=0; const why=[];
    for(const tk of stems){
      if(name.includes(tk)){ sc+=3; why.push("name ~ "+tk); }
      else if(path.includes(tk)){ sc+=2; why.push("path ~ "+tk); }
      else if(tk.length>3 && content.includes(tk)){ sc+=1.5; why.push("content ~ "+tk); }
      else if(name.startsWith(tk.slice(0,4))){ sc+=0.75; }
    }
    if(ext && f.node.ext===ext.replace(/\./g,"")){ sc+=2.5; why.push("type ."+ext); }
    if(win!=null && (now-f.node.mtime) <= win*86400000){ sc+=2; why.push("modified "+ (when||"recently")); }
    if(win!=null && (now-f.node.mtime) > win*86400000) sc-=2;
    if(sc>0) res.push({path:f.path, score:sc, why:why.slice(0,2).join(" · ")});
  }
  res.sort((a,b)=>b.score-a.score);
  return res.slice(0,8);
}

// ------------------------------------------------ ===== LLM INTENT PARSING (router-backed) =====
// The model must answer with ONE whitelisted intent as JSON. Anything else is
// rejected — a cloud model gets NO more power than the local rules engine.
async function llmParseIntent(userText){
  const list=Object.entries(SCHEMAS).map(([k,v])=>`- ${k}: fields = ${v.fields.join(", ")||"none"} (${v.desc})`).join("\n");
  const sys=`You are the intent parser for CYRUS OS, a locked-down AI operating environment.
You may ONLY respond with a single JSON object of this exact shape:
{"intent": "<one of the allowed intents>", "fields": { ... }}

Allowed intents and required fields:
${list}

Rules:
- Output ONLY the JSON object. No prose, no markdown fences.
- If the request doesn't clearly map to one of these intents, respond with {"intent": "unknown", "fields": {}}.
- Never invent an intent name that isn't in the list.
- For file paths, use the literal text the user gave (e.g. "~/Documents/report.pdf").`;
  const r=await Router.chat([
    {role:"system", content:sys},
    {role:"user", content:userText}
  ],{taskType:"fast", temperature:0, maxTokens:200});
  if(!r.ok) throw new Error(r.errors.join(" | ")||"no provider answered");
  let raw=r.text;
  raw=raw.replace(/^```(json)?/m,"").replace(/```$/m,"").trim();
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m) throw new Error("model output had no JSON object");
  const parsed=JSON.parse(m[0]);
  return {intent:parsed.intent, fields:parsed.fields||{}, via:r.via, viaLabel:r.viaLabel};
}

// ------------------------------------------------ ===== REQUEST PIPELINE =====
async function handleRequest(userText){
  const canLLM=Store.data.settings.privacy!=="local";
  let parsed=null, parsedVia=null, llmError=null;
  // 1) local rules first (instant, deterministic, offline)
  parsed=IntentEngine.parse(userText);
  // 2) unknown → try the AI Router, but ONLY accept a whitelisted intent back
  if(parsed.intent==="unknown" && canLLM){
    try{
      const lp=await llmParseIntent(userText);
      if(lp.intent && lp.intent!=="unknown" && SCHEMAS[lp.intent]){
        // schema validation: required fields present
        const missing=SCHEMAS[lp.intent].fields.filter(f=>lp.fields[f]==null||lp.fields[f]==="");
        if(!missing.length){ parsed=lp; parsedVia=lp.viaLabel; }
        else llmError=`model dropped required field(s): ${missing.join(", ")}`;
      }
    }catch(e){ llmError=e.message; }
  }
  if(parsed.intent==="unknown"){
    // chat fallback — Router first (all free AIs), then offline personality
    if(canLLM){
      try{
        const sys=CYRUS_PERSONA + liveContext();
        const r=await Router.chat([
          {role:"system", content:sys},
          ...AssistantHistory.slice(-12),
          {role:"user", content:userText}
        ],{taskType:Router.classify(userText), temperature:.55, maxTokens:1100});
        if(r.ok){
          Log.record(userText,"chat",{},"low",false,true,`answered via ${r.viaLabel}`);
          return {ok:true, message:r.text, via:`✨ ${r.viaLabel}`, chat:true};
        }
        if(r.errors && r.errors.some(e=>/sign-in|auth|login/i.test(e))){
          return {ok:false, needsSignin:true, message:"🔒 My keyless brain (Puter — Claude Sonnet 4 / GPT-4o class) needs a one-time free sign-in, and its popup was blocked in this embedded view.\n\nOne click fixes it:", via:"🔐 sign-in required"};
        }
      }catch(e){ llmError=e.message; }
    }
    const msg=AssistantFallback(userText);
    Log.record(userText,"unknown",{}, "n/a", false, false, msg);
    return {ok:false, message:msg, via: llmError?`🟢 local (AI router unreachable)`:`🟢 local`};
  }
  const decision=Policy.evaluate(parsed.intent, parsed.fields);
  if(decision.blocked){
    const msg="Blocked.\nRisk: CRITICAL — Administrator confirmation required.\n"+decision.reason;
    Log.record(userText,parsed.intent,parsed.fields,"high",false,false,msg);
    return {ok:false, blocked:true, message:msg, riskNote:"🔴 CRITICAL · blocked"};
  }
  let confirmed=false;
  if(decision.requires_confirmation){
    const danger=decision.risk_level==="medium";
    confirmed=await Modal.confirm({
      title:`Confirm ${parsed.intent} — risk ${decision.risk_level.toUpperCase()}`,
      body:`About to run: ${parsed.intent}(${JSON.stringify(parsed.fields).replace(/"/g,"")})\n\n${decision.reason}`,
      confirmText: danger?"Confirm":"Proceed",
      danger:true,
    });
    if(!confirmed){
      Log.record(userText,parsed.intent,parsed.fields,decision.risk_level,false,false,"User declined confirmation.");
      return {ok:false, message:"Cancelled. Nothing was changed.", riskNote:`🛡️ ${decision.risk_level} · confirmation declined`};
    }
  }
  let result;
  try{ result=Actions[parsed.intent](parsed.fields); }
  catch(e){ console.error(e); result={ok:false, message:"Action failed: "+e.message}; }
  Log.record(userText,parsed.intent,parsed.fields,decision.risk_level,confirmed,result.ok,result.message);
  const riskNote = result.blocked ? "🔴 CRITICAL · blocked" : decision.risk_level==="medium" ? `🟡 medium · confirmed by you` : `🟢 low · ran locally`;
  const via = parsedVia ? `✨ parsed by ${parsedVia}` : Store.data.settings.privacy==="local" ? "🟢 local" : "🟢 local rules";
  return {...result, riskNote, via};
}

function AssistantFallback(text){
  const lo=text.toLowerCase();
  if(/^(hi|hello|hey|yo|sup)\b/.test(lo)) return "Hey Rithvik. Give me an intent — “find my java assignments”, “start my research workspace”, “create a python project for analyzing CSV files” — or just tell me what you need in plain words.";
  if(/who are you|what are you|what can you do|help/.test(lo))
    return "I'm CYRUS — the AI layer of this OS. I don't get a shell; I emit whitelisted intents that a policy gate checks before anything runs.\n\nTry:\n• find my machine learning pdfs from last semester\n• open vs code / open terminal\n• start my college workspace\n• move project.zip to Downloads\n• create a python project called house-prices\n• set up my python data science environment\n• clean up my desktop\n• what's using all my disk space?\n• summarize the AI mining presentation";
  if(/thank/.test(lo)) return "Anytime. The audit log has everything we did today if you want to review it.";
  if(/internet|wifi|wi-fi|faster/.test(lo))
    return "I found three possible causes:\n1. DNS configuration\n2. Background downloads\n3. Weak Wi-Fi signal\n\nI'd recommend fixing #1 and pausing two background tasks. This sandbox build has no live network stack, so I can't apply it from here — but the intent (“make my internet faster”) is exactly the kind of thing the settings agent handles on real hardware.";
  if(/time|date/.test(lo)) return "It's "+new Date().toLocaleString()+". Ask “briefing” for today's plan.";
  if(/\?/.test(lo)) return "Good question — that one needs the reasoning model, not the intent engine. In the full build the AI Router would pick the right model for it. Here, try an intent: “find …”, “open …”, “start my … workspace”, “move … to …”, “summarize …”.";
  return "I couldn't map that to one of my whitelisted intents — and I don't guess with actions that touch your files.\n\nThings I can do: search files, open apps/workspaces, move or delete files, scaffold projects, run registered scripts, disk reports, summarize documents, and brief you on the day. Try “help”.";
}

  init(){
    this.el=$("#palette"); this.input=$("#pal-input"); this.meta=$("#pal-meta");
    this.result=$("#pal-result"); this.sugs=$("#pal-sugs");
    this.sugs.innerHTML=this.SUGGESTIONS.map(([i,t])=>`<button class="sug" data-t="${esc(t)}"><span class="s-i">${i}</span><span>${esc(t)}</span></button>`).join("");
    this.sugs.querySelectorAll(".sug").forEach(b=>b.addEventListener("click",()=>{ this.input.value=b.dataset.t; this.run(); }));
    this.input.addEventListener("input",()=>this.preview());
    this.input.addEventListener("keydown",e=>{
      if(e.key==="Enter") this.run();
      if(e.key==="Escape") this.hide();
    });
    this.el.querySelector(".backdrop").addEventListener("click",()=>this.hide());
    $("#tb-brand").addEventListener("click",()=>this.show());
    $("#tb-search").addEventListener("click",()=>this.show());
  },
  show(){ this.el.classList.remove("hidden"); this.openState=true; this.input.value=""; this.result.textContent=""; this.result.className=""; this.meta.innerHTML=""; setTimeout(()=>this.input.focus(),20); },
  hide(){ this.el.classList.add("hidden"); this.openState=false; },
  toggle(){ this.openState?this.hide():this.show(); },
  preview(){
    const t=this.input.value.trim();
    if(!t){ this.meta.innerHTML=""; return; }
    const p=IntentEngine.parse(t);
    if(p.intent==="unknown"){ this.meta.innerHTML=`<span class="chip high">no intent yet</span><span>chat fallback — press Enter anyway</span>`; }
    else{
      const risk=Policy.evaluate(p.intent).risk_level;
      this.meta.innerHTML=`<span class="chip intent">${esc(p.intent)}</span><span class="chip ${risk==="medium"?"med":risk==="high"?"high":"low"}">${risk} risk</span><span>${esc((SCHEMAS[p.intent]||{}).desc||"")}</span>`;
    }
  },
  async run(){
    const t=this.input.value.trim(); if(!t)return;
    this.result.className=""; this.result.textContent="Thinking…";
    const r=await handleRequest(t);
    this.result.className=r.ok?"ok":"err";
    this.result.textContent=r.message;
    if(r.riskNote) this.meta.innerHTML=`<span class="chip ${r.riskNote.includes("CRITICAL")?"high":r.riskNote.includes("medium")?"med":"low"}">${esc(r.riskNote)}</span>`;
  }
};

function applyAccent(){ document.documentElement.style.setProperty("--accent",Store.data.settings.accent); }
function applyWallpaper(){
  const w=$("#wallpaper"), s=Store.data.settings.wallpaper;
  let gen=null;
  if(typeof s==="string" && s.startsWith("gen:")){ gen=Themes.all().find(t=>t.name===s.slice(4))||null; w.className=""; }
  else w.className=(s==="default"||!s)?"":"w-"+s;
  let st=$("#genwall");
  if(!st){ st=document.createElement("style"); st.id="genwall"; document.head.appendChild(st); }
  const orbs=document.querySelectorAll("#wall-fx .orb");
  if(!gen){
    st.textContent="";
    orbs.forEach(o=>o.style.background="");
    document.documentElement.style.removeProperty("--accent");
    document.documentElement.style.removeProperty("--accent2");
    return;
  }
  const o=gen.orbs||[];
  st.textContent=`#wallpaper{background:
    radial-gradient(1100px 720px at 80% -12%, ${o[0]||gen.accent}26, transparent 62%),
    radial-gradient(950px 650px at -10% 32%, ${o[1]||gen.accent2}20, transparent 58%),
    radial-gradient(1000px 700px at 52% 118%, ${o[2]||gen.bg1}22, transparent 60%),
    radial-gradient(700px 500px at 108% 78%, ${o[3]||gen.accent}1a, transparent 55%),
    linear-gradient(160deg, ${gen.bg0} 0%, ${gen.bg1} 55%, ${gen.bg0} 100%) !important}`;
  const fb=[gen.accent,gen.accent2,gen.bg1,gen.accent];
  orbs.forEach((elm,i)=>{ elm.style.background=`radial-gradient(circle at 32% 32%, ${o[i]||fb[i%4]}, transparent 70%)`; });
  document.documentElement.style.setProperty("--accent",gen.accent);
  document.documentElement.style.setProperty("--accent2",gen.accent2);
}

// interactive background: wallpaper parallax + orb drift + glow that follows the pointer
function initWallFx(){
  const wall=$("#wallpaper"), fx=$("#wall-fx"), glow=fx.querySelector(".cursor-glow");
  const orbs=[...fx.querySelectorAll(".orb")];
  let tx=0, ty=0, cx=innerWidth/2, cy=innerHeight/2, raf=null;
  const DEPTH=[[.030,.030],[.014,-.020],[-.022,.014],[.040,-.030]]; // per-orb parallax depth
  function frame(){
    cx+=(tx-cx)*.08; cy+=(ty-cy)*.08;
    const nx=(cx/innerWidth-.5), ny=(cy/innerHeight-.5);
    wall.style.transform=`translate(${nx*-26}px,${ny*-18}px) scale(1.06)`;
    glow.style.transform=`translate(${cx}px,${cy}px)`;
    orbs.forEach((o,i)=>{ const d=DEPTH[i]||[0,0]; o.style.setProperty("translate",`${nx*d[0]*innerWidth}px ${ny*d[1]*innerHeight}px`); });
    if(Math.abs(tx-cx)>.4||Math.abs(ty-cy)>.4) raf=requestAnimationFrame(frame); else raf=null;
  }
  function wake(){ if(!raf) raf=requestAnimationFrame(frame); }
  document.addEventListener("pointermove",e=>{ tx=e.clientX; ty=e.clientY; wake(); },{passive:true});
  addEventListener("resize",()=>{ cx=tx=innerWidth/2; cy=ty=innerHeight/2; wake(); });
  wake();
}

function renderNotifs(){
  const list=Notify.list();
  const buckets={imp:["IMPORTANT",[]], act:["ACTION NEEDED",[]], low:["LOW PRIORITY",[]]};
  list.forEach(n=>{ (buckets[n.bucket]||buckets.low)[1].push(n); });
  $("#nlist").innerHTML=Object.entries(buckets).map(([id,[label,items]])=>items.length?`
    <div class="n-bucket ${id}"><div class="b-h">${label} — ${items.length}</div>
    ${items.map(n=>`<div class="n-card" data-a="${n.app||""}" data-arg="${esc(n.arg||"")}"><b>${esc(n.title)}</b><span class="n-sub">${esc(n.sub)}</span></div>`).join("")}</div>`:"").join("")
    ||'<div style="color:var(--muted);text-align:center;padding:30px">Inbox zero. The AI filtered the noise.</div>';
  $("#nlist").querySelectorAll(".n-card").forEach(c=>c.addEventListener("click",()=>{ if(c.dataset.a) Apps.open(c.dataset.a,c.dataset.arg||null); toggleDrawer(false); }));
  const cnt=Notify.count();
  $("#bell-count").classList.toggle("hidden",!cnt); $("#bell-count").textContent=cnt;
}
function toggleDrawer(force){
  const d=$("#ndraw"); const open=force!=null?force:!d.classList.contains("open");
  d.classList.toggle("open",open);
  if(open) renderNotifs();
}

function buildDock(){
  const dock=$("#dock");
  const items=[["start","🏠"],["files","🗂️"],["terminal","⌨️"],["editor","🧑‍💻"],["cyrus","💬"],["studio-ai","🎨"],["cyrus-video","🎬"],["agents","🤖"],"sep",["workspaces","🎛️"],["notes","📝"],["browser","🌐"],["memory","🧠"],"sep",["settings","⚙️"],["about","💠"]];
  dock.innerHTML="";
  for(const it of items){
    if(it==="sep"){ dock.appendChild(el("div","dock-sep")); continue; }
    const [id,ic]=it;
    const b=el("button","dock-item",ic);
    if(id==="start"){ b.id="dock-start"; b.title="Start — home layout"; b.addEventListener("click",()=>toggleStartMenu()); }
    else{
      b.title=Apps.reg.get(id).title;
      b.dataset.app=id;
      b.addEventListener("click",()=>{
        toggleStartMenu(false);
        if(WM.running(id)){ const w=WM.wins.get(id); if(w.el.classList.contains("min")){ w.el.classList.remove("min"); WM.focus(w);} else WM.close(id); }
        else Apps.open(id);
      });
    }
    dock.appendChild(b);
  }
  const p=el("button","dock-item","🔮"); p.id="dock-palette"; p.title="AI Command Palette (Ctrl+Space)";
  p.addEventListener("click",()=>{ toggleStartMenu(false); Palette.show(); });
  dock.appendChild(p);
  Bus.on("wm",()=>{ dock.querySelectorAll(".dock-item[data-app]").forEach(b=>b.classList.toggle("running", WM.running(b.dataset.app))); });
}

function buildStartMenu(){
  const sm=$("#startmenu");
  const grid=sm.querySelector('[data-a="grid"]'), wsWrap=sm.querySelector('[data-a="ws"]');
  const pinned=["cyrus","files","terminal","editor","studio-ai","cyrus-video","cyrus-avatar","assistant","agents","browser","notes","workspaces","memory","settings","about"];
  grid.innerHTML=pinned.map(id=>{ const a=Apps.reg.get(id); if(!a) return "";
    return `<div class="sm-app" data-app="${id}"><div class="b">${a.icon}</div><div class="n">${esc(a.title)}</div></div>`; }).join("");
  grid.querySelectorAll(".sm-app").forEach(c=>c.addEventListener("click",()=>{ toggleStartMenu(false); Apps.open(c.dataset.app); }));
  // My Apps — generated by the AI App Maker
  const myWrap=sm.querySelector('[data-a="myapps"]'), myLbl=sm.querySelector('[data-a="myapps-label"]');
  const mine=AppMaker.list();
  if(mine.length){
    myWrap.style.display=""; myLbl.style.display="";
    myWrap.innerHTML=mine.map(a=>`<div class="sm-app" data-name="${esc(a.name)}"><div class="b">${a.emoji}</div><div class="n">${esc(a.title)}</div></div>`).join("");
    myWrap.querySelectorAll(".sm-app").forEach(c=>c.addEventListener("click",()=>{ toggleStartMenu(false); AppMaker.open(c.dataset.name); }));
  } else { myWrap.style.display="none"; myLbl.style.display="none"; }
  wsWrap.innerHTML=Object.entries(WORKSPACES).map(([id,ws])=>`<button data-ws="${esc(id)}">${ws.emoji} ${esc(ws.name)}</button>`).join("");
  wsWrap.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ toggleStartMenu(false); Actions.open_workspace(b.dataset.ws); }));
  sm.querySelector('[data-a="search"]').addEventListener("click",()=>{ toggleStartMenu(false); Palette.show(); });
  sm.querySelector('[data-a="allapps"]').addEventListener("click",()=>{ toggleStartMenu(false); Apps.open("terminal"); });
  sm.querySelector('[data-a="about"]').addEventListener("click",()=>{ toggleStartMenu(false); Apps.open("about"); });
  sm.querySelector('[data-a="power"]').addEventListener("click",async()=>{
    const ok=await Modal.confirm({title:"Power off CYRUS OS?", body:"Your files and settings are saved in this browser and restored on next boot.", confirmText:"Shut down"});
    if(!ok) return;
    toggleStartMenu(false); location.reload();
  });
  sm.addEventListener("click",e=>{ if(e.target===sm) toggleStartMenu(false); });
}
function toggleStartMenu(force){
  const sm=$("#startmenu");
  const open=force!=null?force:sm.classList.contains("hidden");
  sm.classList.toggle("hidden",!open);
  const sb=$("#dock-start"); if(sb) sb.classList.toggle("running",open);
}

function buildDesktopIcons(){
  const di=$("#dicons");
  const icons=[["🗂️","Files",()=>Apps.open("files","/home/rithvik")],["⌨️","Terminal",()=>Apps.open("terminal")],["💬","CYRUS Chat",()=>Apps.open("cyrus")],["🎛️","Workspaces",()=>Apps.open("workspaces")]];
