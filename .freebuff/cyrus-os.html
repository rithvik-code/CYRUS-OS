<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0716">
<title>CYRUS OS — AI-native operating environment</title>
<style>
:root{
  --bg:#0d0716; --panel:#160e26; --panel2:#1f1434; --panel3:#2a1c45;
  --text:#f2ecff; --muted:#a89cc8; --border:#3a2a58; --border2:#4c3a74;
  --accent:#d4a53f; --accent2:#ffd873; --green:#4ade80; --yellow:#fbbf24; --red:#fb7185; --blue:#7dd3fc;
  --gold:#d4a53f; --wine:#9d3b6e; --violet:#7c4dff;
  --shadow:0 18px 50px rgba(5,2,12,.65);
  --radius:12px;
}
  --st-mono:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
  --st-mono:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
  --st-mono:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden; user-select:none;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:14px;
}
body.no-anim *{transition:none!important;animation:none!important}
code,pre,.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3344;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- WALLPAPER / DESKTOP ---------- */
#desktop{position:fixed;inset:0;display:flex;flex-direction:column}
#wallpaper{position:absolute;inset:0;background:
  radial-gradient(1100px 700px at 78% -10%, rgba(212,165,63,.20), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(124,77,255,.30), transparent 60%),
  radial-gradient(700px 500px at 50% 120%, rgba(157,59,110,.22), transparent 60%),
  linear-gradient(160deg,#0d0716 0%,#150b28 55%,#1c1038 100%);
  transition:transform .35s cubic-bezier(.2,.7,.3,1),background .4s;will-change:transform}
#wallpaper.w-green{background:
  radial-gradient(1100px 700px at 80% -10%, rgba(74,222,128,.18), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(212,165,63,.14), transparent 60%),
  linear-gradient(160deg,#071009,#0b1810 60%,#0e2016)}
#wallpaper.w-blue{background:
  radial-gradient(1100px 700px at 80% -10%, rgba(125,211,252,.20), transparent 60%),
  radial-gradient(800px 500px at 0% 100%, rgba(124,77,255,.26), transparent 60%),
  linear-gradient(160deg,#080a18,#0e1128 60%,#141a3c)}
#wallpaper.w-ember{background:
  radial-gradient(1100px 700px at 80% -10%, rgba(251,113,133,.20), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(212,165,63,.16), transparent 60%),
  linear-gradient(160deg,#160a0c,#220f14 60%,#2a1216)}
/* interactive background: pointer-reactive orbs + glow that follows the mouse */
#wall-fx{position:absolute;inset:-60px;z-index:1;pointer-events:none;overflow:hidden}
#wall-fx .orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;will-change:transform;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
#wall-fx .o1{width:340px;height:340px;left:8%;top:16%;background:radial-gradient(circle,rgba(212,165,63,.34),transparent 70%)}
#wall-fx .o2{width:460px;height:460px;left:62%;top:38%;background:radial-gradient(circle,rgba(124,77,255,.38),transparent 70%)}
#wall-fx .o3{width:300px;height:300px;left:30%;top:62%;background:radial-gradient(circle,rgba(157,59,110,.32),transparent 70%)}
#wall-fx .o4{width:220px;height:220px;left:80%;top:8%;background:radial-gradient(circle,rgba(125,211,252,.22),transparent 70%)}
#wall-fx .cursor-glow{position:absolute;width:520px;height:520px;left:0;top:0;margin:-260px 0 0 -260px;
  border-radius:50%;background:radial-gradient(circle,rgba(212,165,63,.14),rgba(124,77,255,.07) 45%,transparent 68%);
  will-change:transform;transition:transform .18s ease-out}
#wallpaper.w-green ~ #wall-fx .cursor-glow{background:radial-gradient(circle,rgba(74,222,128,.13),rgba(212,165,63,.06) 45%,transparent 68%)}
#wallpaper.w-ember ~ #wall-fx .cursor-glow{background:radial-gradient(circle,rgba(251,113,133,.14),rgba(212,165,63,.07) 45%,transparent 68%)}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(36px,-26px) scale(1.07)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-44px,30px) scale(.94)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,36px) scale(1.05)}}
#wall-fx .o1{animation:drift1 13s ease-in-out infinite}
#wall-fx .o2{animation:drift2 17s ease-in-out infinite}
#wall-fx .o3{animation:drift3 15s ease-in-out infinite}

/* top bar */
#topbar{position:relative;z-index:60;height:40px;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:rgba(22,14,38,.78);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,165,63,.22)}
.tb-brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1.5px;font-size:13px;padding:4px 10px;border-radius:8px;color:var(--accent2);cursor:pointer}
.tb-brand:hover{background:rgba(212,165,63,.12)}
.tb-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tb-ic{cursor:pointer}
.dicon{cursor:pointer}
#tb-priv{cursor:pointer}
#tb-bell{cursor:pointer}
#tb-search{flex:0 1 420px;display:flex;align-items:center;gap:8px;background:var(--panel2);
  border:1px solid var(--border);border-radius:9px;padding:5px 12px;color:var(--muted);cursor:pointer;font-size:13px}
#tb-search:hover{border-color:rgba(212,165,63,.45);background:var(--panel3)}
#tb-search kbd{margin-left:auto}
#tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.tb-ic{position:relative;width:32px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px}
.tb-ic:hover{background:var(--panel2)}
#tb-priv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:8px}
#tb-priv:hover{background:var(--panel2)}
#tb-priv .pd{width:8px;height:8px;border-radius:50%}
#tb-clock{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25;padding:0 8px}
#tb-clock b{display:block;color:var(--text);font-size:13px}
#bell-count{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
kbd{background:var(--panel3);border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;
  padding:0 6px;font-size:11px;font-family:Consolas,monospace;color:var(--muted)}

/* ---------- WATERMELON-STYLE INTERACTION LAYER ---------- */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
.btn,.tb-btn,.dock-item,.sm-app,.achip,.sug{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.12));
  transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.btn:active,.tb-btn:active,.achip:active{transform:scale(.96)}
.btn,.tb-btn,.achip{transition:transform .12s var(--spring),background .12s,border-color .12s}
.dock-item:active{transform:translateY(-2px) scale(.94)}
.toolbar input[type=text]:focus,#as-in:focus,#pal-input:focus{box-shadow:0 0 0 3px rgba(212,165,63,.16);border-color:rgba(212,165,63,.55)!important}
.win{animation:wpop .22s var(--spring)}
@keyframes wpop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal{animation:wpop .2s var(--spring)}
.fitem,.n-card{transition:transform .15s var(--spring),background .12s,border-color .12s}
.fitem:hover{transform:translateY(-2px)}
.n-card:hover{transform:translateX(3px)}
.sm-grid .sm-app{opacity:0;animation:smpop .3s var(--spring) forwards}
.sm-grid .sm-app:nth-child(1){animation-delay:.02s}.sm-grid .sm-app:nth-child(2){animation-delay:.05s}
.sm-grid .sm-app:nth-child(3){animation-delay:.08s}.sm-grid .sm-app:nth-child(4){animation-delay:.11s}
.sm-grid .sm-app:nth-child(5){animation-delay:.14s}.sm-grid .sm-app:nth-child(6){animation-delay:.17s}
.sm-grid .sm-app:nth-child(7){animation-delay:.2s}.sm-grid .sm-app:nth-child(8){animation-delay:.23s}
.sm-grid .sm-app:nth-child(9){animation-delay:.26s}.sm-grid .sm-app:nth-child(10){animation-delay:.29s}
.sm-grid .sm-app:nth-child(11){animation-delay:.32s}
@keyframes smpop{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}

/* desktop icons */
#dicons{position:absolute;top:56px;left:14px;z-index:5;display:flex;flex-direction:column;gap:6px;width:92px}
.dicon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;cursor:pointer;text-align:center}
.dicon:hover{background:rgba(212,165,63,.1)}
.dicon .ic{font-size:30px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.dicon .lb{font-size:11.5px;color:#dfe3ec;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ---------- WINDOWS ---------- */
#winlayer{position:absolute;inset:40px 0 88px 0;z-index:10;pointer-events:none}
#winlayer .win{pointer-events:auto}
.win{position:absolute;display:flex;flex-direction:column;background:rgba(22,14,38,.94);backdrop-filter:blur(16px);
  border:1px solid rgba(76,58,116,.7);border-radius:var(--radius);box-shadow:var(--shadow);min-width:320px;min-height:200px;overflow:hidden}
.win.focused{border-color:rgba(212,165,63,.5);box-shadow:0 24px 70px rgba(5,2,12,.7),0 0 0 1px rgba(212,165,63,.28)}
.win-title{height:36px;display:flex;align-items:center;gap:9px;padding:0 10px;background:rgba(31,20,52,.85);
  border-bottom:1px solid var(--border);cursor:grab;flex:none}
.win-title:active{cursor:grabbing}
.win-title .w-ic{font-size:15px}
.win-title .w-t{font-size:12.5px;font-weight:600;color:#e4dcf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-btns{margin-left:auto;display:flex;gap:0;align-self:stretch;height:100%}
.wbtn{width:44px;height:100%;border-radius:0;display:flex;align-items:center;justify-content:center;
  color:#cfc6e4;font-size:10px;line-height:1;background:transparent;transition:background .1s,color .1s}
.wbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.wbtn.close:hover{background:#e81123;color:#fff}
.wbtn.min{font-size:11px}
.wbtn.max{font-size:9px}
.wbtn:active{background:rgba(255,255,255,.2)}
.wbtn.close:active{background:#f1707a}
.win-body{flex:1;overflow:auto;position:relative}
.win.min{display:none}
.win.max{border-radius:0}

/* ---------- DOCK ---------- */
#dock{position:relative;z-index:60;height:74px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;
  background:rgba(13,8,26,.66);backdrop-filter:blur(16px);border:1px solid rgba(212,165,63,.25);
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);border-radius:22px;box-shadow:0 12px 40px rgba(5,2,12,.6)}
.dock-item{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s,box-shadow .15s;background:rgba(42,28,69,.65);border:1px solid rgba(124,77,255,.28)}
.dock-item:hover{background:rgba(58,42,88,.85);transform:translateY(-7px) scale(1.12);box-shadow:0 8px 22px rgba(212,165,63,.25)}
.dock-item.running{border-color:rgba(212,165,63,.6);box-shadow:0 0 14px rgba(212,165,63,.22)}
.dock-item.running::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dock-sep{width:1px;height:30px;background:rgba(212,165,63,.35);margin:0 6px}
#dock-palette{background:linear-gradient(135deg,rgba(212,165,63,.3),rgba(124,77,255,.3));border:1px solid rgba(212,165,63,.5)}

/* ---------- PALETTE ---------- */
#palette{position:absolute;inset:0;z-index:800;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
#palette .backdrop{position:absolute;inset:0;background:rgba(8,4,18,.62);backdrop-filter:blur(3px)}
#pal-card{position:relative;width:min(640px,92vw);background:rgba(24,15,42,.97);border:1px solid rgba(212,165,63,.4);
  border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#pal-input{width:100%;background:transparent;border:none;outline:none;padding:18px 20px;font-size:18px;color:var(--text)}
#pal-input::placeholder{color:#5a6175}
#pal-meta{display:flex;align-items:center;gap:8px;padding:0 20px 10px;font-size:11.5px;color:var(--muted)}
.chip{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid}
.chip.intent{color:var(--accent2);border-color:rgba(212,165,63,.45);background:rgba(212,165,63,.12)}
.chip.low{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.chip.med{color:var(--yellow);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.chip.high{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
#pal-result{padding:12px 20px 16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;user-select:text}
#pal-result.ok{color:var(--green)}#pal-result.err{color:var(--red)}
#pal-suggest{border-top:1px solid var(--border);padding:10px 8px;background:rgba(13,8,26,.7)}
#pal-suggest .s-h{font-size:10.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:2px 12px 8px}
.sug{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13.5px;color:#cdd3e0}
.sug:hover{background:var(--panel2)}
.sug .s-i{width:18px;text-align:center}

/* ---------- MODAL ---------- */
#modal-root{position:absolute;inset:0;z-index:850;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.6);backdrop-filter:blur(3px)}
.modal{width:min(460px,92vw);background:var(--panel);border:1px solid rgba(212,165,63,.35);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.modal h3{font-size:15.5px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.modal .m-body{font-size:13.5px;color:#c9cfdd;line-height:1.6;white-space:pre-wrap;user-select:text;max-height:260px;overflow:auto}
.modal .m-btns{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.btn{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--border2);background:var(--panel2)}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}

/* ---------- TOASTS ---------- */
#toast-root{position:absolute;right:16px;bottom:100px;z-index:750;display:flex;flex-direction:column;gap:9px;width:340px}
.toast{background:rgba(24,15,42,.97);border:1px solid var(--border2);border-left:3px solid var(--accent);
  border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;line-height:1.5;cursor:pointer;
  animation:slidein .18s ease;user-select:text}
.toast.warn{border-left-color:var(--yellow)}.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
.toast .t-title{font-weight:700;font-size:12.5px;margin-bottom:3px;display:flex;gap:7px;align-items:center}
.toast .t-msg{color:#c4cad8;white-space:pre-wrap;max-height:180px;overflow:auto}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- NOTIFICATION DRAWER ---------- */
#ndraw{position:absolute;top:40px;right:0;bottom:0;width:360px;z-index:700;background:rgba(19,12,34,.97);
  backdrop-filter:blur(16px);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column}
#ndraw.open{transform:none}
#ndraw .n-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center}
#ndraw .n-head b{font-size:13.5px}
#ndraw .n-head span{margin-left:auto;font-size:11.5px;color:var(--muted);cursor:pointer}
#ndraw .n-head span:hover{color:var(--text)}
#nlist{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.n-bucket .b-h{font-size:10.5px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.n-bucket.imp .b-h{color:var(--red)}.n-bucket.act .b-h{color:var(--yellow)}.n-bucket.low .b-h{color:var(--muted)}
.n-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;font-size:13px;line-height:1.5}
.n-card b{display:block;font-size:13px;margin-bottom:2px}
.n-card .n-sub{color:var(--muted);font-size:12px}

/* ---------- BOOT / LOCK ---------- */
#boot{position:fixed;inset:0;z-index:1000;background:#080412;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#boot .logo{font-size:38px;font-weight:800;letter-spacing:12px;color:var(--accent2);text-shadow:0 0 30px rgba(212,165,63,.5)}
#boot .sub{color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase}
#bootLog{width:min(560px,88vw);height:170px;overflow:hidden;font-family:Consolas,monospace;font-size:12px;color:#7f8aa3;line-height:1.7}
#bootLog .ok{color:var(--green)}
#bootBar{width:min(560px,88vw);height:4px;background:var(--panel2);border-radius:4px;overflow:hidden}
#bootBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--violet));transition:width .3s}
#boot-skip{color:#5a6175;font-size:11.5px}
#lock{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:linear-gradient(160deg,#0d0716,#1a0f30 60%,#241440);transition:opacity .35s}
#lock.fade{opacity:0;pointer-events:none}
#lock-time{font-size:74px;font-weight:200;letter-spacing:2px}
#lock-date{color:var(--muted);font-size:15px;margin-top:2px}
#lock-card{margin-top:70px;display:flex;flex-direction:column;align-items:center;gap:13px}
#lock-av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--wine));
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;box-shadow:0 10px 34px rgba(212,165,63,.35)}
#lock-name{font-size:19px;font-weight:600}
#lock-hint{color:var(--muted);font-size:12.5px}
#lock-btn{margin-top:4px;padding:9px 26px;border-radius:999px;background:linear-gradient(135deg,var(--gold),#b8860b);font-weight:600;font-size:13.5px;color:#1a0f30}
#lock-btn:hover{background:linear-gradient(135deg,var(--accent2),var(--gold))}

/* ---------- APP-SHARED ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex:none;background:rgba(26,30,41,.5);flex-wrap:wrap}
.toolbar .tb-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);font-size:12.5px}
.toolbar .tb-btn:hover{background:var(--panel3)}
.toolbar input[type=text]{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:12.5px;outline:none;min-width:130px}
.toolbar input[type=text]:focus{border-color:var(--accent)}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--text);font-weight:600;cursor:pointer}
.crumb b:hover{text-decoration:underline}

/* files */
#files-grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
.fitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:10px;cursor:pointer;text-align:center;border:1px solid transparent}
.fitem:hover{background:var(--panel2)}
.fitem.sel{background:rgba(212,165,63,.14);border-color:rgba(212,165,63,.4)}
.fitem .f-ic{font-size:34px}
.fitem .f-n{font-size:11.5px;word-break:break-word;max-height:29px;overflow:hidden;line-height:1.3}
.fitem .f-s{font-size:10px;color:var(--muted)}
#files-results{position:absolute;inset:0;background:rgba(18,21,29,.98);z-index:5;padding:14px;overflow:auto;user-select:text}
#files-results .r{padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;border:1px solid transparent}
#files-results .r:hover{background:var(--panel2);border-color:var(--border)}
#files-results .r .r-path{color:var(--muted);font-size:11.5px;margin-top:2px}
#files-results .r .r-why{color:var(--accent2);font-size:11px;margin-top:2px}

/* terminal */
#term-out{flex:1;overflow:auto;padding:12px 14px;font-family:Consolas,monospace;font-size:13px;line-height:1.6;user-select:text;white-space:pre-wrap;word-break:break-word}
#term-out .p{color:var(--accent2)}#term-out .err{color:var(--red)}#term-out .ok{color:var(--green)}#term-out .dim{color:var(--muted)}
#term-line{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--border);font-family:Consolas,monospace;font-size:13px}
#term-ps{color:var(--accent2);white-space:nowrap}
#term-in{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:Consolas,monospace;font-size:13px}

/* editor */
#ed-area{flex:1;background:rgba(10,12,18,.6);border:none;outline:none;resize:none;padding:14px 16px;font-family:Consolas,monospace;font-size:13px;line-height:1.6;user-select:text}
#ed-status{padding:5px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px}

/* ---------- CYRUS STUDIO (VS Code / Cursor style) ---------- */
.studio{background:rgba(13,8,26,.98)}
.st-body{flex:1;display:flex;min-height:0}
.st-side{width:200px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(19,12,34,.7)}
.st-side-h{font-size:10px;letter-spacing:1.6px;color:var(--muted);padding:10px 12px 7px;font-weight:700}
.st-tree{flex:1;overflow:auto;padding:0 6px 10px;font-size:12.5px;user-select:none}
.st-dir{padding:3px 8px;color:#d9d2ec;cursor:pointer;border-radius:6px;display:flex;gap:6px;align-items:center}
.st-dir:hover{background:var(--panel2)}
.st-file{padding:3px 8px 3px 24px;color:#b9aed6;cursor:pointer;border-radius:6px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-file:hover{background:var(--panel2)}
.st-file.on{background:rgba(212,165,63,.14);color:var(--accent2)}
.st-main{flex:1;display:flex;flex-direction:column;min-width:0}
.st-tabs{display:flex;background:rgba(19,12,34,.7);border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.st-tab{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);white-space:nowrap}
.st-tab.on{background:rgba(13,8,26,.98);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.st-tab .x{opacity:.5;font-size:10px;padding:1px 3px;border-radius:4px}
.st-tab .x:hover{opacity:1;background:var(--panel3)}
.st-editor-wrap{flex:1;display:flex;min-height:0;background:rgba(10,6,20,.75)}
.st-gutter{flex:none;padding:12px 8px 12px 14px;text-align:right;color:#5e5480;font-family:Consolas,monospace;font-size:13px;line-height:1.6;user-select:none;overflow:hidden}
.st-code{flex:1;border:none;outline:none;resize:none;background:transparent;color:#eae4ff;padding:12px 16px 12px 8px;
  font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.6;user-select:text;white-space:pre;overflow:auto;tab-size:2}
.st-out{flex:none;height:180px;border-top:1px solid var(--border);background:#080412;padding:10px 14px;overflow:auto;
  font-family:Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;user-select:text}
.st-out .ok{color:var(--green)}.st-out .err{color:var(--red)}
.st-out iframe{width:100%;height:100%;border:none;background:#fff;border-radius:8px}
.st-ai{width:300px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;background:rgba(19,12,34,.7)}
.st-ai.hid{display:none}
.st-ai-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--accent2);border-bottom:1px solid var(--border)}
.st-ai-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.st-ai-msgs .msg{max-width:100%;font-size:12.5px}
.st-ai-quick{display:flex;gap:6px;padding:0 12px 9px;flex-wrap:wrap}
.st-ai-quick .tb-btn{font-size:11px;padding:4px 9px}
.st-ai-in{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--border)}
.st-ai-in input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12.5px;outline:none;color:var(--text)}
.st-ai-in input:focus{border-color:rgba(212,165,63,.5)}
.st-status{display:flex;align-items:center;gap:14px;padding:4px 12px;border-top:1px solid var(--border);background:rgba(19,12,34,.85);font-size:11px;color:var(--muted);flex:none}
.st-status .tb-btn{font-size:11px;padding:3px 10px}

/*STUDIO_CSS_START*/
/* ---------- CYRUS STUDIO v2 — IDE surface ---------- */
.st2{display:flex;flex-direction:column;height:100%;background:#0b0618;font-size:12.5px}
.st2-bar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#150d29;border-bottom:1px solid #2a1f47;flex:none;user-select:none}
.st2-bar .g2{display:flex;align-items:center;gap:2px;flex:none}
.st2-sep{width:1px;height:16px;background:#2a1f47;margin:0 5px;flex:none}
.st2-ico{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:#8d84ad;cursor:pointer;font-size:13px}
.st2-ico:hover{background:#241a42;color:#d8cff2}
.st2-ico.on{background:rgba(212,165,63,.18);color:var(--accent2)}
.st2-title{font-size:11.5px;color:#7d74a0;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.st2-title b{color:var(--accent2);font-weight:600}

.st2-main{flex:1;display:flex;min-height:0}
.st2-side{width:236px;flex:none;display:flex;flex-direction:column;background:#100a20;border-right:1px solid #2a1f47;min-width:0}
.st2-side.w0{display:none}
.st2-side.w1{width:190px}
.st2-pane-h{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6f6690;padding:8px 10px 6px;font-weight:700;flex:none}
.st2-pane-h .cnt{margin-left:auto;font-weight:400;letter-spacing:0;color:#5b5382}
.st2-act{margin-left:auto;display:flex;gap:1px}
.st2-act button{background:none;border:none;color:#6f6690;cursor:pointer;font-size:12px;padding:1px 5px;border-radius:4px;line-height:1.4}
.st2-act button:hover{background:#241a42;color:var(--accent2)}
.st2-resizer{width:4px;cursor:col-resize;background:transparent;flex:none;margin-left:-2px}
.st2-resizer:hover{background:rgba(212,165,63,.35)}

/* explorer rows */
.st2-row{display:flex;align-items:center;gap:5px;padding:2.5px 8px 2.5px 0;cursor:pointer;color:#b6abd6;white-space:nowrap;border-radius:0;position:relative;user-select:none}
.st2-row:hover{background:#1b1333}
.st2-row.on{background:rgba(212,165,63,.15);color:var(--accent2)}
.st2-row.cut{opacity:.42}
.st2-row .tw{width:14px;flex:none;text-align:center;font-size:9px;color:#6f6690;transition:transform .12s}
.st2-row.dir>.tw.closed{transform:rotate(-90deg)}
.st2-row .nm{overflow:hidden;text-overflow:ellipsis}
.st2-row .bad{width:6px;height:6px;border-radius:50%;flex:none;background:var(--red)}
.st2-row .mod{width:6px;height:6px;border-radius:50%;flex:none;background:var(--accent)}
.st2-kids{display:none}
.st2-kids.open{display:block}
.st2-empty{padding:8px 12px;color:#5b5382;font-size:11.5px;font-style:italic}

/* center column */
.st2-mid{flex:1;display:flex;flex-direction:column;min-width:0;background:#0b0618}
.st2-tabs{display:flex;background:#100a20;border-bottom:1px solid #2a1f47;overflow-x:auto;flex:none;min-height:29px}
.st2-tab{display:flex;align-items:center;gap:6px;padding:0 9px;height:29px;font-size:11.5px;color:#7d74a0;cursor:pointer;border-right:1px solid #221a3c;white-space:nowrap;background:#120c24}
.st2-tab:hover{background:#1b1333}
.st2-tab.on{background:#0b0618;color:#e6dffc;box-shadow:inset 0 1.5px 0 var(--accent)}
.st2-tab.dirty .x::before{content:"●";font-size:9px;opacity:.9}
.st2-tab .x{opacity:.45;font-size:10px;padding:1px 4px;border-radius:4px}
.st2-tab .x:hover{opacity:1;background:#2c2050}
.st2-bread{display:flex;align-items:center;gap:5px;padding:3px 12px;font-size:10.5px;color:#6f6690;background:#0d0820;border-bottom:1px solid #1e1638;overflow:hidden;white-space:nowrap;flex:none;user-select:none}
.st2-bread .bs{color:#a99ccc;cursor:pointer;padding:1px 3px;border-radius:3px}
.st2-bread .bs:hover{background:#241a42;color:var(--accent2)}
.st2-bread .bs.on{color:var(--accent2)}

/* editor surface */
.st2-edwrap{flex:1;display:flex;min-height:0;position:relative;overflow:hidden;background:#0b0618}
.st2-gut{flex:none;padding:10px 0 10px 0;text-align:right;color:#4b4370;font-family:var(--st-mono);font-size:12.5px;line-height:20px;user-select:none;overflow:hidden;background:#0d0820;position:relative}
.st2-gut .ln{padding:0 8px 0 14px;position:relative;white-space:pre}
.st2-gut .ln.err{color:#e8798f}
.st2-gut .ln.warn{color:#e0b155}
.st2-gut .ln.cur{color:#cfc6ea;background:rgba(212,165,63,.09)}
.st2-gut .gl{position:absolute;left:2px;top:0;width:11px;text-align:center;color:#5b5382;font-size:8px;cursor:pointer;user-select:none}
.st2-gut .gl:hover{color:var(--accent2)}
.st2-scroll{flex:1;position:relative;overflow:auto;min-width:0}
.st2-layer{position:relative;min-height:100%;min-width:100%;width:max-content}
.st2-hl,.st2-ta{font-family:var(--st-mono);font-size:12.5px;line-height:20px;tab-size:4;
  padding:10px 20px 10px 12px;margin:0;border:0;white-space:pre;word-wrap:normal}
.st2-hl{position:absolute;inset:0;color:#cfc6ea;pointer-events:none;min-width:100%;width:max-content}
.st2-ta{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--accent2);resize:none;outline:none;overflow:hidden}
.st2-ta::selection{background:rgba(122,92,214,.42)}
.st2-hl .cur-layer{position:absolute;top:0;left:0;pointer-events:none}
.st2-hl .mc{position:absolute;width:2px;height:20px;background:var(--accent2)}
.st2-hl .mc.sel{width:0}
.st2-hl .sel2{background:rgba(122,92,214,.30);border-radius:2px}
.st2-hl .ghost{color:#6b6390;font-style:italic}
.st2-hl .cmt{color:#5e5480;font-style:italic}
.st2-hl .str{color:#9ad48b}
.st2-hl .num{color:#e0a86b}
.st2-hl .kw{color:#c58af0}
.st2-hl .bi{color:#6fb3f2}
.st2-hl .fn{color:#e8c96b}
.st2-hl .ty{color:#7ee0c4}
.st2-hl .op{color:#b9aed6}
.st2-hl .pun{color:#8a80ab}
.st2-hl .prm{color:#8a80ab}
.st2-hl .var{color:#e09ad8}
.st2-hl .cls{color:#f0b57a}
.st2-hl .attr{color:#7ee0c4}
.st2-hl .tag{color:#f0b57a}
.st2-hl .ent{color:#e8798f}
.st2-hl .esc{color:#7ee0c4}
.st2-hl .dec{color:#9a7ee0}
.st2-hl .regexp{color:#7ee0c4}
.st2-hl .curw{border-bottom:2px solid rgba(212,165,63,.55)}
.st2-hl .occ{background:rgba(212,165,63,.24);border-radius:2px}
.st2-hl .mtch{background:rgba(226,120,90,.42);border-radius:2px}
.st2-hl .fold{background:rgba(122,92,214,.22);border-radius:2px;cursor:pointer}
.st2-hl .ins{background:rgba(46,160,67,.16);display:block}
.st2-hl .del{background:rgba(248,81,73,.16);display:block;text-decoration:line-through;opacity:.75}

/* inline widgets */
.st2-iw{position:absolute;z-index:9}
.st2-ac{background:#1c1236;border:1px solid #33265c;border-radius:8px;box-shadow:0 10px 34px rgba(0,0,0,.6);overflow:hidden;min-width:270px;max-width:430px}
.st2-ac-i{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:11.5px;color:#b6abd6;cursor:pointer;border-left:2px solid transparent}
.st2-ac-i.on{background:#251844;border-left-color:var(--accent)}
.st2-ac-i .ic{width:14px;text-align:center;color:#7d74a0}
.st2-ac-i .ic.k{color:#c58af0}
.st2-ac-i .ic.s{color:#9ad48b}
.st2-ac-i .ic.f{color:#e8c96b}
.st2-ac-i .dt{margin-left:auto;font-size:9.5px;color:#5b5382;letter-spacing:.4px;text-transform:uppercase}
.st2-hint{background:#2a1f47;border-top:1px solid #3a2c63;color:#8a80ab;font-size:10.5px;padding:4px 10px}
.st2-hint b{color:#b6abd6;font-weight:600}

/* find bar */
.st2-find{position:absolute;top:6px;right:18px;z-index:12;display:flex;align-items:center;gap:4px;background:#1c1236;border:1px solid #33265c;border-radius:8px;padding:5px 7px;box-shadow:0 8px 26px rgba(0,0,0,.55)}
.st2-find input{background:#0d0820;border:1px solid #2a1f47;border-radius:5px;color:#e6dffc;font-size:11.5px;padding:3px 7px;outline:none;width:150px;font-family:inherit}
.st2-find input:focus{border-color:rgba(212,165,63,.5)}
.st2-find .ct{font-size:10.5px;color:#8a80ab;min-width:52px;text-align:center}
.st2-find .fx{background:none;border:none;color:#8a80ab;cursor:pointer;font-size:11px;padding:2px 5px;border-radius:4px}
.st2-find .fx:hover{background:#2a1f47;color:var(--accent2)}

/* minimap */
.st2-mm{width:78px;flex:none;background:#0d0820;border-left:1px solid #1e1638;position:relative;overflow:hidden;cursor:pointer}
.st2-mm canvas{display:block;position:absolute;top:0;left:0}
.st2-mm .vp{position:absolute;left:0;right:0;background:rgba(212,165,63,.10);border-top:1px solid rgba(212,165,63,.3);border-bottom:1px solid rgba(212,165,63,.3)}
.st2-mm .cur{position:absolute;left:0;right:0;height:2px;background:var(--accent);opacity:.85}

/* right panel */
.st2-right{width:330px;flex:none;display:flex;flex-direction:column;background:#100a20;border-left:1px solid #2a1f47;min-width:0}
.st2-right.w0{display:none}
.st2-right.w1{width:250px}
.st2-right.w2{width:440px}
.st2-rtabs{display:flex;gap:1px;padding:0 6px;background:#100a20;border-bottom:1px solid #2a1f47;flex:none}
.st2-rtab{padding:6px 11px;font-size:11px;color:#7d74a0;cursor:pointer;border-bottom:1.5px solid transparent;text-transform:uppercase;letter-spacing:.7px}
.st2-rtab:hover{color:#b6abd6}
.st2-rtab.on{color:var(--accent2);border-bottom-color:var(--accent)}
.st2-rbody{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}

/* AI chat */
.st2-msgs{display:flex;flex-direction:column;gap:9px}
.st2-m{max-width:100%;font-size:12px;line-height:1.62;white-space:pre-wrap;word-break:break-word;padding:9px 12px;border-radius:11px}
.st2-m.user{align-self:flex-end;background:linear-gradient(135deg,#d4a53f,#a97a1e);color:#16092e;border-bottom-right-radius:3px}
.st2-m.ai{background:#1a1130;border:1px solid #2a1f47;color:#d3cae8;align-self:flex-start}
.st2-m.sys{align-self:flex-start;background:rgba(226,120,90,.13);border:1px solid rgba(226,120,90,.35);color:#f0bfae;font-size:11px}
.st2-m .codeblock{background:#0b0618;border:1px solid #2a1f47;border-radius:7px;padding:8px 10px;margin:7px 0;overflow-x:auto;font-family:var(--st-mono);font-size:11px;line-height:1.55;color:#cfc6ea}
.st2-m .codeblock .cb-h{display:flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:#6f6690;margin-bottom:6px;user-select:none}
.st2-m .codeblock .cb-h button{margin-left:auto;background:#1c1236;border:1px solid #2a1f47;color:#8a80ab;border-radius:5px;font-size:9.5px;padding:1.5px 7px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.st2-m .codeblock .cb-h button:hover{border-color:var(--accent);color:var(--accent2)}
.st2-m .codeblock .cb-h button.ap{border-color:rgba(46,160,67,.5);color:#63c47c}
.st2-m .md-em{color:#e8c96b;font-style:italic}
.st2-m .md-b{font-weight:700;color:#e6dffc}
.st2-m .md-c{color:#6f6690;font-size:10.5px}
.st2-quick{display:flex;gap:5px;flex-wrap:wrap}
.st2-quick button{background:#1c1236;border:1px solid #2a1f47;color:#9a90bd;font-size:10.5px;border-radius:11px;padding:3px 9px;cursor:pointer}
.st2-quick button:hover{border-color:var(--accent);color:var(--accent2)}
.st2-aiin{flex:none;border-top:1px solid #2a1f47;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:#100a20}
.st2-aiin .row{display:flex;gap:6px}
.st2-aiin textarea{flex:1;background:#0d0820;border:1px solid #2a1f47;border-radius:8px;color:#e6dffc;font-size:12px;padding:7px 10px;outline:none;resize:none;font-family:inherit;line-height:1.5;max-height:120px;min-height:32px}
.st2-aiin textarea:focus{border-color:rgba(212,165,63,.5)}
.st2-aiin .row button{background:linear-gradient(135deg,#d4a53f,#a97a1e);border:none;color:#16092e;border-radius:8px;padding:0 13px;cursor:pointer;font-size:12.5px;font-weight:700}
.st2-aiin .row button:disabled{opacity:.4;cursor:default}
.st2-ctx{display:flex;gap:5px;flex-wrap:wrap;font-size:10px;color:#6f6690}
.st2-ctx span{background:#1a1130;border:1px solid #221a3c;border-radius:9px;padding:1px 7px;display:flex;align-items:center;gap:4px}
.st2-ctx span b{color:#a99ccc;font-weight:500}
.st2-ctx span i{cursor:pointer;font-style:normal;opacity:.6}
.st2-ctx span i:hover{opacity:1;color:#e8798f}

/* outline / problems / extensions */
.st2-sec{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#6f6690;font-weight:700;margin:2px 0 1px}
.st2-sym{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#b6abd6;padding:2.5px 6px;border-radius:5px;cursor:pointer}
.st2-sym:hover{background:#1b1333;color:#e6dffc}
.st2-sym .ic{font-size:10px;width:13px;text-align:center}
.st2-sym .ic.fn{color:#e8c96b}.st2-sym .ic.cls{color:#f0b57a}.st2-sym .ic.var{color:#e09ad8}
.st2-sym .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st2-sym .ln{margin-left:auto;font-size:9.5px;color:#5b5382}
.st2-prob{border-left:2px solid transparent;padding:4px 8px;border-radius:0;cursor:pointer;font-size:11.5px;color:#b6abd6;line-height:1.5}
.st2-prob:hover{background:#1b1333}
.st2-prob.err{border-left-color:#e8798f}
.st2-prob.warn{border-left-color:#e0b155}
.st2-prob.info{border-left-color:#6fb3f2}
.st2-prob .loc{color:#5b5382;font-size:10px;display:block}
.st2-ext{border:1px solid #2a1f47;border-radius:9px;padding:9px 11px;background:#160f2c}
.st2-ext .nm{font-size:12px;color:var(--accent2);font-weight:600;display:flex;align-items:center;gap:6px}
.st2-ext .ver{font-size:9.5px;color:#5b5382;font-weight:400}
.st2-ext .ds{font-size:11px;color:#8a80ab;line-height:1.55;margin-top:3px}
.st2-ext .pm{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.st2-ext .pm b{font-size:9px;font-weight:500;letter-spacing:.3px;background:#1c1236;border:1px solid #2a1f47;color:#7d74a0;border-radius:4px;padding:1px 5px}
.st2-ext .pm b.g{color:#63c47c;border-color:rgba(46,160,67,.35)}
.st2-ext .pm b.y{color:#e0b155;border-color:rgba(224,177,85,.35)}
.st2-ext .pm b.r{color:#e8798f;border-color:rgba(232,121,143,.35)}
.st2-ext .act{display:flex;gap:6px;margin-top:8px}
.st2-ext .act button{background:#1c1236;border:1px solid #2a1f47;color:#8a80ab;border-radius:6px;font-size:10.5px;padding:3px 9px;cursor:pointer}
.st2-ext .act button:hover{border-color:var(--accent);color:var(--accent2)}

/* bottom panel */
.st2-panel{height:210px;flex:none;display:flex;flex-direction:column;background:#0d0820;border-top:1px solid #2a1f47}
.st2-panel.h0{display:none}
.st2-ptabs{display:flex;gap:1px;padding:0 6px;flex:none;border-bottom:1px solid #1e1638}
.st2-ptab{padding:5px 11px;font-size:10.5px;color:#6f6690;cursor:pointer;text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:5px}
.st2-ptab:hover{color:#b6abd6}
.st2-ptab.on{color:var(--accent2);box-shadow:inset 0 -1.5px 0 var(--accent)}
.st2-ptab .bdg{background:#e8798f;color:#16092e;border-radius:8px;font-size:9px;font-weight:700;padding:0 5px;min-width:15px;text-align:center}
.st2-pbody{flex:1;overflow:auto;padding:8px 12px;font-family:var(--st-mono);font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.st2-pbody .e{color:#e8798f}.st2-pbody .w{color:#e0b155}.st2-pbody .i{color:#6fb3f2}
.st2-pbody .g{color:#63c47c}.st2-pbody .d{color:#5e5480}
.st2-pbody .lnk{color:#6fb3f2;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(111,179,242,.35)}
.st2-pbody .lnk:hover{text-decoration-color:#6fb3f2}
.st2-pbody iframe{width:100%;height:100%;border:none;background:#fff;border-radius:6px}
.st2-prow{display:flex;gap:9px;padding:1.5px 0}
.st2-prow .cl{color:#5e5480;flex:none}

/* status bar */
.st2-status{flex:none;display:flex;align-items:center;gap:0;background:#1a1030;border-top:1px solid #2a1f47;font-size:10.5px;color:#8a80ab;padding:0 2px;user-select:none}
.st2-status .s{padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:0;white-space:nowrap}
.st2-status .s:hover{background:#261a44;color:#e6dffc}
.st2-status .s.sp{background:rgba(212,165,63,.16);color:var(--accent2)}
.st2-status .grow{flex:1;cursor:default}
.st2-status .grow:hover{background:none;color:#8a80ab}
.st2-tip{color:#5b5382}

/* empty / welcome */
.st2-wel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#6f6690;user-select:none;overflow:auto;padding:24px}
.st2-wel h2{font-size:26px;font-weight:800;letter-spacing:9px;color:var(--accent);margin:0 0 4px}
.st2-wel .sub{font-size:12px;color:#7d74a0;text-align:center;max-width:520px;line-height:1.75;margin-bottom:18px}
.st2-wel .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px;width:100%;max-width:720px}
.st2-wel .card{border:1px solid #2a1f47;border-radius:10px;padding:10px 12px;background:#120c24;cursor:pointer;text-align:left}
.st2-wel .card:hover{border-color:var(--accent);background:#180f30}
.st2-wel .card .k{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#cfc6ea}
.st2-wel .card kbd{background:#241a42;border:1px solid #33265c;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:9.5px;font-family:var(--st-mono);color:var(--accent2)}
.st2-wel .card .d{font-size:10.5px;color:#5b5382;margin-top:3px;line-height:1.5}
.st2-wel .langs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:640px;margin-top:16px}
.st2-wel .langs span{font-size:9.5px;background:#150d29;border:1px solid #221a3c;color:#6f6690;border-radius:5px;padding:1.5px 6px}

/* overlays: palette, quick open, diff, settings */
.st2-modal{position:fixed;inset:0;background:rgba(5,2,14,.62);z-index:400;display:flex;align-items:flex-start;justify-content:center;padding-top:11vh;backdrop-filter:blur(2px)}
.st2-pal{width:600px;max-width:92vw;background:#150d29;border:1px solid #3a2c63;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.st2-pal-in{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid #2a1f47}
.st2-pal-in input{flex:1;background:none;border:none;outline:none;color:#e6dffc;font-size:14.5px;font-family:inherit}
.st2-pal-in input::placeholder{color:#5b5382}
.st2-pal-in .tag{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#5b5382;border:1px solid #2a1f47;border-radius:4px;padding:1px 6px}
.st2-pal-list{overflow:auto;padding:5px}
.st2-pal-i{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;cursor:pointer;color:#b6abd6;font-size:12.5px}
.st2-pal-i.on{background:#241a42;color:#e6dffc}
.st2-pal-i .ic{width:17px;text-align:center;flex:none}
.st2-pal-i .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st2-pal-i .lbl b{color:var(--accent2);font-weight:600}
.st2-pal-i .sub{font-size:10.5px;color:#5b5382;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44%}
.st2-pal-i .kc{font-size:9.5px;color:#5b5382;background:#1c1236;border:1px solid #2a1f47;border-radius:3px;padding:0 4px;flex:none}
.st2-pal-f{border-top:1px solid #2a1f47;padding:5px 12px;font-size:10px;color:#5b5382;display:flex;gap:12px}
.st2-pal-f b{color:#8a80ab;font-weight:600}

.st2-diff{width:min(880px,94vw);max-height:76vh;background:#150d29;border:1px solid #3a2c63;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden}
.st2-diff-h{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid #2a1f47;flex:none}
.st2-diff-h .t{font-size:13px;color:#e6dffc;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st2-diff-h .st{font-size:10.5px;margin-left:auto;display:flex;gap:8px;flex:none}
.st2-diff-h .st .a{color:#63c47c}.st2-diff-h .st .d{color:#e8798f}
.st2-diff-b{flex:1;overflow:auto;font-family:var(--st-mono);font-size:11.5px;line-height:1.68;padding:6px 0}
.st2-dl{display:flex;padding:0 12px;white-space:pre}
.st2-dl .ln{color:#5e5480;flex:none;width:34px;text-align:right;padding-right:11px;user-select:none}
.st2-dl .tx{flex:1}
.st2-dl.add{background:rgba(46,160,67,.13)}.st2-dl.add .ln{color:#63c47c}
.st2-dl.del{background:rgba(248,81,73,.13)}.st2-dl.del .ln{color:#e8798f}
.st2-dl.ctx .tx{color:#9a90bd}
.st2-diff-f{flex:none;display:flex;align-items:center;gap:8px;padding:9px 15px;border-top:1px solid #2a1f47;font-size:11px;color:#6f6690}
.st2-diff-f .rt{margin-left:auto;display:flex;gap:7px}
.st2-tier{font-size:10px;letter-spacing:.4px;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap;font-weight:600}
.st2-tier.mech{color:#63c47c;border-color:#2f5c3c;background:#12261a}
.st2-hl-inline .cmt{color:#5e5480;font-style:italic}
.st2-hl-inline .str{color:#9ad48b}
.st2-hl-inline .num{color:#e0a86b}
.st2-hl-inline .kw{color:#c58af0}
.st2-hl-inline .fn{color:#e8c96b}
.st2-hl-inline .bi{color:#6fb0e8}
.st2-hl-inline .op,.st2-hl-inline .pun{color:#9d92bd}
.st2-tier.ai{color:#e0b155;border-color:#5c4a22;background:#241d10}
.st2-diff-note{flex:none;padding:7px 15px;font-size:11px;color:#8a80ab;background:#120c22;border-bottom:1px solid #1e1638}
.st2-btn{background:#1c1236;border:1px solid #2a1f47;color:#b6abd6;border-radius:7px;padding:5px 13px;font-size:11.5px;cursor:pointer;font-family:inherit}
.st2-btn:hover{border-color:var(--accent);color:var(--accent2)}
.st2-btn.fix{border-color:#2f5c3c;color:#7fd898;background:#14261a;padding:1px 8px;font-size:10px;line-height:1.5}
.st2-btn.fix:hover{border-color:#63c47c;color:#a9ecbd}
.st2-pfixall{display:flex;align-items:center;gap:10px;padding:7px 12px;margin-bottom:4px;border:1px solid #2f5c3c;border-radius:8px;background:#12261a;color:#7fd898;font-size:11px}
.st2-pfixall .st2-btn{margin-left:auto}
.st2-btn.pri{background:linear-gradient(135deg,#d4a53f,#a97a1e);border-color:transparent;color:#16092e;font-weight:700}
.st2-btn.pri:hover{filter:brightness(1.1)}
.st2-btn.dng{border-color:rgba(232,121,143,.5);color:#e8798f}
.st2-btn.dng:hover{background:rgba(232,121,143,.15);border-color:#e8798f}

.st2-set{width:min(760px,94vw);max-height:78vh;background:#150d29;border:1px solid #3a2c63;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden}
.st2-set-b{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.st2-set-g .h{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6f6690;font-weight:700;margin-bottom:8px}
.st2-set-r{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12px;color:#b6abd6}
.st2-set-r .lbl{flex:1}
.st2-set-r .lbl small{display:block;color:#5b5382;font-size:10.5px;line-height:1.5;margin-top:1px}
.st2-set-r input[type=range]{width:120px;accent-color:var(--accent)}
.st2-set-r select,.st2-set-r input[type=text]{background:#0d0820;border:1px solid #2a1f47;border-radius:6px;color:#e6dffc;padding:4px 8px;font-size:11.5px;outline:none;font-family:inherit}
.st2-set-r .sw{width:34px;height:18px;border-radius:10px;background:#2a1f47;position:relative;cursor:pointer;transition:background .15s;flex:none}
.st2-set-r .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#7d74a0;transition:transform .15s,background .15s}
.st2-set-r .sw.on{background:rgba(212,165,63,.4)}
.st2-set-r .sw.on::after{transform:translateX(16px);background:var(--accent)}
.st2-badge{font-size:9.5px;background:#1c1236;border:1px solid #2a1f47;border-radius:4px;color:#7d74a0;padding:1px 6px;letter-spacing:.4px}
.st2-badge.g{color:#63c47c;border-color:rgba(46,160,67,.4)}
.st2-badge.y{color:#e0b155;border-color:rgba(224,177,85,.4)}
.st2-badge.r{color:#e8798f;border-color:rgba(232,121,143,.4)}
.st2-mono{font-family:var(--st-mono)}
.st2-scroll-x{overflow-x:auto}
.st2-hr{height:1px;background:#2a1f47;margin:2px 0}
.st2-note{font-size:10.5px;color:#5b5382;line-height:1.6}
/* ---- Phase 9: Connections — the always-on authority panel ---- */
.st2-conn{padding:2px 0 6px}
.st2-conn-row{display:flex;align-items:center;gap:6px;padding:3px 12px;font-size:11px;cursor:pointer;color:#8a80ab;line-height:1.5}
.st2-conn-row:hover{background:#1c1236;color:#e6dffc}
.st2-conn-dot{width:7px;height:7px;border-radius:50%;flex:none;background:#4a4068;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.st2-conn-row.connected .st2-conn-dot{background:#4ec98a;box-shadow:0 0 7px rgba(78,201,138,.65)}
.st2-conn-row.needs    .st2-conn-dot{background:#e0b155;box-shadow:0 0 7px rgba(224,177,85,.6)}
.st2-conn-row.error    .st2-conn-dot{background:#e8798f;box-shadow:0 0 7px rgba(232,121,143,.6)}
.st2-conn-row.checking .st2-conn-dot{background:#7c6cff;animation:st2-pulse 1s ease-in-out infinite}
@keyframes st2-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.st2-conn-ico{flex:none;font-size:11px;width:13px;text-align:center}
.st2-conn-name{flex:none;color:#b9aee0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st2-conn-row.connected .st2-conn-name{color:#e6dffc}
.st2-conn-det{margin-left:auto;font-size:9.5px;color:#6f6690;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%;padding-left:4px}
.st2-conn-row.needs .st2-conn-det{color:#c9a45c}
.st2-conn-row.error .st2-conn-det{color:#c97386}
.st2-conn-cell.e{color:#e8798f}.st2-conn-cell.w{color:#e0b155}.st2-conn-cell.g{color:#4ec98a}
/* manage sheet */
.st2-conn-sheet{position:absolute;inset:0;margin:auto;width:460px;max-width:92vw;height:fit-content;max-height:82vh;display:flex;flex-direction:column;background:#150d29;border:1px solid #2f2350;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden}
.st2-conn-body{padding:12px 14px 16px;overflow:auto;font-size:11.5px;color:#a89ec8;line-height:1.7}
.st2-conn-sum{font-size:12.5px;color:#cfc6ea;margin-bottom:8px}
.st2-conn-sum .w{color:#e0b155}.st2-conn-sum .e{color:#e8798f}
.st2-conn-hint{font-size:10.5px;color:#6f6690;margin-bottom:10px;line-height:1.6}
.st2-conn-item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer}
.st2-conn-item:hover{background:#1e1638}
.st2-conn-state{display:inline-block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:#241a40;color:#b9aee0;margin-bottom:8px}
.st2-conn-state.connected{background:rgba(78,201,138,.16);color:#4ec98a}
.st2-conn-state.needs{background:rgba(224,177,85,.16);color:#e0b155}
.st2-conn-state.error{background:rgba(232,121,143,.16);color:#e8798f}
.st2-conn-cred{margin:8px 0;padding:7px 9px;background:#1a1030;border:1px solid #2a1f47;border-radius:6px;color:#8a80ab;font-size:11px;word-break:break-all}
.st2-conn-cred code{color:#d4a53f}
.st2-conn-note{margin:8px 0;font-size:10.5px;color:#6f6690;line-height:1.65}
.st2-conn-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ============================================================ OS PHASE 10-14 */
/* Locations / mounts */
.mp{padding:4px 2px}
.mp-h{font-size:12.5px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.mp-k{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#6f6690;margin:14px 0 7px}
.mp-row{display:block;width:100%;text-align:left;background:#1a1130;border:1px solid #2c2150;
  border-radius:9px;padding:10px 12px;margin-bottom:7px;cursor:pointer;color:var(--text);font:inherit}
.mp-row:hover{border-color:var(--accent);background:#221640}
.mp-row b{display:block;font-size:13px;font-weight:600}
.mp-row span{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.mp-row.off{opacity:.5;cursor:not-allowed}
.mp-row.live{cursor:default;border-color:#2e6b45}
.mp-row.live:hover{border-color:#2e6b45;background:#1a1130}
.mp-un{float:right;font-size:10.5px;background:none;border:1px solid #463a6b;color:#b9aee0;
  border-radius:6px;padding:2px 7px;cursor:pointer;margin-top:-2px}
.mp-un:hover{border-color:#e1706b;color:#e1706b}
.mp-cur{font-size:12px;color:var(--muted);padding:6px 2px}
.mp-cur.dim{opacity:.65}
.mp-note{font-size:11px;color:#6f6690;line-height:1.55;margin-top:12px;
  border-left:2px solid #2c2150;padding-left:9px}
.cyrus-mnt-badge{position:fixed;right:10px;bottom:8px;z-index:60;font-size:10.5px;
  background:rgba(26,17,48,.94);border:1px solid #3a2c5e;color:#9b8ec9;
  border-radius:999px;padding:3px 11px;cursor:pointer;font-family:var(--st-mono,monospace)}
.cyrus-mnt-badge:hover{border-color:var(--accent);color:var(--accent)}

/* System panel */
.cyr-sys{padding:12px 14px;overflow:auto;height:100%}
.cyr-sys-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cyr-sys-src{font-size:11px;color:var(--muted);margin-left:auto}
.cyr-sys-g{margin-bottom:16px}
.cyr-sys-g h4{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#6f6690;
  margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #241a44}
.cyr-sys-r{display:grid;grid-template-columns:150px 1fr 78px;gap:4px 10px;padding:6px 8px;
  border-radius:6px;align-items:baseline}
.cyr-sys-r:nth-child(odd){background:rgba(255,255,255,.022)}
.cyr-sys-r .k{font-size:12px;color:var(--muted)}
.cyr-sys-r .v{font-size:12.5px;font-family:var(--st-mono,monospace);color:var(--text);word-break:break-word}
.cyr-sys-r .p{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;text-align:right;color:#3f8f5e}
.cyr-sys-r .n{grid-column:2/4;font-size:10.5px;color:#6f6690;line-height:1.45}
.cyr-sys-r.unavailable .v{color:#6f6690;font-style:italic}
.cyr-sys-r.unavailable .p{color:#8a5a3a}

/* Snapshots */
.cyr-snap{padding:12px 14px;overflow:auto;height:100%}
.cyr-snap-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cyr-snap-n{font-size:10.5px;color:#6f6690;margin-left:auto}
.cyr-snap-r{border:1px solid #2c2150;border-radius:9px;padding:9px 11px;margin-bottom:7px;background:rgba(255,255,255,.02)}
.cyr-snap-r:hover{border-color:#3d2f66}
.cyr-snap-r .l{font-size:12.5px;font-weight:600}
.cyr-snap-r .m{font-size:10.5px;color:var(--muted);margin-top:2px}
.cyr-snap-r .a{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.cyr-snap-r .a .btn{font-size:11px;padding:4px 10px}
.cyr-snap-empty{font-size:12.5px;color:var(--muted);padding:22px 4px;line-height:1.6}

/* Profiles */
.cyr-prof{padding:12px 14px;overflow:auto;height:100%}
.cyr-prof-blurb{font-size:12px;line-height:1.65;color:var(--muted);
  border-left:2px solid var(--accent);padding-left:10px;margin:0 0 14px}
.cyr-prof-r{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid #2c2150;border-radius:9px;padding:9px 11px;margin-bottom:6px}
.cyr-prof-r b{font-size:13px}
.cyr-prof-r span{font-size:11px;color:var(--muted);margin-left:7px}
.cyr-prof-r em{display:block;font-size:10.5px;color:#6f6690;font-style:normal;margin-top:2px}
.cyr-prof-r .a{display:flex;gap:5px;flex-shrink:0}
.cyr-prof-r .a .btn{font-size:11px;padding:4px 9px}
.cyr-prof-empty{font-size:12.5px;color:var(--muted);padding:18px 4px;line-height:1.6}
.cyr-prof-new{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.cyr-prof-new input{flex:1;min-width:150px;background:#160e28;border:1px solid #2f2352;color:var(--text);
  border-radius:7px;padding:7px 10px;font:inherit;font-size:12px}
.cyr-prof-new input:focus{outline:none;border-color:var(--accent)}
.cyr-prof-note{font-size:11px;color:#6f6690;margin-top:10px}

/* Lock screen profile strip */
.cyr-lock-profiles{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.cyr-lock-p{background:rgba(31,20,52,.9);border:1px solid #3a2c5e;color:var(--text);

<script>
"use strict";
/* =========================================================================
   CYRUS OS — working browser port of the CYRUS intent→policy→action OS layer.
   Everything runs client-side: virtual filesystem, intent engine, permission
   gate, window manager, apps, audit log. State persists in localStorage.
   ========================================================================= */

// ------------------------------------------------ utils
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const daysAgo = n => Date.now()-n*86400000;
const fmtSize = kb => kb>=1048576 ? (kb/1048576).toFixed(1)+" GB" : kb>=1024 ? (kb/1024).toFixed(1)+" MB" : Math.round(kb)+" KB";
const fmtTime = ts => new Date(ts).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});

// ------------------------------------------------ event bus
const Bus = { m:{}, on(e,f){(this.m[e]=this.m[e]||[]).push(f);}, emit(e,d){(this.m[e]||[]).forEach(f=>{try{f(d)}catch(err){console.error(err)}});} };

// ------------------------------------------------ persistent store
const Store = {
  KEY:"cyrus_os_v2",
  data:null,
  load(){
    try{ this.data = JSON.parse(localStorage.getItem(this.KEY)); }catch(e){ this.data=null; }
    if(!this.data || !this.data.vfs){ this.data = { vfs: seedFS(), log: seedLog(), settings: defaultSettings(), notes:{} }; this.save(); }
    if(!this.data.settings) this.data.settings = defaultSettings();
    if(this.data.settings.accent==="#8b5cf6") this.data.settings.accent="#d4a53f"; // migrate old blue accent → royal gold
    // one-time: owner asked for maximum intelligence — unlock the cloud brain lane (can re-lock in Settings)
    if(!this.data.settings.brainUnlocked){ this.data.settings.brainUnlocked=true;
      if(this.data.settings.privacy==="local") this.data.settings.privacy="cloud"; this.save(); }
  },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){} },
  reset(){ localStorage.removeItem(this.KEY); location.reload(); }
};
function defaultSettings(){
  return { privacy:"local", accent:"#d4a53f", wallpaper:"default", anims:true, llmEndpoint:"", llmModel:"", notifications:null, brainLane:"astra",
           apiKeys:{}, endpoints:{}, usePuter:true, routeChain:null, routeModel:{}, routeStrategy:null };
}

// ------------------------------------------------ virtual filesystem
function mkFile(name, content, opts={}){
  const ext=(name.split(".").pop()||"").toLowerCase();
  return { type:"file", name, ext, content:content||"",
           size: opts.size != null ? opts.size : Math.max(2, Math.round((content||"").length/900)+40+Math.round(Math.random()*300)),
           mtime: opts.mtime || Date.now() };
}
function mkDir(name, children={}, opts={}){ return { type:"dir", name, children, mtime: opts.mtime||Date.now() }; }

function seedFS(){
  const home = mkDir("rithvik", {
    Documents: mkDir("Documents", {
      "AI Mining Presentation.pptx": mkFile("AI Mining Presentation.pptx",

        {size:4200, mtime:daysAgo(25)}),
      "AI mining research.pdf": mkFile("AI mining research.pdf",
        "Research paper draft: machine learning for rockfall hazard prediction. Covers feature engineering on seismic sensor streams, gradient boosted trees, and a comparison against baseline models. Related to the Rockfall dataset and the Smart Campus project.",
        {size:2100, mtime:daysAgo(28)}),
      "Rockfall dataset.csv": mkFile("Rockfall dataset.csv","sensor_id,timestamp,vibration,magnitude,label\n...",{size:15400, mtime:daysAgo(31)}),
      "resume.pdf": mkFile("resume.pdf","Rithvik — cybersecurity and AI projects: CrimeGraph, ThreatView, VulnScan, XAI Agent, Smart Campus.",{size:340, mtime:daysAgo(60)}),
      "Team meeting — Aug 19.txt": mkFile("Team meeting — Aug 19.txt","Discussed Smart Campus occupancy model training plan, dataset cleanup and the dashboard API. Next: finish model accuracy testing.",{size:12, mtime:daysAgo(26)}),
      "ML Notes": mkDir("ML Notes", {
        "transformers cheat sheet.pdf": mkFile("transformers cheat sheet.pdf","Attention is all you need — QKV, multi-head attention, positional encoding, masking. Notes from last semester deep learning course.",{size:890, mtime:daysAgo(105)}),
        "CNN notes.pdf": mkFile("CNN notes.pdf","Convolutional neural networks: kernels, pooling, feature maps. Lab exercises from last semester.",{size:760, mtime:daysAgo(118)}),
        "gradient descent.pdf": mkFile("gradient descent.pdf","Optimization: SGD, momentum, Adam, learning-rate schedules. Course notes.",{size:640, mtime:daysAgo(97)}),
      }),
      "java_assignments": mkDir("java_assignments", {
        "ArrayOps.java": mkFile("ArrayOps.java","public class ArrayOps { static int sum(int[] a){ int s=0; for(int x:a) s+=x; return s; } }",{size:4, mtime:daysAgo(75)}),
        "LinkedList.java": mkFile("LinkedList.java","public class LinkedList { Node head; static class Node { int v; Node next; } }",{size:5, mtime:daysAgo(74)}),
        "README.txt": mkFile("README.txt","DSA course assignments 1-4. Submit via college portal.",{size:1, mtime:daysAgo(76)}),
      }),
    }),
    Desktop: mkDir("Desktop", {
      "screenshot-2026-09-01.png": mkFile("screenshot-2026-09-01.png","",{size:2400, mtime:daysAgo(13)}),
      "todo.txt": mkFile("todo.txt","- finish smart campus model\n- clean desktop\n- email professor about ML notes",{size:1, mtime:daysAgo(4)}),
      "project.zip": mkFile("project.zip","",{size:912000, mtime:daysAgo(20)}),
      "dataset.csv": mkFile("dataset.csv","a,b,c\n1,2,3",{size:8200, mtime:daysAgo(9)}),
      "wallpaper.jpg": mkFile("wallpaper.jpg","",{size:3800, mtime:daysAgo(40)}),
    }),
    Downloads: mkDir("Downloads", {
      "paper-review.pdf": mkFile("paper-review.pdf","Reviewer comments on the AI mining rockfall prediction manuscript.",{size:560, mtime:daysAgo(6)}),
      "rockfall_dataset_v2.csv": mkFile("rockfall_dataset_v2.csv","sensor,vib,mag,label\n...",{size:22100, mtime:daysAgo(11)}),
    }),

      college: mkDir("college", {

            "api.py": mkFile("api.py","from flask import Flask, request, jsonify\napp = Flask(__name__)\n\n@app.route('/predict')\ndef predict():\n    return jsonify({'occupancy': 0.42})\n",{mtime:daysAgo(3)}),
          }),

        }),

        }),
      }),

    }),
  });
  return mkDir("/", { home: mkDir("home", { rithvik: home }) });
}

const VFS = {
  root:null,
  norm(base, p){
    if(p==null||p==="") return base;
    if(p==="~") p="/home/rithvik";
    if(p.startsWith("~/")) p="/home/rithvik/"+p.slice(2);
    let parts = p.startsWith("/") ? p.split("/") : (base+"/"+p).split("/");
    const st=[];
    for(const seg of parts){ if(!seg||seg===".")continue; if(seg==="..")st.pop(); else st.push(seg); }
    return "/"+st.join("/");
  },
  node(path){
    if(path==="/"||path==="") return this.root;
    let cur=this.root;
    for(const seg of path.split("/").filter(Boolean)){
      if(!cur || cur.type!=="dir") return null;
      cur = cur.children[seg];
    }
    return cur||null;
  },
  parent(path){ const i=path.lastIndexOf("/"); return i<=0?"/":path.slice(0,i); },
  base(path){ return path.split("/").filter(Boolean).pop()||"/"; },
  mkdirp(path){
    let cur=this.root;
    for(const seg of path.split("/").filter(Boolean)){
      if(!cur.children[seg]) cur.children[seg]=mkDir(seg,{});
      cur=cur.children[seg];
      if(cur.type!=="dir") return null;
    }
    return cur;
  },
  writeFile(path, content){
    const dir=this.node(this.parent(path)); if(!dir||dir.type!=="dir") return false;
    const name=this.base(path);
    if(dir.children[name] && dir.children[name].type==="dir") return false;
    const ex=dir.children[name];
    if(ex){ ex.content=content; ex.mtime=Date.now(); ex.size=Math.max(2,Math.round(content.length/900)+2); }
    else dir.children[name]=mkFile(name,content);
    Bus.emit("vfs"); Store.save(); return true;
  },
  detach(path){
    const node=this.node(path); if(!node) return null;
    const dir=this.node(this.parent(path));
    delete dir.children[this.base(path)];
    return node;
  },
  attach(dirPath, node){
    const dir=this.node(dirPath); if(!dir||dir.type!=="dir") return false;
    dir.children[node.name]=node; Bus.emit("vfs"); Store.save(); return true;
  },
  move(src, dstDirPath){
    const node=this.detach(src); if(!node) return false;
    const dst=this.node(dstDirPath);
    if(dst && dst.type==="dir" && !dst.children[node.name]){ dst.children[node.name]=node; }
    else { // rename
      const pd=this.node(this.parent(dstDirPath)); if(!pd) return false;
      node.name=this.base(dstDirPath); pd.children[node.name]=node;
    }
    Bus.emit("vfs"); Store.save(); return true;
  },
  remove(path){
    const node=this.detach(path); if(!node) return false;
    Bus.emit("vfs"); Store.save(); return true;
  },
  walk(path, fn){
    const n=this.node(path); if(!n) return;
    if(n.type==="file"){ fn(path, n); return; }
    for(const name of Object.keys(n.children)) this.walk((path==="/"?"":path)+"/"+name, fn);
  },
  allFiles(){ const out=[]; this.walk("/home/rithvik",(p,n)=>out.push({path:p,node:n})); return out; },
  sizeOf(path){ const n=this.node(path); if(!n) return 0; if(n.type==="file") return n.size||0; let t=0; this.walk(path,(p,f)=>t+=f.size||0); return t; }
};

// ------------------------------------------------ CYRUS Memory — persistent facts CYRUS is told
// "remember that X" → saved to ~/Memory/cyrus-memory.json + re-injected into every conversation.
const MemoryC = {
  path:"/home/rithvik/Memory/cyrus-memory.json",
  _cache:null,
  facts(){
    if(this._cache) return this._cache;
    const n=VFS.node(this.path);
    try{ this._cache = n && n.type==="file" ? JSON.parse(n.content||"[]") : []; }catch(e){ this._cache=[]; }
    return this._cache;
  },
  save(){
    VFS.mkdirp("/home/rithvik/Memory");
    VFS.writeFile(this.path, JSON.stringify(this.facts(),null,2));
    this._cache=null; // re-read from VFS (single source of truth, persists via Store)
  },
  add(text, source){
    text=String(text||"").trim(); if(!text) return false;
    const facts=this.facts();
    if(facts.some(f=>f.text.toLowerCase()===text.toLowerCase())) return false;
    facts.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), text:text.slice(0,220),
                   ts:Date.now(), source:source||"chat"});
    if(facts.length>100) facts.length=100;
    this.save(); return true;
  },
  forget(id){ const f=this.facts(); const i=f.findIndex(x=>x.id===id); if(i<0) return false; f.splice(i,1); this.save(); return true; },
  clearAll(){ this._cache=[]; this.save(); },
  // fact lines for the persona (most recent 20)
  block(){
    const f=this.facts().slice(0,20);
    if(!f.length) return "";
    return "\n\nWHAT CYRUS REMEMBERS (told by the user across sessions — treat as true):\n" +
      f.map(x=>"• "+x.text).join("\n");
  },
  // detect "remember that ..." requests in chat text; returns saved fact or null
  capture(text){
    const m=String(text||"").match(/^\s*(?:hey\s+)?(?:cyrus[,:]?\s*)?(?:please\s+)?remember(?:\s+(?:that|this))?[\s:,-]+(.+)$/is);
    if(!m) return null;
    let fact=m[1].trim().replace(/[.!?]+$/,"");
    if(fact.length<3 || /^(to\s+)?(open|run|delete|move|find)\b/i.test(fact)) return null; // that's an action, not a memory
    return this.add(fact) ? fact : null;
  }
};

// ------------------------------------------------ Smart Organizer — AI-proposed folder cleanup, review-before-apply, undoable
const IOrganizer = {
  lastUndo:null,
  async plan(folderPath){
    const node=VFS.node(folderPath); if(!node||node.type!=="dir") throw new Error("folder not found");
    const items=Object.values(node.children).filter(n=>n.type==="file").map(n=>n.name);
    if(items.length<2) throw new Error("not enough files in "+folderPath+" to organize");
    const r=await Router.chat([
      {role:"system", content:"You organize a user's folder. Given file names, propose 2-4 AI folders and an assignment for EVERY file. Reply ONLY minified JSON: {\"folders\":[\"Suggested Name\",...],\"moves\":[{\"file\":\"exact name\",\"to\":\"Suggested Name\"}]}. Group by purpose/topic, never by extension alone. Keep names short and human."},
      {role:"user", content:"Folder: "+folderPath+"\nFiles:\n"+items.join("\n")}
    ],{taskType:"general", temperature:.3, maxTokens:500});
    if(!r.ok) throw new Error((r.errors||["router offline"]).join("; ").slice(0,140));
    const m=r.text.match(/\{[\s\S]*\}/); if(!m) throw new Error("model did not return a plan");
    const p=JSON.parse(m[0]);
    if(!Array.isArray(p.moves)||!Array.isArray(p.folders)) throw new Error("bad plan shape");
    return {folders:p.folders.slice(0,5), moves:p.moves.filter(x=>x&&x.file&&x.to&&items.includes(x.file)).slice(0,80), via:r.via};
  },
  apply(folderPath, plan){
    const applied=[];
    plan.folders.forEach(f=>VFS.mkdirp(folderPath+"/"+f));
    plan.moves.forEach(mv=>{
      const src=folderPath+"/"+mv.file;
      if(VFS.node(src) && VFS.node(folderPath+"/"+mv.to)){
        if(VFS.move(src, folderPath+"/"+mv.to)) applied.push({from:src, to:folderPath+"/"+mv.to+"/"+mv.file});
      }
    });
    this.lastUndo={folder:folderPath, applied};
    Log.record("organize "+folderPath,"organize",{moves:applied.length},"medium",true,true,"AI plan applied after review via "+(plan.via||""));
    return applied.length;
  },
  undo(){
    if(!this.lastUndo) return 0;
    let n=0; this.lastUndo.applied.forEach(m=>{ if(VFS.move(m.to, this.lastUndo.folder)) n++; });
    this.lastUndo=null; return n;
  }
};

      <div class="win-body"></div>`;
    layer.appendChild(e);

      if(ev.target.closest(".wbtn"))return;

      const ox=ev.clientX-r.left, oy=ev.clientY-r.top;
