    cs.lineHeight = S.get("lineHeight")+"px";
    ed._measure();
    ed.mm.style.display = S.get("minimap") ? "" : "none";
    ed.gut.style.display = S.get("gutter") ? "" : "none";
    ed.ta.style.whiteSpace = S.get("wordWrap") ? "pre-wrap" : "pre";
    ed.ta.setAttribute("wrap", S.get("wordWrap") ? "soft" : "off");
    this.r.side.style.width = (S.get("sideWidth")||236)+"px";
    this.r.right.style.width = (S.get("rightWidth")||330)+"px";
    this.r.right.classList.remove("w1","w2");
    if(S.get("rightWidth")<280) this.r.right.classList.add("w1");
    if(S.get("rightWidth")>400) this.r.right.classList.add("w2");
    ed.render(); this.renderStatus();
  },
  cycleTheme(){

  },

  showSettings(){

    const row = (label, hint, ctrl)=>`<div class="st2-set-r"><div class="lbl">${label}${hint?`<small>${hint}</small>`:""}</div>${ctrl}</div>`;
    const sw = (key)=>`<div class="sw ${S.get(key)?"on":""}" data-sw="${key}"></div>`;

// ============================================================================
//  PHASE 9 — CONNECT · persistent provider authority
//
//  The problem this solves: the Puter SDK deliberately discards its stored
//  session on web pages (`discardStoredSessionToken_()` runs on every web
//  boot), so its popup asks for a sign-in over and over. But `setAuthToken()`
//  is public and `puter.authToken` is readable after any sign-in.
//
//  So the authority only has to be obtained ONCE. CYRUS captures it, stores it
//  next to the provider keys it already keeps, and re-applies it on every boot.
//
//  Honesty rule (same one the whole project runs on): a provider is only ever
//  shown green when something actually proved it. A 401 is amber, a failing
//  probe is red. We never round a guess up into a claim.
// ============================================================================

const StConn = {
  // ---- every provider, and what each one must actually prove to be "connected"
  META: {
    local:        { label:"Local rule engine", icon:"⚙️",  kind:"local" },
    puter:        { label:"Puter",             icon:"🌐",  kind:"authority" },
    openai:       { label:"OpenAI",            icon:"✨",  kind:"key" },
    groq:         { label:"Groq",              icon:"⚡",  kind:"key" },
    gemini:       { label:"Google AI Studio",  icon:"🔵",  kind:"key" },
    openrouter:   { label:"OpenRouter",        icon:"🧭",  kind:"key" },
    pollinations: { label:"Pollinations",      icon:"🌸",  kind:"keyless" },
    ollama:       { label:"Ollama (local PC)", icon:"🦙",  kind:"local" },
    did:          { label:"D-ID avatar",       icon:"🗣️",  kind:"key" },
  },
  ORDER: ["puter","openai","groq","gemini","openrouter","pollinations","ollama","did","local"],
  // `local` is offline and unconditional, so counting it would just inflate the score.
  SCORED: ["puter","openai","groq","gemini","openrouter","pollinations","ollama","did"],

  rows:{},          // id -> { state, detail, model, at }
  attached:null,    // the StApp we render into, if Studio is open
  _toasted:false,   // the "authority saved" nudge, once per page load

  // ---- state vocabulary ----------------------------------------------------
  // connected : proven working right now
  // needs     : has an authority/key but has not proved it since boot
  // off       : nothing stored, nothing to prove
  // error     : actively failing (this is what Pollinations lands on today)
  // checking  : a probe is in flight
  STATES: ["connected","needs","off","error","checking"],

  // ---- small helpers -------------------------------------------------------
  meta(id){ return this.META[id] || { label:id, icon:"•", kind:"key" }; },
  row(id){ return this.rows[id] || (this.rows[id] = { state:"off", detail:"not checked", model:"", at:0 }); },
  set(id, state, detail, model){
    const r = this.row(id);
    r.state = state;
    if(detail !== undefined) r.detail = detail;
    if(model  !== undefined) r.model = model;
    r.weak = false;                 // only a verified authority clears this
    r.at = Date.now();
    this.paint();
    return r;
  },
  paint(){
    if(this.attached) this.renderInto(this.attached.r && this.attached.r.conn);
    if(this.attached && this.attached.renderStatus) this.attached.renderStatus();
    Bus.emit("conn", this.summary());
  },

  // ---- the stored authority ------------------------------------------------
  token(){ return (Router.keys().puterToken || "").trim(); },
  key(id){ return (Router.keys()[id] || "").trim(); },
  endpoint(){ return (Router.endpoints().ollama || "").trim(); },

  // A token is only a token if it survives this. Anything that looks like a
  // stringified object, a boolean or a one-word error must never be stored —
  // that is how a broken capture silently poisons every later boot.
  normalize(t){
    if(typeof t !== "string") return "";
    let s = t.trim();
    if(s.length >= 2){
      const a = s[0], b = s[s.length-1];
      if((a === '"' && b === '"') || (a === "'" && b === "'")) s = s.slice(1,-1).trim();
    }
    if(!s) return "";
    const junk = ["undefined","null","[object object]","true","false","nan","promise"];
    if(junk.indexOf(s.toLowerCase()) >= 0) return "";
    if(s.length < 16) return "";
    return s;
  },

  // Four places a live Puter authority can be found, best first. We take the
  // first that survives normalize(); the source is kept so the UI can be honest
  // about where the authority actually came from.
  readToken(){
    const found = [];
    try{ if(window.puter && typeof window.puter.authToken === "string") found.push(["puter.authToken", window.puter.authToken]); }catch(e){}
    try{
      const st = window.puter && window.puter.puterAuthState;
      if(st && st.authGranted && typeof window.puter.authToken === "string") found.push(["sign-in", window.puter.authToken]);
    }catch(e){}
    try{ const v = localStorage.getItem("puter.auth.token.v2"); if(v) found.push(["puter.auth.token.v2", v]); }catch(e){}
    try{ const v = localStorage.getItem("puter.auth.token");      if(v) found.push(["puter.auth.token", v]); }catch(e){}
    for(let i=0;i<found.length;i++){
      const n = this.normalize(found[i][1]);
      if(n) return { token:n, src:found[i][0] };
    }
    return { token:"", src:"" };
  },

  // Capture and persist, if we have anything real and it is not already stored.
  // Returns true when the stored authority actually changed.
  capture(reason){
    const got = this.readToken();
    if(!got.token) return false;
    if(got.token === this.token()) return false;
    Router.keys().puterToken = got.token;
    Store.save();
    Log.record("connections: captured Puter authority", "studio_conn",
               { provider:"puter", action:"autocapture", from:got.src, reason:reason||"boot" },
               "low", true, true, "Puter authority saved — you will not be asked to sign in again.");
    if(!this._toasted){
      this._toasted = true;
      Toast.show("Connections", "Puter authority saved — you will not be asked to sign in again.", null, "ok");
    }
    this.set("puter","needs","authority saved from " + got.src + ", verifying…");
    return true;
  },

  // Puter fires onAuth the moment a sign-in completes. Hooking it means the
  // authority is captured then, not whenever the next chat happens to run.
  hookAuth(){
    try{
      const p = window.puter;
      if(!p) return false;
      p.onAuth = ()=>{ this.capture("sign-in"); this.verify("puter"); };
      return true;
    }catch(e){ return false; }
  },

  // ---- proving it ----------------------------------------------------------
  withTimeout(pr, ms){
    return Promise.race([ pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timed out")), ms)) ]);
  },

  // The Puter authority is only green when the SDK actually resolves an identity
  // behind it (whoami, else getUser). Token presence alone is not proof, and if
  // neither surface exists we mark the claim weak rather than dress it up.
  async whoami(){
    if(!this.token()) return { ok:false, why:"no authority saved yet" };
    try{ await this.withTimeout(Router.puterReady(), 12000); }
    catch(e){ return { ok:false, why:"Puter SDK did not load" }; }
    const p = window.puter;
    if(!p) return { ok:false, why:"Puter SDK did not load" };
    if(typeof p.whoami === "function"){
      try{
        const u = await this.withTimeout(Promise.resolve(p.whoami()), 12000);
        if(u) return { ok:true, who:(u.username||u.email||u.sub||""), weak:false };
      }catch(e){
        const m = String((e && e.message) || e || "");
        if(/401|unauthor/i.test(m) || (e && e.status === 401)) return { ok:false, why:"401 — the saved authority was rejected" };
        return { ok:false, why:m.slice(0,60) || "whoami failed" };
      }
    }
    // The published SDK has no whoami on the global; getUser is the public
    // equivalent and it really does prove a signed-in identity behind the token.
    if(typeof p.getUser === "function"){
      try{
        const u = await this.withTimeout(Promise.resolve(p.getUser()), 12000);
        if(u) return { ok:true, who:(u.username||u.email||u.sub||""), weak:false };
        return { ok:false, why:"no signed-in user behind that authority" };
      }catch(e){
        const m = String((e && e.message) || e || "");
        if(/401|unauthor/i.test(m) || (e && e.status === 401)) return { ok:false, why:"401 — the saved authority was rejected" };
        return { ok:false, why:m.slice(0,60) || "getUser failed" };
      }
    }
    // Nothing to verify with — say so instead of dressing a token up as proof.
    return { ok:!!this.normalize(p.authToken), who:"", weak:true };
  },

  // Verify one provider for real. Never trusts "the token exists".
  async verify(id){
    const kind = this.meta(id).kind;
    if(kind === "local" && id === "local"){
      this.set("local","connected","offline · always on");
      return this.row("local");
    }
    if(id === "ollama"){
      if(!this.endpoint()){ this.set("ollama","off","no endpoint set"); return this.row("ollama"); }
      this.set("ollama","checking","asking your machine…");
      const ok = await this.withTimeout(Router.probe("ollama"), 3000).catch(()=>false);
      this.set("ollama", ok ? "connected" : "error", ok ? "answering" : "no answer from that endpoint");
      return this.row("ollama");
    }
    if(id === "puter"){
      // Nothing stored is "off", not "needs" — the same condition must not
      // produce two different states depending on which path noticed it.
      if(!this.token()){
        this.set("puter","off","sign in once — then CYRUS keeps it");
        return this.row("puter");
      }
      this.set("puter","checking","verifying authority…");
      const r = await this.whoami();
      let model = "";
      try{ model = Router.pickModel("puter"); }catch(e){}
      if(r.ok){
        const who = r.who ? " · " + r.who : "";
        this.set("puter","connected", (r.weak ? "authority saved (unverified)" : "authority valid" + who), model);
        this.row("puter").weak = !!r.weak;   // say plainly when we only saw a token
      }else{
        this.set("puter","needs", r.why, model);
      }
      return this.row("puter");
    }
    // A keyless provider has no key to check, so it must be probed on its own
    // terms — never short-circuited to "off" just because the key is empty.
    if(kind === "keyless"){
      this.set(id,"checking","probing…");
      let ok = false;
      try{ ok = !!(await this.withTimeout(Router.probe(id), 8000)); }catch(e){ ok = false; }
      if(ok){
        let model = "";
        try{ model = Router.pickModel(id); }catch(e){}
        this.set(id,"connected","no key needed", model);
      }else{
        this.set(id,"error","keyless, but the endpoint did not answer");
      }
      return this.row(id);
    }
    // key providers: nothing stored means nothing to prove
    if(!this.key(id)){ this.set(id,"off","no key saved"); return this.row(id); }
    this.set(id,"checking","checking key…");
    let ok = false;
    try{ ok = !!(await this.withTimeout(Router.probe(id), 8000)); }catch(e){ ok = false; }
    if(ok){
      let model = "";
      try{ model = Router.pickModel(id); }catch(e){}
      this.set(id,"connected", "key accepted", model);
    }else{
      this.set(id,"error","key stored but the endpoint did not accept it");
    }
    return this.row(id);
  },

  async verifyAll(ids){
    const list = (ids && ids.length) ? ids : this.SCORED;
    for(const id of list){ try{ await this.verify(id); }catch(e){ this.set(id,"error","check failed"); } }
    return this.summary();
  },

  // ---- boot ----------------------------------------------------------------
  // Runs when Studio opens. Re-applies whatever authority we already hold, then
  // checks each provider once. Keyless providers are verified lazily (they cost
  // a request); anything with a stored secret is checked immediately so the
  // panel is honest from the first frame.
  async restore(){
    this.booted = true;
    const hasToken = !!this.token();
    if(hasToken){
      try{ await this.withTimeout(Router.puterReady(), 12000); }catch(e){}
      this.hookAuth();
      this.capture("boot");                    // pick up a fresher one if the SDK has it
      await this.verify("puter");
    }else{
      this.set("puter","off","sign in once — then CYRUS keeps it");
    }
    const immediate = this.SCORED.filter(id => id !== "puter" && id !== "pollinations" && (this.key(id) || this.endpoint()));
    await this.verifyAll(immediate);
    // Pollinations is keyless: give it one probe so the panel can report its
    // real state (it currently 403s behind Turnstile — shown red, not green).
    try{ await this.withTimeout(Router.probe("pollinations"), 8000); }catch(e){}
    this.verify("pollinations");
    this.verify("local");
    this.paint();
    return this.summary();
  },

  // ---- acting on a row -----------------------------------------------------
  async connect(id){
    if(id === "puter") return this.connectPuter();
    if(id === "ollama"){ this.sheet("ollama"); return null; }
    this.sheet(id);
    return null;
  },

  // Puter's sign-in, then immediate capture. authenticateWithPuter is the
  // SDK's own entry point; if the SDK does not expose it we make a real call,
  // which raises the popup as a side effect.
  async connectPuter(){
    this.set("puter","checking","waiting for sign-in…");
    Toast.show("Puter", "Finish the sign-in in the popup — CYRUS keeps the authority from then on.");
    let got = false;
    try{
      await this.withTimeout(Router.puterReady(), 12000);
      this.hookAuth();
      const p = window.puter;
      if(p && p.ui && typeof p.ui.authenticateWithPuter === "function"){
        await this.withTimeout(Promise.resolve(p.ui.authenticateWithPuter()), 90000);
        got = true;
      }else if(p && p.ai && typeof p.ai.chat === "function"){
        await this.withTimeout(p.ai.chat("Reply with exactly: TOKEN-OK", { model:"gpt-4o-mini" }), 90000);
        got = true;
      }
    }catch(e){ /* the popup may have been blocked — say so rather than pretend */ }
    this.capture("connect");
    const r = await this.verify("puter");
    if(r.state === "connected"){
      Log.record("connections: Puter connected", "studio_conn", { provider:"puter", action:"connect", popup:got },
                 "low", true, true, "Puter authority obtained and stored.");
      Toast.show("Connections", "Puter connected — you will not be asked again.", null, "ok");
    }else{
      Log.record("connections: Puter sign-in did not complete", "studio_conn", { provider:"puter", action:"connect", popup:got },
                 "low", true, false, r.detail || "no authority captured");
      Toast.show("Puter", "No authority captured" + (got ? "" : " — the sign-in popup was likely blocked. Open CYRUS OS in its own tab, or paste a token in Settings → CYRUS Brain."), null, "warn");
    }
    return r;
  },

  setKey(id, value){
    const v = String(value || "").trim();
    if(!v){ this.forget(id); return null; }
    Router.keys()[id] = v;
    Store.save();
    Log.record("connections: key saved for " + id, "studio_conn", { provider:id, action:"key" },
               "low", true, true, "Key stored for " + this.meta(id).label + " (value never logged).");
    this.set(id,"checking","checking key…");
    return this.verify(id);
  },

  forget(id){
    if(id === "puter"){
      delete Router.keys().puterToken;
    }else{
      delete Router.keys()[id];
    }
    Store.save();
    Log.record("connections: forgot " + id, "studio_conn", { provider:id, action:"forget" },
               "low", true, true, "Removed the stored authority for " + this.meta(id).label + ".");
    this.set(id,"off","not connected");
    if(id === "puter") Toast.show("Connections", "Puter authority forgotten. Next use will ask you to sign in again.");
    return this.row(id);
  },

  // ---- summary for the status bar -----------------------------------------
  summary(){
    let live=0, need=0, err=0;
    for(const id of this.SCORED){
      const s = (this.rows[id] || {}).state;
      if(s === "connected") live++;
      else if(s === "error") err++;
      else if(s === "needs" || s === "checking") need++;
    }
    const p = this.rows.puter || {};
    return { live, need, err, total:this.SCORED.length, puter:p.state || "off" };
  },
  statusCell(){
    const s = this.summary();
    const tone = s.err ? " e" : s.need ? " w" : " g";
    const label = s.err ? (s.err + " failing") : s.need ? (s.need + " to connect") : (s.live + "/" + s.total + " live");
    return `<span class="s st2-conn-cell${tone}" data-s="conn" title="Connections — click to manage">🔑 ${esc(label)}</span>`;
  },

  // ---- rendering -----------------------------------------------------------
  rowHtml(id){
    const m = this.meta(id);
    const r = this.row(id);
    const detail = r.detail || "";
    const right = r.state === "connected" && r.model ? esc(r.model) : esc(detail);
    const title = m.label + " — " + (r.state||"off") + (detail ? ": " + detail : "");
    return `<div class="st2-conn-row ${r.state}" data-c="${esc(id)}" title="${esc(title)}">
      <span class="st2-conn-dot"></span>
      <span class="st2-conn-ico">${m.icon}</span>
      <span class="st2-conn-name">${esc(m.label)}</span>
      <span class="st2-conn-det">${right}</span>
    </div>`;
  },

  renderInto(node){
    if(!node) return;
    node.innerHTML = this.ORDER.map(id => this.rowHtml(id)).join("");
    const rows = node.querySelectorAll("[data-c]");
    for(let i=0;i<rows.length;i++) rows[i].onclick = ()=> this.sheet(rows[i].getAttribute("data-c"));
  },

  // ---- the manage sheet ----------------------------------------------------
  sheet(id){
    if(typeof stModal !== "function") return;
    const back = stModal();
    const body = id ? this.detailHtml(id) : this.listHtml();
    back.innerHTML = `<div class="st2-conn-sheet"><div class="st2-pane-h">${id ? esc(this.meta(id).label) : "Connections"}
        <span class="st2-act"><button data-x="close">✕</button></span></div>
      <div class="st2-conn-body">${body}</div></div>`;
    document.body.appendChild(back);
    const close = ()=>{ back.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e)=>{ if(e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    back.addEventListener("mousedown", (e)=>{ if(e.target === back) close(); });
    const x = back.querySelector('[data-x="close"]');
    if(x) x.onclick = close;

    const acts = back.querySelectorAll("[data-act]");
    for(let i=0;i<acts.length;i++){
      acts[i].onclick = async ()=>{
        const cid = acts[i].getAttribute("data-id");
        const what = acts[i].getAttribute("data-act");
        if(what === "close"){ close(); return; }
        if(what === "refresh"){ await this.verifyAll([cid]); close(); this.sheet(cid); return; }
        if(what === "forget"){ this.forget(cid); close(); this.sheet(cid); return; }
        if(what === "connect"){ close(); await this.connect(cid); if(id) this.sheet(id); return; }
        if(what === "savekey"){
          const inp = back.querySelector("[data-keyinput]");
          if(!inp) return;
          await this.setKey(cid, inp.value);
          close(); this.sheet(cid); return;
        }
      };
    }
  },

  listHtml(){
    const s = this.summary();
    const head = `<div class="st2-conn-sum"><b>${s.live}/${s.total}</b> proven live${s.need?` · <span class="w">${s.need} to connect</span>`:""}${s.err?` · <span class="e">${s.err} failing</span>`:""}</div>
      <div class="st2-conn-hint">Every provider only turns green when something actually proved it. A 401 shows amber; a failing probe shows red.</div>`;
    return head + this.ORDER.map(id=>{
      const m = this.meta(id);
      return `<div class="st2-conn-item ${this.row(id).state}" data-c2="${esc(id)}"><span class="st2-conn-dot"></span><span>${m.icon} ${esc(m.label)}</span><span class="st2-conn-det">${esc(this.row(id).detail||"")}</span></div>`;
    }).join("");
  },

  detailHtml(id){
    const m = this.meta(id), r = this.row(id);
    const prov = (typeof PROVIDERS !== "undefined" && PROVIDERS[id]) || null;
    const desc = prov && prov.desc ? prov.desc
      : id === "did" ? "Talking-avatar lane for the Assistant app. Optional."
      : "";
    let h = `<div class="st2-conn-state ${r.state}">${esc(r.state)}${r.weak?" (unverified)":""}</div>
      <div class="st2-conn-desc">${esc(desc)}</div>`;
    if(m.kind === "authority"){
      const t = this.token();
      h += `<div class="st2-conn-cred">${t ? "Authority saved · <code>••••••••" + esc(t.slice(-4)) + "</code>" : "No authority saved"}</div>`;
      h += `<div class="st2-conn-note">Puter discards its own web session on every reload. CYRUS captures the authority after one sign-in and re-applies it on every boot — that is why you are only ever asked once.</div>`;
      h += `<div class="st2-conn-btns">
        <button class="tb-btn" data-act="connect" data-id="${esc(id)}">${t?"Sign in again":"Sign in once"}</button>
        <button class="tb-btn" data-act="refresh" data-id="${esc(id)}">Re-verify</button>
        ${t?`<button class="tb-btn" data-act="forget" data-id="${esc(id)}">Forget</button>`:""}
      </div>`;
    }else if(m.kind === "key"){
      const k = this.key(id);
      h += `<div class="st2-conn-cred">${k ? "Key saved · <code>••••••••" + esc(k.slice(-4)) + "</code>" : "No key saved"}</div>`;
      h += `<input class="sw" type="password" data-keyinput placeholder="Paste your ${esc(m.label)} key" value="">
        <div class="st2-conn-btns">
          <button class="tb-btn" data-act="savekey" data-id="${esc(id)}">Save &amp; test</button>
          <button class="tb-btn" data-act="refresh" data-id="${esc(id)}">Re-verify</button>
          ${k?`<button class="tb-btn" data-act="forget" data-id="${esc(id)}">Forget</button>`:""}
        </div>`;
    }else if(m.kind === "keyless"){
      h += `<div class="st2-conn-note">No key and no sign-in. CYRUS probes it for real and reports what it finds — including failing.</div>
        <div class="st2-conn-btns"><button class="tb-btn" data-act="refresh" data-id="${esc(id)}">Probe now</button></div>`;
    }else{
      const ep = this.endpoint();
      h += `<div class="st2-conn-cred">${ep ? "Endpoint · <code>"+esc(ep)+"</code>" : "No endpoint set"}</div>
        <div class="st2-conn-btns"><button class="tb-btn" data-act="refresh" data-id="${esc(id)}">Probe now</button>
        <button class="tb-btn" data-act="close">Close</button></div>`;
    }
    return h;
  },

  // ---- attach to a running Studio -----------------------------------------
  attach(app){
    this.attached = app;
    this.renderInto(app.r && app.r.conn);
    if(!this.booted) this.restore();
    return this;
  },
  refreshAll(){ return this.restore(); },
};
// ============================================================================
//  OS PHASE 10 — REAL DISK
//  Phase 0 LANG · Phase 1 EDIT · Phase 2 XPL · Phase 3 PROJ · Phase 4 RUN
//  Phase 5 AI · Phase 6 NAV · Phase 7 EXT · Phase 8 POLISH · Phase 10 DISK
// ============================================================================
//  What this adds, and what it deliberately does not do.
//
//  CYRUS used to have exactly one filesystem: an in-memory tree inside a
//  localStorage JSON blob. Every window, the explorer and the shell talked to
//  it and nothing else existed. That is why `ls /` could never show a real
//  folder — there wasn't one to show.
//
//  This adds a `/mnt/<name>/...` namespace. A path under `/mnt/` is routed to a
//  backend; every other path keeps hitting the original tree **byte for byte**.
//  That is the whole trick. Nothing inside VFS was rewritten, no call site was
//  edited, and with nothing mounted CYRUS behaves exactly as it did before.
//
//  THE MIRROR IS NOT OPTIONAL — READ THIS BEFORE EDITING
//  ---------------------------------------------------
//  VFS is synchronous. Every one of its callers — the Files app, `cat`, the
//  Studio explorer, `rm` — expects a value back immediately. The three real
//  backends are not synchronous: `showDirectoryPicker()` hands back a promise,
//  and the bridge is HTTP. So a mount keeps a *mirror* of the real tree in
//  memory, built by an async `scan()`. Reads come from the mirror; writes
//  update the mirror immediately (so the rest of the OS sees a consistent
//  filesystem) and are pushed to the real device in the background.
//
//  The consequence, stated plainly rather than hidden: between a `write()` and
//  the push landing, a crash loses that write. `Mnt.flush()` resolves once
//  everything has landed, and every mount shows its own last-sync time, so the
//  window is visible rather than assumed away.
//
//  SAFETY
//  ------
//  A `showDirectoryPicker()` handle is scoped by the browser to the folder the
//  user actually chose — a mount physically cannot escape its root. The bridge
//  confines every path to `indexed_paths` in config.yaml and refuses to spawn a
//  shell, so CYRUS still never hands the model a terminal. Both are audited
//  through the same Log the rest of the OS uses.
// ============================================================================

// ------------------------------------------------ shared namespace
// Every later OS phase hangs off this one object. Defined here because this is
// the first chunk the build splices.
const Cyrus = {
  version:"p10-disk",
  // Defer work that touches globals defined *after* the splice point.
  // The marker sits at ~line 8586, but SCHEMAS / IntentEngine / Actions are
  // declared ~line 10100+, so a chunk that reads them at load time would throw
  // a temporal-dead-zone ReferenceError. `onReady` fires after the whole script
  // has run.
  _ready:[], _readyFired:false,
  onReady(fn){ if(this._readyFired){ try{ fn(); }catch(e){ console.error("[cyrus:onReady]",e); } } else this._ready.push(fn); },
  fireReady(){ if(this._readyFired) return; this._readyFired=true; this._ready.splice(0).forEach(fn=>{ try{ fn(); }catch(e){ console.error("[cyrus:onReady]",e); } }); },
  el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; },
  // `esc`, `fmtSize`, `sleep`, `Log`, `Toast`, `Modal`, `VFS`, `Store`, `Apps`,
  // `WM`, `Bus`, `CMDS`, `MAN` are all declared above the splice point and are
  // reachable directly. Anything below it must go through `onReady`.
  audit(user_text, intent, fields, risk, confirmed, ok, message){
    try{ Log.record(user_text, intent, fields, risk, confirmed, ok, message); }catch(e){ console.error("[cyrus:audit]",e); }
  },
};
// One timer after the script finishes is enough, and it costs no polling.
if(typeof window!=="undefined") setTimeout(()=>Cyrus.fireReady(), 0);

// A file too big to hold in the mirror is represented by size + mtime only.
// 1 MB is well past what the editor or `cat` can usefully show in one go.
const MIRROR_MAX = 1048576;

// ============================================================================
//  Mnt — the mount registry
// ============================================================================
const Mnt = {
  // name -> { name, label, kind, root, perms:{read,write}, tree, ready,
  //           lastSync, error, backend, dirty:Set<relPath> }
  mounts:new Map(),
  LISTENERS:[],

  get(name){ return this.mounts.get(name) || null; },
  names(){ return [...this.mounts.keys()]; },
  list(){ return [...this.mounts.values()]; },
  onChange(fn){ this.LISTENERS.push(fn); },
  emitChange(){ this.LISTENERS.forEach(f=>{ try{ f(); }catch(e){ console.error("[mnt:onChange]",e); } }); Bus.emit("mnt"); },

  // Parse "/mnt/real/Documents/a.txt" into {mount, sub:"/Documents/a.txt"}.
  // Returns null for any path that is not a mount path — which is the common
  // case, and the reason this is cheap to put in front of every VFS call.
  parse(path){
    if(typeof path!=="string" || path.indexOf("/mnt/")!==0) return null;
    const rest = path.slice(5);                 // strip "/mnt/"
    const slash = rest.indexOf("/");
    const name = slash<0 ? rest : rest.slice(0, slash);
    if(!name) return null;
    const m = this.mounts.get(name);
    if(!m) return null;
    const sub = slash<0 ? "/" : ("/" + rest.slice(slash+1));
    return { mount:m, name, sub };
  },
  isMounted(path){ return !!this.parse(path); },

  // "/mnt" itself lists the mounts; everything under it is a mount path.
  normalize(base, p){
    if(typeof p!=="string" || p==="") return base;
    let out = p.startsWith("/") ? p : (base+"/"+p);
    out = VFS.norm(base, out);
    if(out==="/mnt") return out;
    if(out.startsWith("/mnt/")) return out.replace(/\/+$/,"") || "/mnt";
    return out;
  },

  // ---- lifecycle -----------------------------------------------------------
  async mount(name, opts){
    const kind = opts.kind;
    const backend = this.backendFor(kind);
    if(!backend) throw new Error("no backend for kind: " + kind);
    const handle = opts.handle || await backend.acquire(opts);
    if(!handle) throw new Error("no handle — permission or a cancelled picker");
    const m = {
      name, label: opts.label || name, kind,
      root: handle,
      perms: { read: opts.read!==false, write: opts.write!==false },
      tree: mkDirNode("/", {}),
      ready:false, error:null, lastSync:0, dirty:new Set(),
      async scan(){ return backend.scan(handle); },
      backend,
    };
    this.mounts.set(name, m);
    await this.refresh(name);
    Cyrus.audit("mount "+name, "mount_disk", {kind, name}, "medium", true, true,
               "Mounted a real location as /mnt/"+name);
    this.emitChange();
    return m;
  },

  unmount(name){
    const m = this.mounts.get(name);
    if(!m) return false;
    this.mounts.delete(name);
    Cyrus.audit("umount "+name, "unmount_disk", {name}, "medium", true, true,
               "Unmounted /mnt/"+name);
    this.emitChange();
    return true;
  },

  // Re-read the real tree into the mirror. Called on mount, on demand from the
  // System panel, and after any operation that could have changed the disk
  // behind our back (someone in Explorer, a build finishing, the bridge running
  // a registered script).
  async refresh(name){
    const m = this.mounts.get(name);
    if(!m) return null;
    try{
      m.tree = await m.scan();
      m.ready = true; m.error = null; m.lastSync = Date.now();
    }catch(e){
      m.error = e && e.message ? e.message : String(e);
      m.ready = false;
      console.error("[mnt:refresh:"+name+"]", e);
    }
    return m;
  },

  // Resolve once every pending write has reached the real device. Anything that
  // must not lose work awaits this first.
  async flush(){
    const jobs = [];
    for(const m of this.mounts.values()){
      for(const rel of Array.from(m.dirty)){
        m.dirty.delete(rel);
        const node = nodeAt(m.tree, rel);
        jobs.push(m.backend.write(m.root, rel, node ? node.content : "")
          .catch(e=>{ m.error = e.message || String(e); console.error("[mnt:write]",e); }));
      }
    }
    await Promise.all(jobs);
    return jobs.length;
  },

  backendFor(kind){ return BACKENDS[kind] || null; },
  available(){ return Object.keys(BACKENDS).filter(k => BACKENDS[k].available()); },
};

// ---- tiny tree helpers (mirror format mirrors the VFS node shape exactly) ----
function mkDirNode(name, children){ return { type:"dir", name, children:children||{}, mtime:Date.now() }; }
function mkFileNode(name, content, size, mtime){
  return { type:"file", name, ext:(name.split(".").pop()||"").toLowerCase(),
           content: content==null ? null : String(content),
           size: size!=null ? size : String(content==null?"":content).length,
           mtime: mtime || Date.now(), mirrored:true };
}
function nodeAt(root, rel){
  let cur = root;
  for(const seg of String(rel).split("/").filter(Boolean)){
    if(!cur || cur.type!=="dir") return null;
    cur = cur.children[seg];
  }
  return cur || null;
}
function ensureDir(root, rel){
  let cur = root;
  for(const seg of String(rel).split("/").filter(Boolean)){
    if(!cur.children[seg] || cur.children[seg].type!=="dir") cur.children[seg] = mkDirNode(seg,{});
    cur = cur.children[seg];
  }
  return cur;
}

// ============================================================================
//  Backends — all async, all normalised to the same three operations
// ============================================================================
const BACKENDS = {

  // ---- the original in-browser tree, exposed as a mount -------------------
  // Not offered in the picker (it is always reachable at /), but defined so the
  // bridge and the panels can talk about every location in one vocabulary.
  vfs:{
    label:"CYRUS disk (browser storage)",
    available(){ return true; },
    async acquire(){ return null; },
    async scan(){ return VFS.node("/") ? VFS.node("/") : mkDirNode("/",{}); },
    async write(){ throw new Error("the CYRUS disk is written through VFS directly"); },
  },

  // ---- File System Access API: a real folder the user picked ---------------
  fsapi:{
    label:"Real folder (this device)",
    available(){ return typeof window!=="undefined" && typeof window.showDirectoryPicker==="function"; },
    hint:"Needs Chrome/Edge (or another Chromium browser) on a real page — a file:// tab has no picker.",
    async acquire(){
      return await window.showDirectoryPicker({ mode:"readwrite", id:"cyrus-root", startIn:"documents" });
    },
    async scan(dir){
      const out = mkDirNode("/", {});
      await walkFs(dir, "", out, 0);
      return out;
    },
    async write(dir, rel, content){
      const parts = String(rel).split("/").filter(Boolean);
      if(!parts.length) return;
      let d = dir;
      for(let i=0;i<parts.length-1;i++) d = await d.getDirectoryHandle(parts[i], {create:true});
      const fh = await d.getFileHandle(parts[parts.length-1], {create:true});
      const w = await fh.createWritable();
      await w.write(content==null? "" : String(content));
      await w.close();
    },
    async remove(dir, rel){
      const parts = String(rel).split("/").filter(Boolean);
      let d = dir;
      for(let i=0;i<parts.length-1;i++) d = await d.getDirectoryHandle(parts[i]);
      await d.removeEntry(parts[parts.length-1], {recursive:true});
    },
    async mkdir(dir, rel){ await ensureFsDir(dir, rel); },
    async move(dir, from, to){
      // The File System Access API has no rename, and there is no cross-device
      // move. Read-then-write is honest and correct; it is not atomic.
      const src = await nodeAt(await this.scan(dir), from);
      await this.write(dir, to, src && src.content!=null ? src.content : "");
    },
  },

  // ---- Origin Private File System: real files, private to this origin ------
  opfs:{
    label:"OPFS (private to this browser)",
    available(){ return !!(navigator.storage && navigator.storage.getDirectory); },
    hint:"Real files with no picker. Private to this browser profile; clearing site data deletes them.",
    async acquire(){
      const root = await navigator.storage.getDirectory();
      return root.getDirectoryHandle("cyrus", {create:true});
    },
    async scan(dir){ const out = mkDirNode("/",{}); await walkFs(dir, "", out, 0); return out; },
    async write(dir, rel, content){
      const parts = String(rel).split("/").filter(Boolean);
      if(!parts.length) return;
      let d = dir;
      for(let i=0;i<parts.length-1;i++) d = await d.getDirectoryHandle(parts[i], {create:true});
      const fh = await d.getFileHandle(parts[parts.length-1], {create:true});
      const w = await fh.createWritable(); await w.write(content==null? "" : String(content)); await w.close();
    },
    async remove(dir, rel){
      const parts = String(rel).split("/").filter(Boolean);
      let d = dir;
      for(let i=0;i<parts.length-1;i++) d = await d.getDirectoryHandle(parts[i]);
      await d.removeEntry(parts[parts.length-1], {recursive:true});
    },
    async mkdir(dir, rel){ await ensureFsDir(dir, rel); },
    async move(dir, from, to){ return BACKENDS.fsapi.move.call(this, dir, from, to); },
  },

  // ---- the optional local daemon ------------------------------------------
  bridge:{
    label:"CYRUS bridge (localhost)",
    available(){ return typeof location!=="undefined" && /^https?:$/.test(location.protocol); },
    hint:"Run `python -m cyrus.bridge` on this machine. Confined to indexed_paths; no shell.",
    async acquire(){ await Bridge.probe(); if(!Bridge.online) throw new Error(Bridge.lastError || "no bridge answered"); return {url:Bridge.url}; },
    async scan(){
      const tree = await Bridge.call("list", {path:"/"});
      return tree && tree.tree ? tree.tree : mkDirNode("/",{});
    },
    async write(dir, rel, content){ await Bridge.call("write", {path:rel, content:content==null?"":String(content)}); },
    async remove(dir, rel){ await Bridge.call("delete", {path:rel}); },
    async mkdir(dir, rel){ await Bridge.call("mkdir", {path:rel}); },
    async move(dir, from, to){
      // The bridge has a real rename primitive; use it rather than read-write-delete,
      // which would lose a file if the daemon died between the two calls.
      await Bridge.call("move", {from, to});
    },
  },
};

// Shared recursive scan for the two File System Access style backends.
const SCAN_MAX_FILES = 2000, SCAN_MAX_DEPTH = 12;
async function walkFs(dir, prefix, out, depth){
  if(depth > SCAN_MAX_DEPTH) return;
  let count = 0;
  for await(const [name, handle] of dir.entries()){
    if(count++ > SCAN_MAX_FILES || out.__full) return;
    const rel = prefix + "/" + name;
    if(handle.kind === "directory"){
      const sub = mkDirNode(name, {});
      out.children[name] = sub;
      await walkFs(handle, rel, sub, depth+1);
      if(out.__full) return;
    }else{
      try{
        const f = await handle.getFile();
        if(f.size > MIRROR_MAX){
          out.children[name] = mkFileNode(name, null, f.size, f.lastModified);
        }else{
          out.children[name] = mkFileNode(name, await f.text(), f.size, f.lastModified);
        }
      }catch(e){ out.children[name] = mkFileNode(name, null, 0, Date.now()); }
    }
  }
}
async function ensureFsDir(dir, rel){
  let d = dir;
  for(const seg of String(rel).split("/").filter(Boolean)) d = await d.getDirectoryHandle(seg, {create:true});
  return d;
}

// ============================================================================
//  Bridge — loopback client for the optional daemon
// ============================================================================
//  The daemon is not a shell. It exposes six file verbs plus `sensors`, and it
//  re-enforces the same whitelist and path confinement that
//  cyrus/cyrus/actions.py already applies on the native side. A second
//  enforcement of an existing boundary — not a new one.
const Bridge = {
  url: localStorage.getItem("cyrus_bridge_url") || "",
  token: sessionStorage.getItem("cyrus_bridge_token") || "",
  online:false, lastError:"", roots:[], version:"", lastSeen:0,

  save(){ try{ localStorage.setItem("cyrus_bridge_url", this.url||""); }catch(e){} },
  saveToken(){ try{ sessionStorage.setItem("cyrus_bridge_token", this.token||""); }catch(e){} },

  async call(op, args){
    if(!this.url) throw new Error("no bridge URL — start one in Settings → System");
    let r;
    try{
      r = await fetch(this.url + op, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "X-Cyrus-Token":this.token },
        body: JSON.stringify(args || {}),
      });
    }catch(e){
      this.online = false;
      // A refused connection and a wrong origin look identical to fetch(). Say
      // which one it most likely is instead of showing a bare "failed".
      this.lastError = "could not reach " + this.url + " — is `python -m cyrus.bridge` running?";
      throw new Error(this.lastError);
    }
    let body;
    try{ body = await r.json(); }catch(e){ body = {ok:false, error:"bridge sent a non-JSON reply"}; }
    if(!r.ok || body.ok === false){
      this.lastError = body.error || ("bridge returned " + r.status);
      throw new Error(this.lastError);
    }
    this.online = true; this.lastSeen = Date.now();
    return body.result || {};
  },

  async probe(){
    if(!this.url){ this.online=false; this.lastError="no bridge URL configured"; return false; }
    try{
      const b = await this.call("ping", {});
      this.online = true; this.lastError = "";
      this.roots = b.roots || []; this.version = b.version || "";
      return true;
    }catch(e){ this.online = false; this.lastError = e.message || String(e); return false; }
  },

  // The daemon reports where it found its token; the OS can tell the user
  // exactly what to do instead of "not connected".
  async adopt(token, url){
    this.token = token || ""; if(url) this.url = url;
    this.saveToken(); this.save();
    return await this.probe();
  },
};

// ============================================================================
//  VFS interception
// ============================================================================
//  Only these four methods change. `norm`, `parent`, `base`, `walk`,
//  `allFiles` and `sizeOf` keep their original implementations and work
//  unchanged over both trees, which is why nothing else in the OS had to be
//  touched.
(function patchVFS(){
  const origNode    = VFS.node;
  const origWrite   = VFS.writeFile;
  const origMkdirp  = VFS.mkdirp;
  const origRemove  = VFS.remove;

  VFS.node = function(path){
    const p = Mnt.parse(path);
    if(!p) return origNode.call(this, path);
    if(p.sub === "/") return p.mount.tree;
    return nodeAt(p.mount.tree, p.sub);
  };

  VFS.writeFile = function(path, content){
    const p = Mnt.parse(path);
    if(!p) return origWrite.call(this, path, content);
    const m = p.mount;
    if(!m.perms.write){ throw new Error("mount /mnt/"+p.name+" is read-only"); }
    if(p.sub === "/") return false;
    const dir = ensureDir(m.tree, VFS.parent(p.sub));
    const name = VFS.base(p.sub);
    if(dir.children[name] && dir.children[name].type === "dir") return false;
    dir.children[name] = mkFileNode(name, content);
    m.dirty.add(p.sub);                       // pushed on flush()
    Bus.emit("vfs"); Mnt.emitChange();
    return true;
  };

  VFS.mkdirp = function(path){
    const p = Mnt.parse(path);
    if(!p) return origMkdirp.call(this, path);
    const m = p.mount;
    if(!m.perms.write) return null;
    const d = ensureDir(m.tree, p.sub);
    m.dirty.add(p.sub);
    Bus.emit("vfs"); Mnt.emitChange();
    return d;
  };

  VFS.remove = function(path){
    const p = Mnt.parse(path);
    if(!p) return origRemove.call(this, path);
    const m = p.mount;
    if(!m.perms.write) return false;
    const node = nodeAt(m.tree, p.sub);
    if(!node) return false;
    const parent = VFS.parent(p.sub);
    if(parent === p.sub || p.sub === "/") return false;
    delete nodeAt(m.tree, parent).children[VFS.base(p.sub)];
    m.dirty.add("!" + p.sub);                 // "!" prefix marks a removal
    Bus.emit("vfs"); Mnt.emitChange();
    return true;
  };
})();

// Push removals (and writes) down to the real device. Anything after this
// point is a real effect on a real disk, so it is audited as one.
Mnt.flush = async function(){
  let n = 0;
  for(const m of Mnt.mounts.values()){
    for(const rel of Array.from(m.dirty)){
      m.dirty.delete(rel);
      try{
        if(rel.charAt(0) === "!"){ await m.backend.remove(m.root, rel.slice(1)); n++; }
        else {
          const node = nodeAt(m.tree, rel);
          await m.backend.write(m.root, rel, node && node.content != null ? node.content : "");
          n++;
        }
      }catch(e){ m.error = e.message || String(e); console.error("[mnt:flush]", e); }
    }
    m.lastSync = Date.now();
  }
  if(n) Mnt.emitChange();
  return n;
};

Object.assign(MAN, {

  umount:"umount <name> — detach /mnt/<name>.",
  mounts:"mounts — every mounted location, its kind, its permissions and when it last synced.",

  df:"df -h — real storage: this origin's quota from the browser, and every real disk the bridge reports.",

Object.assign(CMDS, {
  mount:{
    man:"mount",
    async run(a, s, pr){

        await MntPicker.show();
        return;
      }
      const rows = Mnt.list();
      if(!rows.length){
        return pr("Nothing is mounted.\n\nCYRUS disk is always available at /.\n"+
                  "Add a real location:  mount --pick\n"+
                  "Or from Settings → System → Locations.");
      }
      pr("MOUNT                       KIND      ACCESS   LAST SYNC");
      for(const m of rows){
        const t = m.lastSync ? new Date(m.lastSync).toLocaleTimeString() : "never";
        pr((("/mnt/"+m.name).padEnd(27)) + m.kind.padEnd(9) +
           ((m.perms.read?"r":"")+(m.perms.write?"w":"-")).padEnd(9) + t);
      }
    }
  },
  umount:{
    man:"umount",
    run(a, s, pr){
      if(!a[0]) return pr("umount: name a mount, e.g. `umount real`", "err");
      const name = String(a[0]).replace(/^\/mnt\//,"").replace(/\/+$/,"");
      return pr(Mnt.unmount(name) ? ("unmounted /mnt/"+name) : ("umount: " + name + ": not mounted"), Mnt.get(name)?null:"err");
    }
  },
  mounts:{
    man:"mounts",
    run(a, s, pr){
      const rows = Mnt.list();
      if(!rows.length) return pr("no real locations mounted (the CYRUS disk at / is always present)");
      rows.forEach(m=>pr(("/mnt/"+m.name).padEnd(18) + m.kind.padEnd(10) + (m.ready?"mounted":"error") +
                         (m.error? " — " + m.error : "")));
    }
  },
  sync:{
    man:"sync",
    async run(a, s, pr){
      const flushed = await Mnt.flush();
      if(flushed) pr("flushed " + flushed + " change(s) to the real device");
      if(a[0]){
        const m = Mnt.get(String(a[0]).replace(/^\/mnt\//,""));
        if(!m) return pr("sync: no such mount: " + a[0], "err");
        await Mnt.refresh(m.name);
        return pr("re-read /mnt/" + m.name);
      }
      const rows = Mnt.list();
      for(const m of rows) await Mnt.refresh(m.name);
      pr(rows.length ? ("re-read " + rows.length + " mount(s)") : "nothing mounted to sync");
    }
  },
  df:{
    man:"df -h",
    async run(a, s, pr){
      pr(await DiskUsage.report());
    }
  },
});

// ============================================================================
//  Real storage figures — no invented numbers
// ============================================================================
//  The old system_report answered this question with a literal "512 GB".
//  Anything that cannot be measured says so instead of guessing.
const DiskUsage = {
  async browser(){
    try{
      const est = await navigator.storage.estimate();
      return { ok:true, usage:est.usage||0, quota:est.quota||0 };
    }catch(e){ return { ok:false, error:e.message||String(e) }; }
  },
  async report(){
    const L = [];
    L.push("Filesystem            Size       Used      Avail    Source");
    const b = await this.browser();
    // storage.estimate() and psutil both report BYTES; fmtSize expects KILOBYTES.
    // pad() truncates when it runs out of room, and "157.5 G" is ambiguous
    // enough to be wrong, so these columns are sized to hold a full unit.
    if(b.ok && b.quota){
      const pct = b.quota ? Math.round(b.usage/b.quota*100) : 0;
      L.push(pad("this origin",14) + pad(fmtSize(b.quota/1024),10) + pad(fmtSize(b.usage/1024),10) +
             pad(fmtSize(Math.max(0,b.quota-b.usage)/1024),9) + pct + "%  browser storage.estimate()");
    }else{
      L.push(pad("this origin",14) + "unknown       —          —         storage.estimate() unavailable: " + (b.error||"denied"));
    }
    if(Bridge.online || Bridge.url){
      try{
        const res = await Bridge.call("sensors", {});
        (res.disks||[]).forEach(d=>{
          L.push(pad("/mnt/"+(d.mount||"bridge"),14) + pad(fmtSize(d.total/1024),10) +
                 pad(fmtSize(d.used/1024),10) + pad(fmtSize(Math.max(0,d.total-d.used)/1024),9) +
                 (d.used&&d.total? " " + Math.round(d.used/d.total*100) + "%" : "") + "  bridge");
        });
      }catch(e){ L.push("bridge disks       unavailable — " + (e.message||e)); }
    }
    const m = Mnt.list().filter(x=>x.kind==="fsapi");
    if(m.length) L.push("", m.map(x=>"/mnt/"+x.name+"        a real folder you granted — CYRUS cannot see outside it.").join("\n"));
    return L.join("\n");
  },
};
function pad(s, n){ s = String(s==null?"":s); return s.length>=n ? s.slice(0,n-1)+" " : s+" ".repeat(n-s.length); }

// Push pending writes before the tab goes away. A browser cannot await on
// unload, so `visibilitychange` is the honest hook: it fires when the user
// actually switches away, and it is the last moment a page can still finish.

// ============================================================================
//  OS PHASE 11 — SYSTEM
//  Every measurement below carries where it came from. A number CYRUS cannot
//  prove is rendered as "not reachable from a browser", never as a plausible
//  guess.
// ============================================================================
//
//  WHY THIS FILE EXISTS
//  -------------------
//  The intent `system_report` used to answer "what's using my disk and RAM?"
//  with two string literals:
//
//      Total: 4.2 MB of 512 GB used (1%)
//      Nothing is eating memory
//
//  Both were invented. The 512 GB never came from anywhere. This file replaces
//  that with measurements that are either real or explicitly absent, and it
//  records the provenance of each one so the next person can tell the
//  difference without reading the source.
//
//  The rule this file holds to:
//      A row is either MEASURED (and says how), or NOT REACHABLE (and says
//      why). There is no third state.
// ============================================================================

// provenance: "browser" | "bridge" | "unavailable"
// `note` is what the number is NOT, in plain words.
const SysProbe = {
  rows:[],

  row(group, label, value, provenance, note){
    this.rows.push({group, label, value, provenance, note});
    return this.rows[this.rows.length-1];
  },

  reset(){ this.rows = []; return this; },

  async all(){
    this.reset();
    await this.cpu();
    await this.memory();
    await this.storage();
    await this.gpu();
    await this.battery();
    await this.network();
    this.display();
    await this.devices();
    this.kernel();
    return this.rows;
  },

  // ---- CPU -----------------------------------------------------------------
  async cpu(){
    const cores = navigator.hardwareConcurrency;
    if(cores){
      this.row("Processor", "Logical cores", String(cores), "browser",
               "what the page is allowed to see — not the CPU model, not clocks");
    }else{
      this.row("Processor", "Logical cores", null, "unavailable", "hardwareConcurrency not exposed");
    }
    const mem = navigator.deviceMemory;
    if(mem) this.row("Processor", "Device memory class", mem + " GB", "browser",
                     "a coarse bucket (1/2/4/8), not a measurement of installed RAM");
  },

  // ---- Memory --------------------------------------------------------------
  // `fmtSize` takes KILOBYTES. performance.memory, storage.estimate and psutil
  // all report BYTES. Every conversion below is explicit because getting it
  // wrong inflates a 4 MB heap into a convincing "4.0 GB".
  async memory(){
    const p = performance.memory;
    if(p && p.usedJSHeapSize != null){
      this.row("Memory", "JS heap in use", fmtSize(p.usedJSHeapSize/1024), "browser",
               "this tab's JavaScript heap — not your physical RAM, and not what the OS is using");
      if(p.jsHeapSizeLimit) this.row("Memory", "JS heap limit", fmtSize(p.jsHeapSizeLimit/1024), "browser",
               "the engine's ceiling for this tab, not your installed memory");
    }else{
      this.row("Memory", "JS heap in use", null, "unavailable",
               "performance.memory is not exposed in this browser (it is Chromium-only)");
    }
  },

  // ---- Storage -------------------------------------------------------------
  async storage(){
    let est = null;
    try{ est = await navigator.storage.estimate(); }catch(e){}
    if(est && est.quota){
      const pct = Math.round((est.usage||0) / est.quota * 100);
      this.row("Storage", "This origin", fmtSize((est.usage||0)/1024) + " of " + fmtSize(est.quota/1024) + " (" + pct + "%)",
               "browser", "quota the browser grants this site — not your disk");
    }else{
      this.row("Storage", "This origin", null, "unavailable", "storage.estimate() denied or unsupported");
    }
    if(Bridge.online){
      try{
        const s = await Bridge.call("sensors", {});
        (s.memory||[]).forEach(m=>{
          this.row("Memory", "Physical " + (m.mount||"system"), fmtSize(m.used/1024) + " of " + fmtSize(m.total/1024),
                   "bridge", "read from this machine by cyrus.bridge");
        });
        (s.disks||[]).forEach(d=>{
          this.row("Storage", "Disk " + (d.mount||""), fmtSize(d.used/1024) + " of " + fmtSize(d.total/1024),
                   "bridge", "real filesystem on this machine");
        });
      }catch(e){
        this.row("Memory", "Physical memory", null, "unavailable", "bridge did not answer: " + (e.message||e));
      }
    }
  },

  // ---- GPU -----------------------------------------------------------------
  async gpu(){
    let info = null;
    try{
      if(navigator.gpu && navigator.gpu.requestAdapter){
        const ad = await navigator.gpu.requestAdapter();
        if(ad && ad.info) info = ad.info;
      }
    }catch(e){}
    let unmasked = null;
    try{
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if(gl){
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        if(ext) unmasked = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
      }
    }catch(e){}
    const v = (info && (info.vendor || info.architecture)) || unmasked;
    if(v) this.row("Graphics", "Adapter", String(v), "browser",
                   "which GPU is available — CYRUS cannot install or swap a driver");
    else this.row("Graphics", "Adapter", null, "unavailable", "neither WebGPU adapter info nor WebGL renderer exposed");
  },

  // ---- Battery -------------------------------------------------------------
  async battery(){
    if(!navigator.getBattery){
      this.row("Power", "Battery", null, "unavailable", "Battery Status API not available here");
      return;
    }
    try{
      const b = await navigator.getBattery();
      if(b && typeof b.level === "number"){
        this.row("Power", "Battery", Math.round(b.level*100) + "%" + (b.charging ? " (charging)" : ""),
                 "browser", "many browsers deliberately report a fixed 100%");
      }else{
        this.row("Power", "Battery", null, "unavailable", "the browser declined to report a level");
      }
    }catch(e){ this.row("Power", "Battery", null, "unavailable", "Battery Status API blocked"); }
  },

  // ---- Network -------------------------------------------------------------
  network(){
    const c = navigator.connection;
    if(c){
      this.row("Network", "Connection", (c.effectiveType || "unknown") +
               (c.downlink ? " · " + c.downlink + " Mb/s" : "") + (c.saveData ? " · data saver" : ""),
               "browser", "a hint from the OS, not a measurement of throughput");
    }else{
      this.row("Network", "Connection", null, "unavailable", "Network Information API not available");
    }
    this.row("Network", "Origin", location.protocol + "//" + (location.host||"(no host)"), "browser",
             "file:// means no service worker, no install, and cross-origin APIs need CORS");
  },

  // ---- Display -------------------------------------------------------------
  display(){
    if(typeof screen!=="undefined"){
      this.row("Display", "Screen", screen.width + "×" + screen.height +
               " @ " + (window.devicePixelRatio||1) + "×", "browser", "CSS pixels vs device pixels");
    }
  },

  // ---- Devices: counts only, never control ---------------------------------
  async devices(){
    const add = async (label, fn, note)=>{
      try{
        const n = await fn();
        if(n == null) throw new Error("no such API");
        this.row("Devices", label, n === 0 ? "none connected" : n + " available", "browser", note);
      }catch(e){
        this.row("Devices", label, null, "unavailable", "not exposed in this browser");
      }
    };
    await add("USB", ()=>navigator.usb && navigator.usb.getDevices().then(d=>d.length), "handles for devices you have already granted");
    await add("Serial ports", ()=>navigator.serial && navigator.serial.getPorts().then(p=>p.length), "ports you have already granted");
    await add("HID", ()=>navigator.hid && navigator.hid.getDevices().then(d=>d.length), "devices you have already granted");
    await add("Bluetooth", ()=>navigator.bluetooth && navigator.bluetooth.getAvailability(), "available — CYRUS cannot pair without a user gesture");
  },

  // ---- The rows that will never turn green --------------------------------
  //  Listing these is the point. A panel that only shows what it can do reads
  //  as complete; this one is visibly incomplete, which is the truth.
  kernel(){
    this.row("Kernel", "Kernel modules", null, "unavailable", "a page cannot load or unload kernel modules");
    this.row("Kernel", "Drivers", null, "unavailable", "driver installation needs an installer and an OS-level token");
    this.row("Kernel", "BIOS / UEFI", null, "unavailable", "firmware settings are not addressable from a browser");
    this.row("Kernel", "Filesystem repair", null, "unavailable", "fsck-style repair needs privileged raw disk access");
    this.row("Kernel", "System users / permissions", null, "unavailable", "device profiles are not OS accounts");
  },

  // ---- Rendering -----------------------------------------------------------
  text(){
    if(!this.rows.length) return "Not measured yet.";
    const out = [];
    let group = null;
    for(const r of this.rows){
      if(r.group !== group){ group = r.group; out.push("", group.toUpperCase()); }
      const v = r.provenance === "unavailable" ? "not reachable from a browser" : r.value;
      // The status is never truncated — "not reachable from a brows" is worse
      // than useless, it just looks like a rendering bug.
      out.push("  " + pad(r.label, 24) + (v == null ? "" : String(v)) +
               (r.provenance === "unavailable" ? " ·" : " ✓") +
               "\n      " + (r.note||""));
    }
    return out.join("\n");
  },
};

  Actions.system_report = async function(){

// ============================================================================
//  OS PHASE 12 — SNAPSHOTS
//  Real recovery, so "this cannot be undone" stops being a disclaimer.
// ============================================================================
//
//  WHAT WAS TRUE BEFORE
//  --------------------
//  CYRUS had persistence and an audit log, and that was the entirety of its
//  answer to "what if I ruin something". The Studio delete dialog said:
//
//      Every delete is written to the audit log. This cannot be undone
//      from inside Studio.
//
//  The audit log records what happened. It does not bring the file back.
//
//  WHAT THIS ADDS
//  --------------
//  A snapshot is a content-hashed copy of every file in the virtual filesystem.
//  One is taken automatically before any medium/high-risk operation the policy
//  gate classifies *and the user approves*, and on demand from the System app.
//  Restoring writes a fresh snapshot first, so a bad restore is itself
//  recoverable — the recovery path cannot be the thing that loses your work.
//
//  WHY AN INJECTABLE STORE
//  -----------------------
//  The snapshot logic is the part most likely to quietly lose data, so it is
//  written against a tiny four-method store interface rather than against
//  IndexedDB directly. The browser build injects the IndexedDB adapter; the
//  test harness injects a Map. The code under test is byte-identical in both.
// ============================================================================

// ---- the store interface ----------------------------------------------------
// put(id, snapshot) · get(id) · ids() · del(id)
const MemSnapStore = {
  _m:new Map(),
  async put(id, s){ this._m.set(id, s); return s; },
  async get(id){ return this._m.get(id) || null; },
  async ids(){ return [...this._m.keys()]; },
  async del(id){ this._m.delete(id); },
};

const IdbSnapStore = {
  DB:"cyrus_snapshots_v1", _db:null,
  open(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res, rej)=>{
      if(typeof indexedDB === "undefined"){ rej(new Error("IndexedDB unavailable")); return; }
      const req = indexedDB.open(this.DB, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains("snaps")) db.createObjectStore("snaps", {keyPath:"id"});
      };
      req.onsuccess = ()=>{ this._db = req.result; res(this._db); };
      req.onerror = ()=>rej(req.error || new Error("could not open the snapshot database"));
    });
  },
  async _tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej)=>{
      const tx = db.transaction("snaps", mode);
      const store = tx.objectStore("snaps");
      const out = fn(store);
      tx.oncomplete = ()=>res(out && out.result !== undefined ? out.result : out);
      tx.onerror = ()=>rej(tx.error);
      tx.onabort = ()=>rej(tx.error || new Error("snapshot transaction aborted"));
    });
  },
  async put(id, s){ return this._tx("readwrite", st=>{ st.put(s); return s; }); },
  async get(id){ return this._tx("readonly", st=>st.get(id)).then(r=>r||null); },
  async ids(){
    const keys = await this._tx("readonly", st=>st.getAllKeys());
    return (keys && keys.result) || keys || [];
  },
  async del(id){ return this._tx("readwrite", st=>{ st.delete(id); return true; }); },
};

// ============================================================================
const Snapshots = {
  store: (typeof indexedDB !== "undefined") ? IdbSnapStore : MemSnapStore,
  RETAIN: 10,
  available(){ return !!this.store; },

  // A stable, cheap content hash. Not a security primitive — it exists so two
  // snapshots of an unchanged file store one copy, not two.
  hash(s){
    s = String(s == null ? "" : s);
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for(let i=0;i<s.length;i++){
      const c = s.charCodeAt(i);
      h1 = ((h1 ^ c) >>> 0) * 16777619 >>> 0;
      h2 = ((h2 + c) >>> 0) ^ (h1 >>> 13) >>> 0;
    }
    return (h1.toString(16).padStart(8,"0") + h2.toString(16).padStart(8,"0"));
  },

  // Capture the current virtual filesystem. Only files — the audit log and
  // settings are append-only and small, and a restore should not roll back the
  // record of why the restore happened.
  capture(label, reason){
    const entries = [];
    VFS.walk("/", (path, node) => {
      if(node.type !== "file") return;
      entries.push({
        path,
        content: node.content == null ? "" : node.content,
        mtime: node.mtime || 0,
        h: this.hash(node.content),
      });
    });
    return { label: label || ("Snapshot " + new Date().toLocaleString()), reason: reason || "manual", entries };
  },

  // `keep` is an explicit third argument, not something inferred from the label.
  // Inferring it looked tidy and was a bug: every automatic restore point is
  // named "before rm ...", so all of them counted as deliberate and retention
  // pruned nothing. Protection is now something a person does on purpose.
  // Date.now() has millisecond resolution and snapshots are created in bursts, so
  // two snapshots often share a ts. With equal ts, "newest" is undefined and
  // retention can prune the newer of the pair. Ticks are therefore forced
  // strictly increasing against whatever is already stored.
  async _nextTs(){
    const now = Date.now();
    let max = 0;
    let ids = [];
    try{ ids = await this.store.ids(); }catch(e){ return now; }
    for(const id of ids){
      const s = await this.store.get(id);
      if(s && s.ts > max) max = s.ts;
    }
    return Math.max(now, max + 1);
  },

  async take(label, reason, keep){
    if(!this.available()) return null;
    const snap = this.capture(label, reason);
    snap.id = "s" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
    snap.ts = await this._nextTs();
    snap.count = snap.entries.length;
    snap.bytes = snap.entries.reduce((a,e)=>a+e.content.length, 0);
    snap.keep = !!keep;
    try{
      await this.store.put(snap.id, snap);
    }catch(e){
      // Out of quota must not take the OS down with it, and must not be silent.
      console.error("[snapshots] write failed", e);
      Cyrus.audit("snapshot", "snapshot_disk", {label}, "low", false, false,
                  "Snapshot failed: " + (e.message||e));
      return null;
    }
    Cyrus.audit("snapshot", "snapshot_disk", {label:snap.label, files:snap.count}, "low", true, true,
                "Snapshot “" + snap.label + "” — " + snap.count + " files, " + snap.bytes + " bytes");
    await this.prune();
    return snap;
  },

  // Keep the newest RETAIN unpinned snapshots. A pinned snapshot is never deleted
  // here — deleting one is always a deliberate act in the UI.
  async prune(){
    if(!this.available()) return 0;
    let ids;
    try{ ids = await this.store.ids(); }catch(e){ return 0; }
    const all = [];
    for(const id of ids){
      const s = await this.store.get(id);
      if(s) all.push(s);
    }
    all.sort((a,b)=>a.ts - b.ts);
    const automatic = all.filter(s => !s.keep);
    if(automatic.length <= this.RETAIN) return 0;
    const surplus = automatic.slice(0, automatic.length - this.RETAIN);
    for(const s of surplus){
      try{ await this.store.del(s.id); }catch(e){ console.error("[snapshots] prune", e); }
    }
    return surplus.length;
  },

  async list(){
    if(!this.available()) return [];
    let ids = [];
    try{ ids = await this.store.ids(); }catch(e){ return []; }
    const all = [];
    for(const id of ids){
      const s = await this.store.get(id);
      if(s) all.push(s);
    }
    return all.sort((a,b)=>b.ts - a.ts);
  },

  // Whole-filesystem restore. Snapshots first — restoring must not be the one
  // irreversible action in this file.
  async restore(id, confirmFn){
    const snap = await this.store.get(id);
    if(!snap) return {ok:false, message:"That snapshot no longer exists."};

    const existing = this.capture("pre-restore","auto");
    const diff = this.diff(snap.entries, existing.entries);
    if(!diff.length) return {ok:true, message:"The filesystem already matches that snapshot — nothing to restore."};
    if(!diff.every(d => d.kind === "missing")){
      const ok = confirmFn ? await confirmFn(diff) : true;
      if(!ok) return {ok:false, message:"Restore cancelled."};
    }
    existing.id = "s" + Date.now().toString(36) + "-prerestore";
    existing.ts = await this._nextTs();
    existing.keep = false;
    existing.count = existing.entries.length;
    try{ await this.store.put(existing.id, existing); }catch(e){ console.error("[snapshots] pre-restore", e); }

    VFS.remove("/home");
    VFS.mkdirp("/home");
    let n = 0;
    for(const e of snap.entries){
      VFS.mkdirp(VFS.parent(e.path));
      if(VFS.writeFile(e.path, e.content)) n++;
    }
    Store.save(); Bus.emit("vfs");
    Cyrus.audit("restore snapshot", "restore_disk", {id:snap.id, files:n}, "high", true, true,
                "Restored " + n + " files from “" + snap.label + "”");
    return {ok:true, message:"Restored " + n + " files from “" + snap.label + "”. A snapshot of the previous state was kept as “" + existing.label + "”."};
  },

  // One file back out of a snapshot, without touching anything else.
  async restoreFile(id, path, confirmFn){
    const snap = await this.store.get(id);
    if(!snap) return {ok:false, message:"That snapshot no longer exists."};
    const e = snap.entries.find(x => x.path === path);
    if(!e) return {ok:false, message:"That file is not in this snapshot."};
    const cur = VFS.node(path);
    if(cur && cur.content === e.content) return {ok:true, message:"“" + path + "” already matches that snapshot."};
    if(cur && confirmFn){ if(!await confirmFn(path)) return {ok:false, message:"Cancelled."}; }
    if(cur) await this.take("pre-restore of " + VFS.base(path), "auto");
    VFS.mkdirp(VFS.parent(path));
    VFS.writeFile(path, e.content);
    Store.save(); Bus.emit("vfs");
    Cyrus.audit("restore file", "restore_disk", {id:snap.id, path}, "medium", true, true,
                "Restored " + path + " from “" + snap.label + "”");
    return {ok:true, message:"Restored " + path + " from “" + snap.label + "”."};
  },

  // What actually changes if this snapshot were restored.
  diff(snapEntries, curEntries){
    const cur = new Map(curEntries.map(e => [e.path, e]));
    const want = new Map(snapEntries.map(e => [e.path, e]));
    const out = [];
    for(const [p, e] of want){
      const c = cur.get(p);
      if(!c) out.push({path:p, kind:"missing"});
      else if(c.h !== e.h) out.push({path:p, kind:"changed"});
    }
    for(const [p] of cur) if(!want.has(p)) out.push({path:p, kind:"extra"});
    return out;
  },

  // ---- Export / import ----------------------------------------------------
  exportBundle(){
    return JSON.stringify({
      format:"cyrus-snapshot-bundle", version:1,
      exported:new Date().toISOString(),
      snapshots: this._pending || [],
    });
  },
  async exportAll(){
    this._pending = await this.list();
    const json = this.exportBundle();
    this._pending = null;
    return json;
  },
  parseBundle(text){
    let b;
    try{ b = JSON.parse(text); }catch(e){ return {ok:false, message:"That file is not a CYRUS snapshot bundle."}; }
    if(!b || b.format !== "cyrus-snapshot-bundle" || !Array.isArray(b.snapshots))
      return {ok:false, message:"That file is not a CYRUS snapshot bundle."};
    return {ok:true, snapshots:b.snapshots};
  },
  async importBundle(text){
    const p = this.parseBundle(text);
    if(!p.ok) return p;
    let n = 0;
    for(const s of p.snapshots){
      if(!s || !Array.isArray(s.entries)) continue;
      const id = s.id || ("s" + Date.now().toString(36) + "-imp" + n);
      await this.store.put(id, {...s, id});
      n++;
    }
    await this.prune();
    return {ok:true, message:"Imported " + n + " snapshot(s)."};
  },
};

// ============================================================================
//  Automatic restore points
// ============================================================================
//  Hooked in two places: the terminal's own destructive commands, and StFS's
//  guard (Studio's explorer). Both fire *after* the policy gate approved the op
//  and *before* it runs.
function snapshotBefore(label, reason){
  if(!Snapshots.available()) return Promise.resolve(null);
  // keep defaults to false: automatic restore points are the churny ones and
  // retention is exactly what stops them filling the disk.
  return Snapshots.take(label, reason, false).catch(e=>{ console.error("[snapshots:auto]", e); return null; });
}

// `rm` and `rm -r` in cyrus-sh. Rewriting the command objects rather than
// wrapping the terminal means the help text, `man` and the risk table all keep
// describing what actually runs.
["rm","rmdir"].forEach(name=>{
  const orig = CMDS[name];
  if(!orig || orig.__snapWrapped) return;
  const wrapped = {
    man: orig.man,
    async run(a, s, pr){
      await snapshotBefore("before `" + name + " " + a.join(" ") + "`", "auto");
      return orig.run(a, s, pr);
    },
  };
  wrapped.__snapWrapped = true;
  CMDS[name] = wrapped;
});

// Studio's explorer. StFS exists before this splice point, so the guard can be
// wrapped directly.
if(typeof StFS !== "undefined" && StFS.guard && !StFS.guard.__snapWrapped){
  const origGuard = StFS.guard.bind(StFS);
  const wrappedGuard = async function(op, targets, describe){
    const many = Array.isArray(targets) ? targets.length > 1 : false;
    const risk = StFS.risk(op, targets, many);
    // Only the ops that can lose data, and only once the gate has said yes.
    if(risk === "medium" || risk === "high"){
      const before = await snapshotBefore("before " + op + " (" + describe + ")", "auto");
      window.__cyrusLastRestorePoint = before;
    }
    return origGuard(op, targets, describe);
  };
  wrappedGuard.__snapWrapped = true;
  StFS.guard = wrappedGuard;
}

                        "\n\nA snapshot of the current state is kept first, so this is reversible.",
                  confirmText:"Restore", danger:true });

                Toast.show("Snapshots", res.message, null, res.ok?"ok":"err");
                paint();
              }
            }));
          });
