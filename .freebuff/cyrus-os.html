        changed:()=>{ this.refreshExplorer(); this.afterVfsChange(); },
        renamed:(a,b)=>{ const t=this.tabs.find(x=>x.path===a); if(t){ t.path=b; if(this.active===a) this.active=b; } this.renderTabs(); },
        expanded:(list)=>{ StSettings.set("expanded", list); },
        context:(paths,x,y)=>this.showContextMenu(paths,x,y),
        activate:()=>this.renderStatus()
      }
    });
    this.explorer.expanded = new Set(StSettings.get("expanded")||[]);
    this.explorer.filter = StSettings.get("explorerFilter")||"";
    this.r.filter.value = this.explorer.filter;

    this.explorer._wire();
    this.bindBar();
    this.bindSide();
    this.bindPanel();
    this.buildFind();
    this.buildStatusBar();
    this.buildRight();
    // Phase 9: the Connections panel is always present, so the authority the
    // user already granted is visible for the whole life of the window.
    StConn.attach(this);
  }

  bindBar(){
    this.q("tglSide").onclick = ()=>this.toggleSide();
    this.q("qopen").onclick = ()=>this.quickOpen();
    this.q("palette").onclick = ()=>this.commandPalette();
    this.q("run").onclick = ()=>this.run();
    this.q("save").onclick = ()=>this.save();
    this.q("split").onclick = ()=>this.splitEditor();
    this.q("ext").onclick = ()=>this.showExtensions();
    this.q("settings").onclick = ()=>this.showSettings();
    this.q("newFile").onclick = ()=>this.newFile();
    this.q("newFolder").onclick = ()=>this.newFolder();
    this.q("collapse").onclick = ()=>{ this.explorer.expanded = new Set([this.root]); this.explorer.render(); StSettings.set("expanded",[this.root]); };
    this.q("openFolder").onclick = ()=>this.openFolderPicker();
    this.q("projInfo").onclick = ()=>this.projectInfo();
    this.q("connRefresh").onclick = async ()=>{ this.toast("Re-checking providers…"); await StConn.restore(); };
    this.r.filter.addEventListener("input", ()=>{
      this.explorer.search(this.r.filter.value);
      StSettings.set("explorerFilter", this.r.filter.value);
    });
    this.r.filter.addEventListener("keydown", e=>e.stopPropagation());
    // global keyboard: everything not consumed by the editor
    this.win.el.addEventListener("keydown", e=>this.onGlobalKey(e));
  }

  // ================= tabs =================
  bindSide(){
    const main = this.win.body.querySelector(".st2-main");
    const mk = (which)=>{
      const r = el("div","st2-resizer");
      r.style.cssText = "width:5px;cursor:col-resize;flex:none;background:transparent";
      r.addEventListener("mousedown", e=>{
        e.preventDefault();
        const startX = e.clientX;
        const key = which==="left" ? "sideWidth" : "rightWidth";
        const start = StSettings.get(key);
        const move = ev=>{
          const d = which==="left" ? ev.clientX-startX : startX-ev.clientX;
          StSettings.set(key, Math.max(150, Math.min(600, start+d)));
          StSettings.save(); this.applySettings();
        };
        const up = ()=>{ document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };
        document.addEventListener("mousemove",move); document.addEventListener("mouseup",up);
      });
      return r;
    };
    main.insertBefore(mk("left"), this.r.side.nextSibling);
    this.r.right.parentNode.insertBefore(mk("right"), this.r.right);
    // keep the right splitter glued to the panel edge as panels toggle
    this.win.el.addEventListener("click", ()=>{}, true);
  }

  renderTabs(){
    const items = this.split ? [this.active, this.split] : this.tabs.map(t=>t.path);
    this.r.tabs.innerHTML = items.filter(Boolean).map(p=>{
      const t = this.tabs.find(x=>x.path===p);
      const on = p===this.active ? " on":"";
      const dirty = t && t.dirty ? " dirty":"";
      const tag = LANG.forPath(p);
      return `<div class="st2-tab${on}${dirty}" data-p="${esc(p)}"><span>${this.iconFor(p)}</span><span>${esc(VFS.base(p))}</span><span class="x" data-close="${esc(p)}">✕</span></div>`;
    }).join("");
    this.r.tabs.querySelectorAll(".st2-tab").forEach(tab=>{
      const p = tab.dataset.p;
      tab.addEventListener("mousedown", e=>{
        if(e.target.dataset.close){ e.stopPropagation(); this.closeTab(e.target.dataset.close); return; }
        this.openPath(p);
      });
      tab.addEventListener("contextmenu", e=>{
        e.preventDefault();
        this.showTabMenu(p, e.clientX, e.clientY);
      });
      tab.addEventListener("auxclick", e=>{ if(e.button===1){ e.preventDefault(); this.closeTab(p); } });
    });
  }
  iconFor(p){
    const tag = LANG.forPath(p).id;
    return ({"javascript":"🟨","typescript":"🟦","python":"🐍","html":"🌐","css":"🎨","markdown":"📘",
             "json":"🧩","jsonc":"🧩","java":"☕","go":"🐹","rust":"🦀","c":"🔵","cpp":"🔵","csharp":"🎯",
             "php":"🐘","ruby":"💎","sh":"⚙️","yaml":"🧾","sql":"🗄️","dockerfile":"🐳","toml":"🔧","make":"🔨"}[tag]) || "📄";
  }
  openPath(path, opts){
    opts = opts || {};
    if(!path) return;
    const n = VFS.node(path);
    if(!n){ this.toast("Not found: "+path,"err"); return; }
    if(n.type==="dir"){ this.setRoot(path); return; }
    if(!this.tabs.some(t=>t.path===path)){
      this.tabs.push({ path, view:null, dirty:false, prev:null });
      const rec = StIndex.symbolsFor(path);
      if(rec) StSettings.set("recent", [path].concat((StSettings.get("recent")||[]).filter(p=>p!==path)).slice(0,20));
    }
    this.active = path;
    // Load the file FIRST. setFile() replaces the content and resets the caret,
    // so placing the cursor before it silently threw the jump away — every
    // "go to line" path (references, workspace symbols, problem clicks) landed
    // wherever the previous file happened to leave off.
    if(!opts.keepView){ const t=this.tabs.find(x=>x.path===path); this.editor.setFile(path, t&&t.dirty?t.text:(n.content||"")); }
    if(opts.line!=null){
      const p=this.editor.posAt(opts.line, opts.col||0);
      this.editor.setSelection(p, opts.col!=null ? p : this.editor.lineEnd(opts.line));
    }
    this.renderTabs(); this.renderBread(); this.renderWelcome(); this.renderStatus();
    this.analyze(); this.renderRight();
    if(opts.focus!==false) this.editor.focus();
    if(opts.line!=null) this.editor.revealLine(opts.line);
  }
  activePath(){ return this.active; }
  closeTab(p){
    const t = this.tabs.find(x=>x.path===p);
    if(t && t.dirty){
      Modal.confirm({ title:"Close "+VFS.base(p)+"?", body:"It has unsaved changes.", confirmText:"Close without saving", danger:true })
        .then(ok=>{ if(ok){ t.dirty=false; this.closeTab(p); } });
      return;
    }
    this.tabs = this.tabs.filter(x=>x.path!==p);
    if(this.split===p) this.split = null;
    if(this.active===p){
      this.active = this.tabs.length ? this.tabs[this.tabs.length-1].path : null;
      if(this.active) this.openPath(this.active); else this.editor.setFile("", "");
    }
    this.renderTabs(); this.renderWelcome(); this.renderStatus(); this.renderRight();
  }
  closeAllTabs(){ this.tabs.forEach(t=>t.dirty=false); this.tabs=[]; this.active=null; this.split=null;
    this.editor.setFile("",""); this.renderTabs(); this.renderWelcome(); this.renderStatus(); }
  splitEditor(){
    if(!this.active) return;
    if(this.split){ const t=this.tabs.find(x=>x.path===this.split); if(t){ this.active=this.split; this.split=null; this.openPath(this.active); } return; }
    this.split = this.active;
    this.toast("Split view: "+VFS.base(this.split)+" · "+(this.tabs.length>1?VFS.base(this.tabs.find(t=>t.path!==this.split)?.path||""):"(open another file)"),"ok");
    this.renderTabs();
  }
  setRoot(root){
    this.root = root;
    this.explorer.setRoot(root);
    StSettings.set("root", root);
    const proj = StProject.detect(root);
    if(proj){ this.root = proj.root; this.marker = proj.marker; this.explorer.setRoot(this.root); }
    this.renderProject();
    this.renderRight();
    this.toast("Workspace: "+this.root.replace("/home/rithvik","~"),"ok");
    Log.record("studio: open workspace "+this.root, "studio_workspace", {root:this.root}, "low", false, true, "Workspace opened");
  }

  // ================= editor plumbing =================
  onEditorChange(txt, kind){
    const t = this.tabs.find(x=>x.path===this.active);
    if(t && !t.dirty && (VFS.node(this.active)||{}).content !== txt){ t.dirty = true; this.renderTabs(); }
    if(kind==="format" || kind==="replace" || kind==="replaceAll" || kind==="enter" || kind==="indent")
      this.scheduleAnalyze();
    if(this.pendingDiff && (kind==="input"||kind==="insert")) this.pendingDiff = null;
    this.renderStatus();
    if(StSettings.get("autoSave")) this.scheduleAutoSave();
  }
  onEditorCursor(){ this.renderBread(); this.renderStatus();
    // the Debug panel is a live view of the caret's token, so it follows the caret
    if(this.panelTab==="debug" && this.panelOpen) this.renderDebug(this.r.pbody); }
  onEditorRender(){ if(this.editor) this.renderStatus(); }
  scheduleAutoSave(){
    clearTimeout(this._autoSaveT);
    this._autoSaveT = setTimeout(()=>{ if(this.tabs.some(t=>t.dirty)) this.save({quiet:true}); }, StSettings.get("autoSaveDelay"));
  }
  onEditorKey(k, e){
    const mod = e.ctrlKey || e.metaKey;
    if(k==="s"){ this.save(); return; }
    if(k==="f"){ this.openFind(false); return; }
    if(k==="h"){ this.openFind(true); return; }
    if(k==="p"){ this.quickOpen(); return; }
    if(k==="b"){ this.toggleSide(); return; }
    if(k==="g"){ this.gotoLine(); return; }
    if(k===","){ this.showSettings(); return; }
    if(k==="shiftp"){ this.commandPalette(); return; }
    if(StSettings.get("inlineAI")) this.scheduleInline();
  }
  onGlobalKey(e){
    if(StPalette.node) return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
    if(mod && e.shiftKey && k==="p"){ e.preventDefault(); this.commandPalette(); return; }
    if(mod && k==="p" && !e.shiftKey){ if(document.activeElement!==this.r.filter){ e.preventDefault(); this.quickOpen(); } return; }
    if(mod && e.shiftKey && k==="o"){ e.preventDefault(); this.gotoSymbol(); return; }
    if(mod && e.shiftKey && k==="m"){ e.preventDefault(); this.setPanelTab("problems"); return; }
    if(mod && e.shiftKey && k==="x"){ e.preventDefault(); this.showExtensions(); return; }
    if(mod && e.shiftKey && k==="e"){ e.preventDefault(); this.togglePanel("outline"); return; }
    if(mod && k==="t"){ e.preventDefault(); this.gotoWorkspaceSymbol(); return; }
    if(mod && k==="`"){ e.preventDefault(); this.setPanelTab("terminal"); return; }
    if(mod && k==="j"){ e.preventDefault(); this.togglePanel(); return; }
    if(mod && k==="Enter"){ e.preventDefault(); this.run(); return; }
    if(mod && k==="w"){ e.preventDefault(); this.closeTab(this.active); return; }
    if(mod && k==="\\"){ e.preventDefault(); this.splitEditor(); return; }
    if(mod && k==="."){ e.preventDefault(); this.quickFixSelected(); return; }
    if(e.altKey && (k==="ArrowLeft"||k==="ArrowRight")){ e.preventDefault(); k==="ArrowLeft"?this.navBack():this.navForward(); return; }
    if(e.shiftKey && k==="F12"){ e.preventDefault(); this.findReferences(); return; }
  }

  // ---- inline autocomplete ------------------------------------------------
  scheduleInline(){
    clearTimeout(this.inlineTimer);
    const ed = this.editor;
    if(!ed || !this.active) return;
    const t = this.tabs.find(x=>x.path===this.active);
    if(t) t.text = ed.text;
    const p = ed.primary;
    if(p.s!==p.e) return ed.clearGhost();
    const before = ed.content.slice(Math.max(0,p.s-2), p.s);
    if(/[\s]/.test(before.slice(-1)) || /^\s*$/.test(before)) return ed.clearGhost();
    this.inlineTimer = setTimeout(()=>this.runInline(), StSettings.get("aiDelay"));
  }

  // Ask the brain only for the text at the caret, then show it as ghost text.
  // The token guards every step: a newer keystroke, a closed tab or a failed
  // request all abandon the pending suggestion instead of flashing it late.
  async runInline(){
    const ed = this.editor, path = this.active;
    if(!ed || !path) return;
    const token = ++this.inlineToken;
    const p = ed.primary;
    const spec = LANG.forPath(path, ed.text);
    const res = await Copilot.complete({ file:{ path, lang:spec.id }, project:null, style:"" },
                                      ed.content.slice(0,p.s), ed.content.slice(p.e));
    if(token !== this.inlineToken) return;
    if(!ed || this.active !== path || !res || !res.text){ if(ed) ed.clearGhost(); return; }
    const now = ed.primary;
    if(now.s!==now.e || now.s!==p.s){ ed.clearGhost(); return; }   // caret moved while we waited
    ed.setGhost({ text:res.text, pos:p.s });
    ed.render();
  }
  async runInline(){
    const ed = this.editor;
    const path = this.active; if(!path) return;
    const my = ++this.inlineToken;
    const p = ed.primary;
    const pos = p.s;
    const prefix = ed.content.slice(0,pos), suffix = ed.content.slice(pos);
    const c = this.buildContext();
    if(!c.file){ ed.clearGhost(); return; }
    ed.setGhost({ pos, text:"…" });
    try{
      const r = await Copilot.complete(c, prefix, suffix);
      if(my!==this.inlineToken) return;
      if(this.active!==path){ ed.clearGhost(); return; }
      if(!r || !r.text){ ed.clearGhost(); return; }
      const maxLines = StSettings.get("aiMaxLines");
      const limited = r.text.split("\n").slice(0,maxLines).join("\n");
      const cur = ed.primary;
      if(cur.s!==pos) { ed.clearGhost(); return; }   // the user moved on
      ed.setGhost({ pos, text:limited });
    }catch(e){ ed.clearGhost(); }
  }
  acceptGhost(){
    const ed = this.editor, g = ed.ghost;
    if(!g || !g.text) return false;
    this.inlineToken++;
    const pos = g.pos, text = g.text;
    ed.setGhost(null);
    ed.snapshot();
    ed.content = ed.content.slice(0,pos) + text + ed.content.slice(pos);
    const np = pos + text.length;
    ed.sel = [{ s:np, e:np }];
    ed._syncTA(); ed.render();
    if(this.onEditorChange) this.onEditorChange(ed.content, "insert");
    return true;
  }

  // ---- analysis ----------------------------------------------------------
  scheduleAnalyze(){ clearTimeout(this._anT); this._anT = setTimeout(()=>this.analyze(), 420); }
  analyze(){
    const ed = this.editor;
    if(!ed || !StSettings.get("diagnostics") || !this.active){ this.lastProblems=[]; ed && ed.setProblems([]); this.renderRight(); this.renderPanel(); return; }
    clearTimeout(this._anToken);
    const token = (this._anToken||0)+1;
    this._anToken = token;
    const path = this.active;
    const text = ed.text;
    setTimeout(()=>{
      if(this._anToken!==token || this.active!==path) return;
      const spec = LANG.forPath(path, text);
      let probs = [];
      try{ probs = DIAG.analyze(text, spec, {}); }catch(e){ probs=[]; }
      if(!StSettings.get("unusedHints")) probs = probs.filter(d=>d.src!=="unused"&&d.src!=="style");
      const extra = this.runState && this.runState.problems || [];
      const merged = probs.concat(extra.filter(x=>!(x.file && x.file!==path) && x.line<=text.split("\n").length));
      this.lastProblems = merged.map(d=>(Object.assign({file:path}, d)));
      ed.setProblems(merged);
      this.problemMap = {};
      this.lastProblems.forEach(d=>{
        const k = this.problemMap[d.file] || (this.problemMap[d.file]={err:0,warn:0,info:0});
        k[d.sev]++;
      });
      this.explorer.setProblems(this.problemMap);
      this.renderRight(); this.renderPanel(); this.renderStatus();
    }, 90);
  }
  afterVfsChange(){ StIndex.invalidate(); this.renderProject(); this.renderRight(); }
  refreshExplorer(){ this.explorer.render(); this.renderProject(); this.renderStatus(); }
}
// ---- save / run -----------------------------------------------------------
Object.assign(StApp.prototype, {

  toast(msg, kind){ Toast.show("CYRUS Studio", msg, null, kind); },

  save(opts){
    opts = opts || {};
    let saved = 0;
    for(const t of this.tabs){
      if(!t.dirty) continue;
      const text = t.path===this.active ? this.editor.text : t.text;
      if(text==null) continue;
      let out = text;
      if(StSettings.get("formatOnSave")){
        try{
          const ed = new StEditor(el("div","hidden"), {});
          ed.spec = LANG.forPath(t.path, text);
          ed.setContent(text, true);
          ed.format();
          out = ed.content;
        }catch(e){}
      }
      if(VFS.writeFile(t.path, out)){
        t.dirty = false; saved++;
        if(t.path===this.active) this.editor.setContent(out, true);
      }
    }
    if(saved){
      StIndex.invalidate();
      this.renderTabs(); this.refreshExplorer();
      this.analyze();
      this.renderStatus();
      if(!opts.quiet) this.toast(saved===1 ? "Saved "+VFS.base(this.tabs.find(t=>!t.dirty && t.path===this.active)?.path||this.active) : "Saved "+saved+" files", "ok");
    } else if(!opts.quiet && this.active){
      this.toast("No changes to save","warn");
    }
    return saved;
  },
  saveAll(){ return this.save({quiet:true}); },
  markClean(){ this.tabs.forEach(t=>t.dirty=false); this.renderTabs(); },

  async run(path){
    path = path || this.active;
    if(!path){ this.setPanelTab("output"); this.toast("Open a file first","warn"); return; }
    const t = this.tabs.find(x=>x.path===path);
    const text = path===this.active ? this.editor.text : (VFS.node(path)||{}).content || "";
    const spec = LANG.forPath(path, text);
    const plan = StRun.plan(this.root, path, text);
    this.running = true;
    this.runState = { path, plan, t0:performance.now() };
    this.setPanelTab("output");
    const out = [];
    const line = s => out.push(s);
    line(`▸ ${plan.command || "cyrus run "+VFS.base(path)}${plan.fromManifest ? "   (from "+MANIFEST+")" : "   (inferred from the language)"}`);
    line("─".repeat(60));
    const res = await StRun.exec(this.root, path, text);
    StRun.record(this.root, path, res);
    if(res.kind==="preview"){
      this.runState.preview = res.preview;
      this.setPanelTab("preview", true);
      this.renderPanel();
      this.running = false;
      this.renderStatus();
      return res;
    }
    if(res.note) line(res.note);
    if(res.out) line(res.out);
    if(res.err) line(res.err);
    line("─".repeat(60));
    line(`${res.ok?"✔":"✖"} ${res.kind} · ${Math.round(res.ms)}ms · ${new Date().toLocaleTimeString()}`);
    this.runState.result = res;
    this.runState.problems = DIAG.fromOutput((res.err||"")+"\n"+(res.out||""), path);
    this.termLines = out;
    this.pbodyHtml = out.map(s=>this.colorize(s)).join("\n");
    this.running = false;
    this.renderPanel(); this.renderStatus();
    this.analyze();
    if(!res.ok) this.pulseProblems();
    return res;
  },
  colorize(s){
    const e = esc(s);
    if(/^✔/.test(s)) return '<span class="g">'+e+"</span>";
    if(/^✖|^Traceback|Error:|error:/.test(s)) return '<span class="e">'+e+"</span>";
    if(/^⚠|^Warning|warning:/.test(s)) return '<span class="w">'+e+"</span>";
    if(/^▸|^─/.test(s)) return '<span class="i">'+e+"</span>";
    return e;
  },
  pulseProblems(){ this.setPanelTab("problems"); },
  stopRun(){ this.running=false; this.toast("Nothing to stop — runs in this panel are synchronous","warn"); this.renderStatus(); },
  restartRun(){ if(this.active) this.run(); },

  async runConfigPicker(){
    const r = StProject.resolved(this.root);
    if(!r.runs.length){ this.toast("No run configs in "+MANIFEST+" — add one, or just Run the file","warn"); return; }
    StPalette.open({ tag:"run", placeholder:"Run a configuration…",
      items:r.runs.map(c=>({ cfg:c })),
      render:(it,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">▶</span><span class="lbl">${esc(it.cfg.name)}</span><span class="sub">${esc(it.cfg.command)}</span></div>`,
      quick:(q,items)=>Fuzzy.rank(q,items,x=>x.cfg.name+" "+x.cfg.command).map(x=>x.item),
      onPick:async(it)=>{
        const parts = it.cfg.command.split(/\s+/);
        const fileArg = parts.slice(1).find(a=>!a.startsWith("-"));
        const target = fileArg && VFS.node(VFS.norm(this.root, fileArg)) ? VFS.norm(this.root, fileArg) : this.active;
        this.setPanelTab("output");
        this.termLines = ["▸ "+it.cfg.command, "─".repeat(60),
          "This configuration names a host command. CYRUS runs what the browser can run and reports the rest:",
          "  "+it.cfg.command, "", "(no shell inside the page — copy the line above into your terminal)"];
        this.pbodyHtml = this.termLines.map(s=>this.colorize(s)).join("\n");
        this.renderPanel();
        Log.record("studio: run config "+it.cfg.name, "run_script", {name:it.cfg.name, cmd:it.cfg.command}, "medium", false, true, "Run config selected");
      }
    });
  },
  async runAllConfigs(){
    const r = StProject.resolved(this.root);
    if(!r.runs.length) return this.runConfigPicker();
    const lines = r.runs.map(c=>`${c.name.padEnd(10)} ${c.command}`);
    this.setPanelTab("output");
    this.termLines = ["▹ all run configurations in "+MANIFEST, "─".repeat(60), ...lines, "", "CYRUS does not chain host commands."];
    this.pbodyHtml = this.termLines.map(s=>this.colorize(s)).join("\n");
    this.renderPanel();
  },

  async explainFailure(){
    const rs = this.runState;
    if(!rs || !rs.result || rs.result.ok){ this.toast("Nothing has failed yet","warn"); return; }
    this.setRightTab("cyrus");
    const r = rs.result;
    const diag = this.lastProblems.slice(0,8).map(d=>"· line "+((d.line||0)+1)+": "+d.msg).join("\n");
    this.askAI("The run of "+VFS.base(rs.path)+" failed.\n\nCommand: "+(r.cmd||"(in-browser)")+
      "\n\nOutput:\n"+(r.out||"").slice(0,900)+"\n"+(r.err||"").slice(0,900)+
      "\n\nDiagnostics CYRUS itself reported:\n"+(diag||"(none)")+
      "\n\nExplain the root cause and give the exact fix.");
  },

  // ================= status bar =================
  buildStatusBar(){
    this.r.status.addEventListener("mousedown", e=>{
      const s = e.target.closest("[data-s]");
      if(!s) return;
      const a = s.dataset.s;
      if(a==="side") this.toggleSide();
      if(a==="right") this.toggleRight();
      if(a==="panel") this.togglePanel();
      if(a==="problems") this.setPanelTab("problems");
      if(a==="conn") StConn.sheet(null);
      if(a==="run") this.run();
      if(a==="lang") this.pickLanguage();
      if(a==="indent") this.pickIndent();
      if(a==="eol") this.toast("CYRUS Studio uses LF. The host editor decides the truth.","warn");
      if(a==="enc") this.toast("UTF-8","ok");
      if(a==="theme") this.cycleTheme();
      if(a==="settings") this.showSettings();
      if(a==="ai") { StSettings.set("inlineAI", !StSettings.get("inlineAI")); this.toast("Inline suggestions "+(StSettings.get("inlineAI")?"on":"off"),"ok"); this.renderStatus(); }
    });
  },
  renderStatus(){
    const ed = this.editor;
    const p = ed.primary;
    const line = ed.lineOf(p.e);
    const col = p.e - ed.lineStart(line);
    const selChars = p.e-p.s;
    const path = this.active;
    const tag = path ? LANG.forPath(path, ed.text) : null;
    const counts = this.lastProblems.reduce((a,d)=>{ a[d.sev]=(a[d.sev]||0)+1; return a; },{});
    const L = (key, content, cls)=>`<span class="s ${cls||""}" data-s="${key}">${content}</span>`;
    const parts = [];
    parts.push(L("side","🗂️ EXPLORER"));
    parts.push(L("right","✨ CYRUS"));
    parts.push(L("panel", this.panelOpen ? "▾ PANEL" : "▸ PANEL"));
    parts.push('<span class="grow"></span>');
    if(selChars) parts.push(`<span class="s" data-s="cursor">${selChars} selected</span>`);
    parts.push(L("cursor","Ln "+(line+1)+", Col "+(col+1)));
    if(counts.err) parts.push(`<span class="s" data-s="problems"><span style="color:#e8798f">✖ ${counts.err}</span></span>`);
    if(counts.warn) parts.push(`<span class="s" data-s="problems"><span style="color:#e0b155">⚠ ${counts.warn}</span></span>`);
    if(StSettings.get("inlineAI")) parts.push(L("ai","✨ inline"));
    // Phase 9: one cell that always says whether the granted authorities still hold.
    try{ parts.push(StConn.statusCell()); }catch(e){}
    if(path) parts.push(L("lang", tag ? tag.name : "Plain Text"));
    parts.push(L("indent","Spaces: "+StSettings.get("tabSize")));
    parts.push(L("eol","LF"));
    parts.push(L("enc","UTF-8"));
    parts.push(L("theme","◐ "+StThemes[StSettings.get("theme")].name));
    parts.push(L("settings","⚙"));
    this.r.status.innerHTML = parts.join("");
  },

  // ================= bottom panel =================
  bindPanel(){
    this.r.ptabs.addEventListener("mousedown", e=>{
      const t = e.target.closest("[data-pt]");
      if(t) this.setPanelTab(t.dataset.pt);
    });
  },
  setPanelTab(tab, silent){
    this.panelTab = tab;
    if(!silent){ this.panelOpen = true; StSettings.set("lastPanel", tab); StSettings.save(); }
    this.r.panel.classList.toggle("h0", !this.panelOpen);
    this.renderPanel(); this.renderStatus();
  },
  togglePanel(which){
    if(which && which!==this.panelTab){ this.setPanelTab(which); return; }
    this.panelOpen = !this.panelOpen;
    StSettings.set("lastPanel", this.panelTab); StSettings.save();
    this.r.panel.classList.toggle("h0", !this.panelOpen);
    this.renderStatus();
  },
  dockPanel(){ this.panelOpen = true; this.r.panel.classList.remove("h0"); this.renderStatus(); },
  renderPanel(){
    const tabs = [["problems","PROBLEMS"],["output","OUTPUT"],["terminal","TERMINAL"],["preview","PREVIEW"],["debug","DEBUG"],["tasks","TASKS"]];
    const counts = this.lastProblems.reduce((a,d)=>{ a[d.sev]=(a[d.sev]||0)+1; return a; },{});
    this.r.ptabs.innerHTML = tabs.map(([id,label])=>{
      const on = id===this.panelTab ? " on":"";
      const b = id==="problems" && counts.err ? `<span class="bdg">${counts.err}</span>` :
                id==="problems" && counts.warn ? `<span class="bdg" style="background:#e0b155">${counts.warn}</span>` : "";
      return `<div class="st2-ptab${on}" data-pt="${id}">${label}${b}</div>`;
    }).join("");

    const body = this.r.pbody;
    if(this.panelTab==="preview"){
      const pv = this.runState && this.runState.preview;
      body.innerHTML = pv ? `<iframe sandbox="allow-scripts" srcdoc="${esc(pv)}"></iframe>`
        : '<span class="d">Run a file to preview it here. HTML, CSS, Markdown and SVG render live.</span>';
      return;
    }
    if(this.panelTab==="problems"){
      if(!this.lastProblems.length){
        body.innerHTML = '<span class="g">✔ No problems detected</span><br><span class="d">'+
          "CYRUS checks brackets, unterminated strings, mixed indentation, unused imports, hard-coded secrets, "+
          "loose equality, long lines, bare excepts and missing include guards — without a compiler.</span>";
        return;
      }
      // Offer a ⚡ button only where CYRUS can fix the problem without guessing.
      // A mechanical fix is computed from the token stream; anything that would
      // need a model keeps its "Ask CYRUS" button and says so.
      const spec0 = LANG.forPath(this.active, this.editor.text);
      const src0 = this.editor.text;
      const fixable = this.lastProblems.map(d=>this.fixableFor(src0, spec0, d));
      // the count on the button is the number Fix All will actually apply
      const nFixable = fixable.filter(Boolean).length;
      const nSafe = fixable.filter(f=>f && f.safe).length;
      const head = nSafe>1
        ? `<div class="st2-pfixall"><span>${nSafe} of these CYRUS can fix on its own — no model, no guess.</span>`+
          `<button class="st2-btn fix" data-fixall="1">⚡ Fix all ${nSafe}</button></div>` : "";
      body.innerHTML = head + this.lastProblems.slice(0,300).map((d,i)=>{
        const loc = `${d.file?p2(d.file,this.root):""}${d.line!=null?":"+(d.line+1):""}${d.col?", "+(d.col+1):""}`;
        const mech = fixable[i]
          ? `<button class="st2-btn fix" data-mfix="${i}" title="${esc(fixable[i].label)}">⚡ Fix</button>` : "";
        const ai = (d.src==="run" || !mech) && d.sev!=="info"
          ? `<button class="st2-btn" data-fix="${i}" style="margin-left:6px;padding:1px 7px;font-size:10px">Ask CYRUS</button>` : "";
        return `<div class="st2-prow" data-prob="${i}"><span class="cl">${d.line!=null?String(d.line+1).padStart(4," "):""}</span>`+
               `<span class="${d.sev==="err"?"e":d.sev==="warn"?"w":"i"}">${d.sev==="err"?"✖":d.sev==="warn"?"⚠":"ℹ"}</span>`+
               `<span>${esc(d.msg)}</span><span class="cl" style="color:#4b4370">${esc(loc)}</span>${mech}${ai}</div>`;
      }).join("");
      body.querySelectorAll("[data-prob]").forEach(row=>{
        row.addEventListener("click", ()=>{
          const d = this.lastProblems[+row.dataset.prob];
          this.selectedProblem = d;
          if(d.file && d.file!==this.active) this.openPath(d.file);
          if(d.line!=null){ const p=this.editor.posAt(d.line, d.col||0); this.editor.setSelection(p, this.editor.lineEnd(d.line)); this.editor.revealLine(d.line); }
        });
        row.addEventListener("contextmenu", e=>{
          e.preventDefault();
          const d = this.lastProblems[+row.dataset.prob];
          this.selectedProblem = d;
          const m = fixable[+row.dataset.prob];
          this.problemMenu(e.clientX, e.clientY, d, m);
        });
      });
      const fa = body.querySelector("[data-fixall]");
      if(fa) fa.addEventListener("click", e=>{ e.stopPropagation(); this.fixAllMechanical(); });
      body.querySelectorAll("[data-mfix]").forEach(b=>b.addEventListener("click", e=>{
        e.stopPropagation();
        this.quickFix(this.lastProblems[+b.dataset.mfix]);
      }));
      body.querySelectorAll("[data-fix]").forEach(b=>b.addEventListener("click", e=>{
        e.stopPropagation();
        const d = this.lastProblems[+b.dataset.fix];
        this.selectedProblem = d;
        this.fixProblem();
      }));
      return;
    }
    if(this.panelTab==="output"){
      body.innerHTML = (this.pbodyHtml || '<span class="d">Nothing has run yet. Press ▶ or Ctrl+Enter.</span>');
      body.scrollTop = body.scrollHeight;
      return;
    }
    if(this.panelTab==="terminal"){
      const hist = StTerm.history.slice(-8).reverse().map(h=>`<div class="d">$ ${esc(h)}</div>`).join("");
      body.innerHTML = `<div class="d">CYRUS in-browser shell · cwd <span style="color:#8a80ab">${esc(StTerm.cwd)}</span> · type <span style="color:#8a80ab">help</span></div>`+
        `<div class="d" style="border-top:1px solid #1e1638;margin:6px 0;padding-top:5px">${hist}</div>`+
        (this.termOut||'<span class="d">(no output)</span>')+
        `<div style="display:flex;gap:6px;margin-top:8px;border-top:1px solid #1e1638;padding-top:7px">`+
        `<span style="color:var(--accent)">$</span>`+
        `<input data-r="term" spellcheck="false" placeholder="help" style="flex:1;background:transparent;border:none;outline:none;color:#e6dffc;font-family:var(--st-mono);font-size:11.5px">`+
        `<button class="st2-btn" data-a="termRun" style="padding:1px 10px">Run</button></div>`;
      const inp = body.querySelector('[data-r="term"]');
      const go = async ()=>{
        const v = inp.value.trim(); if(!v) return;
        inp.value = "";
        let out;
        try{ out = await StTerm.exec(v, { open:p=>this.openPath(p), run:p=>this.run(p) }); }
        catch(e){ out = '<span class="e">'+esc(e.message)+"</span>"; }
        if(out==="\u0000CLEAR") this.termOut = "";
        else this.termOut = `$ ${esc(v)}\n` + out + "\n";
        this.renderPanel();
        setTimeout(()=>{ const i2=this.r.pbody.querySelector('[data-r="term"]'); if(i2){ i2.focus(); } },10);
      };
      inp.addEventListener("keydown", e=>{ e.stopPropagation(); if(e.key==="Enter") go(); if(e.key==="ArrowUp"){ StTerm.hi=Math.max(0,StTerm.hi-1); inp.value=StTerm.history[StTerm.hi]||""; } });
      body.querySelector('[data-a="termRun"]').addEventListener("click", go);
      setTimeout(()=>{ if(this.panelTab==="terminal" && !StPalette.node){ const i2=this.r.pbody.querySelector('[data-r="term"]'); if(i2) i2.focus(); } },20);
      body.scrollTop = body.scrollHeight;
      return;
    }
    if(this.panelTab==="debug"){ this.renderDebug(body); return; }
    // tasks
    const r = StProject.resolved(this.root);
    const all = StSettings.get("savedTasks")||[];
    body.innerHTML = `<div class="st2-sec">FROM ${MANIFEST}</div>`+
      (r.runs.length ? r.runs.map(c=>`<div class="st2-prow"><span class="cl">▶</span><span>${esc(c.name)}</span><span class="d">${esc(c.command)}</span></div>`).join("")
                    : '<span class="d">No run configs declared. Run a file directly, or add a "runs" array to '+MANIFEST+".</span>")+
      `<div class="st2-sec">SAVED TASKS</div>`+
      (all.length ? all.map(c=>`<div class="st2-prow"><span class="cl">★</span><span>${esc(c.name)}</span><span class="d">${esc(c.command)}</span></div>`).join("")
        : '<span class="d">None. Terminal lines starting with "npm ", "cargo ", "go " and "python " are offered to be saved.</span>');
  },

  // ================= find bar =================
  buildFind(){
    const bar = el("div","st2-find hidden");
    bar.innerHTML =
      `<span style="font-size:11px;color:#8a80ab">Find</span>
       <input data-r="fq" placeholder="find" spellcheck="false">
       <button class="fx" data-r="fc" title="Match case">Aa</button>
       <button class="fx" data-r="fw" title="Whole word">|ab|</button>
       <button class="fx" data-r="fr" title="Regex">.*</button>
       <span class="ct" data-r="fcn">0/0</span>
       <button class="fx" data-r="fp" title="Previous">↑</button>
       <button class="fx" data-r="fn" title="Next">↓</button>
       <button class="fx" data-r="fx">✕</button>
       <input data-r="rq" placeholder="replace" spellcheck="false" style="display:none;width:130px">
       <button class="fx" data-r="rx" title="Replace">⇄</button>
       <button class="fx" data-r="ra" title="Replace all" style="display:none">⇉</button>`;
    this.win.body.appendChild(bar);
    bar.style.position = "absolute";
    bar.style.top = "34px";
    bar.style.right = "100px";
    this.findBar = bar;
    const q = k => bar.querySelector(`[data-r="${k}"]`);
    this.fq = q("fq"); this.rq = q("rq"); this.fcn = q("fcn");
    this.findOpts = { caseOn:false, whole:false, regex:false };
    const run = ()=>{
      const n = this.editor.setFind(this.fq.value, Object.assign({}, this.findOpts));
      this.fcn.textContent = (this.editor.find && this.editor.find.matches.length ? this.editor.find.idx+1 : 0)+"/"+n;
    };
    this.fq.addEventListener("input", run);
    this.fq.addEventListener("keydown", e=>{
      e.stopPropagation();
      if(e.key==="Enter"){ e.preventDefault(); this.editor.findNext(e.shiftKey?-1:1); this.fcn.textContent=(this.editor.find.idx+1)+"/"+this.editor.find.matches.length; }
      if(e.key==="Escape"){ e.preventDefault(); this.closeFind(); }
      if(e.key==="Tab"){ e.preventDefault(); this.rq.focus(); }
    });
    this.rq.addEventListener("keydown", e=>{
      e.stopPropagation();
      if(e.key==="Enter"){ e.preventDefault(); this.editor.replaceCurrent(this.rq.value); }
      if(e.key==="Escape"){ e.preventDefault(); this.closeFind(); }
    });
    q("fc").onclick = ()=>{ this.findOpts.caseOn=!this.findOpts.caseOn; q("fc").style.color=this.findOpts.caseOn?"var(--accent2)":""; run(); };
    q("fw").onclick = ()=>{ this.findOpts.whole=!this.findOpts.whole; q("fw").style.color=this.findOpts.whole?"var(--accent2)":""; run(); };
    q("fr").onclick = ()=>{ this.findOpts.regex=!this.findOpts.regex; q("fr").style.color=this.findOpts.regex?"var(--accent2)":""; run(); };
    q("fn").onclick = ()=>{ this.editor.findNext(1); this.fcn.textContent=(this.editor.find.idx+1)+"/"+this.editor.find.matches.length; };
    q("fp").onclick = ()=>{ this.editor.findNext(-1); this.fcn.textContent=(this.editor.find.idx+1)+"/"+this.editor.find.matches.length; };
    q("fx").onclick = ()=>this.closeFind();
    q("rx").onclick = ()=>{ const on=this.rq.style.display==="none"; this.rq.style.display=on?"":"none"; q("ra").style.display=on?"":"none"; if(on) this.rq.focus(); };
    q("ra").onclick = ()=>{ const n=this.editor.replaceAll(this.rq.value); this.toast("Replaced "+n+" occurrence"+(n===1?"":"s"),"ok"); };
    this.win.body.addEventListener("mousedown", e=>{
      if(!this.findBar.classList.contains("hidden") && !e.target.closest(".st2-find") && !e.target.closest(".st2-ta")){
        this.editor.setFind("", {}); this.closeFind();
      }
    });
  },
  openFind(replace){
    this.findBar.classList.remove("hidden");
    const ed = this.editor;
    const sel = ed.primary;
    if(sel.s!==sel.e && sel.e-sel.s<120) this.fq.value = ed.content.slice(sel.s, sel.e);
    this.fq.focus(); this.fq.select();
    if(replace){ this.rq.style.display=""; this.rq.focus(); }
    if(this.fq.value) this.editor.setFind(this.fq.value, this.findOpts);
  },
  closeFind(){ this.findBar.classList.add("hidden"); this.editor.setFind("", {}); this.editor.focus(); }
});
// ---- right panel: Copilot · Outline · Problems · Extensions · Source -----
Object.assign(StApp.prototype, {

  buildRight(){
    this.r.rtabs.addEventListener("mousedown", e=>{
      const t = e.target.closest("[data-rt]");
      if(t) this.setRightTab(t.dataset.rt);
    });
    this.r.rbody.addEventListener("mousedown", e=>{
      const g = e.target.closest("[data-goto]");
      if(g){ this.openPath(g.dataset.goto, { line:g.dataset.line?+g.dataset.line:undefined }); return; }
      const s = e.target.closest("[data-sym]");
      if(s){ const [p,l]=s.dataset.sym.split("|"); this.openPath(p,{line:+l}); return; }
      const a = e.target.closest("[data-extcmd]");
      if(a){ StExt.run(this, a.dataset.extcmd); return; }
      const c = e.target.closest("[data-ctxact]");
      if(c) this.quickAction(c.dataset.ctxact);
    });
    this.aiInput = this.newAIInput();
  },
  // A fresh, fully wired chat textarea. cloneNode() would drop the listeners,
  // and stringifying a node into innerHTML yields "[object HTMLTextAreaElement]",
  // so the panel builds its input through here instead.
  newAIInput(){
    const ta = el("textarea");
    ta.placeholder = "Ask about this code, or say “rewrite this to …”";
    ta.rows = 1;
    ta.addEventListener("keydown", e=>{
      e.stopPropagation();
      if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); this.send(); }
      if(e.key==="Tab"){
        e.preventDefault();
        const ed = this.editor;
        const s = ed ? ed.primary : null;
        const sel = (ed && s && s.s!==s.e) ? ed.content.slice(s.s,s.e) : "";
        ta.value += (ta.value && !/\s$/.test(ta.value) ? " " : "") + (sel ? "`"+sel+"`" : "");
        ta.focus();
      }
    });
    ta.addEventListener("input", ()=>{
      ta.style.height = "auto";
      ta.style.height = Math.min(120, ta.scrollHeight) + "px";
    });
    return ta;
  },
  setRightTab(tab){ this.rightTab = tab; this.renderRight(); },
  toggleRight(){ this.r.right.classList.toggle("w0"); this.renderRight(); },
  toggleSide(){ this.r.side.classList.toggle("w0"); },

  renderRight(){
    const tabs = [["cyrus","COPILOT"],["outline","OUTLINE"],["problems","PROBLEMS"],["ext","EXTENSIONS"]];
    const counts = this.lastProblems.reduce((a,d)=>{ a[d.sev]=(a[d.sev]||0)+1; return a; },{});
    this.r.rtabs.innerHTML = tabs.map(([id,label])=>{
      const b = id==="problems" && (counts.err||counts.warn) ? `<span class="bdg" style="background:${counts.err?"#e8798f":"#e0b155"}">${counts.err||counts.warn}</span>` : "";
      return `<div class="st2-rtab ${id===this.rightTab?"on":""}" data-rt="${id}">${label}${b}</div>`;
    }).join("");

    const b = this.r.rbody;
    if(this.rightTab==="cyrus") return this.renderAI(b);
    if(this.rightTab==="outline") return this.renderOutline(b);
    if(this.rightTab==="problems") return this.renderProblemsList(b);
    if(this.rightTab==="ext") return this.renderExtensions(b);
  },

  renderOutline(b){
    b.innerHTML = "";
    const path = this.active;
    if(!path){ b.innerHTML = '<div class="st2-empty">Open a file to see its structure.</div>'; return; }
    const t = this.tabs.find(x=>x.path===path);
    const text = path===this.active ? this.editor.text : (t&&t.text) || (VFS.node(path)||{}).content || "";
    const spec = LANG.forPath(path, text);
    const syms = SYMBOLS.extract(text, spec);
    const head = `<div class="st2-sec">${esc(spec.name.toUpperCase())} · ${syms.length} symbols · ${spec.pairs&&Object.keys(spec.pairs).length?"bracket-aware":""}</div>`;
    if(!syms.length){
      b.innerHTML = head + `<div class="st2-empty">No declarations found in ${esc(VFS.base(path))}.<br><span style="opacity:.7">The extractor understands ${LANG.count} languages; this file has no top-level symbols.</span></div>`;
      return;
    }
    const ic = { fn:"ƒ", cls:"◈", int:"◻", var:"▪", let:"▪", mod:"▣", prm:"◔", proc:"ƒ", ty:"τ" };
    const cur = this.editor.primary;
    const curLine = this.editor.lineOf(cur.e);
    b.innerHTML = head + syms.map(s=>{
      const here = s.line===curLine;
      return `<div class="st2-sym" data-sym="${esc(path)}|${s.line}" style="padding-left:${6+s.depth*11}px;${here?"background:#241a42;color:#e6dffc":""}">`+
        `<span class="ic ${s.kind}">${ic[s.kind]||"•"}</span>`+
        `<span class="nm">${esc(s.name)}${s.container?`<span style="color:#5b5382"> in ${esc(s.container)}</span>`:""}</span>`+
        `<span class="ln">${s.line+1}</span></div>`;
    }).join("");
  },

  renderProblemsList(b){
    if(!this.lastProblems.length){ b.innerHTML = '<div class="st2-empty">✔ No problems. <span style="opacity:.7">Compiler-free checks only.</span></div>'; return; }
    b.innerHTML = `<div class="st2-sec">${this.lastProblems.length} findings</div>`+
      this.lastProblems.map((d,i)=>`<div class="st2-prob ${d.sev}" data-goto="${esc(d.file||"")}" data-line="${d.line!=null?d.line:0}">`+
        `<b style="color:${d.sev==="err"?"#e8798f":d.sev==="warn"?"#e0b155":"#6fb3f2"}">${d.sev==="err"?"✖":d.sev==="warn"?"⚠":"ℹ"}</b> ${esc(d.msg)}`+
        `<span class="loc">${esc(p2(d.file||"",this.root))}${d.line!=null?" · line "+(d.line+1):""} · ${esc(d.src||"")}</span></div>`).join("");
  },

  renderExtensions(b){
    const list = StExt.list();
    b.innerHTML = `<div class="st2-sec">${list.length} INSTALLED · declarative manifests</div>`+
      `<div class="st2-note" style="margin-bottom:9px">Extensions here cannot execute arbitrary code. A plugin is a JSON manifest — it can only contribute commands, snippets and problem matchers, and every capability it asks for passes the table below.</div>`+
      `<div class="st2-sec">CAPABILITIES</div>`+
      Object.entries(CAPS).map(([k,v])=>`<div class="st2-prow"><span class="cl">${esc(k)}</span><span class="${v.risk==="high"?"e":v.risk==="medium"?"w":"g"}">${v.risk}</span><span class="d">${esc(v.desc)}</span></div>`).join("")+
      `<div class="st2-sec">EXTENSIONS</div>`+
      list.map(m=>{
        const cmds = (m.contributes&&m.contributes.commands)||[];
        return `<div class="st2-ext"><div class="nm">${m.icon||"🧩"} ${esc(m.name)} <span class="ver">v${esc(m.version||"1.0.0")}</span></div>`+
          `<div class="ds">${esc(m.description||"")}</div>`+
          `<div class="pm">${(m.permissions||[]).map(p=>{ const c=CAPS[p]; return `<b class="${c&&c.risk==="high"?"r":c&&c.risk==="medium"?"y":"g"}">${esc(p)}</b>`; }).join("")}</div>`+
          (cmds.length? `<div class="act">${cmds.slice(0,4).map(c=>`<button data-extcmd="${esc(c.id)}">${esc(c.title)}</button>`).join("")}</div>` : "")+
          `</div>`;
      }).join("")+
      `<div class="st2-sec">ADD YOUR OWN</div>`+
      `<div class="st2-note">Drop a JSON manifest at <b style="color:#a99ccc">${StExt.dir}/&lt;id&gt;.json</b> then run <b style="color:#a99ccc">Extensions: Reload</b>.</div>`+
      `<div class="st2-btn" data-extcmd="__install" style="margin-top:7px;align-self:flex-start">Scaffold an extension…</div>`;
    if(!VFS.node(StExt.dir)) VFS.mkdirp(StExt.dir);
  },

  showExtPanel(title, html){
    this.r.rtabs.querySelectorAll("[data-rt]").forEach(t=>t.classList.remove("on"));
    if(!this._extTab){ this._extTab = document.createElement("div");
      this._extTab.className="st2-rtab"; this._extTab.dataset.rt="__ext";
      this._extTab.addEventListener("mousedown", ()=>this.setRightTab("__ext"));
      this.r.rtabs.appendChild(this._extTab); }
    this._extTab.textContent = title.toUpperCase().slice(0,12);
    this._extTab.classList.add("on");
    this.rightTab = "__ext";
    this.r.rbody.innerHTML = html;
    this.r.rbody.querySelectorAll("[data-goto]").forEach(n=>{
      n.addEventListener("click", ()=>this.openPath(n.dataset.goto, { line:n.dataset.line?+n.dataset.line:undefined }));
    });
  },

  // ================= CYRUS Copilot =================
  buildContext(){
    const path = this.active;
    const c = { file:null, selection:null, symbols:"", errors:"" };
    c.project = StProject.aiContext(this.root);
    c.style = StProject.learn(this.root).summary;
    if(path){
      const t = this.tabs.find(x=>x.path===path);
      const text = this.editor.text;
      const spec = LANG.forPath(path, text);
      const p = this.editor.primary;
      const syms = SYMBOLS.extract(text, spec);
      const enclosing = SYMBOLS.at(syms, this.editor.lineOf(p.e), p.e - this.editor.lineStart(this.editor.lineOf(p.e)));
      c.file = { path, lang:spec.id, body:text.slice(0,16000), truncated:text.length>16000 };
      if(p.s!==p.e){
        const l1=this.editor.lineOf(p.s), l2=this.editor.lineOf(p.e);
        c.selection = { from:l1+1, to:l2+1, text:text.slice(p.s,p.e).slice(0,6000) };
      }
      if(syms.length)
        c.symbols = syms.slice(0,60).map(s=>`${s.kind} ${s.name} :${s.line+1}${s.container?" in "+s.container:""}`).join("\n");
      const errs = this.lastProblems.filter(d=>d.file===path && (d.sev==="err"||d.sev==="warn")).slice(0,12);
      if(errs.length) c.errors = errs.map(d=>`line ${d.line+1}: ${d.msg}`).join("\n");
      c.enclosing = enclosing ? `The cursor is inside ${enclosing.kind} ${enclosing.name} (line ${enclosing.line+1}).` : "";
      const t2 = this.tabs.find(x=>x.path===path);
      if(t2) t2.text = text;
    }
    // A tab can outlive its file on disk (deleted from the explorer, renamed
    // externally), and symbolsFor() has no symbols to report in that case.
    const firstSym = p => { const s = StIndex.symbolsFor(p); return (s && s.syms && s.syms[0] ? s.syms[0].name : ""); };
    c.openFiles = this.tabs.slice(0,8).map(t=>({ path:t.path, note: (t.dirty?"unsaved · ":"") + firstSym(t.path) }));
    return c;
  },
  renderAI(b){
    const ctx = this.buildContext();
    const chips = [];
    if(ctx.file) chips.push(`<span title="current file"><b>${esc(VFS.base(ctx.file.path))}</b><i data-c="file">✕</i></span>`);
    if(ctx.selection) chips.push(`<span><b>selection</b><i data-c="sel">✕</i></span>`);
    if(ctx.enclosing) chips.push(`<span><b>${esc(ctx.enclosing.replace("The cursor is inside ",""))}</b></span>`);
    if(ctx.symbols) chips.push(`<span><b>${(ctx.symbols||"").split("\n").length} symbols</b></span>`);
    if(ctx.errors) chips.push(`<span><b style="color:#e8798f">${this.lastProblems.filter(d=>d.sev==="err").length} errors</b></span>`);
    chips.push(`<span><b>${esc(StProject.resolved(this.root).name)}</b></span>`);
    const quota = this.ai.length ? "" : `<div class="st2-m ai">I read the <b>token stream</b>, not just the text — symbols, imports and diagnostics. Ask anything, or use a quick action.</div>`;
    b.innerHTML = `<div class="st2-msgs" data-r="msgs">${quota}${this.ai.map((m,i)=>this.aiHTML(m,i)).join("")}</div>
      <div class="st2-quick" style="margin-top:10px">
        <button data-ctxact="explain">Explain</button>
        <button data-ctxact="bugs">Find bugs</button>
        <button data-ctxact="refactor">Refactor</button>
        <button data-ctxact="tests">Tests</button>
        <button data-ctxact="docs">Document</button>
        <button data-ctxact="types">Explain types</button>
      </div>`;
    const msgs = b.querySelector('[data-r="msgs"]');
    msgs.scrollTop = msgs.scrollHeight;
    // inline panel input
    const box = el("div","st2-aiin");
    box.innerHTML = `<div class="st2-ctx">${chips.join("")}</div>
      <div class="row"><span data-a="slot"></span><button data-a="send">➤</button></div>`;
    box.querySelector("[data-a=slot]").replaceWith(this.newAIInput());
    b.appendChild(box);
    const ta = box.querySelector("textarea");
    box.querySelector("[data-a=send]").onclick = ()=>this.send();
    box.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{
      if(x.dataset.c==="file"){ this.ai=[]; }
      this.renderRight();
    });
    // code-block buttons
    msgs.querySelectorAll(".codeblock button").forEach(btn=>{
      btn.addEventListener("mousedown", e=>{
        e.preventDefault(); e.stopPropagation();
        const msg = this.ai[+btn.closest(".st2-m").dataset.i];
        const blocks = mdCodeBlocks(msg.text);
        const b2 = blocks[+btn.dataset.i];
        if(!b2) return;
        if(btn.dataset.act==="copy"){ this.toast(copied(b2.code),"ok"); return; }
        if(btn.dataset.act==="ask"){ const t2=this.r.rbody.querySelector(".st2-aiin textarea"); if(t2){ t2.value="Explain this code:\n\n"+b2.code; t2.focus(); } return; }
        this.applyCode(b2);
      });
    });
  },
  aiHTML(m, i){
    if(m.role==="user") return `<div class="st2-m user" data-i="${i}">${esc(m.text)}</div>`;
    if(m.role==="sys") return `<div class="st2-m sys" data-i="${i}">${esc(m.text)}</div>`;
    return `<div class="st2-m ai" data-i="${i}">${mdToHtml(m.text)}${m.via?`<div class="md-c" style="margin-top:6px">via ${esc(m.via)}</div>`:""}</div>`;
  },
  aiAdd(role, text, via){
    this.ai.push({ role, text, via });
    if(this.ai.length>40) this.ai.splice(0, this.ai.length-40);
    this.rightTab = "cyrus";
    this.renderRight();
    return text;
  },
  async send(explicit){
    const box = this.r.rbody.querySelector(".st2-aiin textarea");
    // An explicit question comes from askAI() and the quick actions, which never
    // touch the textarea; re-reading it there silently dropped them.
    const v = (explicit!=null ? String(explicit) : (box ? box.value : "")).trim();
    if(!v || this.aiBusy) return;
    if(box && explicit!=null) box.value = "";
    this.aiAdd("user", v);
    this.aiBusy = true;
    const wait = this.aiAdd("ai","⏳ thinking…");
    const c = this.buildContext();
    const mode = /\b(rewrite|refactor|rename|convert|add tests|document|comment|implement)\b/i.test(v) ? "edit" : "chat";
    try{
      const r = await Copilot.ask(c, v, { mode, maxTokens: mode==="edit"?2600:1200 });
      const idx = this.ai.indexOf(wait);
      if(idx>=0) this.ai.splice(idx,1);
      if(r.ok){
        this.aiAdd("ai", r.text, r.viaLabel);
        Log.record("studio: ask "+v.slice(0,60), "ai_query", {q:v.slice(0,200)}, "low", false, true, "Answered via "+r.viaLabel);
      } else {
        this.aiAdd("sys", "CYRUS could not reach the brain ("+((r.errors||[]).join("; ")||"all providers offline")+"). "+
          "Connect one in Settings → CYRUS Brain — a free keyless provider (Pollinations, Puter) is enough for most of this panel.");
      }
    }catch(e){
      const idx = this.ai.indexOf(wait);
      if(idx>=0) this.ai.splice(idx,1);
      this.aiAdd("sys","Request failed: "+e.message);
    }
    this.aiBusy = false;
    this.renderRight();
  },
  // send() records the question itself, so this must not add it a second time.
  askAI(text, opts){ this.setRightTab("cyrus"); this.send(text); this.renderRight(); },
  focusAI(){ this.setRightTab("cyrus"); setTimeout(()=>{ const t=this.r.rbody.querySelector(".st2-aiin textarea"); if(t) t.focus(); },40); },
  quickAction(kind){
    const map = {
      explain:"Explain what this file does, step by step, and why it is written this way.",
      bugs:"Find real bugs, race conditions and edge cases. For each one give the line, why it is wrong, and the exact fix.",
      refactor:"Refactor this to be clearer and easier to test. Keep behaviour identical.",
      tests:"Write unit tests for this file. Match the project's existing conventions.",
      docs:"Add clear documentation to this file. Return the complete file.",
      types:"Explain the types, interfaces and data flow in this file."
    };
    const mode = ["refactor","tests","docs"].includes(kind) ? "edit" : "chat";
    this.aiAdd("user", map[kind]||kind);
    this.setRightTab("cyrus");
    const run = async ()=>{
      const wait = this.aiAdd("ai","⏳ thinking…");
      const c = this.buildContext();
      if(mode==="edit") return this.runAgentic(c, map[kind]);
      const r = await Copilot.ask(c, map[kind]||kind, { mode:"chat" });
      const idx=this.ai.indexOf(wait); if(idx>=0) this.ai.splice(idx,1);
      if(r.ok) this.aiAdd("ai", r.text, r.viaLabel);
      else this.aiAdd("sys","CYRUS could not reach the brain ("+((r.errors||[]).join("; ")||"offline")+").");
      this.renderRight();
    };
    setTimeout(run, 20);
  },
  async runAgentic(c, instruction){
    const path = this.active;
    if(!path){ this.aiAdd("sys","Open a file first."); return; }
    const before = this.editor.text;
    const res = await Copilot.edit(c, instruction, before);
    if(!res.ok){
      this.aiAdd("sys", res.err + (res.prose? "\n\n"+res.prose : ""));
      this.renderRight();
      return;
    }
    this.aiAdd("ai", `Here is the rewrite — <b>${res.stat.add} added, ${res.stat.del} removed</b>. Nothing has been written yet; review the diff and accept it below.`, res.via);
    this.setRightTab("cyrus");
    this.renderRight();
    this.showDiff({ title:path, a:before, b:res.code, rows:res.rows, stat:res.stat, target:path,
      applyLabel:"Accept & write",
      onApply:(final)=>{
        this.editor.setContent(final, true);
        const t = this.tabs.find(x=>x.path===path);
        if(t){ t.text = final; t.dirty = true; }
        this.analyze();
        Log.record("studio: agentic edit "+path, "studio_ai_edit", {path, add:res.stat.add, del:res.stat.del},
                   "medium", true, true, "Accepted an AI rewrite (+"+res.stat.add+" −"+res.stat.del+")");
        this.toast("Applied · save to write to disk","ok");
        this.renderTabs(); this.renderStatus();
      }});
  },
  applyCode(block){
    const p = this.editor.primary;
    if(p.s!==p.e && block.code.trim().length < 4000){
      this.editor.apply(()=> this.editor.content.slice(0,p.s)+block.code+this.editor.content.slice(p.e));
      this.toast("Replaced the selection","ok");
    } else if(block.code.split("\n").length > 5 && (VFS.node(this.active)||{}).content === this.editor.text){
      this.showDiff({ title:this.active, a:this.editor.text, b:block.code, target:this.active,
        applyLabel:"Accept & apply", onApply:(f)=>{ this.editor.setContent(f,true); const t=this.tabs.find(x=>x.path===this.active); if(t) t.text=f; this.analyze(); this.renderTabs(); } });
    } else {
      this.editor.insert("\n"+block.code+"\n");
      this.toast("Inserted at the cursor","ok");
    }
  },
  async fixProblem(){
    const d = this.selectedProblem;
    if(!d){ this.toast("Select a problem in the Problems panel first","warn"); return; }
    if(d.file && d.file!==this.active) this.openPath(d.file, {line:d.line});
    await this.runAgentic(this.buildContext(),
      `Fix the problem CYRUS reported at line ${(d.line||0)+1}: ${d.msg}. Change only what is necessary and keep everything else identical.`);
  },
  // -------------------------------------------------------------------------
  //  DEBUG — the honest kind
  //  There is no debugger in a page: no breakpoints, no stepper, no stack. What
  //  a browser CAN show you truthfully is the token stream everything else is
  //  built on, and exactly which token the caret is sitting in. So that is what
  //  this panel shows, and it works before anything has been run.
  // -------------------------------------------------------------------------
  tokenAt(pos){
    const ed = this.editor;
    if(!ed || pos==null) return null;
    const src = ed.text, spec = ed.spec;
    const toks = LANG.tokenize(src, spec);
    const t = toks.find(x=> pos>=x.s && pos<x.e);
    const line = ed.lineOf(pos);
    const ls = ed.lineStart(line) || 0;
    if(!t) return { kind:"plain", text:src[pos]?src[pos]:"(end of file)", line, col:pos-ls, size:1 };
    return { kind:t.t||"plain", cls:t.c||"", text:src.slice(t.s,t.e), line:ed.lineOf(t.s),
             col:t.s-(ed.lineStart(ed.lineOf(t.s))||0), size:t.e-t.s, start:t.s };
  },
  renderDebug(body){
    const rs = this.runState;
    const spec = this.editor ? this.editor.spec : LANG.forPath("");
    const tok = this.tokenAt(this.editor ? this.editor.primary.e : null);
    const diagAt = tok ? this.lastProblems.filter(p=>p.line===tok.line) : [];
    const mem = performance.memory ? Math.round(performance.memory.usedJSHeapSize/1048576)+" MB heap" : "heap not exposed";

    let html = `<div class="st2-sec">CARET</div>`;
    if(tok){
      // tokenize() emits {s,e,t}; the colour comes from the .<kind> CSS rule, so
      // showing the token inside a .st2-hl span shows the real editor colour
      html += `<div class="st2-prow"><span class="cl">token</span><span class="st2-mono st2-hl-inline"><span class="${esc(tok.cls||tok.kind)}">${esc(tok.text.length>60?tok.text.slice(0,60)+"…":tok.text)}</span></span></div>`+
        `<div class="st2-prow"><span class="cl">kind</span><span><span class="st2-badge y">${esc(tok.kind)}</span> coloured by <span class="st2-mono">.${esc(tok.cls||tok.kind)}</span></span></div>`+
        `<div class="st2-prow"><span class="cl">at</span><span>line ${tok.line+1}, col ${tok.col+1} · offsets ${tok.start}–${tok.start+tok.size} · ${tok.size} char${tok.size===1?"":"s"}</span></div>`+
        (diagAt.length ? `<div class="st2-prow"><span class="cl">here</span><span>${diagAt.map(d=>esc(d.msg)).join("<br>")}</span></div>` : "");
    } else {
      html += `<div class="st2-prow"><span class="d">Put the caret in the file to inspect its token.</span></div>`;
    }

    html += `<div class="st2-sec">RUN</div>`;
    if(rs && rs.result){
      const res = rs.result;
      html += `<div class="st2-prow"><span class="cl">file</span><span>${esc(rs.path)}</span></div>`+
        `<div class="st2-prow"><span class="cl">cmd</span><span>${esc(rs.plan.command||"(in-browser)")}${rs.plan.fromManifest?" [manifest]":" [inferred]"}</span></div>`+
        `<div class="st2-prow"><span class="cl">result</span><span class="${res.ok?"g":"e"}">${res.ok?"ok":"failed"} · ${res.kind} · ${Math.round(res.ms||0)}ms</span></div>`;
    } else {
      html += `<div class="st2-prow"><span class="d">Nothing has run yet. The caret readout above works anyway.</span></div>`;
    }

    const toks = LANG.tokenize(this.editor ? this.editor.text : "", spec);
    const byType = {};
    toks.forEach(t=>{ if(t.t) byType[t.t]=(byType[t.t]||0)+1; });
    html += `<div class="st2-sec">TOKEN STREAM (what every other phase reads)</div>`+
      (Object.keys(byType).length
        ? Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="st2-prow"><span class="cl">${esc(k)}</span><span>${v}</span></div>`).join("")
        : `<div class="st2-prow"><span class="d">Empty file.</span></div>`);

    html += `<div class="st2-sec">RUNTIME</div>`+
      `<div class="st2-prow"><span class="cl">heap</span><span>${mem}</span></div>`+
      `<div class="st2-prow"><span class="cl">lines</span><span>${this.editor?this.editor.lineCount():0}</span></div>`+
      `<div class="st2-prow"><span class="cl">language</span><span>${esc(spec.name)} · ${spec.derived?"(derived fallback)":spec.exts.length+" extensions"}</span></div>`+
      `<div class="st2-note" style="margin-top:8px">No breakpoints and no stepper: a page cannot host a debugger. `+
      `What you see above is the real token stream and the real timing of the run — inspect it rather than take it on faith.</div>`;
    body.innerHTML = html;
  },

// -------------------------------------------------------------------------
  //  QUICK FIX
  //  A mechanical fix is one CYRUS derived from the token stream itself, so it
  //  needs no model and is correct for the class of bug it names. An AI fix is
  //  a guess. Both arrive as one diff, and the diff says which tier produced it
  //  — the difference is the whole point, so it is never hidden.
  // -------------------------------------------------------------------------
  fixableFor(src, spec, d){
    return DIAG.quickFix(src, spec, d).find(f=>f.kind==="mechanical") || null;
  },
  quickFix(d, opts){
    opts = opts || {};
    if(!this.active){ this.toast("Open a file first","warn"); return; }
    if(d && d.file && d.file!==this.active) this.openPath(d.file, {line:d.line});
    const src = this.editor.text;
    const spec = LANG.forPath(this.active, src);
    // Fix All only batches safe fixes; unsafe ones (adding `export`) stay one click
    const pool = opts.all ? this.lastProblems : [d].filter(Boolean);
    const chosen = [];
    for(const p of pool){
      const m = this.fixableFor(src, spec, p);
      if(m && (!opts.all || m.safe)) chosen.push(m);
    }

    if(!chosen.length){
      const target = opts.all ? null : d;
      if(target){
        this.toast("No mechanical fix for that — asking CYRUS instead","warn");
        return this.fixProblem();
      }
      this.toast("Nothing here CYRUS can fix on its own","info");
      return;
    }
    const after = DIAG.applyFixes(src, chosen);
    if(after===src){ this.toast("Nothing to change","info"); return; }
    const rows = Diff.lines(src, after);
    this.showDiff({
      title: opts.all ? this.active+" — "+chosen.length+" fixes" : this.active+" — "+chosen[0].label,
      a:src, b:after, rows, stat:Diff.stat(rows), target:this.active,
      tier:"mechanical",
      note: chosen.length>1 ? chosen.map(c=>c.label).join(" · ")
                            : (chosen[0].note || chosen[0].label),
      applyLabel: opts.all ? ("Apply "+chosen.length+" fixes") : "Apply fix",
      onApply:(final)=>{
        this.editor.setContent(final, true);
        const t = this.tabs.find(x=>x.path===this.active);
        if(t){ t.text = final; t.dirty = true; }   // setContent bypasses on.change, so mark it here
        this.analyze();
        Log.record("studio: quick fix "+this.active, "studio_quickfix",
                   {path:this.active, tier:"mechanical", fixes:chosen.map(c=>c.id)},
                   "low", true, true, "Applied "+chosen.length+" mechanical fix(es): "+chosen.map(c=>c.id).join(", "));
        this.toast("Fixed · save to write to disk","ok");
        this.renderTabs(); this.renderStatus(); this.renderPanel();
      }
    });
  },
  fixAllMechanical(){ this.quickFix(null, {all:true}); },

  // Ctrl+.  Uses the problem the caret is sitting on when nothing is selected,
  // which is what you want when your eyes are in the editor, not the panel.
  quickFixSelected(){
    if(!this.active){ this.toast("Open a file first","warn"); return; }
    const src = this.editor.text, spec = LANG.forPath(this.active, src);
    let d = this.selectedProblem;
    if(!d && this.editor){
      const line = this.editor.lineOf(this.editor.primary.e);
      const onLine = this.lastProblems.filter(p=>p.line===line && p.file!==undefined || (p.line===line && !p.file));
      // prefer the worst thing on the caret's line: a bracket error beats a note
      d = onLine.sort((a,b)=>({err:0,warn:1,info:2})[a.sev]-({err:0,warn:1,info:2})[b.sev])[0];
    }
    if(!d){ this.toast("No problem at the cursor","info"); return; }
    this.selectedProblem = d;
    this.quickFix(d);
  },

  // Right-click a problem. The mechanical entry only appears when one exists,
  // so the menu never offers a button that would have to guess.
  problemMenu(x, y, d, mech){
    const items = [];
    if(mech) items.push(["⚡", mech.label, ()=>this.quickFix(d), true]);
    items.push(["✷", "Ask CYRUS to fix this", ()=>this.fixProblem(), d.sev!=="info"]);
    items.push(["?", "Explain this problem", ()=>this.explainProblem(), true]);
    items.push(["→", "Go to it", ()=>{
      if(d.file && d.file!==this.active) this.openPath(d.file, {line:d.line});
      else if(d.line!=null){ const p=this.editor.posAt(d.line,d.col||0); this.editor.setSelection(p,this.editor.lineEnd(d.line)); this.editor.revealLine(d.line); }
    }, d.line!=null]);
    items.push(["⧉", "Copy message", ()=>{ this.toast(copied(d.msg),"ok"); }, true]);
    buildCtxMenu(items, x, y);
  },

  explainProblem(){
    const d = this.selectedProblem;
    if(!d){ this.toast("Select a problem first","warn"); return; }
    this.askAI(`CYRUS's diagnostic engine flagged line ${(d.line||0)+1} of ${d.file}: "${d.msg}". Explain what that means here, whether it is a real bug or a false positive, and what to do.`);
  },

  // ================= navigation =================
  navTo(path, line){
    this.nav.stack = this.nav.stack.slice(0, this.nav.pos+1);
    if(this.active && this.active!==path) this.nav.stack.push({path:this.active, line:this.editor.lineOf(this.editor.caret)});
    this.nav.pos = this.nav.stack.length-1;
    this.openPath(path, { line });
  },
  navBack(){
    if(this.nav.pos<=0) return;
    this.nav.pos--; const n=this.nav.stack[this.nav.pos];
    this.openPath(n.path, {line:n.line});
  },
  navForward(){
    if(this.nav.pos>=this.nav.stack.length-1) return;
    this.nav.pos++; const n=this.nav.stack[this.nav.pos];
    this.openPath(n.path, {line:n.line});
  },
  quickOpen(){
    const recent = StSettings.get("recent")||[];
    const items = StIndex.quickOpen(this.root, "", 400).concat(
      recent.filter(p=>VFS.node(p)).map(p=>({path:p, kind:"recent"})));
    StPalette.open({
      tag:"file", placeholder:"Search files by name or by what's inside them…",
      items,
      render:(it,i)=>{
        const spec = LANG.forPath(it.path);
        const r = it.ranges;
        return `<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">${this.iconFor(it.path)}</span>`+
          `<span class="lbl">${r?Fuzzy.highlight(VFS.base(it.path), r):esc(VFS.base(it.path))}</span>`+
          `<span class="sub">${esc(p2(it.path,this.root))} · ${esc(spec.name)}</span></div>`;
      },
      quick:(q,items)=>StIndex.quickOpen(this.root, q, 40).map(x=>Object.assign(x,{ranges:Fuzzy.match(q,VFS.base(x.path))?.ranges})),
      onPick:(it)=>{ this.navTo(it.path); if(it.why) this.toast(it.why,"ok"); }
    });
  },
  gotoSymbol(){
    if(!this.active){ this.toast("Open a file first","warn"); return; }
    const spec = LANG.forPath(this.active, this.editor.text);
    const syms = SYMBOLS.extract(this.editor.text, spec);
    if(!syms.length){ this.toast("No symbols in this file","warn"); return; }
    StPalette.open({ tag:"symbol", placeholder:"Go to symbol in "+VFS.base(this.active)+"…",
      items:syms,
      render:(s,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">${s.kind==="fn"?"ƒ":s.kind==="cls"?"◈":"▪"}</span>`+
        `<span class="lbl">${esc(s.name)}</span><span class="sub">${s.container?esc(s.container)+" · ":""}line ${s.line+1}</span></div>`,
      quick:(q,items)=>Fuzzy.rank(q,items,x=>x.name).map(x=>x.item),
      onPick:(s)=>{ this.editor.setSelection(this.editor.posAt(s.line,0), this.editor.posAt(s.line,s.col)+s.name.length);
        this.editor.revealLine(s.line); this.editor.focus(); } });
  },
  gotoWorkspaceSymbol(){
    StPalette.open({ tag:"workspace", placeholder:"Go to a symbol anywhere in "+p2(this.root,"~")+"…",
      items:StIndex.symbolSearch(this.root, "", 300),
      render:(s,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">${s.kind==="fn"?"ƒ":s.kind==="cls"?"◈":"▪"}</span>`+
        `<span class="lbl">${esc(s.name)}</span><span class="sub">${esc(p2(s.path,this.root))}${s.container?" › "+esc(s.container):""} · ${s.line+1}</span></div>`,
      quick:(q,items)=>{
        if(!q) return items;
        const byName = Fuzzy.rank(q, items, x=>x.name).map(x=>x.item);
        const seen=new Set(byName.map(x=>x.path+"::"+x.name));
        return byName.concat(items.filter(x=>!seen.has(x.path+"::"+x.name) && (x.container||"").toLowerCase().includes(q.toLowerCase())));
      },
      onPick:(s)=>this.navTo(s.path, s.line) });
  },
  gotoLine(){
    StPalette.open({ tag:"line", placeholder:"Go to line…",
      items:Array.from({length:Math.max(1,this.editor.lineCount())},(_,i)=>i+1),
      render:(n,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">${n}</span><span class="lbl">${esc(this.editor.lineText(n-1).slice(0,80)||"(blank)")}</span></div>`,
      quick:(q,items)=>{ const n=parseInt(q,10); return isNaN(n) ? items.slice(0,30) : items.filter(x=>x>=n).slice(0,30); },
      onPick:(n)=>{ const p=this.editor.posAt(n-1,0); this.editor.setSelection(p,p); this.editor.revealLine(n-1); this.editor.focus(); } });
  },
  findReferences(){
    const w = this.editor.wordAtCaret;
    if(!w){ this.toast("Put the cursor on a name first","warn"); return; }
    const refs = StIndex.references(this.root, w, this.active);
    StPalette.open({ tag:"refs", placeholder:`${refs.length} reference${refs.length===1?"":"s"} to ${w}…`, items:refs,
      render:(r,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">${this.iconFor(r.path)}</span>`+
        `<span class="lbl">${esc(w)}</span><span class="sub">${esc(p2(r.path,this.root))}:${r.line+1}</span></div>`,
      quick:(q,items)=>Fuzzy.rank(q,items,x=>p2(x.path,this.root)).map(x=>x.item),
      onPick:(r)=>this.navTo(r.path, r.line) });
    Log.record("studio: find references "+w, "search_files", {name:w, n:refs.length}, "low", false, true, refs.length+" references");
  },
  referencesPanel(){
    const w = this.editor.wordAtCaret;
    if(!w) return;
    const refs = StIndex.references(this.root, w, this.active);
    this.showExtPanel("References", `<div class="st2-sec">${refs.length} references to <b style="color:var(--accent2)">${esc(w)}</b></div>`+
      refs.map(r=>`<div class="st2-prob info" data-goto="${esc(r.path)}" data-line="${r.line}"><b>${esc(w)}</b><span class="loc">${esc(p2(r.path,this.root))}:${r.line+1}</span></div>`).join(""));
  },

  commandPalette(){
    const items = StCmds.forPalette();
    StPalette.open({ tag:"cmd", placeholder:"Type a command…", items,
      render:(c,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">▸</span>`+
        `<span class="lbl"><b>${esc(c.category)}</b> › ${esc(c.title)}</span>${c.key?`<span class="kc">${esc(c.key)}</span>`:""}</div>`,
      quick:(q,items)=>items.map(c=>({c,m:Fuzzy.match(q, c.category+" "+c.title)})).filter(x=>x.m)
        .sort((a,b)=>b.m.score-a.m.score).map(x=>x.c),
      footer:"<b>↑↓</b> move · <b>enter</b> run · <b>esc</b> dismiss",
      onPick:(c)=>c.run() });
  },
});
// ---- context menus, dialogs, welcome, project info ------------------------
Object.assign(StApp.prototype, {

      ["📂", "Open", ()=>this.explorer.open(paths[0])],

      ["⧉", one ? "Duplicate" : `Duplicate ${n} items`, ()=>this.explorer.duplicateSel()],
      null,
      ["📋", "Copy", ()=>{ this.explorer.copy(); this.toast(n+" copied","ok"); }],
      ["✂", "Cut", ()=>{ this.explorer.cut(); this.toast(n+" cut","ok"); }],
      ["📥", "Paste here", ()=>this.explorer.paste(paths[0]), this.explorer.clip],
      ["📋", "Copy path", ()=>this.toast(copied(paths.join("\n")),"ok")],
      null,
      ["🤖", "Ask CYRUS about this", ()=>this.askAI("Explain "+paths.map(p=>p2(p,this.root)).join(", "))],
      ["🧭", "Find in workspace…", ()=>{ this.r.filter.value=paths.length===1?VFS.base(paths[0]):""; this.explorer.search(this.r.filter.value); }],

      ["↩","Close",()=>this.closeTab(p)],
      ["×","Close Others",()=>{ this.tabs.filter(a=>a.path!==p).forEach(a=>a.dirty=false); this.tabs=this.tabs.filter(a=>a.path===p); this.renderTabs(); }],
      ["▥","Split Right",()=>{ this.openPath(p); this.splitEditor(); }],
      ["🔍","Reveal in Explorer",()=>this.explorer.reveal(p)],
      t&&t.dirty ? ["💾","Save",()=>this.save()] : null,

  async newFile(){
    const dir = await this.pickTarget("Where should the new file go?");
    if(!dir) return;
    const name = await this.promptText("New file name", "untitled.js");
    if(!name) return;
    const r = StFS.newFile(dir, name);

    this.refreshExplorer();
    this.openPath(r.path);
  },
  async newFolder(){
    const dir = await this.pickTarget("Where should the new folder go?");
    if(!dir) return;
    const name = await this.promptText("New folder name", "src");
    if(!name) return;
    const r = StFS.newFolder(dir, name);
    if(!r.ok){ this.toast(r.err,"err"); return; }
    this.explorer.expanded.add(dir); this.explorer.expanded.add(r.path);
    this.refreshExplorer();
  },
  pickTarget(title){
    const dirs = [];
    const walk = (p, d)=>{
      const n = VFS.node(p); if(!n||n.type!=="dir") return;
      dirs.push({ path:p, depth:d });
      if(d>3) return;
      Object.keys(n.children).sort().forEach(k=>{ if(n.children[k].type==="dir" && !k.startsWith(".")) walk(p+"/"+k, d+1); });
    };
    walk(this.root, 0);
    return new Promise(resolve=>{
      let done = false;
      StPalette.open({ tag:"folder", placeholder:title||"Pick a folder…", items:dirs,
        render:(d,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}" style="padding-left:${11+d.depth*16}px"><span class="ic">${d.depth?"":"📁"}</span><span class="lbl">${esc(VFS.base(d.path)||"/")}</span><span class="sub">${esc(p2(d.path,"~"))}</span></div>`,
        quick:(q,items)=>Fuzzy.rank(q,items,x=>x.path).map(x=>x.item),
        onPick:(d)=>{ done=true; StPalette.close(); resolve(d.path); },
        onCancel:()=>{ if(!done) resolve(null); } });
    });
  },
  promptText(title, def){
    return new Promise(resolve=>{
      const back = stModal();
      back.innerHTML = `<div class="st2-pal" style="width:460px">
        <div class="st2-pal-in"><span class="tag">input</span><input placeholder="${esc(def||"")}" value="${esc(def||"")}" spellcheck="false"></div>
        <div class="st2-pal-f"><b>enter</b> confirm · <b>esc</b> cancel</div></div>`;
      document.body.appendChild(back);
      const inp = back.querySelector("input");
      const done = v => { back.remove(); document.removeEventListener("keydown", trap, true); resolve(v); };
      const trap = e => { e.stopPropagation(); if(e.key==="Escape"){ e.preventDefault(); done(null); } };
      document.addEventListener("keydown", trap, true);
      inp.addEventListener("keydown", e=>{
        e.stopPropagation();
        if(e.key==="Enter"){ e.preventDefault(); done(inp.value.trim()||null); }
        if(e.key==="Escape"){ e.preventDefault(); done(null); }
      });
      back.addEventListener("mousedown", e=>{ if(e.target===back) done(null); });
      setTimeout(()=>{ inp.focus(); inp.select(); },20);
      this._activePrompt = done;
    });
  },
  openFolderPicker(){
    const dirs = [];
    const walk = (p,d)=>{
      const n=VFS.node(p); if(!n||n.type!=="dir") return;
      dirs.push({path:p,depth:d});
      if(d>4) return;
      Object.keys(n.children).sort().forEach(k=>{ if(n.children[k].type==="dir") walk(p+"/"+k,d+1); });
    };
    walk("/home/rithvik", 0);
    StPalette.open({ tag:"workspace", placeholder:"Open a folder as the workspace…", items:dirs,
      render:(d,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}" style="padding-left:${11+d.depth*16}px"><span class="ic">📁</span><span class="lbl">${esc(VFS.base(d.path)||"/")}</span><span class="sub">${esc(p2(d.path,"~"))}</span></div>`,
      quick:(q,items)=>Fuzzy.rank(q,items,x=>x.path).map(x=>x.item),
      onPick:(d)=>{ const proj=StProject.detect(d.path); this.setRoot(proj?proj.root:d.path);
        this.tabs=[]; this.active=null; this.editor.setFile("","");
        this.renderTabs(); this.renderWelcome(); this.analyze(); this.renderRight(); } });
  },
  newProjectDialog(){
    const kinds = [["node","Node.js"],["python","Python"],["rust","Rust"],["go","Go"],["static","Static site"],["blank","Empty workspace"]];
    StPalette.open({ tag:"new", placeholder:"What kind of project?", items:kinds.map(k=>({id:k[0],name:k[1]})),
      render:(k,i)=>`<div class="st2-pal-i ${i?"on":""}" data-i="${i}"><span class="ic">✦</span><span class="lbl">${esc(k.name)}</span><span class="sub">${k.id==="blank"?"just "+MANIFEST:"scaffolded with a run config"}</span></div>`,
      onPick:async(k)=>{
        const name = await this.promptText("Project name", "my-project");
        if(!name) return;
        const dir = VFS.norm(this.root, name);
        if(VFS.node(dir)) return this.toast("That folder already exists","err");
        VFS.mkdirp(dir);
        const r = StProject.scaffold(dir, name, k.id);
        if(!r.ok) return this.toast(r.err,"err");
        this.setRoot(dir);
        this.tabs=[]; this.active=null;
        this.renderTabs(); this.renderWelcome();

  async initWorkspace(){

  // ---- breadcrumbs / welcome ---------------------------------------------
  renderBread(){

    this.r.bread.classList.remove("hidden");
    const parts = this.active.split("/").filter(Boolean);
    let acc = "";
    const crumbs = parts.map(seg=>{ acc += "/"+seg; return { path:acc, name:seg }; });
    const p = this.editor.primary;

      (at? `<span style="opacity:.4">›</span><span class="bs on">${at.kind==="fn"?"ƒ":at.kind==="cls"?"◈":"▪"} ${esc(at.name)}</span>`:"");

      <div class="grid">
        <div class="card" data-w="qopen"><div class="k">🔎 <span>Go to File</span><kbd>Ctrl P</kbd></div><div class="d">Fuzzy search by name, or by what is inside the file</div></div>
        <div class="card" data-w="palette"><div class="k">⌘ <span>Command Palette</span><kbd>Ctrl ⇧ P</kbd></div><div class="d">Every command CYRUS Studio has</div></div>
        <div class="card" data-w="symbol"><div class="k">≣ <span>Go to Symbol</span><kbd>Ctrl ⇧ O</kbd></div><div class="d">Every function, class and type in this file</div></div>
        <div class="card" data-w="wssym"><div class="k">🧭 <span>Workspace Symbols</span><kbd>Ctrl T</kbd></div><div class="d">Symbols across every file</div></div>
        <div class="card" data-w="newfile"><div class="k">✚ <span>New File</span><kbd>Ctrl ⌥ N</kbd></div><div class="d">Create files and folders in any folder of the workspace</div></div>
        <div class="card" data-w="newproj"><div class="k">✦ <span>New Project</span><kbd>—</kbd></div><div class="d">Scaffold one with ${MANIFEST} already written</div></div>
        <div class="card" data-w="ext"><div class="k">🧩 <span>Extensions</span><kbd>Ctrl ⇧ X</kbd></div><div class="d">Capability-gated plugins</div></div>
        <div class="card" data-w="honest"><div class="k">◐ <span>What CYRUS won't fake</span><kbd>—</kbd></div><div class="d">The honest list of what this editor really does</div></div>
      </div>
      ${recent.length? `<div style="margin-top:18px;width:100%;max-width:720px"><div class="st2-sec" style="text-align:left;padding-left:4px">RECENT</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${recent.map(p=>`<button class="st2-btn" data-recent="${esc(p)}">${this.iconFor(p)} ${esc(VFS.base(p))}</button>`).join("")}</div></div>`:""}
      <div class="langs">${langs.map(l=>`<span>${esc(l)}</span>`).join("")}<span style="border-color:var(--accent);color:var(--accent2)">+${LANG.count-langs.length} more</span></div>`;
    this.r.wel.querySelectorAll("[data-w]").forEach(c=>c.addEventListener("click", ()=>{
      const w=c.dataset.w;

  renderProject(){

      `<div style="font-size:10.5px">${esc(p2(this.root,"~"))}</div>`+
      (r.error? `<div style="color:#e8798f">manifest invalid</div>` : "")+
      `<div style="color:#5b5382;margin-top:3px">${esc(s.summary)}</div>`;

// ---- settings, extensions UI, diff modal, honesty, shortcuts, boot --------
Object.assign(StApp.prototype, {
