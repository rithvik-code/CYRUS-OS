    this.sel = [{s:0,e:0}];
    this.problems = [];
    this.folds = [];
    this.collapsed = new Set();
    this.spec = LANG.forPath("x.txt");
    this.path = "";
    this.find = null;
    this.ghost = null;
    this.occWord = null;
    this.undoStack = [];
    this.redoStack = [];
    this._coalesce = null;
    this._mctx = document.createElement("canvas").getContext("2d");

    host.innerHTML = `
      <div class="st2-gutter" data-r="gut"></div>
      <div class="st2-scroll" data-r="scroll">
        <div class="st2-layer">
          <div class="st2-hl" data-r="hl"></div>
          <textarea class="st2-ta" data-r="ta" spellcheck="false" autocomplete="off"
            autocapitalize="off" wrap="off" autocorrect="off"></textarea>
        </div>
      </div>
      <div class="st2-mm" data-r="mm"><canvas data-r="mmc"></canvas><div class="vp" data-r="mmv"></div><div class="cur" data-r="mmc2"></div></div>`;
    this.gut = host.querySelector('[data-r="gut"]');
    this.scroll = host.querySelector('[data-r="scroll"]');
    this.hl = host.querySelector('[data-r="hl"]');
    this.ta = host.querySelector('[data-r="ta"]');
    this.mm = host.querySelector('[data-r="mm"]');
    this.mmc = host.querySelector('[data-r="mmc"]');
    this.mmv = host.querySelector('[data-r="mmv"]');
    this.mmc2 = host.querySelector('[data-r="mmc2"]');
    this.curLayer = el("div","cur-layer");
    this.hl.appendChild(this.curLayer);

    this.ta.style.height = "1px";
    this._taEvent();
    this._measure();
  }

  _measure(){
    const cs = getComputedStyle(this.ta);
    if(!this._mctx) this._mctx = document.createElement("canvas").getContext("2d");
    this._mctx.font = cs.fontSize + " " + cs.fontFamily;
    const m = this._mctx.measureText("M");
    this.cw = m.width || CW;
    this.lh = parseFloat(cs.lineHeight) || LH;
  }

  // ---- public surface ---------------------------------------------------
  setFile(path, content, spec){
    this.path = path;
    this.spec = spec || LANG.forPath(path, content);
    this.content = content || "";
    this.sel = [{s:this.content.length, e:this.content.length}];
    this.collapsed = new Set();
    this.problems = [];
    this.undoStack = []; this.redoStack = [];
    this._syncTA(); this.render();
  }
  setContent(t, keepSel){
    this.content = t;
    if(!keepSel) this.sel = [{s:0,e:0}];
    else this.sel = this.sel.map(c=>({ s:Math.min(c.s,t.length), e:Math.min(Math.max(c.e,c.s),t.length) })).filter((c,i,a)=> i===0 || true);
    this._syncTA(); this.render();
  }
  get text(){ return this.content; }

  setProblems(list){
    this.problems = list || [];
    this.render();
    if(this.on.problems) this.on.problems(this.problems);
  }
  setGhost(g){ this.ghost = g; this.render(); }
  clearGhost(){ if(this.ghost){ this.ghost = null; this.render(); } }

  focus(){ try{ this.ta.focus({preventScroll:true}); }catch(e){ this.ta.focus(); } }

  // ---- selection plumbing ----------------------------------------------
  get primary(){ return this.sel[0]; }
  setSelection(s,e,extend){
    const a = Math.max(0, Math.min(s,this.content.length));
    const b = Math.max(0, Math.min(e,this.content.length));
    if(extend && this.sel.length){
      const p = this.sel[0];
      this.sel[0] = { s: Math.min(p.s,a), e: Math.max(p.e,b) };
    } else {
      this.sel[0] = { s:a, e:b };
    }
    this._syncTA(); this.render();
    if(this.on.cursor) this.on.cursor(this.sel[0]);
  }
  setSelections(list){
    this.sel = list.map(c=>({ s:Math.max(0,Math.min(c.s,this.content.length)),
                              e:Math.max(0,Math.min(c.e,this.content.length)) })).sort((a,b)=>a.s-b.s);
    if(!this.sel.length) this.sel=[{s:0,e:0}];
    this._syncTA(); this.render();
  }
  _syncTA(){
    const p = this.primary;
    this.ta.value = this.content;
    try{ this.ta.setSelectionRange(p.s, p.e); }catch(e){}
  }
  _fromTA(){
    this.sel[0] = { s:this.ta.selectionStart, e:this.ta.selectionEnd };
    if(this.on.cursor) this.on.cursor(this.sel[0]);
  }

  // ---- coordinates ------------------------------------------------------
  lineOf(pos){ return SYMBOLS.lineOf(SYMBOLS.lineStarts(this.content), pos); }
  lineStart(i){ const s = SYMBOLS.lineStarts(this.content); return s[i]!==undefined ? s[i] : this.content.length; }
  lineEnd(i){ const s = SYMBOLS.lineStarts(this.content); return s[i+1]!==undefined ? s[i+1]-1 : this.content.length; }
  posAt(line, col){ return this.lineStart(line) + col; }
  charAt(pos){ return this.content[pos]; }
  get caret(){ const p=this.primary; return p.s===p.e ? p.s : p.e; }
  lineText(i){ return this.content.slice(this.lineStart(i), this.lineEnd(i)); }
  lineCount(){ return SYMBOLS.lineStarts(this.content).length; }

  wordRangeAt(pos){
    const c = this.content;
    const isW = ch => /[A-Za-z0-9_$]/.test(ch);
    if(pos>c.length) return {s:0,e:0};
    let a = pos, b = pos;
    if(!isW(c[pos]) && isW(c[pos-1])) a = pos-1;
    else if(!isW(c[pos]) && !isW(c[pos-1])) return {s:pos,e:pos};
    while(a>0 && isW(c[a-1])) a--;
    while(b<c.length && isW(c[b])) b++;
    return {s:a,e:b};
  }
  get wordAtCaret(){
    const p = this.primary;
    const r = (p.s===p.e) ? this.wordRangeAt(p.s) : p;
    return this.content.slice(r.s, r.e);
  }

  // ---- undo -------------------------------------------------------------
  snapshot(){
    this.undoStack.push({ text:this.content, sel:JSON.parse(JSON.stringify(this.sel)) });
    if(this.undoStack.length>250) this.undoStack.shift();
    this.redoStack.length = 0;
  }
  undo(){
    if(!this.undoStack.length) return;
    const s = this.undoStack.pop();
    this.redoStack.push({ text:this.content, sel:JSON.parse(JSON.stringify(this.sel)) });
    this.content = s.text; this.sel = s.sel;
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "undo");
  }
  redo(){
    if(!this.redoStack.length) return;
    const s = this.redoStack.pop();
    this.undoStack.push({ text:this.content, sel:JSON.parse(JSON.stringify(this.sel)) });
    this.content = s.text; this.sel = s.sel;
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "redo");
  }

  // ---- edits ------------------------------------------------------------
  // Applies fn to the text, then moves each cursor by the returned delta map.
  apply(fn, opts={}){
    this.snapshot();
    const before = this.content;
    const res = fn(this.content);
    const after = typeof res === "string" ? res : (res && res.text) || before;
    this.content = after;
    if(res && res.sel) this.sel = res.sel;
    else this.sel = this.sel.map(c=>({ s:clamp(c.s,0,after.length), e:clamp(c.e,0,after.length) }));
    this._syncTA(); this.render();
    if(!opts.silent && this.on.change) this.on.change(this.content, opts.kind||"edit");
    return true;
  }
  insert(text, opts={}){
    if(!text) return;
    return this.apply(t=>{
      const sel = JSON.parse(JSON.stringify(this.sel));
      let out = "", last = 0;
      sel.forEach((c,i)=>{
        const isLast = i===sel.length-1;
        out += t.slice(last, c.s);
        out += text;
        if(c.s!==c.e && opts.wrap!==false && text.length===1) { /* handled by caller */ }
        if(isLast){ out += t.slice(c.s, c.e); last = c.e; }
      });
      out += t.slice(last);
      const newSel = sel.map(c=>({ s:c.s+text.length, e:c.s+text.length }));
      // if a selection was replaced, collapse into it
      sel.forEach((c,i)=>{ if(c.s!==c.e) newSel[i] = { s:c.s+text.length, e:c.s+text.length }; });
      return { text:out, sel:newSel };
    }, opts);
  }
  wrap(before, after){
    const p = this.primary;
    const s = this.content.slice(p.s,p.e) || (this.on.surroundDefault ? this.on.surroundDefault : "");
    this.apply(()=> this.content.slice(0,p.s)+before+s+after+this.content.slice(p.e), {kind:"wrap"});
    this.setSelection(p.s+before.length, p.s+before.length+s.length);
  }
  delChars(dir){
    return this.apply(()=>{
      let out = "", last = 0;
      const sel = JSON.parse(JSON.stringify(this.sel));
      sel.forEach(c=>{
        out += this.content.slice(last, c.s);
        if(c.s===c.e){ const i = dir<0 ? c.s-1 : c.s; if(i>=0 && i<this.content.length){ last = i+1; return; } }
        last = Math.max(last, c.e);
      });
      out += this.content.slice(last);
      const newSel = sel.map(c=>{
        if(c.s===c.e) return { s:Math.max(0,c.s+(dir<0?0:0)), e:Math.max(0,c.s+(dir<0?0:0)) };
        return { s:Math.min(c.s,out.length), e:Math.min(c.s,out.length) };
      });
      return { text:out, sel:newSel };
    }, {kind:"delete"});
  }

  // ---- render -----------------------------------------------------------
  render(){
    const deco = {
      problems: this.problems,
      matches: this.find ? this.find.matches : null,
      sel2: this.sel.filter((c,i)=> i>0 && c.s!==c.e),
      folded: this.foldedMarks(),
      occWord: this.occWordMarks()
    };
    // wrap ghost text into the renderer via a dedicated path
    let html;
    if(this.ghost && this.ghost.text){
      html = HL.render(this.content, this.spec, Object.assign({}, deco, {ghost:this.ghost}));
    } else {
      html = HL.render(this.content, this.spec, deco);
    }
    // folded regions hide their text
    html = html + "";
    this.hl.innerHTML = html;
    this._renderCursors();
    this._renderGutter();
    this._sizeLayer();
    this._renderMinimap();
    if(this.on.render) this.on.render();
  }

  foldedMarks(){
    const marks = [];
    const starts = SYMBOLS.lineStarts(this.content);
    for(const key of this.collapsed){
      const f = this.folds.find(x=>x.id===key);
      if(!f) continue;
      const s = starts[f.from+1];
      const e = starts[f.to]!==undefined ? starts[f.to]-1 : this.content.length;
      if(e>s) marks.push({ s, e, c:"fold" });
    }
    return marks;
  }
  occWordMarks(){
    const w = this.wordAtCaret;
    if(!w || w.length<2) return [];
    if(this.sel.length>1) return this.sel.slice(1).map(c=>({ s:c.s, e:c.e }));
    return [];
  }

  _renderCursors(){
    const c = this.curLayer;
    c.innerHTML = "";
    if(document.activeElement !== this.ta) return;
    const parts = [];
    this.sel.forEach((s2,i)=>{
      if(s2.s===s2.e && i>0){
        const p = this._xy(s2.s);
        parts.push(`<div class="mc" style="left:${p.x}px;top:${p.y}px"></div>`);
      } else if(s2.s===s2.e && i===0){
        // primary caret is the real one
      } else {
        const a = this._xy(s2.s), b = this._xy(s2.e);
        parts.push(`<div class="mc" style="left:${a.x}px;top:${a.y}px;width:${Math.max(2,b.x-a.x)}px"></div>`);
      }
    });
    c.innerHTML = parts.join("");
    const w = this.wordAtCaret;
    this.occWord = null;
    if(w && w.length>1 && this.sel.length===1 && this.sel[0].s===this.sel[0].e){
      const re = new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
      let m, guard=0, first=true;
      const hits=[];
      while((m=re.exec(this.content)) && guard++<600){
        if(m.index>=this.caret){ first=false; break; }
        hits.push(m);
      }
      first = true;
      const marks = [];
      if(hits.length && (this.caret - hits[hits.length-1].index) < 60)
        marks.push({ s:hits[hits.length-1].index, e:hits[hits.length-1].index + w.length });
      if(marks.length){
        const p = this._xy(marks[0].s);
        parts.push(`<div class="mc sel" style="left:${p.x}px;top:${p.y}px"></div>`);
        c.innerHTML = parts.join("");
      }
    }
  }
  _xy(pos){
    const ls = SYMBOLS.lineStarts(this.content);
    const l = SYMBOLS.lineOf(ls, Math.max(0,Math.min(pos,this.content.length)));
    const col = Math.max(0,pos - ls[l]);
    return { x: PADL + col*this.cw, y: PADT + l*this.lh, line:l, col };
  }

  _renderGutter(){
    const total = this.lineCount();
    const visible = Math.max(1, Math.ceil(this.scroll.clientHeight / this.lh) + 1);
    const first = Math.max(0, Math.floor(this.scroll.scrollTop / this.lh));
    const curLine = this.lineOf(this.caret);
    const errL = new Set(), warnL = new Set();
    for(const p of this.problems){
      if(p.sev==="err") errL.add(p.line); else if(p.sev==="warn") warnL.add(p.line);
    }
    let html = "";
    for(let i=first;i<Math.min(total, first+visible+2);i++){
      const cls = i===curLine ? "ln cur" : errL.has(i) ? "ln err" : warnL.has(i) ? "ln warn" : "ln";
      const f = this.foldStartAt(i);
      html += `<div class="${cls}">${f?`<span class="gl" data-fold="${f.id}">${this.collapsed.has(f.id)?"▸":"▾"}</span>`:""}${i+1}</div>`;
    }
    this.gut.innerHTML = html;
    this.gut.style.paddingTop = PADT + "px";
  }
  foldStartAt(line){
    return this.folds.find(f=>f.from===line && !this.collapsed.has(f.id));
  }

  _sizeLayer(){
    const lines = this.lineCount();
    const maxCol = this.content.split("\n").reduce((m,l)=> Math.max(m,l.length), 0);
    const h = PADT*2 + lines*this.lh;
    const w = PADL + Math.max(40, maxCol+6) * this.cw + 40;
    this.ta.style.height = h + "px";
    this.ta.style.width = w + "px";
    const layer = this.scroll.querySelector(".st2-layer");
    if(layer){ layer.style.height = h + "px"; layer.style.width = w + "px"; }
  }

  scrollTo(offset){
    const p = this._xy(offset);
    const st = this.scroll;
    if(p.y < st.scrollTop+40) st.scrollTop = Math.max(0, p.y-60);
    else if(p.y > st.scrollTop + st.clientHeight - 40) st.scrollTop = p.y - st.clientHeight + 60;
    if(p.x > st.scrollLeft + st.clientWidth - 60) st.scrollLeft = Math.max(0, p.x - st.clientWidth/2);
  }
  revealLine(line){
    const y = PADT + line*this.lh;
    const st = this.scroll;
    if(y < st.scrollTop) st.scrollTop = Math.max(0, y-40);
    else if(y > st.scrollTop + st.clientHeight - this.lh) st.scrollTop = y - st.clientHeight + this.lh + 40;
  }
  xyToOffset(clientX, clientY){
    const r = this.scroll.getBoundingClientRect();
    const x = clientX - r.left + this.scroll.scrollLeft - PADL;
    const y = clientY - r.top + this.scroll.scrollTop - PADT;
    const line = Math.max(0, Math.floor(y / this.lh));
    const col = Math.max(0, Math.round(x / this.cw));
    return { line, col, pos: Math.min(this.content.length, this.posAt(line, col)) };
  }
}// ---- Phase 1b: events, keymap, folding, find/replace, minimap
const clamp = (v,a,b)=> v<a?a:v>b?b:v;

Object.assign(StEditor.prototype, {

  // ================= textarea wiring =================
  _taEvent(){
    const ta = this.ta;
    this._lastValue = "";
    ta.addEventListener("input", ()=>this._onInput());
    ta.addEventListener("keydown", e=>this._onKey(e));
    ta.addEventListener("click", ()=>{ this._fromTA(); this.render(); });
    ta.addEventListener("select", ()=>{ this._fromTA(); this.render(); });
    ta.addEventListener("scroll", ()=>{ this._renderMinimap(); });
    this.scroll.addEventListener("scroll", ()=>{ this._renderMinimap(); });
    this.mm.addEventListener("click", e=>{
      const r = this.mm.getBoundingClientRect();
      const line = Math.floor((e.clientY - r.top) / 2);
      this.setSelection(this.posAt(line,0), this.lineEnd(line));
      this.focus();
    });
    this.gut.addEventListener("click", e=>{
      const f = e.target.closest("[data-fold]");
      if(f){ this.toggleFold(f.dataset.fold); return; }
      const ln = e.target.closest(".ln");
      if(ln){
        const idx = [...this.gut.querySelectorAll(".ln")].indexOf(ln);
        const line = Math.floor(this.scroll.scrollTop/this.lh) + idx;
        this.setSelection(this.posAt(line,0), this.lineEnd(line));
        this.focus();
      }
    });
  },

  _onInput(){
    const nv = this.ta.value, ov = this._lastValue;
    if(this.sel.length>1 && ov!=null && nv!==ov){
      let p=0; const max=Math.min(ov.length,nv.length);
      while(p<max && ov[p]===nv[p]) p++;
      let q=0; while(q<max-p && ov[ov.length-1-q]===nv[nv.length-1-q]) q++;
      const inserted = nv.slice(p, nv.length-q);
      const oldP = this._preSel0 || this.sel[0];
      // replicate the same edit at every secondary cursor (back to front)
      let out = "";
      let text = this.content;
      for(let i=this.sel.length-1;i>=1;i--){
        const c = this.sel[i];
        text = text.slice(0,c.s) + inserted + text.slice(c.s);
        if(c.s===c.e) this.sel[i] = { s:c.s, e:c.s };
        else if(c.s===oldP.s && c.e===oldP.e) this.sel[i] = { s:c.s+inserted.length, e:c.s+inserted.length };
        else this.sel[i] = { s:c.s, e:c.e+inserted.length };
      }
      this.content = text;
      this._syncTA(); this.render();
      if(this.on.change) this.on.change(this.content, "input");
      return;
    }
    this.content = nv;
    this.sel[0] = { s:ta0(this.ta).s, e:ta0(this.ta).e };
    this.render();
    if(this.on.change) this.on.change(this.content, "input");
  },

  // ================= keymap =================
  _onKey(e){
    const ta = this.ta;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key;
    const lc = k.length===1 ? k.toLowerCase() : k;
    this._preSel0 = { s:ta.selectionStart, e:ta.selectionEnd };

    // ---- history
    if(mod && lc==="z" && !e.shiftKey){ e.preventDefault(); this.undo(); return; }
    if((mod && lc==="y") || (mod && e.shiftKey && lc==="z")){ e.preventDefault(); this.redo(); return; }
    if(mod && lc==="a"){ e.preventDefault(); this.setSelections([{s:0,e:this.content.length}]); return; }

    // ---- hand off to the app
    if(mod && ["s","f","h","p","b","g",",","/"].indexOf(lc)>=0 && !(lc==="/" && !e.shiftKey && false)){
      if(lc==="/" && !e.shiftKey){ /* our comment toggle */ }
      else if(this.on.key){ this.on.key(lc, e); }
      e.preventDefault(); return;
    }
    if(e.shiftKey && mod && lc==="p"){ if(this.on.key) this.on.key("shiftp", e); e.preventDefault(); return; }
    if(mod && k==="P" && e.shiftKey){ if(this.on.key) this.on.key("shiftp", e); e.preventDefault(); return; }
    if(mod && e.shiftKey && lc==="e"){ e.preventDefault(); this.selectAllOccurrences(); return; }
    if(mod && e.shiftKey && lc==="l"){ e.preventDefault(); this.selectLine(); return; }
    if(e.shiftKey && e.altKey && lc==="f"){ e.preventDefault(); this.format(); return; }

    // ---- multi-cursor
    if(mod && e.altKey && (k==="ArrowUp"||k==="ArrowDown")){ e.preventDefault(); this.addCursorVert(k==="ArrowUp"?-1:1); return; }
    if(mod && k==="d" && !e.shiftKey){ e.preventDefault(); this.addNextOccurrence(); return; }
    if(k==="Escape"){ if(this.sel.length>1){ e.preventDefault(); this.setSelections([this.primary]); } return; }

    if(mod && e.shiftKey && lc==="k"){ e.preventDefault(); this.deleteLines(); return; }
    if(e.altKey && !e.ctrlKey && (k==="ArrowUp"||k==="ArrowDown") && !e.shiftKey){ e.preventDefault(); this.moveLines(k==="ArrowUp"?-1:1); return; }
    if(e.shiftKey && e.altKey && (k==="ArrowDown"||k==="ArrowUp")){ e.preventDefault(); this.duplicateLines(k==="ArrowDown"?1:-1); return; }
    if(mod && lc==="/"){ e.preventDefault(); this.toggleComment(); return; }
    if(mod && (k==="]"||k==="[")){ e.preventDefault(); this.indentSelection(k==="]" ? 1 : -1); return; }

    // ---- tabs
    if(k==="Tab"){
      // a pending inline suggestion wins over indentation
      if(!e.shiftKey && this.ghost && this.ghost.text && this.on.acceptGhost && this.on.acceptGhost()) return;
      e.preventDefault();
      if(e.shiftKey) this.outdent();
      else {
        const multi = this.sel.some(c=>this.content.slice(c.s,c.e).indexOf("\n")>=0);
        if(multi) this.indentSelection(1);
        else this.insert(this.spec.indent===4 ? "    " : "  ");
      }
      return;
    }

    // ---- newline
    if(k==="Enter" && !mod && !e.altKey){
      e.preventDefault(); this.smartEnter(); return;
    }

    // ---- auto close / skip
    if(k.length===1 && !mod && !e.altKey && this.spec.pairs[k]){
      e.preventDefault();
      const p = this.primary;
      if(p.s!==p.e){ this.wrap(k, this.spec.pairs[k]); return; }
      const next = this.content[p.s];
      const prev = this.content[p.s-1];
      const wrapSel = /[\w"'`]/.test(next||"") && !/[\s(]/.test(prev||"");
      this.insert(k + (wrapSel ? this.spec.pairs[k] : ""));
      this.setSelection(p.s+1, p.s+1);
      return;
    }
    if(k.length===1 && !mod && /[\)\]\}]/.test(k)){
      if(this.primary.s===this.primary.e && this.content[this.primary.s]===k && !this.sel.some(c=>c.s!==c.e)){
        e.preventDefault(); this.setSelection(this.primary.s+1, this.primary.s+1); return;
      }
    }
    if(k.length===1 && /["'`]/.test(k) && !mod && this.primary.s===this.primary.e &&
       this.content[this.primary.s]===k && this.spec.esc){
      e.preventDefault(); this.setSelection(this.primary.s+1, this.primary.s+1); return;
    }

    // ---- smart home / end
    if(k==="Home" && !mod && !e.shiftKey){ e.preventDefault(); this.smartHome(e.altKey); return; }
    if(k==="End"  && !mod && !e.shiftKey){ e.preventDefault(); this.setSelection(this.lineEnd(this.lineOf(this.caret)), this.lineEnd(this.lineOf(this.caret))); return; }

    // ---- backspace / delete with several cursors
    if((k==="Backspace"||k==="Delete") && this.sel.length>1){
      e.preventDefault();
      if(this.sel.some(c=>c.s!==c.e)){ this.apply(()=>{
        let out="",last=0;
        this.sel.forEach(c=>{ out+=this.content.slice(last,c.s); last=Math.max(last,c.e); });
        out+=this.content.slice(last);
        const m=out.length; return { text:out, sel:[{s:m,e:m}] };
      }, {kind:"delete"}); }
      else this.delChars(k==="Backspace"?-1:1);
      return;
    }
    if(k==="Backspace" && !mod){
      const p=this.primary;
      if(p.s===p.e && p.s>0){
        const before = this.content.slice(0,p.s);
        if(/^\s+$/.test(this.content.slice(p.s, this.lineEnd(this.lineOf(p.s)))) === false && /[ \t]{2,}$/.test(before) && !/^\s*$/.test(before)){
          const ind = this.currentIndent();
          if(before.length - before.replace(/[ \t]+$/,"").length >= ind){ e.preventDefault(); this.backspaceIndent(); return; }
        }
        const w = this.wordRangeAt(p.s-1);
        if(p.s-1 >= w.s && w.s < p.s-1 && /[A-Za-z0-9_$]/.test(this.content[p.s-1]) && /[A-Za-z0-9_$]/.test(this.content[w.s])){
          e.preventDefault(); this.setSelection(w.s,p.s); this.delChars(-1); return;
        }
      }
    }

    // bracket matching highlight follows the caret
    if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"||k==="Backspace"||k==="Delete"){
      setTimeout(()=>{ this._fromTA(); this.sel.length>1?this.sel[0]=this.primary:null; this.render(); },0);
    }
  },

  // ================= line operations =================
  currentIndent(){
    const line = this.lineText(this.lineOf(this.caret));
    const m = /^[ \t]*/.exec(line)[0];
    const unit = this.spec.indent===4 ? "    " : "  ";
    return m.includes("\t") ? "\t" : unit;
  },
  lineRangeOf(pos){
    const l = this.lineOf(pos);
    return { from:l, to:l };
  },
  blockRange(){
    let a=Infinity, b=-Infinity;
    this.sel.forEach(c=>{
      const l1=this.lineOf(c.s), l2=this.lineOf(c.e);
      a=Math.min(a,l1); b=Math.max(b,l2);
    });
    if(!isFinite(a)){ const l=this.lineOf(this.caret); a=b=l; }
    return { from:a, to:b };
  },
  indentSelection(dir){
    const {from,to} = this.blockRange();
    const unit = this.spec.indent===4 ? "    " : "  ";
    let deltaTotal = 0; const deltas = [];
    const lines = this.content.split("\n");
    for(let i=from;i<=to;i++){
      if(dir>0){ deltas.push(unit.length); deltaTotal += unit.length; }
      else {
        const m = /^[ \t]+/.exec(lines[i]||"");
        const rm = m ? m[0].replace(/ {1,2}$/,"") : "";
        deltas.push(-(m?m[0].length:0) + rm.length);
        deltaTotal += deltas[i-from];
      }
    }
    this.snapshot();
    const fix = l => {
      const m = /^[ \t]+/.exec(l);
      if(!m) return l;
      const target = Math.max(0, m[0].length - this.spec.indent);
      return " ".repeat(Math.min(target, m[0].length)) + l.slice(m[0].length).replace(/^ +/,"");
    };
    const out2 = lines.map((l,i)=> (i<from||i>to) ? l : (dir>0 ? unit+l : fix(l))).join("\n");
    let acc = 0;
    const newSel = this.sel.map(c=>{
      const before = this.lineOf(c.s);
      const shift = before>from ? (before<=to ? deltas[before-from]||0 : 0) : 0;
      return { s:c.s+shift, e:c.e+shift };
    });
    this.content = out2; this.sel = newSel;
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "indent");
  },
  outdent(){ this.indentSelection(-1); },
  backspaceIndent(){
    const l = this.lineOf(this.caret);
    const lines = this.content.split("\n");
    const ind = this.spec.indent;
    const cur = /^[ \t]*/.exec(lines[l])[0].length;
    const rm = Math.min(ind, cur);
    lines[l] = lines[l].slice(rm);
    const pos = this.posAt(l, Math.max(0, this.primary.s - this.lineStart(l) - rm));
    this.snapshot();
    this.content = lines.join("\n");
    this.setSelection(pos,pos);
    if(this.on.change) this.on.change(this.content, "delete");
  },
  selectLine(){
    const {from,to} = this.blockRange();
    this.setSelection(this.lineStart(from), this.lineEnd(to));
  },
  selectAllOccurrences(){
    const w = this.wordAtCaret;
    if(!w) return;
    const re = new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
    const sels = []; let m;
    while((m=re.exec(this.content))) sels.push({s:m.index,e:m.index+w.length});
    if(sels.length){ this.setSelections(sels); }
  },
  addNextOccurrence(){
    const p = this.primary;
    if(p.s!==p.e){ const w=this.content.slice(p.s,p.e);
      const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");
      let m, from = p.e;
      while((m=re.exec(this.content))){ if(m.index>=from){ this.setSelections(this.sel.concat([{s:m.index,e:m.index+w.length}])); this.focus(); return; } }
      return;
    }
    const w = this.wordAtCaret;
    if(!w || w.length<2) return;
    const re = new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
    const taken = new Set(this.sel.map(c=>c.s));
    let m;
    while((m=re.exec(this.content))){ if(!taken.has(m.index)){ this.setSelections(this.sel.concat([{s:m.index,e:m.index+w.length}])); this.focus(); return; } }
  },
  addCursorVert(dir){
    const p = this.primary;
    const line = this.lineOf(p.s===p.e?p.s:p.s);
    const col = p.e - this.lineStart(line);
    let target;
    if(dir<0){
      let l=line-1;
      while(l>=0 && this.lineText(l).trim()==="") l--;
      if(l<0){ this.setSelections([{s:0,e:0}]); return; }
      target = Math.min(this.lineStart(l)+col, this.lineEnd(l));
    } else {
      let l=line+1;
      while(l<this.lineCount() && this.lineText(l).trim()==="") l++;
      if(l>=this.lineCount()){ this.setSelections([{s:this.content.length,e:this.content.length}]); return; }
      target = Math.min(this.lineStart(l)+col, this.lineEnd(l));
    }
    const sels = this.sel.filter(c=>c.s!==target || c.e!==target);
    sels.push({s:target,e:target});
    this.setSelections(sels); this.focus();
  },
  moveLines(dir){
    const {from,to} = this.blockRange();
    const lines = this.content.split("\n");
    if(dir<0 && from===0) return;
    if(dir>0 && to>=lines.length-1) return;
    const blk = lines.splice(from, to-from+1);
    lines.splice(dir<0 ? from-1 : to+1, 0, ...blk);
    const shift = dir<0 ? -1 : blk.length;
    this.snapshot();
    this.content = lines.join("\n");
    const mk = c => {
      const l1=this.lineOf(c.s), l2=this.lineOf(c.e);
      return { s:this.posAt(clamp(l1+shift,0,lines.length-1), c.s-this.lineStart(l1)),
               e:this.posAt(clamp(l2+shift,0,lines.length-1), c.e-this.lineStart(l2)) };
    };
    const sels = this.sel.map(mk).sort((a,b)=>a.s-b.s);
    this.sel = sels; this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "move");
  },
  duplicateLines(dir){
    const {from,to} = this.blockRange();
    const lines = this.content.split("\n");
    const blk = lines.slice(from, to+1);
    if(dir>0) lines.splice(to+1, 0, ...blk); else lines.splice(from, 0, ...blk);
    this.snapshot();
    this.content = lines.join("\n");
    if(dir>0){
      this.sel = this.sel.map(c=>({ s:c.s + blk.join("\n").length + 1, e:c.e + blk.join("\n").length + 1 }));
    } else this.sel = this.sel.map(c=>({ s:c.s, e:c.e }));
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "dup");
  },
  deleteLines(){
    const {from,to} = this.blockRange();
    const lines = this.content.split("\n");
    lines.splice(from, to-from+1);
    this.snapshot();
    this.content = lines.join("\n");
    const pos = this.posAt(clamp(from,0,lines.length-1), 0);
    this.sel = [{s:pos,e:pos}];
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "delete");
  },
  toggleComment(){
    const {from,to} = this.blockRange();
    const lines = this.content.split("\n");
    const lc = (this.spec.line && this.spec.line[0]) || "//";
    const nonEmpty = lines.slice(from,to+1).filter(l=>l.trim());
    const allCommented = nonEmpty.length && nonEmpty.every(l=>l.trim().startsWith(lc));
    this.snapshot();
    for(let i=from;i<=to;i++){
      if(!lines[i].trim()) continue;
      if(allCommented){
        const i2 = lines[i].indexOf(lc);
        const after = lines[i].slice(i2+lc.length);
        lines[i] = lines[i].slice(0,i2) + after.replace(/^ ?/,"");
      } else {
        const ind = /^[ \t]*/.exec(lines[i])[0];
        lines[i] = ind + lc + (lc==="//"?" ":"") + lines[i].slice(ind.length);
      }
    }
    this.content = lines.join("\n");
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "comment");
  },
  smartHome(toEnd){
    const l = this.lineOf(this.caret);
    const text = this.lineText(l);
    const ind = /^[ \t]*/.exec(text)[0].length;
    const pos = this.caret;
    let target;
    if(this._lastHome!=null && this._lastHome===pos) target = pos-this.lineStart(l);
    else target = Math.max(pos-this.lineStart(l), ind) + this.lineStart(l);
    this._lastHome = target;
    this.setSelection(target, target);
  },
  smartEnter(){
    const p = this.primary;
    const l = this.lineOf(p.s);
    const text = this.lineText(l);
    const ind = /^[ \t]*/.exec(text)[0];
    const before = text.slice(0, p.s - this.lineStart(l)).replace(/\s+$/,"");
    const unit = this.spec.indent===4 ? "    " : "  ";
    let extra = "";
    const opens = /[{([]\s*$/.test(before);
    const pyColon = this.spec.id==="python" && /:\s*$/.test(before);
    const kwBlock = /\b(?:if|else|elif|for|while|try|except|finally|with|match|case|def|class|switch|catch|do|foreach)\b[^:]*:\s*$/.test(before);
    if(opens || pyColon || kwBlock) extra = unit;
    const after = this.content.slice(p.s);
    const closes = after.trimStart();
    if(extra && ["}","]",")"].includes(closes[0]) && (opens || pyColon || kwBlock)){
      const mid = this.content.slice(p.s, p.s + (after.length - closes.length));
      const body = "\n" + ind + extra + mid + "\n" + ind;
      this.snapshot();
      this.content = this.content.slice(0,p.s) + body + this.content.slice(p.s + (after.length - closes.length));
      this.setSelection(p.s + 1 + ind.length + extra.length, p.s + 1 + ind.length + extra.length);
      if(this.on.change) this.on.change(this.content, "enter");
      return;
    }
    this.insert("\n" + ind + extra);
  },
  format(){
    const p = this.primary;
    const spec = this.spec;
    const lc = (spec.line && spec.line[0]) || "//";
    let out = this.content;
    if(spec.id==="python"){
      out = out.replace(/[ \t]+$/gm,"");
    } else if(spec.regexp){
      out = out.split("\n").map(l=>{
        if(/^\s*\/\//.test(l)) return l.replace(/\s+$/,"");
        return l.replace(/;{2,}.*$/,"").replace(/[ \t]+$/,"").replace(/([{,])\s+/g,"$1 ");
      }).join("\n");
    } else if(spec.id==="json"||spec.id==="jsonc"){
      try{ out = JSON.stringify(JSON.parse(this.content), null, 2); }catch(e){ return; }
    }
    if(out===this.content) return;
    this.snapshot(); this.content = out;
    this.sel = [{s:clamp(p.s,0,out.length), e:clamp(p.e,0,out.length)}];
    this._syncTA(); this.render();
    if(this.on.change) this.on.change(this.content, "format");
  },

  // ================= folding =================
  computeFolds(){
    const toks = LANG.tokenize(this.content, this.spec);
    const ls = SYMBOLS.lineStarts(this.content);
    const openers = Object.keys(this.spec.pairs||{});
    const stack = []; const folds = [];
    let id = 0;
    const lineStartsWS = this.content.split("\n").map(l=>/^[ \t]*/.exec(l)[0].length);
    for(const t of toks){
      if(t.t!=="op" && t.t!=="pun") continue;
      const ch = this.content[t.s];
      const line = SYMBOLS.lineOf(ls, t.s);
      if(openers.includes(ch)) stack.push({ch, line, col:lineStartsWS[line]});
      else if(Object.values(this.spec.pairs||{}).includes(ch)){
        const o = stack.pop();
        if(!o) continue;
        if(o.col===0 && line - o.line >= 1) folds.push({ id: "f"+(id++), from:o.line, to:line, kind:"brace" });
      }
    }
    // consecutive comment runs
    const lines = this.content.split("\n");
    let run = -1;
    const lc = (this.spec.line||[])[0] || (this.spec.block||[])[0]?.[0];
    for(let i=0;i<=lines.length;i++){
      const isC = i<lines.length && lc && lines[i].trim().startsWith(lc);
      if(isC && run<0) run=i;
      if(!isC && run>=0){
        if(i-run>=4) folds.push({ id:"f"+(id++), from:run-1, to:i-1, kind:"comment" });
        run=-1;
      }
    }
    this.folds = folds;
  },
  toggleFold(id){
    if(this.collapsed.has(id)) this.collapsed.delete(id);
    else {
      this.computeFolds();
      this.collapsed.add(id);
    }
    this.render();
    if(this.on.folds) this.on.folds();
  },
  unfoldAll(){ this.collapsed = new Set(); this.render(); },

  // ================= find / replace =================
  setFind(q, {replace, caseOn, whole, regex}={}){
    if(!q){ this.find=null; this.render(); return 0; }
    const flags = (caseOn?"":"i");
    let re;
    try{
      re = regex ? new RegExp(q, flags+"g") : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), flags+"g");
    }catch(err){ this.find={q,matches:[],bad:true}; this.render(); return 0; }
    const ms = []; let m, guard=0;
    while((m=re.exec(this.content)) && guard++<3000){
      if(!whole || /[\w$]/.test(this.content[m.index-1]||" ") && /[\w$]/.test(this.content[m.index+m[0].length]||" ")){ }
      ms.push({ s:m.index, e:m.index+m[0].length });
      if(m[0].length===0) re.lastIndex++;
    }
    if(whole){
      const w = new RegExp("\\b"+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
      const ws=[]; let k;
      while((k=w.exec(this.content))) ws.push({s:k.index,e:k.index+q.length});
      ms.length=0; ms.push(...ws);
    }
    this.find = { q, matches:ms, idx:0, replace, caseOn, whole, regex };
    this.render();
    return ms.length;
  },
  findNext(dir){
    if(!this.find || !this.find.matches.length) return false;
    this.find.idx = (this.find.idx + (dir>0?1:-1) + this.find.matches.length) % this.find.matches.length;
    const m = this.find.matches[this.find.idx];
    this.setSelection(m.s, m.e);
    this.scrollTo(m.s);
    this.render();
    return true;
  },
  replaceCurrent(repl){
    if(!this.find || !this.find.matches.length) return false;
    const m = this.find.matches[this.find.idx];
    const text = repl.replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\$(\d)/g,(x,d)=>{
      const mm = this.find.matches[+d]; return mm? this.content.slice(mm.s,mm.e) : x;
    });
    this.snapshot();
    this.content = this.content.slice(0,m.s) + text + this.content.slice(m.e);
    this.sel=[{s:m.s,e:m.s+text.length}];
    this._syncTA();
    this.setFind(this.find.q, {replace:repl, caseOn:this.find.caseOn, whole:this.find.whole, regex:this.find.regex});
    if(this.find.matches.length){ this.find.idx = Math.min(this.find.idx, this.find.matches.length-1); const mm=this.find.matches[this.find.idx]; this.setSelection(mm.s,mm.e); }
    this.render();
    if(this.on.change) this.on.change(this.content, "replace");
    return true;
  },
  replaceAll(repl){
    if(!this.find || !this.find.matches.length) return 0;
    const ms = this.find.matches.slice().sort((a,b)=>b.s-a.s);
    const text = repl.replace(/\\n/g,"\n").replace(/\\t/g,"\t");
    this.snapshot();
    for(const m of ms) this.content = this.content.slice(0,m.s) + text + this.content.slice(m.e);
    const at = ms[ms.length-1].s;
    this.sel=[{s:at,e:at+text.length}];
    this._syncTA();
    this.setFind(this.find.q, {replace:repl, caseOn:this.find.caseOn, whole:this.find.whole, regex:this.find.regex});
    this.render();
    if(this.on.change) this.on.change(this.content, "replaceAll");
    return ms.length;
  },

  // ================= minimap =================
  _renderMinimap(){
    if(!this.mmc) return;
    const total = this.lineCount();
    const W = 78, H = Math.min(4000, Math.max(60, total*2));
    if(this.mmc.width!==W || this.mmc.height!==H){ this.mmc.width=W; this.mmc.height=H; }
    const ctx = this.mmc.getContext("2d");
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#0d0820"; ctx.fillRect(0,0,W,H);
    const runs = HL.minimapRuns(this.content, this.spec);
    for(const r of runs){
      ctx.fillStyle = r.c;
      ctx.fillRect(r.x, r.y, Math.min(r.w, W-r.x), 1);
    }
    const st = this.scroll;
    const ratio = H / Math.max(1, (PADT*2 + total*this.lh));
    this.mmv.style.top = (st.scrollTop*ratio)+"px";
    this.mmv.style.height = Math.max(14, st.clientHeight*ratio)+"px";
    this.mmc2.style.top = (this._xy(this.caret).y*ratio)+"px";
  }
});

function ta0(ta){ return { s:ta.selectionStart, e:ta.selectionEnd }; }
// ---------------------------------------------------------------------------
// PHASE 2 — THE EXPLORER
// Every mutation goes through StFS, which is policy-gated: a destructive op
// asks for confirmation and writes to the audit log like everything else in
// CYRUS OS. The explorer never talks to the VFS directly.
// ---------------------------------------------------------------------------
const StFS = {
  // risk table for editor file operations — mirrors the OS permission model
  risk(op, target, many){
    switch(op){
      case "read": case "open": return "low";
      case "write": case "newFile": case "newFolder": case "save": return "low";
      case "rename": case "copy": case "move": case "duplicate": case "paste": return "low";
      case "delete": return many ? "high" : "medium";
      case "saveAll": return "low";
      default: return "low";
    }
  },
  CRITICAL: ["/", "/home", "/home/rithvik", "/home/rithvik/Documents", "/home/rithvik/Projects"],
  // whole subtrees the editor must never rewrite, matched by prefix so a new
  // system directory cannot be reached by naming a child of it
  SYSTEM: ["/etc","/bin","/sbin","/lib","/usr","/var","/boot","/dev","/proc","/sys","/opt"],
  protected(p){ return this.CRITICAL.includes(p) || this.SYSTEM.some(s => p===s || p.startsWith(s+"/")); },

  async guard(op, targets, describe){
    targets = Array.isArray(targets) ? targets : [targets];
    const many = targets.length > 1;
    const critical = targets.filter(t => this.protected(t));
    if(critical.length){
      Log.record("studio: " + op, "studio_file_op", {op, targets}, "high", false, false,
                 "Blocked: " + describe + " on a critical path (" + critical.join(", ") + ")");
      Toast.show("CYRUS Studio", "Blocked — that path is protected by the OS policy.", null, "err");
      return false;
    }
    const risk = this.risk(op, targets, many);
    if(risk==="medium" || risk==="high"){
      const names = targets.slice(0,6).map(t=>VFS.base(t)||"/").join(", ") + (many?` +${targets.length-6} more`:"");
      const ok = await Modal.confirm({
        title: many ? `Delete ${targets.length} items?` : "Delete " + VFS.base(targets[0]) + "?",
        body: `${describe}\n\n${names}\n\nEvery delete is written to the audit log. This cannot be undone from inside Studio.`,
        confirmText:"Delete", danger:true });
      if(!ok){
        Log.record("studio: " + op, "studio_file_op", {op, targets}, risk, false, false, "Cancelled by user");
        return false;
      }
      targets.forEach(t=>VFS.remove(t));
      Log.record("studio: " + op, "studio_file_op", {op, targets}, risk, true, true, describe);
      Bus.emit("vfs");
      return true;
    }
    return true;
  },

  newFile(dir, name){
    const p = VFS.norm(dir, name);
    if(VFS.node(p)) return { ok:false, path:p, err:"A file or folder called “"+VFS.base(p)+"” already exists." };
    if(!VFS.writeFile(p, "")) return { ok:false, path:p, err:"Cannot create a file inside “"+VFS.base(dir)+"”." };
    Log.record("studio: new file " + p, "studio_file_op", {op:"newFile", path:p}, "low", false, true, "Created "+p);
    Bus.emit("vfs"); return { ok:true, path:p };
  },
  newFolder(dir, name){
    const p = VFS.norm(dir, name);
    if(VFS.node(p)) return { ok:false, path:p, err:"“"+VFS.base(p)+"” already exists." };
    if(!VFS.mkdirp(p)) return { ok:false, path:p, err:"Cannot create that folder." };
    Log.record("studio: new folder " + p, "studio_file_op", {op:"newFolder", path:p}, "low", false, true, "Created "+p);
    Bus.emit("vfs"); return { ok:true, path:p };
  },
  rename(from, toName){
    const to = VFS.norm(VFS.parent(from), toName);
    if(from===to) return { ok:false, err:"Same name." };
    if(VFS.node(to)) return { ok:false, err:"“"+VFS.base(to)+"” already exists here." };
    const node = VFS.detach(from);
    if(!node) return { ok:false, err:"Not found." };
    node.name = toName;
    VFS.attach(VFS.parent(to), node);
    Log.record(`studio: rename ${from} → ${to}`, "studio_file_op", {op:"rename", from, to}, "low", false, true, "Renamed");
    Bus.emit("vfs"); return { ok:true, path:to };
  },
  copy(paths, destDir){
    let n = 0;
    for(const p of paths){
      const node = VFS.node(p); if(!node) continue;
      const clone = JSON.parse(JSON.stringify(node));
      let name = node.name, i = 1;
      while(VFS.node(VFS.norm(destDir, name))){ const dot = name.lastIndexOf("."); name = dot>0 ? name.slice(0,dot)+" copy"+i+name.slice(dot) : name+" copy"+i; i++; }
      clone.name = name;
      VFS.attach(destDir, clone); n++;
    }
    if(n) Log.record(`studio: copy ${n} item(s) → ${destDir}`, "studio_file_op", {op:"copy", paths, destDir}, "low", false, true, "Copied "+n);
    Bus.emit("vfs"); return { ok:true, n };
  },
  duplicate(paths){
    let n = 0;
    for(const p of paths){
      const dir = VFS.parent(p);
      const r = StFS.copy([p], dir);
      if(r.ok) n++;
    }
    return { ok:true, n };
  },
  move(paths, destDir){
    let n = 0;
    for(const p of paths){
      if(destDir===p || destDir.startsWith(p+"/")) continue;
      if(VFS.move(p, destDir)) n++;
      else Log.record("studio: move " + p, "studio_file_op", {op:"move", from:p, to:destDir}, "low", false, false, "Move failed");
    }
    if(n) Log.record(`studio: move ${n} item(s) → ${destDir}`, "studio_file_op", {op:"move", paths, destDir}, "low", false, true, "Moved "+n);
    Bus.emit("vfs"); return { ok:true, n };
  },
  uniqueName(dir, base){
    let name = base, i = 1;
    while(VFS.node(VFS.norm(dir, name))){ const d = base.lastIndexOf("."); name = d>0 ? base.slice(0,d)+" "+i+base.slice(d) : base+" "+i; i++; }
    return name;
  },
  // render a file as a tree-selectable target for open-with
  countLines(p){ const n=VFS.node(p); return n&&n.type==="file" ? (n.content||"").split("\n").length : 0; }
};

// ---- explorer ------------------------------------------------------------
class StExplorer {
  constructor(host, opts){
    this.host = host;
    this.on = opts.on || {};
    this.root = opts.root || "/home/rithvik";
    this.sel = [];
    this.clip = null;
    this.expanded = new Set([this.root]);
    this.problems = {};
    this.filter = "";
    this._drag = null;
    this.render();
  }
  setRoot(p){
    if(!VFS.node(p)) return;
    this.root = p;
    this.sel = [];
    this.expanded = new Set([p]);
    this.render();
  }
  setProblems(map){ this.problems = map || {}; this.render(); }

  visible(){
    const rows = [];
    const walk = (p, depth) => {
      const node = VFS.node(p);
      if(!node || node.type!=="dir") return;
      const keys = Object.keys(node.children).sort((a,b)=>{
        const A=node.children[a], B=node.children[b];
        return (A.type===B.type) ? A.name.localeCompare(B.name, undefined, {numeric:true}) : (A.type==="dir"?-1:1);
      });
      for(const name of keys){
        const cp = p+"/"+name;
        const c = node.children[name];
        const isDir = c.type==="dir";
        const hidden = name.startsWith(".") && name!==".gitignore" && name!==".env";
        if(hidden && !this.expanded.has(p+"!")) continue;
        if(this.filter && !this._matches(cp,c)) continue;
        rows.push({ path:cp, name, type:c.type, depth, mtime:c.mtime, size:c.size });
        if(isDir && this.expanded.has(cp)) walk(cp, depth+1);
      }
    };
    walk(this.root, 0);
    return rows;
  }
  _matches(p, node){
    const q = this.filter.toLowerCase();
    if(node.type==="dir") return true;   // keep folders so the match below is reachable
    if(node.name.toLowerCase().includes(q)) return true;
    if(q.length>2 && node.content && node.content.toLowerCase().includes(q)) return true;
    return false;
  }

  render(){
    const rows = this.visible();
    if(!rows.length){
      this.host.innerHTML = '<div class="st2-empty">'+(this.filter?"No matches for “"+esc(this.filter)+"”":"This folder is empty")+"</div>";
      return;
    }
    const html = rows.map(r=>{
      const isDir = r.type==="dir";
      const sel = this.sel.includes(r.path);
      const open = isDir && this.expanded.has(r.path);
      const probs = this.problems[r.path];
      const bad = probs ? (probs.err?'<span class="bad" title="'+probs.err+' errors"></span>':'<span class="mod" title="'+probs.warn+' warnings"></span>') : "";
      const cut = this.clip && this.clip.mode==="cut" && this.clip.paths.includes(r.path);
      const tag = LANG.forPath(r.path).id;
      const disp = tag==="plain" ? "📄" : LANG.byId.get(tag) ? ({"javascript":"🟨","typescript":"🟦","python":"🐍","html":"🌐","css":"🎨","markdown":"📘","json":"🧩"}[tag] || "📄") : "📄";
      return `<div class="st2-row ${isDir?"dir":"file"} ${sel?"on":""} ${cut?"cut":""}" data-p="${esc(r.path)}" data-d="${r.depth}" draggable="true" title="${esc(r.path)}">
        <span class="tw ${open?"":"closed"}">${isDir?"▾":"·"}</span>
        <span>${isDir?"📁":disp}</span><span class="nm">${esc(r.name)}</span>${bad}
      </div>`;
    }).join("");
    this.host.innerHTML = html;
    this._wire();
  }

  _wire(){
    const rows = [...this.host.querySelectorAll(".st2-row")];
    rows.forEach(row=>{
      const p = row.dataset.p;
      row.addEventListener("mousedown", e=>{
        if(e.button===2) return;
        if(e.ctrlKey||e.metaKey) this.toggleSel(p);
        else if(e.shiftKey) this.rangeSel(p);
        else if(!this.sel.includes(p)) this.select(p);
        // the chevron is the only collapse affordance; clicking the row opens a folder
        const node = VFS.node(p);
        if(node && node.type==="dir"){
          if(e.target.closest(".tw")) this.toggle(p);
          else if(!this.expanded.has(p)) this.toggle(p);
        }
        this.on.activate && this.on.activate(this.selection());
      });
      row.addEventListener("dblclick", ()=>this.open(p));
      row.addEventListener("contextmenu", e=>{
        e.preventDefault(); e.stopPropagation();
        if(!this.sel.includes(p)) this.select(p);
        if(this.on.context) this.on.context(this.selection(), e.clientX, e.clientY);
      });
      row.addEventListener("dragstart", e=>{
        if(!this.sel.includes(p)) this.select(p);
        this._drag = this.selection();
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", p);
      });
      row.addEventListener("dragover", e=>{
        const n = VFS.node(p);
        if(!n || n.type!=="dir") return;
        e.preventDefault(); e.dataTransfer.dropEffect = "move";
        row.style.boxShadow = "inset 0 0 0 1.5px var(--accent)";
      });
      row.addEventListener("dragleave", ()=>{ row.style.boxShadow=""; });
      row.addEventListener("drop", async e=>{
        e.preventDefault(); row.style.boxShadow="";
        const n = VFS.node(p); if(!n||n.type!=="dir") return;
        const srcs = (e.dataTransfer.getData("text/plain")||"").split("\n").filter(Boolean);
        if(!srcs.length) return;
        StFS.move(srcs, p);
        this.expanded.add(p);
        this.render();
        if(this.on.changed) this.on.changed();
      });
    });
  }
  select(p){ this.sel = [p]; this.render(); }
  toggleSel(p){ this.sel = this.sel.includes(p) ? this.sel.filter(x=>x!==p) : this.sel.concat([p]); this.render(); }
  rangeSel(p){
    const rows = this.visible().map(r=>r.path);
    const a = this.sel.length ? rows.indexOf(this.sel[this.sel.length-1]) : -1;
    const b = rows.indexOf(p);
    if(a<0 || b<0) return this.select(p);
    this.sel = rows.slice(Math.min(a,b), Math.max(a,b)+1);
    this.render();
  }
  selection(){ return this.sel.length ? this.sel.slice() : []; }
  primarySel(){ return this.sel[this.sel.length-1] || null; }

  toggle(p){
    if(this.expanded.has(p)) this.expanded.delete(p); else this.expanded.add(p);
    this.render();
    if(this.on.expanded) this.on.expanded([...this.expanded]);
  }
  async open(p){
    const n = VFS.node(p);
    if(!n){ Toast.show("Studio","Not found: "+p,null,"err"); return; }
    if(n.type==="dir"){ this.expanded.add(p); this.render(); return; }
    this.expanded.add(VFS.parent(p));
    this.render();
    this.select(p);
    if(this.on.open) this.on.open(p);
  }
  reveal(p){
    const parts = p.split("/").filter(Boolean);
    let cur = "";
    parts.forEach(seg=>{ cur += "/"+seg; this.expanded.add(cur); });
    this.sel = [p];
    this.render();
  }
  copy(){ this.clip = { mode:"copy", paths:this.selection() }; this.render(); if(this.on.changed) this.on.changed(); }
  cut(){ this.clip = { mode:"cut", paths:this.selection() }; this.render(); if(this.on.changed) this.on.changed(); }
  async paste(destDir){
    const d = destDir || (this.primarySel() ? (VFS.node(this.primarySel())?.type==="dir" ? this.primarySel() : VFS.parent(this.primarySel())) : this.root);
    if(!this.clip){ Toast.show("Studio","Clipboard is empty",null,"warn"); return; }
    if(this.clip.mode==="copy"){ const r = StFS.copy(this.clip.paths, d); Toast.show("Studio","Copied "+r.n+" item"+(r.n===1?"":"s"),null,"ok"); }
    else { const r = StFS.move(this.clip.paths, d); Toast.show("Studio","Moved "+r.n+" item"+(r.n===1?"":"s"),null,"ok"); this.clip=null; }
    this.expanded.add(d); this.render();
    if(this.on.changed) this.on.changed();
  }
  async remove(){
    const paths = this.selection();
    if(!paths.length) return;
    const n = await StFS.guard("delete", paths, "Deleting from the workspace");
    if(n){ this.sel = []; this.render(); if(this.on.changed) this.on.changed(); }
  }
  async duplicateSel(){
    const paths = this.selection(); if(!paths.length) return;
    const r = StFS.duplicate(paths);
    Toast.show("Studio","Duplicated "+r.n+" item"+(r.n===1?"":"s"),null,"ok");
    this.render(); if(this.on.changed) this.on.changed();
  }
  async renameInline(p){
    const n = VFS.node(p); if(!n) return;
    const rows = [...this.host.querySelectorAll(".st2-row")];
    const row = rows.find(r=>r.dataset.p===p); if(!row) return;
    const nm = row.querySelector(".nm");
    const input = el("input");
    input.value = n.name;
    input.style.cssText = "background:#0d0820;border:1px solid var(--accent);border-radius:4px;color:#e6dffc;font-size:12.5px;padding:1px 5px;width:130px;font-family:inherit";
    nm.replaceWith(input);
    input.focus(); input.select();
    const finish = async (ok)=>{
      const v = input.value.trim();
      if(ok && v && v!==n.name){
        const r = StFS.rename(p, v);
        if(!r.ok) Toast.show("Studio", r.err, null, "err");
        else if(this.on.renamed) this.on.renamed(p, r.path);
      }
      this.render(); if(this.on.changed) this.on.changed();
    };
    input.addEventListener("blur", ()=>finish(true));
    input.addEventListener("keydown", e=>{
      e.stopPropagation();
      if(e.key==="Enter"){ e.preventDefault(); finish(true); }
      if(e.key==="Escape"){ e.preventDefault(); finish(false); }
    });
  }
  search(q){ this.filter = q||""; this.render(); }
}// ---------------------------------------------------------------------------
// PHASE 3 — cyrus.project.json
// The "perfectly defined workspace": Studio reads the project instead of
// guessing. One file declares roots, entry points, run configs, env, the
// folders extensions may touch, and the instructions the AI is held to.
// ---------------------------------------------------------------------------
const MANIFEST = "cyrus.project.json";

const StProject = {
  MANIFEST,
  markers: ["cyrus.project.json","package.json","pyproject.toml","Cargo.toml","go.mod",
            "pom.xml","build.gradle","requirements.txt","setup.py","Makefile",".git","deno.json","composer.json"],

  // walk up from a folder looking for a project marker
  detect(from){
    let p = VFS.norm("/", from||"/");
    let guard = 0;
    while(guard++ < 40){
      for(const m of this.markers){
        if(VFS.node(p+"/"+m)) return { root:p, marker:m, manifest: m===MANIFEST ? p+"/"+m : null };
      }
      if(p==="/" || p==="") break;
      p = VFS.parent(p);
    }
    return null;
  },
  path(root){ return VFS.norm(root||"/", MANIFEST); },

  read(root){
    const p = this.path(root);
    const n = VFS.node(p);
    if(!n || n.type!=="file") return null;
    try{
      const j = JSON.parse(n.content);
      return j && typeof j==="object" ? j : null;
    }catch(e){ return { __error: e.message }; }
  },
  write(root, obj){
    const p = this.path(root);
    const text = JSON.stringify(obj, null, 2);
    if(!VFS.writeFile(p, text)) return { ok:false, err:"Cannot write "+p };
    Log.record("studio: save "+MANIFEST, "studio_project", {root}, "low", false, true, "Workspace manifest updated");
    return { ok:true, path:p };
  },

  scaffold(root, name, kind){
    const obj = {
      name: name || VFS.base(root),
      version: "0.1.0",
      description: "",
      roots: ["."],
      exclude: ["node_modules", ".git", "dist", "build", "__pycache__", ".venv", "venv", "target", ".next"],
      entry: "",
      runs: [],
      env: {},
      ai: { instructions: "" },
      extensions: []
    };
    const presets = {
      node: { entry:"src/index.js", runs:[{name:"start", command:"node src/index.js", watch:["src"]},
                {name:"test", command:"npm test"}],
              extensions:["javascript","git"] },
      python:{ entry:"main.py", runs:[{name:"start", command:"python main.py", watch:["."]},
                {name:"test", command:"python -m pytest -q"}], extensions:["python","git"] },
      rust:  { entry:"src/main.rs", runs:[{name:"build", command:"cargo build"},
                {name:"run", command:"cargo run"}, {name:"test", command:"cargo test"}], extensions:["rust","git"] },
      go:    { entry:"main.go", runs:[{name:"build", command:"go build ./..."},
                {name:"run", command:"go run ."}, {name:"test", command:"go test ./..."}], extensions:["go","git"] },
      static:{ entry:"index.html", runs:[{name:"preview", command:"open index.html"}], extensions:["html","css"] },
      blank: { }
    };
    Object.assign(obj, presets[kind||"blank"]||{});
    if(kind==="node") obj.dependencies = { "dependencies": {} };
    if(kind==="python") obj.dependencies = { "requires": ["python>=3.9"] };
    if(kind==="rust") obj.dependencies = { "crate": "", "edition": "2021" };
    if(kind==="go") obj.dependencies = { "module": (name||"app").replace(/[^a-z0-9]/gi,"").toLowerCase() };
    const r = this.write(root, obj);
    if(r.ok){
      if(kind==="node" && !VFS.node(root+"/src")){ VFS.mkdirp(root+"/src"); VFS.writeFile(root+"/src/index.js", "console.log('hello from "+obj.name+"');\n"); }
      if(kind==="python" && !VFS.node(root+"/main.py")) VFS.writeFile(root+"/main.py", 'def main():\n    print("hello from '+obj.name+'")\n\n\nif __name__ == "__main__":\n    main()\n');
      if(kind==="go" && !VFS.node(root+"/main.go")) VFS.writeFile(root+"/main.go", 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("hello from '+obj.name+'")\n}\n');
      if(kind==="rust"){ if(!VFS.node(root+"/src")) VFS.mkdirp(root+"/src");
        if(!VFS.node(root+"/Cargo.toml")) VFS.writeFile(root+"/Cargo.toml", '[package]\nname = "'+obj.name+'"\nversion = "0.1.0"\nedition = "2021"\n\n[dependencies]\n');
        if(!VFS.node(root+"/src/main.rs")) VFS.writeFile(root+"/src/main.rs", 'fn main() {\n    println!("hello from '+obj.name+'");\n}\n'); }
      if(kind==="static" && !VFS.node(root+"/index.html")) VFS.writeFile(root+"/index.html", '<!doctype html>\n<html>\n<head><meta charset="utf-8"><title>'+obj.name+'</title></head>\n<body><h1>'+obj.name+'</h1></body>\n</html>\n');
    }
    return r;
  },

  // ---- what the manifest means to the rest of Studio --------------------
  resolved(root){
    const m = this.read(root) || {};
    const roots = Array.isArray(m.roots) && m.roots.length ? m.roots : ["."];
    const exclude = Array.isArray(m.exclude) ? m.exclude : ["node_modules",".git","__pycache__"];
    return {
      raw:m, roots, exclude,
      name: m.name || VFS.base(root),
      entry: m.entry || "",
      runs: Array.isArray(m.runs) ? m.runs : [],
      env: m.env || {},
      ai: m.ai || {},
      extensions: Array.isArray(m.extensions) ? m.extensions : [],
      deps: m.dependencies || {},
      error: m.__error || null
    };
  },
  inProject(root, path){
    const r = this.resolved(root);
    const rel = path.replace(root, "").replace(/^\//,"");
    const first = rel.split("/")[0];
    if(r.exclude.includes(first)) return false;
    if(r.roots.includes(".") || r.roots.includes("*")) return true;
    return r.roots.some(x=> rel===x || rel.startsWith(x+"/"));
  },
  // every source file the project declares
  files(root){
    const out = [];
    const walk = (p)=>{
      const n = VFS.node(p); if(!n) return;
      if(n.type==="file"){
        const ext = LANG.forPath(p);
        if(!["plain","json","csv","log","md"].includes(ext.id) || /\.(json|md)$/i.test(p)) out.push(p);
        return;
      }
      for(const name of Object.keys(n.children)) walk(p+"/"+name);
    };
    walk(root);
    return out.filter(p=>this.inProject(root,p)).sort();
  },
  // how the project actually writes code — learned, not declared
  learn(root){
    const files = this.files(root).slice(0,60);
    const stats = { indent:{2:0,4:0,tab:0}, quotes:{d:0,s:0}, semi:{on:0,off:0}, langs:{} };
    for(const p of files){
      const n = VFS.node(p); if(!n||n.type!=="file") continue;
      const spec = LANG.forPath(p, n.content);
      stats.langs[spec.name] = (stats.langs[spec.name]||0)+1;
      if(spec.markdown) continue;
      const lines = (n.content||"").split("\n").slice(0,400);
      for(const l of lines){
        const m = /^[ \t]+/.exec(l);
        if(!m) continue;
        if(m[0].includes("\t")) stats.indent.tab++;
        else if(m[0].length % 4 === 0) stats.indent[4]++;
        else stats.indent[2]++;
        if(/;\s*$/.test(l.trim())) stats.semi.on++;
        if(/;/.test(l) && !/for\s*\(/.test(l)) stats.semi.off++;
      }
      const dq = (n.content.match(/"/g)||[]).length, sq = (n.content.match(/'/g)||[]).length;
      if(spec.id==="python"){} else if(dq>=sq) stats.quotes.d+=dq; else stats.quotes.s+=sq;
    }
    const top = (o)=> Object.entries(o).sort((a,b)=>b[1]-a[1])[0]||["",0];
    const ind = top(stats.indent), q = top(stats.quotes);
    const langs = Object.entries(stats.langs).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]+" "+Math.round(x[1]/files.length*100)+"%");
    return {
      indent: ind[0]==="tab" ? "tabs" : (ind[0]==="4" ? "4 spaces" : "2 spaces"),
      quotes: q[0]==="s" ? "single" : "double",
      semicolons: stats.semi.on >= stats.semi.off ? "yes" : "no",
      langs, files: files.length,
      summary: `${files.length} source files · ${ind[0]==="tab"?"tabs":ind[0]+"-space"} indent · ${q[0]==="s"?"single":"double"} quotes`
    };
  },
  // the prompt fragment every AI call in this workspace receives
  aiContext(root){
    const r = this.resolved(root);
    const s = this.learn(root);
    const lines = [];
    lines.push(`Workspace: ${r.name} (root ${root})`);
    if(r.entry) lines.push(`Entry point: ${r.entry}`);
    if(r.roots.length && r.roots[0]!==".") lines.push(`Source roots: ${r.roots.join(", ")}`);
    if(r.deps && Object.keys(r.deps).length) lines.push(`Dependencies: ${JSON.stringify(r.deps)}`);
    lines.push(`Observed style: ${s.summary}`);
    if(r.runs.length) lines.push(`Run configs: ${r.runs.map(x=>x.name+" = "+x.command).join(" | ")}`);
    if(r.ai.instructions) lines.push("Project instructions: " + r.ai.instructions);
    return lines.join("\n");
  },
  runFor(root, path){
    const r = this.resolved(root);
    if(!r.runs.length) return null;
    if(r.entry && path && (path===r.entry || path.startsWith(r.entry.split("/").slice(0,-1).join("/"))))
      return r.runs[0];
    const ext = LANG.forPath(path||"").id;
    const byLang = { javascript:["node","node"], typescript:["ts-node","tsc"], python:["python","python"], go:["go run","go"], rust:["cargo run","cargo"] };
    const pref = byLang[ext];
    if(!pref) return r.runs[0];
    return r.runs.find(x=> (x.command||"").startsWith(pref[0])) || r.runs[0];
  },
  suggestExports(root){
    // conventional entry files a project probably has
    const want = ["main.py","app.py","index.js","index.ts","src/index.js","src/main.rs","main.go","cmd/*/main.go",
                  "index.html","README.md","requirements.txt","package.json","Cargo.toml","go.mod"];
    const found = want.filter(w=>!w.includes("*") && VFS.node(root+"/"+w));
    return found;
  }
};// ---------------------------------------------------------------------------
// PHASE 4 — THE RUNNER
// What can actually run in a browser runs for real (JavaScript, JSON, HTML).
// What cannot is never faked: the panel names the host command, offers to copy
// it, and says plainly why it cannot run here. Honesty is the product thesis.
// ---------------------------------------------------------------------------
const StRun = {
  hostRuntime: { python:"python3", node:"node", rust:"cargo run", go:"go run", ruby:"ruby",
                 java:"java", php:"php", lua:"lua", r:"Rscript", julia:"julia", swift:"swift run" },
  runnable(langId){ return ["javascript","typescript","json","jsonc","html","xml","css","markdown"].includes(langId); },

  // resolve the command CYRUS would run, from the manifest when it declares one
  plan(root, path, content){
    const spec = LANG.forPath(path||"", content||"");
    const cfg = StProject.runFor(root, path);
    if(cfg) return { name:cfg.name||"run", command:cfg.command, watch:cfg.watch||[], fromManifest:true, spec };
    const host = this.hostRuntime[spec.id];
    return { name:"run", command: host ? `${host} ${path.replace(root+"/","")}` : null,
             watch:[], fromManifest:false, spec, noHost:!host && !this.runnable(spec.id) };
  },

  // execute. returns {ok, out, err, ms, kind}
  async exec(root, path, content){
    const t0 = performance.now();
    const spec = LANG.forPath(path||"", content||"");
    const r = { kind:spec.id, ok:true, out:"", err:"", ms:0, cmd:this.plan(root,path,content).command };

    if(spec.id==="json" || spec.id==="jsonc"){
      try{
        JSON.parse(String(content).replace(/^\s*\/\/.*$/gm,""));
        r.out = "Valid JSON ✓";
      }catch(e){ r.ok=false; r.err = e.message; }
      r.ms = performance.now()-t0; return r;
    }
    if(spec.id==="html" || spec.id==="xml"){
      r.kind = "preview"; r.preview = content; r.ms = performance.now()-t0; return r;
    }
    if(spec.id==="markdown"){
      r.kind = "preview"; r.preview = renderMarkdown(content); r.ms = performance.now()-t0; return r;
    }
    if(spec.id==="css"){
      r.kind = "preview";
      r.preview = `<style>${content}</style><div style="font-family:system-ui;padding:20px;color:#111;background:#fff">
        <h1>Heading</h1><p>Paragraph text to show the stylesheet in context.</p>
        <button>Button</button><a href="#">Link</a></div>`;
      r.ms = performance.now()-t0; return r;
    }
    if(spec.id==="javascript" || spec.id==="typescript"){
      let src = content;
      if(spec.id==="typescript"){
        src = stripTypes(content);
        r.out = "Type annotations stripped — CYRUS runs the JavaScript subset.\n";
      }
      r.kind = "js";
      const logs = [];
      const MAX = 4000;
      const fmt = a => a.map(x=>{ try{ return typeof x==="object"&&x!==null ? JSON.stringify(x) : String(x); }catch(e){ return String(x); } }).join(" ");
      const con = { log:(...a)=>logs.push(fmt(a)), info:(...a)=>logs.push(fmt(a)),
                    warn:(...a)=>logs.push("⚠ "+fmt(a)), error:(...a)=>{ logs.push("✖ "+fmt(a)); },
                    debug:(...a)=>logs.push(fmt(a)), table:(...a)=>logs.push(fmt(a)),
                    time:()=>{}, timeEnd:()=>{} };
      try{
        const fn = new Function("console","fetch","setTimeout","clearTimeout","setInterval","clearInterval",
                                "window","document","localStorage","alert","prompt","confirm", src + "\n//# sourceURL=" + path);
        const guarded = t => { if(logs.length>MAX) throw new Error("stopped after "+MAX+" log lines"); };
        await Promise.race([
          fn(con, undefined, (f,t)=>setTimeout(f,t), clearTimeout, setTimeout, clearInterval,
             undefined, undefined, undefined, undefined, undefined, ()=>false),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error("execution exceeded 3s — possible infinite loop")),3000))
        ]);
      }catch(e){
        r.ok = false;
        r.err = e.message;
        const m = /(\w+\.html?):(\d+)/.exec(e.stack||"");
        if(m) r.at = { line:+m[2] };

      r.out = (r.out||"") + (logs.length ? logs.join("\n") : (r.ok ? "(ran — no console output)" : ""));
      r.ms = performance.now()-t0; return r;
    }
    if(spec.id==="python"){
      r.kind = "python";
      const py = PyRun.run(content);
      r.out = py;
      if(/Traceback|Unsupported|SyntaxError/.test(py)) r.ok = false;
      r.note = "PyRun is a line-level sandbox: print and assignment are real; loops and control flow are not evaluated.";
      r.ms = performance.now()-t0; return r;
    }
    // everything else: name the command, do not pretend
    r.kind = "unavailable";
    r.ok = false;
    r.out = "No host runtime for " + spec.name + " inside the browser.";
    r.err = r.cmd ? `Run this in your terminal:\n\n  ${r.cmd}` : `CYRUS has no runner for .${(path.split(".").pop()||"")} — add a run config to ${MANIFEST}.`;
    r.ms = performance.now()-t0;
    return r;

  record(root, path, res){

               res.ok ? "low" : "medium", false, res.ok,
               res.ok ? `Ran ${VFS.base(path)} (${res.kind}, ${Math.round(res.ms)}ms)` : `Run failed: ${(res.err||"").split("\n")[0]}`);
  }
};

function stripTypes(src){
  let s = src;
  s = s.replace(/^\s*(?:export\s+)?(?:interface|type)\s+\w+[\s\S]*?^\}/gm, "");
  s = s.replace(/\binterface\s+\w+\s*(?:extends\s+\w+\s*)?\{[^}]*\}/g, "");
  s = s.replace(/\btype\s+\w+\s*=\s*[^;]+;/g, "");
  s = s.replace(/^\s*import\s+type\b[^\n]*\n/gm, "");
  // `declare` statements are types-only: they have no runtime meaning at all,
  // so the whole line goes rather than trying to strip its annotations.
  s = s.replace(/^\s*declare\s+[^\n]*\n?/gm, "");
  s = s.replace(/\bas\s+const\b/g, "");
  // generic parameter list on an arrow function: <T,>(v) => ... -> (v) => ...
  s = s.replace(/<[A-Za-z_$][\w$<>\[\]|&.,\s]*,?>\s*(?=\()/g, "");
  // variable annotations: const x: number = 5  ->  const x = 5
  s = s.replace(/\b(const|let|var)\s+([A-Za-z_$][\w$]*)\s*:\s*[A-Za-z_$][\w$<>\[\]|&., ]*\s*=/g, "$1 $2 =");
  // value-position casts: x as Foo<T> -> x. Lookbehind so `a as B as C` fully strips;
  // `import { a as b }` is unaffected because `{` precedes the keyword.
  s = s.replace(/(?<=[\w$)\]])\s+as\s+[A-Za-z_$][\w$]*(?:<[^<>()]*>)?/g, "");
  // explicit type arguments on calls: foo<number>(x) -> foo(x)
  s = s.replace(/([\w$)\]])<[^<>()]*>(?=\s*\()/g, "$1");
  // return types: `): string {` -> `) {`. Runs BEFORE the parameter rule so the
  // parameter rule cannot chew the closing paren of a signature.
  s = s.replace(/(\))\s*:\s*[A-Za-z_$][\w$<>\[\]|&., ]*(\s*(?:\{|=>))/g, "$1$2");
  // parameter types: anchored to "(" or "," so object literals, ternaries and
  // labels (`{a: 1}`, `x ? a : b`, `case 1:`) are never mistaken for one.
  s = s.replace(/([(,]\s*)([A-Za-z_$][\w$]*)\s*\??\s*:\s*[A-Za-z_$][\w$<>\[\]|&., ]*(?=\s*[,)=])/g, "$1$2");
  s = s.replace(/\b(private|public|protected|readonly)\s+/g, "");
  s = s.replace(/\?\s*:/g, ":");
  s = s.replace(/!\./g, ".");
  return s;
}

function renderMarkdown(src){
  const escH = s => s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const blocks = [];
  let out = "", i = 0;
  while(i < src.length){
    const fence = /^```([\w-]*)\n([\s\S]*?)^```/m.exec(src.slice(i));
    if(fence){ out += "<pre><code>"+escH(fence[2].replace(/\n$/,""))+"</code></pre>"; i += fence[0].length; continue; }
    out += escH(src[i]); i++;
  }
  out = out
    .replace(/^###### (.*)$/gm, "<h6>$1</h6>").replace(/^##### (.*)$/gm, "<h5>$1</h5>")
    .replace(/^#### (.*)$/gm, "<h4>$1</h4>").replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/^(\s*)[-*+] /gm, "$1• ")
    .replace(/\n{2,}/g, "</p><p>");
  return `<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:#1b1b22;padding:22px 26px;line-height:1.65;font-size:14px;border-radius:6px;overflow:auto;height:100%">
    <style>.mdx h1{font-size:26px;border-bottom:1px solid #e5e5ea;padding-bottom:8px}
    .mdx h2{font-size:20px;border-bottom:1px solid #eee;padding-bottom:5px}.mdx h3{font-size:16px}
    .mdx code{background:#f2f2f5;padding:1px 5px;border-radius:4px;font-size:12.5px}
    .mdx pre{background:#f6f6f9;padding:10px 12px;border-radius:7px;overflow:auto}
    .mdx pre code{background:none;padding:0}.mdx blockquote{border-left:3px solid #ccc;margin-left:0;padding-left:12px;color:#555}
    .mdx table{border-collapse:collapse}.mdx td,.mdx th{border:1px solid #ddd;padding:5px 9px}</style>
    <div class="mdx">${out}</div></div>`;
}

// PHASE 5 — CYRUS COPILOT
// Three surfaces, one brain: chat with full workspace context, inline
// autocomplete as ghost text, and agentic edits that always arrive as a diff
// you have to accept. The AI never writes a file without showing you first.
// ---------------------------------------------------------------------------
const Diff = (()=>{
  // LCS line diff. Bounded so a huge file degrades to a whole-file replace.
  function lines(a, b, maxRows){
    const A = a.split("\n"), B = b.split("\n");
    if(A.length* B.length > (maxRows||4000000) || A.length>2500 || B.length>2500){
      return [ ...A.map(t=>({t:"del", text:t})), ...B.map(t=>({t:"add", text:t})) ];
    }
    const n = A.length, m = B.length;
    const dp = new Uint32Array((n+1)*(m+1));
    for(let i=n-1;i>=0;i--)
      for(let j=m-1;j>=0;j--)
        dp[i*(m+1)+j] = A[i]===B[j] ? dp[(i+1)*(m+1)+(j+1)]+1 : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+(j+1)]);
    const out = []; let i=0, j=0;
    while(i<n && j<m){
      if(A[i]===B[j]){ out.push({t:"ctx", text:A[i], a:i+1, b:j+1}); i++; j++; }
      else if(dp[(i+1)*(m+1)+j] >= dp[i*(m+1)+(j+1)]){ out.push({t:"del", text:A[i], a:++i}); }
      else out.push({t:"add", text:B[j], b:++j});
    }
    while(i<n) out.push({t:"del", text:A[i], a:++i});
    while(j<m) out.push({t:"add", text:B[j], b:++j});
    return out;
  }
  // group into hunks with `pad` lines of context
  function hunks(rows, pad){
    pad = pad==null ? 3 : pad;
    const keep = new Array(rows.length).fill(false);
    rows.forEach((r,i)=>{ if(r.t!=="ctx"){ for(let k=Math.max(0,i-pad);k<=Math.min(rows.length-1,i+pad);k++) keep[k]=true; } });
    if(rows.length && keep.every(k=>!k)) keep[0]=keep[rows.length-1]=true;
    const out = []; let cur = null;
    rows.forEach((r,i)=>{
      if(keep[i]){
        if(!cur){ cur = { rows:[] }; out.push(cur); }
        cur.rows.push(r);
      } else cur = null;
    });
    return out;
  }
  const stat = rows => ({ add: rows.filter(r=>r.t==="add").length, del: rows.filter(r=>r.t==="del").length });
  // three-way merge check: did the user change a line the AI also touched?
  // Uses the changed rows themselves, not the padded hunks — padding is for
  // display and would report a conflict for any edit near an AI change.
  function conflicts(base, mine, theirs){
    if(base === mine) return false;
    const d = lines(base, theirs);
    const baseL = base.split("\n"), mineL = mine.split("\n");
    const touched = new Set();
    let lastA = 1;
    for(const r of d){
      if(r.a != null) lastA = r.a;
      if(r.t === "ctx") continue;
      touched.add(r.a != null ? r.a : lastA); // a pure insertion lands after lastA
    }
    if(!touched.size) return false;
    for(const l of touched){
      if(l < 1 || l > baseL.length) continue;
      if(baseL[l-1] !== mineL[l-1]) return true;
    }
    return false;
  }
  return { lines, hunks, stat, conflicts };
})();

// ---- markdown → HTML for chat (safe: escapes first, never injects raw md)
function mdToHtml(src){
  const escH = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const raw = String(src||"");
  let ci = 0;
  const renderText = t => escH(t)
    .replace(/`([^`\n]+)`/g, "<code class='md-em'>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b class='md-b'>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<i class='md-em'>$2</i>")
    .replace(/^#{6} (.*)$/gm, "<h6>$1</h6>").replace(/^#{5} (.*)$/gm, "<h5>$1</h5>")
    .replace(/^#{4} (.*)$/gm, "<h4>$1</h4>").replace(/^#{3} (.*)$/gm, "<h3>$1</h3>")
    .replace(/^#{2} (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^&gt; (.*)$/gm, "<blockquote class='md-c'>$1</blockquote>")
    .replace(/^[ \t]*[-*+][ \t]+/gm, "&bull; ")
    .replace(/^[ \t]*(\d+)\.[ \t]+/gm, "$1. ")
    .replace(/\n{2,}/g, "<br><br>")
    .replace(/\n/g, "<br>");
  let out = "", last = 0, m;
  const re = /```([\w+#.-]*)\n([\s\S]*?)(?:```|$)/g;
  while((m = re.exec(raw))){
    if(m.index > last) out += renderText(raw.slice(last, m.index));
    const i = ci++;
    const code = m[2].replace(/\n$/,"");
    out += '<div class="codeblock" data-lang="'+escH(m[1])+'"><div class="cb-h"><span>'+escH(m[1]||"code")+"</span>"+
           '<button data-act="apply" data-i="'+i+'">Apply</button>'+
           '<button data-act="copy" data-i="'+i+'">Copy</button>'+
           '<button data-act="ask" data-i="'+i+'">Ask</button></div>'+
           "<code>"+escH(code)+"</code></div>";
    last = m.index + m[0].length;
  }
  if(last < raw.length) out += renderText(raw.slice(last));
  return out;
}
function mdCodeBlocks(src){
  const out = []; let m;
  const re = /```([\w+#.-]*)\n([\s\S]*?)(?:```|$)/g;
  while((m = re.exec(String(src||"")))) out.push({ lang:m[1], code:m[2].replace(/\n$/,"") });
  return out;

const Copilot = {

      c.symbols && c.symbols.length ? "SYMBOLS IN THIS FILE:\n"+c.symbols : ""
    ].filter(Boolean).join("\n\n");
    if(mode==="edit"){
      return base + "\n\nTASK: rewrite the file so it satisfies the request. "+
        "Return ONLY the complete new file inside one fenced code block with the correct language tag. "+
        "No prose before or after it. Preserve everything you were not asked to change, "+
        "match the project's existing style, and never invent APIs you were not given.";
    }
    if(mode==="inline"){
      return base + "\n\nTASK: continue the code at the cursor. Return ONLY the code that should appear next, "+

        "If nothing sensible follows, return nothing.";

    return base + "\n\nAnswer the developer's question precisely. "+
      "Lead with the answer, then the reasoning. Be concise — this is an editor panel, not an essay. "+
      "When you show code, put it in one fenced block with the right language tag. "+
      "If the file is already correct, say so plainly instead of inventing work.";
  },

  buildMessages(c, userText, mode){
    const msgs = [{ role:"system", content:this.systemPrompt(c, mode||"chat") }];
    if(c.file){
      let f = c.file;
      let head = "FILE: " + c.file.path + "\n";
      if(c.selection && c.selection.text) head += "SELECTION (lines "+c.selection.from+"–"+c.selection.to+"):\n"+c.selection.text+"\n";
      head += "```"+(c.file.lang||"")+"\n"+c.file.body+"\n```";
      msgs.push({ role:"user", content: head + "\n\n" + userText });
    } else if(c.files && c.files.length){
      const list = c.files.map(f=>"• "+f.path+" — "+f.note).join("\n");
      msgs.push({ role:"user", content:"Workspace files:\n"+list+"\n\n"+userText });
    } else {

  async ask(c, userText, opts){

    const r = await Router.chat(this.buildMessages(c, userText, opts.mode),
      { taskType: opts.taskType || "reasoning", temperature: opts.temperature==null?0.25:opts.temperature, maxTokens: opts.maxTokens || 1200 });
    return r;
